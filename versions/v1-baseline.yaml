# System design — working spec. Source of truth for the flowchart at index.html.
# Node fields: id, name, lane, kind (data | deterministic | model | human | output),
#   status (memo = as described in the current memo | draft = being reworked | settled = agreed | placeholder),
#   inputs, outputs, rule, checks, on_failure, open (unsettled questions), memo (section it comes from / will become),
#   role (Appendix D role number, for model nodes), row (Appendix C register rows).
# Edge fields: from, to, carries, when.

meta:
  title: Momentum reversal-risk system, as in the current memo (v1 baseline)
  version: v1-baseline
  updated: "2026-09-06"
  note: >
    This is the existing design transcribed from the memo (commit f3a9c75), one node per stage or model role.
    Open questions carry the points raised by the cold read and the ML review. Nothing here is the new design yet.

lanes:
  - {id: data, name: Data in}
  - {id: book, name: The book and its nulls}
  - {id: exposure, name: Exposure reading}
  - {id: text, name: Loser-leg text reading}
  - {id: positioning, name: Positioning and crowding}
  - {id: routes, name: Route detectors and severity}
  - {id: context, name: Context, calendar forward, analogue back}
  - {id: page, name: The page and the people}
  - {id: research, name: Research process}

nodes:
  # ------------------------------------------------------------ data
  - id: prices
    name: Prices, returns, index membership
    lane: data
    kind: data
    status: memo
    inputs: []
    outputs: [daily returns per name, point-in-time universe, sector codes]
    rule: |
      Universe = constituents of the iShares Russell 3000 ETF (IWV) from the fund's archived daily holdings file, taken at the date each change was announced. Daily holdings begin December 2013. Free daily prices (Stooq or Tiingo). SIC codes from EDGAR facts (GICS in production). Delisted names terminate, never flatten.
    checks: [reconciled against the French factor file, corporate actions and ticker reuse]
    on_failure: hold the day's state; page says which series is withheld
    open:
      - Which weighting (value or equal) do the printed numbers use? Memo says both computed, never says which is printed (fix 1.1-b).
      - Exact date range and count of formation dates; memo says 137 month-ends in §5, 134 in the ledger.
    memo: "§1.1, §4.1, Table A.1"

  - id: refseries
    name: Eight reference series
    lane: data
    kind: data
    status: memo
    inputs: []
    outputs: [eight daily series]
    rule: |
      S&P 500 (SPY); ten-year yield change (FRED DGS10); front-month WTI (DCOILWTICO); dollar index (DTWEXBGS); investment-grade spread (BAMLC0A0CM); the ten largest index names against the equal-weighted index (constructed from IVV holdings); two cross-asset principal components estimated on a pre-sample with pinned signs, from a panel adding gold, copper, long-bond total return and EM equity. First-print vintages from ALFRED where hosted. List fixed before any book was examined; grows only by re-registration.
    checks: [family charged as a group; thresholds set on the maximum across the eight]
    on_failure: series withheld; page says which
    open:
      - Pre-sample dates and the sign-pinning rule for the two PCs are not stated (fix 3.1-a).
      - What the second PC loads on is never said; its z of 11.8 on 2026-07-31 is uninterpretable (fix 4.3-c).
    memo: "§3.1, Table A.1"

  - id: filings
    name: Filings and transcripts
    lane: data
    kind: data
    status: memo
    inputs: []
    outputs: [8-K documents per loser-leg name, acceptance timestamps]
    rule: |
      EDGAR full text and XBRL at acceptance timestamp. Proof of concept reads 8-K filings accepted in the 91 days before each formation date, loser leg (and winner leg for the comparison). On 2020-10-31: 112 loser filings from 36 of 263 names; 206 winner filings from 83 names. Earnings-call transcripts are a production source, not used.
    checks: [coverage by leg and by smallest-cap fifth, printed; coverage gate (row 16) marks Route 1 instrument-limited below a threshold]
    on_failure: Route 1 line reads instrument-limited that day
    open:
      - 36 of 263 in a 91-day window that contains a full earnings season is implausibly low; treat as an instrument bug (ticker-to-CIK on renamed or delisted names, or the parser fault trp-79) until checked (ML review, question 1).
      - Are 'filings read' counts pre- or post-keyword-filter?
      - Are exhibits (99.1 earnings releases) included, and how are long documents truncated?
      - Why 91 days; why 8-K rather than 10-Q/10-K risk-factor and MD&A sections, which give near-complete coverage (ML review §2 step 1).
      - Direction of the coverage bias: memo says non-filers are the distressed ones; distressed firms file more 8-Ks, not fewer.
    memo: "§2.2, §4.2, §6 coverage line, Table A.1"
    row: "16"

  - id: posdata
    name: Positioning data
    lane: data
    kind: data
    status: memo
    inputs: []
    outputs: [short interest by leg, daily short volume, ETF shares outstanding, 13F/N-PORT holdings, implied correlation]
    rule: |
      FINRA short interest keyed to release date (about 8 business days after settlement); FINRA Reg SHO daily short-sale volume; momentum-ETF shares outstanding (MTUM); 13F and N-PORT holdings (45 to 60 days after quarter end, long positions only); Cboe implied-correlation indices as the aggregate comparator.
    checks: [keying on settlement flagged as lookahead; 13F reads the winner leg a quarter late and nothing on the short leg]
    on_failure: series withheld
    open: []
    memo: "§2.2, Table A.1"

  - id: french
    name: French factor file
    lane: data
    kind: data
    status: memo
    inputs: []
    outputs: [daily WML 1926 onward]
    rule: |
      Long history and engine check. No vintage; version dated and stored. Construction differs from the reconstruction (2x3 value-weighted), so agreement is measured, not assumed. Event thresholds (-432bp ten-day, -933bp crash day) are percentiles of this file, 1926-11-03 to 2022-12-15, frozen 2026-08-26.
    checks: [agreement with the reconstructed book measured]
    on_failure: n/a
    open:
      - The agreement statistic between reconstructed book and French factor is never reported (fix 4.1-b).
      - The -4.24% 'unconditional' quantile in §4.2 and §6 versus the -432bp threshold here; which sample is which (fix 4.2-g).
      - Crash day at -933bp is called the 1st percentile of 'the same sample', which is ten-day returns; one-day or ten-day? (fix 1.6-c)
    memo: "§1.6, §4.1, Table A.1, E.1"

  - id: caldata
    name: Curated macro calendar
    lane: data
    kind: human
    status: memo
    inputs: []
    outputs: [dated scheduled events]
    rule: FOMC, BLS, OPEC and similar, maintained by hand weekly; curated-through date printed on the page.
    checks: [curated-through date]
    on_failure: coverage is what was entered
    open: []
    memo: "§3.4, §3.6"

  # ------------------------------------------------------------ book
  - id: sort
    name: 12-1 sort, the book
    lane: book
    kind: deterministic
    status: memo
    inputs: [daily returns per name, point-in-time universe]
    outputs: [winner leg (top decile), loser leg (bottom decile), leg sizes and cap profile]
    rule: |
      On each formation date rank every eligible name on its trailing return from t-12 to t-2 (latest month skipped); top decile long, bottom decile short; value- and equal-weighted both computed; rebuilt monthly, measured daily. Plain sort chosen over residual or industry-neutral momentum because those strip the exposure the system reads. Formation dates are calendar month-ends.
    checks: [leg sizes and cap profile logged; crash losses milder than French UMD because Russell drops the smallest names at its June rebalance]
    on_failure: previous book carried with a banner
    open:
      - Which weighting is printed (see prices).
    memo: "§1.1, §3.1, Table 4 Book row, Table B.1 Book row"

  - id: random
    name: Random portfolios, the null
    lane: book
    kind: deterministic
    status: memo
    inputs: [point-in-time universe, leg sizes and cap profile]
    outputs: [N random books per date, cap-matched; a second set sector-matched]
    rule: |
      N random portfolios drawn from the same universe on the same date with the same leg sizes and capitalisation deciles, differing from the book only in not being ranked on past returns. Cap-matched is the headline null; sector-matched prints beside it because sector is usually the vehicle of a macro bet. Registered N = 500; the runs in §4.3 and §5 used 200; the cross-sort comparison in §4.2 used a shared pool of 120.
    checks: [matching declared before measurement; construction fingerprinted; bootstrap interval on the placebo maximum's 95th percentile]
    on_failure: n/a
    open:
      - Which N produced which number is asserted in §3.1 from the fix list and not yet confirmed against the runs.
      - The 500-draw run and the sector-matched twin on the live date are registered and unrun (row 04).
      - For the text measure the sector-matched null should be the headline, since sector composition is what the measure mostly reads (ML review §3).
    memo: "§3.1, Table 4 Null row, Table B.1 Null row"
    row: "01, 04"

  - id: controls
    name: Same-rule sorts and stale-book control
    lane: book
    kind: deterministic
    status: memo
    inputs: [daily returns per name, point-in-time universe]
    outputs: [6-1 and 24-13 sorted books, a book ranked 24 months earlier, a canary (random-ranking) sort]
    rule: |
      Two other return sorts on the same date (6-1, 24-13) test whether concentration is specific to the 12-1 rule or generic to return sorting: 12-1 has the largest exposure on 42.6% of 108 dates against a third by chance. A book ranked 24 months earlier controls for persistent name characteristics. A canary sort (random ranking) should read nothing; its central band is the middle 90% of its own placebo distribution.
    checks: [canary inside its band]
    on_failure: null reversed if the canary leaves its band
    open:
      - Why 108 month-ends here against 137 for claim 1 (fix 5.2-e).
    memo: "§3.1 item 3, §4.2, §5.2 claim 2, E.1"

  # ------------------------------------------------------------ exposure
  - id: sensitivities
    name: Sensitivities, conferred and carried
    lane: exposure
    kind: deterministic
    status: memo
    inputs: [winner leg, loser leg, eight daily series]
    outputs: [per-name slope per series, leg spread per series over the ranking window (conferred) and the holding period (carried)]
    rule: |
      Rolling slope per name per series, one series at a time, fixed window, raw and market-residualised. The winner-minus-loser spread is measured twice: over the ranking window (conferred, what the sort selected) and over the holding period (carried, what the book still holds). Two comparisons print beside it: the part of the exposure the series' own trailing move would predict for any portfolio against the part the sort added, and the stale-book control.
    checks: [sign stability across weighting, quantile, rebalance date, universe, window]
    on_failure: series withheld
    open:
      - Window length is never stated (fix 3-c).
      - The 'trend's own part' construction is described only in a clause; confirm what is regressed on what (fix 3.1-e).
    memo: "§3.1, Table 4 Sensitivities row"
    row: "02"

  - id: zscore
    name: z-score against the null
    lane: exposure
    kind: deterministic
    status: memo
    inputs: [leg spread per series, N random books per date]
    outputs: [z and percentile per series, both nulls; the series with the largest z]
    rule: |
      Each series' spread standardised against the random portfolios' spreads; the daily threshold for a page is set on the null of the maximum across all monitored statistics (familywise), so the registered quantity is a false-page rate, at most 2 expected false pages a month. Decision 1 reads the series with the largest exposure and acts above the 95th placebo percentile; decision 2 reads the series matching a held view. The family-maximum form was retired after clearing 108 of 108 by saturation; the single-series form is what stands.
    checks:
      - "claim 1: market beta clears the 95th percentile on 105 of 137 month-ends (76.6%, [0.635, 0.876])"
      - "z above what N draws resolve is read as an ordering, not a size"
    on_failure: n/a
    open:
      - 33.6 sigma on 120 draws (2020-10-31) exceeds resolution; which series carried it is not named (fix 4.2-b).
      - Dollar z of 12.7 on 2026-07-31 has no sign convention; 'short the dollar' was cut from Scope pending it (fix 4.3-b).
    memo: "§3.1, §4.2, §4.3, §5.2 claim 1, Table 4 Null row"
    row: "01, 21"

  - id: labeller
    name: Labeller, captions the bet
    lane: exposure
    kind: model
    status: memo
    role: "8, 9"
    inputs: [the series with the largest z, the twenty names carrying a leg's sensitivity, holdings]
    outputs: [one-sentence caption of the bet; a name for a grouping the arithmetic produced]
    rule: |
      Role 9 captions the bet in one sentence beside the highest-z series; role 8 names a grouping the deterministic code produced (what the twenty most rate-sensitive names have in common). Twin: the highest-z series name (role 9) or the largest sector name (role 8). Abstains with 'no coherent name'. Calibrated on random portfolios: a caption must be more plausible on the real book than on placebo books by at least 1 point on a 5-point scale, second-rated (row 10).
    checks: [placebo-book calibration (row 10, unrun); sector agreement read two-sided]
    on_failure: series name or sector name printed instead
    open:
      - Row 10 has not run; the caption is unvalidated.
    memo: "§3.2 Table 5 Route 2 row, Table D.1 roles 8-9, Table B.1 Labeller row"
    row: "10"

  # ------------------------------------------------------------ text
  - id: filter
    name: Document filter
    lane: text
    kind: model
    status: memo
    role: "1"
    inputs: [8-K documents per loser-leg name]
    outputs: [documents worth reading]
    rule: |
      A keyword rule marks documents worth reading; the model may only add to the rule's set, never remove, so the rule's recall is the floor. Unsure = unmarked. The one measured filter head-to-head (96.6% precision at full recall against 80.0% at 85.7% recall, 90 hand labels, 28 positive) is on news headlines deciding whether an article is about a company, not on filings.
    checks: [precision on a labelled sample; page notes when the rule's set was read]
    on_failure: rule's set read; page notes it
    open:
      - The keyword list and the pass rate on filings are not stated.
      - With section retrieval from 10-Q/10-K the filter is unnecessary (ML review step 2).
    memo: "§2.1, Table 4 Loser-leg text row, Table D.1 role 1, Table B.1 Filter row"

  - id: extractor
    name: Extractor
    lane: text
    kind: model
    status: memo
    role: "2"
    inputs: [documents worth reading]
    outputs: [record per document, condition stated yes/no, up to three ranked conditions, verbatim quote per field, status]
    rule: |
      One document per call to Claude Sonnet 4.5, fixed schema, no numeric field, mandatory decline path (status field). Reports whether the company states its prospects depend on one external condition, up to three ranked conditions, each with a verbatim quote. Also reads dated forward statements for the calendar (role 3). Nothing from this stage enters severity or sizing.
    checks: [quote gate (next node); precision and recall against hand labels (row 08); planted-claim test is for the panel, not this role]
    on_failure: record dropped; coverage falls
    open:
      - Row 08 has not run; the ninety hand labels are reserved to Tim and unwritten, so every count is a model count (memo §4.2 now says so).
      - No sign field, so Novavax (gains if the pandemic continues) and United (gains if it ends) read as the same condition (ML review step 3).
      - No exclusion of the safe-harbour / forward-looking-statements paragraph, which names the pandemic in every 2020 filing.
      - The boolean 'depends on ONE condition' is a whole-document judgement that a single quote cannot evidence.
      - Schema size: Table A.1 says six fields, Table D.1 says up to three ranked conditions.
      - Temperature, retries, structured-output enforcement, prompt hash per record: unstated.
    memo: "§2.1, §4.2, Table 4 Loser-leg text row, Table D.1 role 2, Table B.1 Extraction row"
    row: "08"

  - id: quotegate
    name: Quote gate
    lane: text
    kind: deterministic
    status: memo
    inputs: [record per document]
    outputs: [stored records, count of dropped records]
    rule: |
      Every quoted span is string-matched against the source document before storage; a record with an unmatched span is dropped and counted. Before the gate existed the extractor fabricated 7% of its supporting quotes.
    checks: [drop count printed]
    on_failure: record dropped and counted
    open:
      - Denominator of the 7% is not given (fix 2.1-b).
      - Exact match or normalised (HTML entities, soft hyphens, line breaks)? The split between 'not in source' and 'in source but failed the match' is unknown (ML review step 3).
      - The gate checks that a span exists, not that the claim follows from it (memo concedes, check 7).
    memo: "§2.1 principle 1, §5.3 check 7"

  - id: mapper
    name: Vocabulary mapper
    lane: text
    kind: model
    status: memo
    role: "4, 7"
    inputs: [stored records, frozen condition vocabulary (versioned)]
    outputs: [condition assigned per record, abstentions]
    rule: |
      Assigns each extracted condition to the frozen, versioned vocabulary so that 'vaccine timing', 'return of normal demand' and 'resumption of international travel' are one condition. Twin: a keyword rule on the same list, with the sector code beside. Abstains with 'no single' or 'could not'; unmapped records raise a printed abstention rate whose bias runs toward the random portfolios (hides a real bet). A date-constrained mapper (role 7) is registered beside it.
    checks: [quote string-matched; scored on the labelled sample; disagreement with the twin reported monthly (row 22)]
    on_failure: unmapped; abstention rate rises on the page
    open:
      - Was the 8-of-9 'same condition' on 2020-10-31 mapped by the model or merged by hand? '§4.2 phrased five ways' suggests by hand.
      - A keyword rule is a weak twin for short-text classification; nearest-centroid over embeddings would be a stronger deterministic baseline (ML review step 4).
    memo: "§2.1, Table 5 Route 1 row, Table D.1 roles 4 and 7"
    row: "22"

  - id: vocab
    name: Vocabulary induction
    lane: text
    kind: human
    status: memo
    role: "5"
    inputs: [stored records from the previous month]
    outputs: [frozen condition vocabulary, versioned; prior version kept a month]
    rule: |
      At each monthly rebalance the extracted conditions are embedded and clustered; cluster count between 8 and 20 chosen by silhouette on a pre-sample; a person names and merges the clusters. Vocabulary is frozen for the month so 'normal demand returning' is the same condition in October as in September. Up to a month of lag on a new condition. Twin: sector code. Reversed if mapping abstention rises above its stated level between rebalances.
    checks: [human step; versioned; prior version kept a month]
    on_failure: previous vocabulary used
    open:
      - Silhouette on about 30 condition-carrying records per date is noise; the withdrawn entropy measure already showed the concentration number moves with the cluster count (ML review step 5).
      - Modal-condition share depends on how far a person merges; not comparable across dates.
      - For backtest dates the merge was done in 2026 by someone who knows the 2020 story; the largest hindsight channel in the pipeline and not a model.
      - Who induced the vocabulary for each of the 13 test dates, when, from which extractions; is the merge log versioned?
      - Alternative: a fixed, pre-registered taxonomy of about 30 external conditions with an 'other' bucket, reviewed quarterly.
    memo: "§2.1, Table 5 Route 1 row, Table D.1 role 5, Table B.1 Vocabulary row, E.1"

  - id: condmeasures
    name: Condition measures
    lane: text
    kind: deterministic
    status: memo
    inputs: [condition assigned per record, coverage]
    outputs: [stated-condition rate (by filing and by company), modal-condition share, abstention rate, coverage by leg and by smallest-cap fifth]
    rule: |
      Counts. Stated-condition rate = share of filings (and of filers) saying prospects depend on one external condition. Modal-condition share = share of condition-carrying filings naming the most common condition. Concentration is two proportions from counts, to be scored against random portfolios' filings under the same vocabulary version (row 03, unrun). On 2020-10-31: loser 19 of 112 filings (17.0%), winner 11 of 206 (5.3%); by company 25.0% against 13.3% (36 and 83 filers), 1.9x, p 0.18; by filing 2.5x, Fisher p 0.006; 8 of 9 condition-carrying loser names cite the same condition.
    checks:
      - "by-name p always printed beside by-filing p"
      - "robustness withdrawn: the earlier normalised-entropy measure moved with the cluster count (+0.30 at one setting, +0.004 at another)"
    on_failure: n/a
    open:
      - The by-company denominator is filers, not the leg; the selection into filing is unmodelled.
      - Rates are name-weighted; leg-weight share on the modal (condition, sign) pair is the object a PM needs (ML review step 6).
      - No intervals printed; 8 of 9 has a binomial interval from about 0.5 to 1.0.
      - Row 03 (against random portfolios) has not run; without it 'concentrated' cannot be separated from 'losers always write about dependence'.
    memo: "§4.2, Table 4 Loser-leg text row, Table 5 Route 1 row"
    row: "03, 06"

  - id: datereader
    name: Date-constrained readers
    lane: text
    kind: model
    status: memo
    role: "6, 7"
    inputs: [documents worth reading]
    outputs: [agreement rate with the contemporary reader]
    rule: |
      A reader whose training data ends before the period (ChronoBERT, an embedding model with a historical cutoff) is run beside the contemporary one on the same extraction; agreement rate is treated as the bound on how much of the text feature is recognition of the period. Pass: rank agreement at or above 0.80 (row 09) or chance-corrected 0.90 (E.1). Also registered: a shuffled-date placebo that should collapse the feature to noise, and an anonymised run (a model dated anonymised text correctly in 40 of 40 cases).
    checks: [row 09, unrun]
    on_failure: feature restricted to the constrained encoder; disagreement printed as an upper bound
    open:
      - Agreement is a diagnostic, not a bound: both readers can key on a surface token that is genuinely in the text, and can disagree for capability reasons (ML review §5).
      - As specified it cannot run: an encoder does not fill a six-field schema with spans (Table D.1 role 6 says 'same extraction').
      - Pass thresholds disagree: 0.80 in row 09, 0.90 in E.1 (fix E.2-a).
      - The anonymised run already failed to anonymise; drop it from the leakage list.
    memo: "§2.1 principle 3, §2.2, Table D.1 roles 6-7, E.1"
    row: "09"

  - id: catextract
    name: Catalyst extraction
    lane: text
    kind: model
    status: memo
    role: "3"
    inputs: [documents worth reading]
    outputs: [dated forward statements, each tagged with the condition it resolves]
    rule: Reads dated forward statements out of filings ('we expect a decision from the FDA in Q1') with the condition each resolves. Twin is keyword date patterns; abstains with 'no dated statement'; span gate; date parsed by rule; human review.
    checks: [span gate, date parsed by rule]
    on_failure: entry not added
    open: []
    memo: "§3.4, Table D.1 role 3"

  # ------------------------------------------------------------ positioning
  - id: comovement
    name: Within-leg co-movement
    lane: positioning
    kind: deterministic
    status: memo
    inputs: [winner leg, loser leg, daily returns per name, implied correlation]
    outputs: [co-movement per leg over the formation window and over 20 days, with its change; gap against index implied correlation]
    rule: |
      Names in a leg moving together more than fundamentals warrant (comomentum, Lou and Polk). Two windows: formation window (cannot see a week's build) and 20-day (noisy). Book-level reading printed beside the Cboe implied-correlation index. Row 05: share of dates the book-level measure is outside its band while the aggregate is not, beyond the placebo share.
    checks: [row 05, unrun]
    on_failure: series withheld
    open:
      - Row 05 has no reported result.
      - On 2020-10-31 comomentum read at its 24th percentile of 82 months; the memo says the four crowding measures read low but the page shows three (fix 4.2-f).
    memo: "§1.4 route 3, Table 5 Route 3 row, §6 positioning line"
    row: "05"

  - id: flows
    name: Short interest, ETF flow, holder overlap
    lane: positioning
    kind: deterministic
    status: memo
    inputs: [short interest by leg, daily short volume, ETF shares outstanding, 13F/N-PORT holdings]
    outputs: [short-crowding series per leg, daily short-flow per leg, daily factor flow, winner-leg holder overlap among momentum-style filers]
    rule: |
      Short interest by leg at release; Reg SHO daily volume as the flow proxy between prints; MTUM shares outstanding as the one same-day factor-flow instance; 13F/N-PORT overlap among momentum-style filers by a fixed rule, a floor, long leg only, a quarter late. Read at rebalance rather than daily because these are consequences of crowding, not measurements of it. Two further channels, FINRA margin debt and SEC fails-to-deliver, were tested for lead and refuted above their detection floors.
    checks: [detection floors by simulation (row 12)]
    on_failure: series withheld
    open:
      - Margin-debt and fails-to-deliver results appear once with no numbers (fix 5.3-e).
    memo: "§2.2, Table 5 Route 3 row, §5.3 ablations note, Table A.1"

  # ------------------------------------------------------------ routes and severity
  - id: route1
    name: Route 1 detector, short leg on one condition
    lane: routes
    kind: deterministic
    status: memo
    inputs: [condition measures, loser-leg beta, distance from prior highs, return volatility, short interest by leg]
    outputs: [Route 1 state, its severity state (volatility regime with the panic flag beside it)]
    rule: |
      Observable: prospects of the loser names turn on one external condition, so a single event reprices all of them. Deterministic measures: loser-leg beta, distance from prior highs, return volatility, short interest at release. Text adds the condition itself and its concentration. The live detector has no bear-market requirement; the classification rule's Route 1 did, so the two are different objects (row 20 scored one against the other).
    checks:
      - "check 5: named the right route before 1 of 3 past Route 1 reversals, the worst of the three"
    on_failure: instrument-limited below the coverage gate
    open:
      - The panic flag and the volatility regime are never defined (fix 3.3-a).
      - The severity state was widened from the panic flag alone after the flag did not fire on 2020-10-31; a post-hoc change, now labelled as such.
    memo: "§1.4, §3.2, Table 5 Route 1 row, §3.3"
    row: "03, 20"

  - id: route2
    name: Route 2 detector, winner leg's macro bet
    lane: routes
    kind: deterministic
    status: memo
    inputs: [z per series, sector weights per leg]
    outputs: [Route 2 state, its severity state (driving-series extension over the formation window)]
    rule: |
      Observable: winner-leg sensitivity to the driving series (rates in the recent decade, oil or the dollar in other years) concentrated beyond what sector composition explains. Measures: per-name rolling sensitivity, the leg spread, the placebo percentile, where inside the leg the sensitivity sits; cap-matched z on the pre-named rate series at the 95th percentile, sector-matched z beside (row 04). Text adds the labeller's caption; a disclosed-sensitivity extractor from filings is a production role.
    checks:
      - "check 5: 3 of 4 Route 2 reversals recovered"
    on_failure: series withheld
    open: []
    memo: "§1.4, Table 5 Route 2 row, §3.3"
    row: "04"

  - id: route3
    name: Route 3 detector, crowded exit
    lane: routes
    kind: deterministic
    status: memo
    inputs: [co-movement per leg, holder overlap, daily factor flow, implied correlation]
    outputs: [Route 3 state, read at rebalance]
    rule: |
      Observable: names in a leg move together more than fundamentals warrant while their holders overlap. Read at rebalance. Little from public text: 246 hand-labelled news articles contained no genuine discussion of factor crowding and a model reading the same corpus found approximately none. Blind at the daily horizon until crowding has moved prices; prime-broker positioning is first on the production purchase list.
    checks:
      - "check 5: the crowding detector never left its quiet range on any of the seven dates"
    on_failure: blind by construction
    open:
      - Route 3 fires on zero of 195 historical episodes; four synthetic episodes planted at its definition's centre were all recovered, so the rule works and the definition does not describe the record.
    memo: "§1.4, Table 5 Route 3 row, Table 6"
    row: "05"

  - id: classify
    name: Classification rule over past reversals (refuted)
    lane: routes
    kind: deterministic
    status: memo
    inputs: [crash inventory (195 episodes 1926 to 2026), leg shares of each loss, market move, bear state]
    outputs: [route label per episode, or fits-none]
    rule: |
      Each episode typed by a fixed rule from the leg share of the loss, the market's move and the bear state; routes mutually exclusive by construction. Registered band for the fits-none share 5 to 30%; result 44.1% [37.0, 51.4], refuted (row 19). 77 of the 86 unassigned share one pattern: short-leg loss, market rising, no prior bear market. Dropping the bear clause would assign 71 of 77; not done because a rule changed after seeing which clause failed is fitted to the data. Breach days within 21 days collapsed to one episode. Route 3 takes zero episodes. The daily output therefore reports by leg and names a route only where its detector fires.
    checks: [order-invariance of the fits-none share; interval assumes independent episodes, a regime-blocked bootstrap owed]
    on_failure: reports by leg
    open:
      - November 2020 is Route 1 in §1.4's narrative and fits-none under the rule; now reconciled in one sentence, but the framework's flagship case falls outside its taxonomy.
      - The next registration (§7) writes the short-leg mechanism as two variants, with and without a preceding bear market.
    memo: "§1.4, §3.2, §5.2 claim 4 and note, Table B.1 last row"
    row: "19, 20"

  - id: severity
    name: Severity
    lane: routes
    kind: deterministic
    status: memo
    inputs: [reconstructed book returns, volatility state, bear-state terms, route states]
    outputs: [10-day 5% VaR, 10-day ES, 21-day VaR, unconditional quantile beside each, episode count]
    rule: |
      Design: a conditional quantile per route (Route 1 on the volatility regime with the panic flag; Route 2 on driving-series extension), unconditional quantile and episode count beside it, unconditional alone below a minimum count; no probability printed because the crashes number in single figures. Prototype, which produced every VaR and ES in §4 and §6: linear quantile regression of the reconstructed book's ten-day forward return on trailing volatility and the Daniel-Moskowitz bear-state terms, fitted at the 5% quantile on every day up to the formation date, scored against unconditional, volatility-scaled and bear-state baselines. Events: ten-day return at or below -432bp (Routes 1 and 3); 800bp peak-to-trough within 90 days confirmed by 20 sessions (Route 2). On 2020-10-31: VaR -9.47% against -4.24% unconditional; realised -9.56%.
    checks: ["check 3: 2 breaches of the 5% VaR in 42 non-overlapping forecasts on the held-out years (4.76%, [0.6%, 16%]); ES no milder than VaR (trp-81)"]
    on_failure: unconditional quantile alone
    open:
      - Minimum episode count for the conditional quantile is not stated (fix 3.3-b).
      - Whether the VaR moves with the state is untested (check 3 caveat).
      - §6 says 'given the current volatility regime only', §3.3 says volatility plus bear-state terms (fix 6-b).
    memo: "§1.6, §3.3, §4.2, §5.3 check 3, §6 severity line"
    row: "07 (withdrawn sizing test)"

  # ------------------------------------------------------------ context
  - id: calendar
    name: Catalyst calendar
    lane: context
    kind: model
    status: memo
    role: "10"
    inputs: [dated forward statements, dated scheduled events, condition assigned per record]
    outputs: [days to the nearest matched event per condition, N of M matched]
    rule: |
      A model proposes which calendar event resolves which extracted condition, with a quote from both sides; a person accepts or rejects; then days-to-nearest is arithmetic. Twin: keyword join. Catalysts are listed and never weighted, because weighting them would be the probability §3.3 declines to print. Unscheduled resolutions are watched through the reference series.
    checks: [spans from both sides string-checked; person accepts]
    on_failure: no match; coverage line falls
    open:
      - On the 2020-10-31 page the falsifier names the vaccine readout, which was not on any calendar; how often does the calendar carry the resolving event at all?
    memo: "§3.4, Table D.1 role 10, Table B.1 Calendar match row"
    row: "17"

  - id: analogue
    name: Analogue retrieval
    lane: context
    kind: deterministic
    status: memo
    inputs: [current state vector, inventory dates with closed outcome windows]
    outputs: [five nearest past states with what followed, quiet outcomes included; neighbour rows with attribution]
    rule: |
      State vector: the eight conferred z-scores, the volatility state, the panic flag, within-leg co-movement, the loser-leg condition rate, each as of that date. Candidates restricted to inventory dates whose outcome window closed at least a year before the query date. Distance is covariance-aware (Mahalanobis-type) on the pre-sample so correlated dimensions are not double-counted. Retrieval in form, deterministic in fact; no model seat in the search. On 2020-10-31 the five nearest were 2008-09 and 2000 recoveries, four of five followed by momentum gains.
    checks: [each neighbour's state computed from data as it stood on its own date (the as-of replay)]
    on_failure: distance list alone
    open:
      - The condition-rate dimension requires extraction on every candidate date; how far back was it run? (fix 3.5-b)
      - Confirm the distance is Mahalanobis (fix 3.5-a).
    memo: "§3.5, Table 4 Analogue row, Table B.1 Analogue row"

  - id: panel
    name: Analogue panel, proponent, dissent, adjudicator
    lane: context
    kind: model
    status: memo
    role: "11, 12, 13"
    inputs: [neighbour rows with attribution]
    outputs: [apt or not, with the failing field]
    rule: |
      Three Claude Sonnet 4.5 roles argue over the record and nothing else: proponent argues the match applies; dissent says where it fails, citing fields the distance does not use; adjudicator rules apt or not, citing the deciding field. Field-citation gate: every claim must name a field present in the record or it is dropped by rule; the query date's own forward return is absent from the record. Adjudicator's twin: a registered field-comparison rule; it earns its seat only if its overrules would not all have been caught by the rule (row 22). On 2020-10-31 the panel ruled the match not apt: every retrieved state was a credit-crisis or dot-com recovery, while this book is priced on one condition with a discrete resolving event.
    checks:
      - "planted-claim test: 3 real kept, 3 invented dropped (check 7, a smoke test)"
      - "uncited dissent share monitored"
    on_failure: retrieval verdict stands, flagged unadjudicated
    open:
      - A model trained after 2009 knows what followed 2009; the gate limits what it can say, a mitigation not a solution; hence last seat into the daily loop.
      - Several instances of one base model share errors, so the panel is not independent confirmation (memo's own risk 4).
    memo: "§3.5, Table D.1 roles 11-13"
    row: "11, 22"

  # ------------------------------------------------------------ page and people
  - id: eventrule
    name: Event rule, when a page fires
    lane: page
    kind: deterministic
    status: memo
    inputs: [z per series, route states, condition measures, co-movement per leg]
    outputs: [fire or quiet]
    rule: |
      A page appears only when a registered threshold is crossed; thresholds set jointly on the null of the daily maximum across all monitored statistics, at most 2 expected false pages a month (row 17); a weekly summary otherwise. A quiet reading distinguishes no bet found from coverage too low to say. If a source fails or is late, only the dependent statistics are withheld and the page says which.
    checks: [measured false-page rate; re-registered if above the ceiling two months running]
    on_failure: template with a banner
    open: []
    memo: "§7 daily loop, Table 4 Page row, E.1"
    row: "17"

  - id: composer
    name: Composer
    lane: page
    kind: model
    status: memo
    role: "14"
    inputs: [every output above]
    outputs: [the page, or the template with a banner]
    rule: |
      Prose composed over fixed fields. A numeral tokeniser rejects any page where a numeral in the prose fails to match a computed field; one mismatch fails the build. Twin: the plain template rendered daily into the log. Daily canary: the composer runs on a test date with a known answer; if it fails, the template ships without prose. Reversed if template and prose are judged equally useful in the blind comparison (row 13). When a model version changes, affected series are recomputed and the change shown as a step.
    checks: [numeral gate, daily canary, blind comparison against a no-information baseline (row 13, unrun), time to verify the headline claim at most 5 minutes (row 14)]
    on_failure: template ships with a banner
    open: []
    memo: "§2.1 principle 2, §7 daily loop, Table D.1 role 14, Table B.1 Composer row"
    row: "13, 14"

  - id: thepage
    name: The page
    lane: page
    kind: output
    status: memo
    inputs: [the page]
    outputs: [one page, pushed; dashboard for checking and recomposing past dates]
    rule: |
      Fixed layout. Header: book, horizon (10 trading days), as-of date. Type (by leg). Headline. Severity (10-day 5% VaR against unconditional, 10-day ES, 21-day VaR). What the usual screens show (sector Herfindahl, VIX and implied-correlation percentiles). Positioning (comomentum percentile, daily short volume, ETF shares). Loser leg (counts, ratio, by-company p, modal condition, one verbatim dated quote). Analogues (five nearest and the panel verdict). What would resolve it. Coverage. Postscript when known. On a quiet day the same layout ships with the headline blank.
    checks: [every number links to the stored output it came from; the quoted span to its filing]
    on_failure: template with a banner
    open:
      - The design promises two falsifiers per page; the page prints one, and it names the event that would confirm the reading, not refute it (fix 3.3-e, TIM).
      - Intervals are not printed; '1.9 times, p 0.18' reads as signal.
      - Sign split of the modal condition is not printed.
    memo: "§6"

  - id: falsifiers
    name: Falsifiers and the hit-and-miss log
    lane: page
    kind: deterministic
    status: memo
    inputs: [the page, subsequent returns and events]
    outputs: [hit-and-miss log; the calibration record]
    rule: Each page ends with its falsifiers, which resolve at each event into a log of hits and false alarms; that log is the calibration record a design without probabilities keeps. Open falsifiers are reviewed weekly.
    checks: [n/a]
    on_failure: n/a
    open:
      - What exactly counts as a hit or a miss for a page whose falsifier is 'not datable in advance'?
    memo: "§3.3, Table 4 Page row, §7 weekly"

  - id: signoff
    name: Sign-off and the four human tasks
    lane: page
    kind: human
    status: memo
    inputs: [the page]
    outputs: [signed page, or template marked unsigned after two hours]
    rule: |
      Four tasks need a person. (1) Sign-off on each event page, for the failure the gates cannot see, a page whose numbers are right and whose stated mechanism is wrong; unsigned after two hours ships the template marked unsigned. (2) Weekly calendar upkeep. (3) A monthly sample of filings labelled by hand and checked by a second reader, measuring the extractor's error rate. (4) At each rebalance, reading the extractor's condition list and naming the categories it maps to. Deciding what the system claims is the register (Appendix C).
    checks: [n/a]
    on_failure: template marked unsigned
    open:
      - Task 3 has never been done; row 08 is the result it would produce.
    memo: "§3.6, §7 the people"

  - id: responselog
    name: Response log, the missing falsifier
    lane: page
    kind: human
    status: memo
    inputs: [signed page, the reader's positions (production input only)]
    outputs: [looked at / ignored / acted on per page]
    rule: The reader's responses are logged as looked at, ignored, or acted on, scored against a pre-stated base rate. This is the only way to measure whether a page changed a decision, and it cannot exist before the reader's positions are an input; the book is a proxy no fund holds.
    checks: [decision-value test, scored against a pre-stated base rate]
    on_failure: n/a
    open:
      - The brief's 'what decision the system informs' rests on this; it is the first item in §7's Next.
    memo: "§1.5, §3.7 Table 6, §7 Next"

  # ------------------------------------------------------------ research process
  - id: register
    name: Pre-registration register
    lane: research
    kind: human
    status: memo
    inputs: [every test]
    outputs: [23 rows with threshold set in advance and both outcome sentences written first]
    rule: |
      Before each test runs, a row records the threshold and the sentence the memo carries if it clears and if it does not; closing a gap deletes the losing branch. Detection floors by simulation before any test (row 12): a null above the floor is a finding, below it the test was too weak (instrument-limited). Sealed years (2023 onward) opened once under criteria written first. Revisions logged: horizon twenty to ten days (before any test); entropy withdrawn (§5.3); Route 1 severity state broadened after the prototype date (post-hoc, labelled).
    checks: [linter fails on any surviving gap token]
    on_failure: n/a
    open:
      - Rows 07, 14, 15, 18 are about the memo or the developer, not the world (bloat pass C-1).
      - Rows 02, 03, 05 have no reported result.
      - Row 23 was registered 2026-09-02, four days before the memo date, with a seventh control added at run and two dates' numbers known at registration.
    memo: "§5.1, Appendix C"
    row: "12, 18, 23"

  - id: labels
    name: Hand-labelled sample and rectification
    lane: research
    kind: human
    status: memo
    inputs: [stored records]
    outputs: [precision and recall of the extractor; rectified stated-condition rate and modal share with intervals]
    rule: |
      About 90 to 100 records per draw, a stratified sample across the whole leg including uncovered names with stratum weights known, sized by inverting for a target half-width of 0.08 near 0.80, second-rated. Prediction-powered inference uses the labelled subset to estimate the model's bias and remove it, with an interval valid for means. Pass: both precision and recall at or above 0.80 with intervals excluding the keyword floor, and the rectified interval narrower than the classical one. Labels produced by the assistant that wrote the extraction prompt are barred by code.
    checks: [n/a]
    on_failure: the labelled sample alone carries the estimate; the model buys no effective sample
    open:
      - Unwritten. The ninety labels are reserved to Tim.
      - At 90 labels the PPI interval is barely narrower than the classical one, so the pass criterion is nearly vacuous (ML review step 9).
      - Constant model bias cancels in the episode-minus-control difference; date-dependent bias does not, so labels must be stratified by episode/control and by era, and error reported by stratum.
      - How is a name with no document labelled?
    memo: "§5.1, Appendix C row 08, E.1"
    row: "08"

  - id: referees
    name: Referee roles and research assistant
    lane: research
    kind: model
    status: memo
    role: "15, 16, 17"
    inputs: [each design with results, verdicts and caveats stripped]
    outputs: [flaws found; disagreements listed; code, review, drafting]
    rule: |
      A referee (role 15) reads a results-stripped design against a checklist; a dissenting referee (role 16) is a second prompt written to disagree; a research assistant (role 17) writes code, reviews, drafts and self-audits, code trusted only on tests run, prose numbers must cite a field. Planted-flaw hit rate and clean-design false alarm are the checks (row 11: chance-corrected agreement 0.60, hit rate 0.80, false alarm 0.20). The drafting model twice proposed a statistical shortcut that did not hold (a mean-only bias correction applied to a nonlinear index; seed agreement as reliability), both caught in review. Package ledger: 81 experiments, 27 supported, 21 refuted, the rest inconclusive, instrument-limited or underpowered. Fourteen instrument faults logged, twelve caught by an existing check.
    checks: [planted flaws, false alarms; trap log]
    on_failure: checklist result used; first referee's list
    open:
      - The drafting model's version is not named in the AI-use log.
    memo: "§3.8, §5.4, Appendix D"
    row: "11"

  - id: evidence
    name: Evidence on the text stage
    lane: research
    kind: deterministic
    status: memo
    inputs: [condition measures on episode and control dates]
    outputs: [claim 6 verdict]
    rule: |
      Claim 6: before a reversal more loser-leg companies say their prospects hang on one external condition. Median stated-condition rate, one-sided rank test, episode formation dates against control dates. Design tier: 6 episodes against 7 controls, 13.4% against 7.1%, p 0.018 (three swapped pairs short of 0.05). Held-out 2023 onward: 6 against 6, 11.0% against 10.4%, p 0.47; did not reproduce, more than half the collapse being the control arm rising. Held-out arm selected episodes by the start of the loss window rather than the drawdown trough; logged, unrepaired. Re-registered (row 06) as the pooled, date-stratified, leg-differenced rate in name units on the design years, forward seal confirmatory.
    checks: [sealed years opened once]
    on_failure: text stage stays a hand tool
    open:
      - The re-registration changes the question from temporal (elevated before reversals) to cross-sectional (loser leg differs from winner leg), and 'fifty times the observations' is false since names within a leg share the condition by hypothesis; the right statistic is the episode-versus-control interaction of the within-date leg difference, clustered by date (ML review §4).
      - The 'floor not ceiling' claim about coverage skew is unsigned until measured.
      - Control dates: matched on calendar month and volatility state, or neither?
      - Boilerplate alone could produce 13.4 against 7.1 if episode dates cluster in 2020.
    memo: "§5.2 claim 6 and note, Appendix C rows 06 and 23"
    row: "06, 23"

