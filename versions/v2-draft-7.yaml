edges:
  # data to the book
  - {from: prices, to: sort, carries: "returns and the universe", when: "at rebalance", mode: "backtest and live"}
  - {from: prices, to: random, carries: "the universe and sector codes", when: "at rebalance", mode: "backtest and live"}
  - {from: sort, to: random, carries: "leg sizes and cap profile", when: "at rebalance", mode: "backtest and live"}
  - {from: prices, to: controls, carries: "returns and the universe", when: "at rebalance", mode: "backtest and live"}
  - {from: prices, to: covariance, carries: "daily returns", when: "at rebalance", mode: "backtest and live"}
  - {from: sort, to: covariance, carries: "the book's names, both legs", when: "at rebalance", mode: "backtest and live"}
  - {from: random, to: covariance, carries: "the sector-matched random portfolios", when: "at rebalance", mode: "backtest and live"}
  - {from: sort, to: pca, carries: "position weights", when: "at rebalance", mode: "backtest and live"}
  - {from: covariance, to: pca, carries: "shrunk covariance, for the book and for each random portfolio", when: "at rebalance", mode: "backtest and live"}
  - {from: pca, to: bridge, carries: "component returns and the named component", when: "at rebalance", mode: "backtest and live"}
  - {from: refseries, to: bridge, carries: "six series", when: "at rebalance", mode: "backtest and live"}
  # exposure
  - {from: sort, to: sensitivities, carries: "two legs", when: "daily", mode: "backtest and live"}
  - {from: refseries, to: sensitivities, carries: "six daily series", when: "daily", mode: "backtest and live"}
  - {from: controls, to: sensitivities, carries: "the book ranked 24 months earlier", when: "at rebalance", mode: "backtest and live"}
  - {from: random, to: sensitivities, carries: "random portfolios, cap-matched", when: "daily", mode: "backtest and live"}
  - {from: sensitivities, to: zscore, carries: "conferred and carried spread per series, for the book and for each random portfolio", when: "daily", mode: "backtest and live"}
  - {from: controls, to: zscore, carries: "the random-ranking control's spread per series", when: "daily", mode: "backtest and live"}
  - {from: zscore, to: route2, carries: "the driving series and its exposure", when: "daily", mode: "backtest and live"}
  # context space
  - {from: news, to: newsagent, carries: "the twelve-month archive", when: "weekly", mode: "backtest and live"}
  - {from: newsagent, to: embedspace, carries: "dated risk statements with paraphrases", when: "weekly", mode: "backtest and live"}
  - {from: pmworries, to: taxonomy, carries: "edits", when: "on change", mode: "live only"}
  - {from: taxonomy, to: embedspace, carries: "list entries, used as retrieval queries", when: "on change", mode: "backtest and live"}
  - {from: embedspace, to: cluster, carries: "reference points and the assignment distance", when: "weekly", mode: "backtest and live"}
  - {from: embedspace, to: namecluster, carries: "news clusters for the cross-check", when: "weekly", mode: "backtest and live"}
  # naming
  - {from: pca, to: pc1text, carries: "component sets of the book and of the random portfolios", when: "at rebalance", mode: "backtest and live"}
  - {from: filings, to: pc1text, carries: "context and event text", when: "weekly", mode: "backtest and live"}
  - {from: pc1text, to: riskextract, carries: "text per component name, with its loading", when: "weekly", mode: "backtest and live"}
  - {from: riskextract, to: cluster, carries: "risk statements with sign and paraphrase, on both series", when: "weekly", mode: "backtest and live"}
  - {from: pca, to: cluster, carries: "component sets with loading signs", when: "at rebalance", mode: "backtest and live"}
  - {from: cluster, to: namecluster, carries: "the component's theme and the quote weights", when: "weekly", mode: "backtest and live"}
  # propagation and theme statistics
  - {from: namecluster, to: propagate, carries: "the theme and its quotes", when: "at rebalance", mode: "backtest and live"}
  - {from: filings, to: propagate, carries: "text of names in scope", when: "at rebalance", mode: "backtest and live"}
  - {from: posdata, to: propagate, carries: "names in the universe's top positioning quintile, the second search scope", when: "at rebalance", mode: "backtest and live"}
  - {from: pca, to: themescore, carries: "book variance share, component set, component sigma", when: "at rebalance", mode: "backtest and live"}
  - {from: sort, to: themescore, carries: "position weights", when: "at rebalance", mode: "backtest and live"}
