      A page ships when it fires and records whether it was acknowledged; the two-hour signature is dropped, since on the days a page fires the market is moving. Human tasks: the taxonomy edits; the weekly catalyst pass; a monthly stratified sample of 90 records labelled by a research analyst, not the PM.
    checks: []
    on_failure: shipped unacknowledged
    open: []
    memo: "§3.6, §7"

