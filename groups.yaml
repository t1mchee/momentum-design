# Hierarchy for the levels view. Groups nest: a group's children are node ids from the spec, or other groups.
# `synthesis` is a one-paragraph statement of what the group does, written for the reader of the memo.
# `brief` names the required element of the brief the group answers. Order is reading order.

groups:
  - id: g_inputs
    name: 1. Inputs, dated when they became public
    short: Inputs
    brief: "Element 2, data design: market, text and positioning; timestamping and point-in-time availability."
    synthesis: >
      The brief asks for three kinds of information: prices and a point-in-time universe, company filings and
      news, and positioning. Each record is dated at the moment it became public. Every feed is labelled
      public, licensed or desk-only, so the reader can see which parts of the design run today on public data
      and which need a purchase. Every component also has one of five look-ahead labels, defined in the
      legend. Clean: it uses only values that were public on the date. As-of: the values exist historically
      but are taken at their release date. Model: a model trained after the date reads text from inside it.
      Live-only: the component runs on live data only and no backtest claim depends on it. Human: a person's
      input, which a backtest runs without. The label decides one thing: a statistic labelled model enters a
      registered test only beside its comparator, which is clean or as-of.
    children:
      - id: g_market
        name: Market data and calendars
        short: Market
        synthesis: >
          Market data covers daily prices adjusted for corporate actions, and the index constituents as they
          stood on each date. It also covers six reference series, none of which is revised, with the bear
          state computed from the first of them, and the French factor file, which gives a long history and
          the reversal record. The earnings and macro calendars supply the catalyst dates, with earnings
          dates projected from the prior year. Options give the premium on the hedge line and nothing else.
        children: [prices, refseries, french, options]
      - id: g_text
        name: Text, in layers
        short: Text
        synthesis: >
          Company text has two layers we can use now: the risk-factor sections of 10-Ks and 10-Qs, and the
          8-Ks and earnings-call transcripts, both split into sentences. A third layer, research and dealer
          notes, is production-only. News is used in two ways. A slow pass over a rolling twelve-month
          archive builds the embedding space in which themes are located; a fast pass over the last five
          sessions feeds the catalyst proposal.
        children: [filings, news]
      - id: g_positioning_data
        name: Positioning feeds and score
        short: Positioning
        synthesis: >
          The positioning score has one input per leg: 13F crowding on the winner leg, short interest on the
          loser leg, each ranked within its leg. A 13F count on a short would measure the wrong side, which is
          why the loser leg has its own input. Neither input is computed from returns, so the overlap's null
          is valid. Because the inputs arrive with different lags, the longest of those lags is shown next to
          the score wherever the score appears.
        children: [posdata]

  - id: g_book
    name: 2. The book and the exposures the ranking rule gave it
    short: The book
    brief: "Element 1, problem definition: the exposure monitored is the 12-1 book. The event, horizon, user and decision are stated in the problem block at the top of the spec."
    synthesis: >
      Rebuild the 12-1 momentum book monthly. Then measure which macro exposures the ranking rule gave the
      book, in hedgeable units, and compare each against 200 random portfolios of the same size, capitalisation
      profile and sector mix. One first-stage regression on the market gives the residual return that every
      later statistic uses, and one slope per company and series gives the exposure, over the 126 days ending
      at formation. The page prints one percentile per series, against the book's own history, and it is the
      percentile that can trigger a page; the percentile against the random portfolios, which shows whether
      the sort produced the exposure, goes to the appendix. The driving series is the one of the six on which
      the book's exposure has the highest own-history percentile that month.
    children: [sort, random, sensitivities, percentiles, drivingseries]

  - id: g_theme
    name: 3. Naming the theme and finding where it has spread
    short: The theme
    brief: "Element 3, system design: where text, retrieval and language models add value over conventional methods, and which parts are deterministic."
    synthesis: >
      First find the leading co-movements among the book's companies, three components, and keep those that
      explain more of the book's variance than a random book of the same shape does. Then label the named
      component from its companies' filings, by assigning their risk statements to the nearest news cluster
      in an embedding space built from news, and on the live page to the nearest entry of a worry list the PM
      maintains. Finally, search the rest of the book and the crowded companies for others whose filings
      contain the same theme; a company counts as having the theme when one of its risk statements lies
      within the assignment distance of the theme's reference point, and that statement is the quote kept
      with the result. The decomposition, the assignment and the search are deterministic. The language model
      does two jobs in this group: it labels the sentences from which the risk-statement classifier is
      trained, for news and for filings, and it names a residual cluster that matches no list entry. Each has
      a comparator that does the job without a language model, a keyword rule and a keyword label, and the
      comparator's records are followed as far as the theme, so the theme's excess weight and its label are
      computed on both runs and the two are printed together. That is the whole comparison, and it is
      measured where the sample can resolve it: on the hand-labelled sentences and on the theme agreement
      between the runs.
    children:
      - id: g_decompose
        name: Decompose the book
        short: Decompose
        synthesis: >
          Compute a shrunk covariance matrix over the book's residual returns and take its first three
          components. For each, report the share of the book's variance it explains, compared with the same
          statistic on random books; a component is above noise when it beats the random books' 95th
          percentile. Regress each component's return on the five non-market reference series: a high
          R-squared means a named macro series already explains the component and the text pipeline will
          only confirm it. The same regression, one instrument at a time over sector ETFs and macro futures,
          chooses the hedge instrument and its slope, which sizes the hedge line.
        children: [covariance, pca, bridge]
      - id: g_context
        name: Build the embedding space
        short: Context
        synthesis: >
          The embedding space is built from news risk statements, using one named public encoder on every
          date with a keyword retrieval beside it, so that a theme statistic the keyword run also produces
          is not an artefact of the encoder. News statements are clustered into topics under discussion, and
          the cluster centroids are the reference points of the themes the backtest can find. On the live
          page each entry of the PM's worry list also gets a reference point, and the list gives the
          clusters names.
        children: [newsagent, taxonomy, embedspace, pmworries]
      - id: g_name
        name: Label the component from its filings
        short: Label
        synthesis: >
          From each component company's filings, take the sentences a classifier marks as risk statements,
          and count a company toward a theme when one of its statements lies within the assignment distance
          of the theme's reference point. Compare the resulting weight with the same procedure run on the
          random books' component sets; the theme is the reference point with the largest excess, if that
          excess is larger than random books reach. Then label it: a list entry's name, or for a residual
          cluster the model's label printed beside a keyword label so the reader can check one against the
          other.
        children: [gathertext, riskextract, cluster, namecluster]
      - id: g_propagate
        name: Search other companies, and the two theme statistics
        short: Propagate
        synthesis: >
          Search the rest of the book and the crowded quintiles for companies whose risk statements lie
          within the assignment distance of the theme's reference point, with no cap and no reranking. Then
          print two statistics: the share of the book's variance explained by the theme component, beside
          its random-book comparison, and the loss in basis points of book, by leg, if the component returns
          minus two standard deviations over ten days.
        children: [propagate, themescore]

  - id: g_crowding
    name: 4. Who else is in the trade
    short: Crowding
    brief: "Element 3, positioning and crowding information integrated with the text reading."
    synthesis: >
      Compare the list of theme companies with the list of crowded companies. The overlap is the share of
      theme companies' book weight that is crowded, per leg; its null is the crowded set's share of the leg's weight, printed
      beside it, and the claim that funds are positioned on one theme is supported when the median gap since
      2014 is above zero.
      Two vulnerable-name lists are drawn from the crowded theme companies: the pre-catalyst list, companies
      that rose with the component and have the most recent gain at risk, and the post-unwind list,
      companies that have not yet moved after the component has fallen. On the loser leg the post-unwind
      list is the heavily shorted theme companies that have not yet rallied. The lists are held back until a
      five-episode event study shows they move more than sector-matched companies.
    children: [poscluster, timebombs]

  - id: g_tail
    name: 5. Severity and timing
    short: Tail and catalysts
    brief: "Element 6, horizon and severity; element 3, statistical modelling against conventional baselines."
    synthesis: >
      One tail model gives the severity estimate. It is the 5% quantile of the book's past ten-day returns,
      each divided by the book's volatility at the time, taken over past starts in the same calendar state as
      today (inside or outside a window around an FOMC decision or a heavy earnings day) and multiplied by
      today's volatility. Its outputs are a ten-day 5% VaR and expected shortfall in basis points of book, the
      probability of a return at or below the long-run threshold, and how much worse the VaR is inside a
      catalyst window. It is scored against two baselines, the same quantile with no volatility scaling and
      with no calendar state, so the ablation is three lines a reader can compute by hand. Text and
      positioning do not enter the model; whether they sort the breaches is measured in the scoring group.
      Scheduled catalysts come from calendars; company-specific and off-universe catalysts are proposed live
      by a model from news, beside a term-list comparator, and approved by the PM. Analogues supply
      historical context by distance alone, with no language model.
    children:
      - id: g_severity
        name: The tail model
        short: Tail model
        synthesis: >
          The tail model uses prices and the calendar only: the book's own return history, its trailing
          volatility and the catalyst windows. There are no fitted parameters. Every run prints the VaR, the
          expected shortfall, the VaR inside a catalyst window and its increase, and the three ablation lines:
          the unconditional quantile, the calendar-state quantile and the volatility-scaled calendar-state
          quantile, which is the model.
        children: [severity, baselines]
      - id: g_catalysts
        name: Catalysts
        short: Catalysts
        synthesis: >
          Scheduled catalysts (FOMC, CPI, payrolls, index rebalances, the component companies' earnings) are
          taken from calendars with no model. Company-specific and off-universe catalysts are proposed by a
          language model, each with a date and a source quote, beside a term-list extractor over the same news,
          and approved by the PM. That model runs only on live data and is excluded from the backtest; an
          approved catalyst opens a window in the tail model.
        children: [catagent, catapprove]
      - id: g_analogue
        name: Analogues
        short: Analogues
        synthesis: >
          The analogue section lists the five past formation dates since 2013 whose state was nearest to
          today's, by Euclidean distance on ten standardised dimensions, and what the book did over the
          following ten days. The twelve months before today are excluded. An analogue is apt when its bear
          state and its theme match today's.
        children: [analogue]

  - id: g_output
    name: 6. What the PM sees and does
    short: Output
    brief: "Element 6, the example output; element 3, which parts require human review; element 7, the production path."
    synthesis: >
      A page is produced five sessions before a catalyst, or whenever the maximum of the book's monitored
      percentiles crosses the 95th percentile of its own history. The page is a template of nine fixed items
      rendered from stored outputs; the only free text is the quotes and the theme label. It reports the theme
      and its variance share; the loss in basis points if the theme reverses, by leg; the VaR beside the hedge
      line, which names the instrument, its notional sized from the component and its premium; the positioning
      overlap; the two vulnerable-name lists, once their event study has run; the catalysts; and what changed
      since the last page. It gives the direction of the risk and the sized hedge and leaves the decision to
      exit with the reader, and its numbers describe the paper 12-1 book, to be scaled by the reader's beta
      to it. An item that has not run is not on the page; the footer names it. The PM acknowledges the page,
      edits the worry list and approves catalysts. Whether the PM looked at, ignored or acted on each page is
      logged; until the PM's positions are an input, the proxy is the acknowledgement and the two logged
      actions within five sessions of a page. In production the page is kept current and pushed on change,
      the response log is the first item, and the licensed feeds replace the public ones layer by layer.
    children: [eventrule, thepage, signoff, responselog]

  - id: g_validation
    name: 7. How we know it works
    short: Validation
    brief: "Element 5, validation plan and evidence: baselines, ablations, leakage controls, registered tests."
    synthesis: >
      Every test is registered before it runs, with the pass threshold, the detection floor and the sentence
      that will go in the memo under each outcome written down in advance; what the register fixes is the
      wording and the thresholds, not the inference, and every v2 result is in-sample. The tail model is
      scored on coverage, where Kupiec's test at 130 months accepts 3 to 10 breaches, and on the ratio of its
      pinball loss to each baseline's, with a bootstrap interval; the model beats a baseline only when the
      interval excludes one. Text is tested as a sort of the breach record by theme weight, and the register
      labels it illustrative if fewer than five of the breaches fall on the high side. The vulnerable-name
      lists are tested in an event study over five recorded unwinds. Extraction error is measured on
      hand-labelled sentences, for the classifier and the keyword rule side by side, split by whether the
      document predates the labelling model's cutoff. The premise, that a theme is visible before a reversal,
      is measured over the recorded episodes and printed as a share beside the same share on calm months. Only the first design's severity test on
      held-out years has run, with a model that had no text: 2 breaches in 42 forecasts. The v2 scoring, the
      labels and the event study have not run, and the worry-list comparison can only be made in production.
    children: [register, labels, volvalidation, bombtest, themevalidation]

  - id: g_retired
    name: Retired
    short: Retired
    brief: "Kept for the record, each with the reason it was replaced."
    synthesis: >
      Components that a later draft replaced or refuted, each kept with the reason: the three-route taxonomy
      and its detectors, the separate vol model, the labeller, the three-role analogue panel, the referee
      roles, and from draft 11 the control sorts, the GARCH baseline and the prose composer.
    hidden: true
    children: [controls, garch, composer, route1, route3, classify, volmodel, labeller, panel, referees]
