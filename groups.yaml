# Hierarchy for the levels view. Groups nest: a group's children are node ids from the spec, or other groups.
# `synthesis` is a one-paragraph statement of what the group does, written for the reader of the memo.
# `brief` names the required element of the brief the group answers. Order is reading order.

groups:
  - id: g_inputs
    name: 1. Inputs, dated when they became public
    short: Inputs
    brief: "Element 2, data design: market, text and positioning; timestamping and point-in-time availability."
    synthesis: >
      The brief asks for three kinds of information: prices and a point-in-time universe, company filings and
      news, and positioning. Each record is dated at the moment it became public. Every feed is labelled
      public, licensed or desk-only, so the reader can see which parts of the design run today on public data
      and which need a purchase. Every component also has one of five look-ahead labels, defined in the legend. Clean: it uses only
      values that were public on the date. As-of: the values exist historically but are taken at their
      release date. Model: a model trained after the date reads text from inside it, and the mitigation is
      stated. Live-only: there is no mitigation, and the component is left out of every backtest. Human: a
      person's input, which a backtest runs without.
    children:
      - id: g_market
        name: Market data and calendars
        short: Market
        synthesis: >
          Market data covers daily prices adjusted for corporate actions, and the index constituents as they
          stood on each date. It also covers six macro reference series, none of which is revised, with the
          bear state computed from the first of them, and the French factor file, which gives a long history
          and sets the reversal thresholds. The earnings and macro calendars supply the catalyst dates the
          backtest uses, with earnings dates projected from the prior year. Options-implied event moves give
          the size of move the options market prices for a given catalyst.
        children: [prices, refseries, french, options]
      - id: g_text
        name: Text, in layers
        short: Text
        synthesis: >
          Company text has two layers we can use now: a context layer (the risk-factor sections of 10-Ks and
          10-Qs) and an event stream (8-Ks and earnings-call transcripts). A third layer, research and dealer
          notes, is production-only. News is used in two ways. A slow pass over a rolling twelve-month archive
          builds the embedding space in which themes are located; a fast pass over the last five sessions
          feeds catalyst proposal.
        children: [filings, news]
      - id: g_positioning_data
        name: Positioning feeds and score
        short: Positioning
        synthesis: >
          Each company gets a positioning score from two inputs, within-leg co-movement and 13F crowding. Short
          interest is reported separately, as the measure for the loser leg, and is not part of the score.
          Because the inputs arrive with different lags, the longest of those lags is shown next to the score
          wherever the score appears.
        children: [posdata]

  - id: g_book
    name: 2. The book and the exposures the ranking rule gave it
    short: The book
    brief: "Element 1, problem definition: the exposure monitored is the 12-1 book. The event, horizon, user and decision are stated in the problem block at the top of the spec."
    synthesis: >
      Rebuild the 12-1 momentum book monthly. Then measure which macro exposures the ranking rule gave the
      book, in hedgeable units, and compare each against random portfolios of the same size and sector mix.
      Each exposure is measured twice. Over the ranking window it is the conferred exposure, because the
      ranking selected it. Over the holding period it is the carried exposure, because the book held it.
      Comparing against the random portfolios shows how much of the exposure came from the sort and how
      much any book of that size and sector mix would have. The driving series is the one of the six on which
      the book's exposure has the highest percentile against its own history that month. Its exposure is the one a desk would hedge.
    children: [sort, random, controls, sensitivities, zscore, route2]

  - id: g_theme
    name: 3. Naming the theme and finding where it has spread
    short: The theme
    brief: "Element 3, system design: where text, retrieval and language models add value over conventional methods, and which parts are deterministic."
    synthesis: >
      First find the leading co-movements among the book's companies, at most three. Then label the named
      component from the companies' filings, by assigning their risk statements to the nearest entry of a
      worry list the PM maintains, where each entry is located in an embedding space built from news. Finally,
      search the rest of the book and crowded companies for others whose filings contain the same
      theme; a company counts as having the theme when one of its filings contains a risk statement that
      clustering assigned to that theme, and the quote is kept with the result. The decomposition and the
      clustering are deterministic. The language model does four jobs in this group: it extracts risk
      statements from news and filings, names clusters matching no list entry, and scores candidate companies
      for the theme. Each output must quote its source verbatim. Each also has a comparator, a method that
      does the same job without a language model, and the two results are printed together: a keyword
      extractor for extraction, a keyword label for the theme label, and retrieval alone for ranking. The comparators
      together form a second text run, and every text statistic is computed on both. One ablation step of the
      tail model replaces the model run with the keyword run. The difference in score is the test of whether
      the language model's extraction, naming and reranking add anything beyond a keyword rule run through the
      same embedding space; both runs share that space, so the test is not of a rule against a model. Because
      every model in this group was trained after most of the dates it reads, its look-ahead labels are the most
      detailed in the design.
    children:
      - id: g_decompose
        name: Decompose the book
        short: Decompose
        synthesis: >
          Compute a shrunk covariance matrix over book companies and take its leading components, keeping
          only those whose eigenvalue exceeds the random-matrix noise threshold. For each component, report the
          share of the book's variance it explains, compared with the same statistic on random books. Flag any
          component whose average loading has opposite signs in the two legs, each above half the typical
          loading; that component is the momentum factor itself, not a theme, and it enters the tail model as a
          state indicator. Regress each component's return on the six reference series: a high R-squared means
          the component is already explained by a named macro series and the text pipeline will only confirm it.
        children: [covariance, pca, bridge]
      - id: g_context
        name: Build the embedding space
        short: Context
        synthesis: >
          The embedding space is built from news risk statements, using an encoder trained only on text
          published before each date. Because the space is built from news, phrases such as "vaccine timing"
          and "travel resumption" are close together. Each entry on a registered list of about thirty external
          conditions, which the PM edits, gets a reference point in the space.
        children: [newsagent, taxonomy, embedspace, pmworries]
      - id: g_name
        name: Name the component from its filings
        short: Name
        synthesis: >
          From each component company's filings, extract reported risks that would hurt it as verbatim
          quotes, each marked with whether the company gains or loses if the risk materialises. Keep quotes
          whose risk moves the company the same way a reversal of the component would. Assign those quotes to the
          nearest list entry in the embedding space and compare the resulting weight with the same procedure
          run on sector-matched random companies. The component's theme is the entry with the largest weight
          in excess of the random companies', if that excess is larger than random companies ever give. Then
          name it; for a cluster that matches no entry, the model's name is printed beside a deterministic
          keyword label so the reader can check one against the other.
        children: [pc1text, riskextract, cluster, namecluster]
      - id: g_propagate
        name: Search other names, and the two theme statistics
        short: Propagate
        synthesis: >
          Search the rest of the book and the top positioning quintile for companies whose filings contain the
          same theme, in two stages: embedding retrieval produces candidates, and a language model ranks
          them. Then print two statistics, each beside its random-book comparison: the share of book variance
          explained by the theme component, and the loss share, the share of book weight held in companies that
          would lose if the theme reverses. The loss share is also expressed as a loss in basis points if the
          component returns minus two standard deviations over ten days.
        children: [propagate, themescore]

  - id: g_crowding
    name: 4. Who else is in the trade
    short: Crowding
    brief: "Element 3, positioning and crowding information integrated with the text reading."
    synthesis: >
      Compare the list of theme companies with the list of heavily positioned companies. Companies on both
      lists are where positioning is concentrated on the theme. Two vulnerable-name lists are drawn from
      them: the pre-catalyst list, companies that rallied with the component before the catalyst, and the
      post-unwind list, companies that have not yet moved after an unwind has started. The lists are held
      back until a five-episode event study shows they move more than sector-matched companies.
    children: [poscluster, timebombs]

  - id: g_tail
    name: 5. Severity and timing
    short: Tail and catalysts
    brief: "Element 6, horizon and severity; element 3, statistical modelling against conventional baselines."
    synthesis: >
      A single conditional tail model gives the severity estimate. It is a regression for the 5% quantile
      of the book's ten-day return, with the theme's variance share, the loss share, positioning overlap and
      timing of the next catalyst as regressors. In the backtest catalysts are component companies' earnings
      dates and the macro calendar; live, the PM's approved list is added. Its output is a ten-day 5% VaR and
      expected shortfall in basis points of book, and how much worse both become inside a catalyst window. It is
      scored against a GARCH model and against a calendar baseline, and ablations report how much text features
      add over price-only features. Scheduled catalysts come from calendars; company-specific and off-universe
      catalysts are proposed live by a model from news and approved by the PM. Analogues supply historical context
      by retrieval alone, with no language model.
    children:
      - id: g_severity
        name: The tail model
        short: Tail model
        synthesis: >
          The tail model is a quantile regression, refitted at each formation date on data up to that date
          only. Every run reports the VaR, the expected shortfall, the VaR conditional on being inside a
          catalyst window, and the ablation sequence: step 0 is prices and the calendar only, step 1 adds the
          price-based theme statistics, step 2a adds the theme's excess quote weight and the weight of
          propagated in-book companies on the keyword run, step 2b replaces them with the same on the
          model run, and step 3 adds positioning.
        children: [severity, garch, eventbaseline]
      - id: g_catalysts
        name: Catalysts
        short: Catalysts
        synthesis: >
          Scheduled catalysts (FOMC, CPI, payrolls, index rebalances, component companies' earnings) are taken
          from calendars with no model. Company-specific and off-universe catalysts are proposed by a language
          model, each with a date and a source quote, and approved by the PM. That model runs only on live data
          and is excluded from the backtest.
        children: [catagent, catapprove]
      - id: g_analogue
        name: Analogues
        short: Analogues
        synthesis: >
          The analogue section lists the five past dates whose state was nearest to today's and what the book
          did over the following ten days, including dates on which nothing happened. Dates within one year of
          today are excluded. A deterministic rule marks each analogue apt or not.
        children: [analogue]

  - id: g_output
    name: 6. What the PM sees and does
    short: Output
    brief: "Element 6, the example output; element 3, which parts require human review; element 7, the production path."
    synthesis: >
      A page is produced five sessions before an approved catalyst, or whenever the maximum of the book's
      monitored percentiles crosses the 95th percentile of its own history. The page reports the theme and
      its variance share; the loss in basis points if the theme reverses, and the direction of that loss; the
      VaR beside the hedge line, which names the instrument, its notional and its ten-day premium in basis
      points of book; the positioning overlap; the two vulnerable-name lists, once their event study has run;
      the catalysts; and what changed since the last page. It gives the direction of the risk and the hedge and
      leaves the decision to exit with the reader, and its numbers describe the paper 12-1 book, to be scaled
      by the reader's beta to it. A language model writes the prose over fixed fields, and a check rejects the
      page if any number in the prose fails to match the field it came from. The PM acknowledges the page,
      edits the worry list and approves catalysts. Whether the PM looked at, ignored or acted on each page is
      logged. That log is the only measure of whether a page changed a decision. It is a production item,
      because it needs the PM's positions as an input. In production the page is kept current and pushed on
      change, the response log is the first item, and the licensed feeds replace the public ones layer by
      layer; each data node names its production feed.
    children: [eventrule, composer, thepage, signoff, responselog]

  - id: g_validation
    name: 7. How we know it works
    short: Validation
    brief: "Element 5, validation plan and evidence: baselines, ablations, leakage controls, registered tests."
    synthesis: >
      Every test is registered before it runs, with the pass threshold and the sentence that will go in the
      memo under each outcome written down in advance. The tail model is scored on coverage and pinball
      loss against two baselines, with the pass range printed for the number of observations available;
      one ablation step swaps the model run for the keyword run, and that step is the test of whether the
      model's extraction adds anything beyond a keyword rule. The lists of vulnerable names are tested in an event study over
      five recorded unwinds. Extraction error is measured on hand-labelled records, split into those dated
      before and after the model's training cutoff; if the model does better on documents it may have seen in
      training than on documents it cannot have seen, the gap is the most that recall could contribute. The
      theme pipeline is compared with the PM's worry list, to show whether it surfaces themes the PM had not listed.
      Of all these, only the first design's severity breach test on held-out years has run, with a tail model
      that had no text features: 2 breaches in 42 forecasts. The v2 tail-model scoring, the event study and
      the cutoff split have not run, and the worry-list comparison can only be made in production.
    children: [register, labels, volvalidation, bombtest, themevalidation]

  - id: g_retired
    name: Retired from the first design
    short: Retired
    brief: "Kept for the record, each with the reason it was replaced."
    synthesis: >
      Components of the first design that the redesign replaced or refuted, each kept with the reason: the
      three-route taxonomy and its detectors, the separate vol model, the labeller, the three-role analogue
      panel, and the referee roles, which now belong in the memo's section on AI use.
    hidden: true
    children: [route1, route3, classify, volmodel, labeller, panel, referees]
