# The simplified map: twenty-two boxes over the same design as spec.yaml (draft 13). Each box lists the
# full-view components it absorbs. The full view is the record; this map is the reading order for the memo,
# and each box's rule is the abridging paragraph the memo will use.
#
# Fields per box: id, name, lane (the step), kind (data | deterministic | model | human | output), lookahead
# (clean | as-of | model | live-only | human), access (data boxes), absorbs (ids in spec.yaml), inputs,
# outputs, rule, comparator (model boxes), check, open.
# Fields per edge: from, to, sends, when, mode, feedback.

meta:
  title: Momentum reversal-risk system, simplified map
  version: v2-draft-16-simple
  updated: "2026-09-07"
  problem:
    exposure: "the 12-1 momentum book: the top and bottom deciles of the Russell 3000 by return from twelve months before to one month before, value-weighted within each leg, dollar-neutral, rebuilt monthly"
    event: "a ten-day return of the reconstructed book at or below its own unconditional 5% quantile on the history since December 2013; the French factor's -432bp is the same quantile on the published factor over 1926 to 2022 and is printed as the long-run reference"
    horizon: "ten trading days, for every forecast on the page"
    user: "a discretionary macro PM whose book carries momentum-type exposure, or the risk manager covering it"
    decision: "whether and how much to hedge the book's exposure to the named theme before the next catalyst, from the VaR before and after the sized hedge on the page; the reader decides"
  note: >
    The design assumes that the theme behind a reversal has been building in the news for some time and that
    the PM can put a label on it. The system measures how much of the book depends on that theme, where it has
    spread, who is positioned on it, and how much worse the book's tail becomes around the next catalyst. When
    a reversal comes from a theme that the news had not covered, the page shows no theme or the wrong one, and
    the VaR is unchanged, because the tail model does not take the theme.
  legend:
    box: "one box here absorbs one or more components of the full view; the panel lists them. The full view (index.html) is the record; this map is the reading order."
    kind: "data = a feed (grey pill); deterministic = a rule with no model (white box, blue band); model = a language-model component (orange); human = a person's task (tan hexagon); output = the page (green double border)."
    lookahead: "clean = uses only values that were public on the date; as-of = the values exist historically but are taken at their release date; model = a model trained after the date reads text from inside it; live-only = the box runs on live data only and no backtest claim depends on it; human = a person's input that a backtest runs without. A box's label is at least the strongest label among its backtest inputs. The encoder is the one unbounded look-ahead; every text statistic inherits it and no registered test uses one."
    access: "public = every feed is public today; mixed = public feeds today, with licensed or desk-only feeds named for production."
    comparator: "a method that does the same job as a model step without a language model, printed beside it."
    quote gate: "every span a model extracts must appear verbatim in its source document, or the record is dropped and counted."
    two runs: "the risk statements are produced twice, by the classifier trained on language-model labels (the model run) and by the keyword rule (the keyword run); both are followed as far as the theme, and the page uses the model run."
    retired: "components retired from earlier drafts are listed in the full view with the reason; none appears here."

lanes:
  - {id: s1, name: "1. Inputs"}
  - {id: s2, name: "2. The book"}
  - {id: s3, name: "3. The theme"}
  - {id: s4, name: "4. Crowding"}
  - {id: s5, name: "5. Severity and timing"}
  - {id: s6, name: "6. The page"}
  - {id: s7, name: "7. Validation"}

nodes:
  # ---------------------------------------------------------------- 1. inputs
  - id: market
    name: Market data and calendars
    lane: s1
    kind: data
    lookahead: clean
    access: mixed
    absorbs: [prices, refseries, french]
    inputs: []
    outputs:
      - "daily returns, the point-in-time universe and the hedge instruments' returns"
      - "six reference series and the bear state"
      - "earnings dates, FOMC dates and listed releases"
      - "the French factor and the reversal record"
    rule: |
      The universe is the Russell 3000 ETF's archived daily holdings, taken at the effective date of each change (PUBLIC). Daily prices come from Stooq or Tiingo (PUBLIC; CRSP in production, LICENSED), and the hedge instruments, eleven sector ETFs and four macro futures or ETFs, are public daily series. Six reference series give the macro exposures: the S&P 500, the ten-year yield, WTI, the broad dollar, the investment-grade spread, and the ten largest index companies against the equal-weighted index (PUBLIC). The bear state is an indicator that the trailing 24-month market return is negative. The earnings calendar in the backtest projects each company's date from its 8-K one year earlier, with the error measured; FOMC dates and the listed releases come from the published calendars. The French factor file gives the long history and the reversal record, 195 episodes since 1926.
    check: "monthly correlation of the reconstructed book with the French factor, reported"
    open:
      - "EMPIRICS: the French correlation."

  - id: filings
    name: Company text
    lane: s1
    kind: data
    lookahead: clean
    access: mixed
    absorbs: [filings]
    inputs: []
    outputs:
      - "risk-factor sentences per company, dated"
      - "8-K and transcript sentences per company, dated"
      - "coverage by leg and by layer"
    rule: |
      The context layer is Item 1A of the latest 10-K accepted before the formation date, plus the latest 10-Q's risk factors where newer, split into sentences (PUBLIC, EDGAR). The event layer is 8-K Items 2.02, 7.01 and 8.01 with exhibits (PUBLIC) and earnings-call transcripts (PUBLIC for a subset; LICENSED for full coverage). Equity research and dealer notes form a third layer in production (LICENSED and DESK-ONLY). Every document is dated at acceptance. Every extracted span must appear verbatim in its source before it is stored. Coverage gates the page: an item whose companies are unread on the layer it needs is withheld, and the footer names it. Quote weights are understated on companies without text.
    check: "quote gate"
    open:
      - "EMPIRICS: the free transcript feeds and the share of companies they cover."

  - id: news
    name: News
    lane: s1
    kind: data
    lookahead: as-of
    access: mixed
    absorbs: [news]
    inputs: []
    outputs:
      - "news sentences, rolling twelve months"
      - "items from the last five sessions"
    rule: |
      GDELT headlines and URLs, Fed, Treasury and BLS release pages, and SEC press-release exhibits (PUBLIC); Bloomberg and Reuters headlines in production (LICENSED). Every item is timestamped at publication and split into sentences. A rolling twelve-month archive feeds the embedding space; the last five sessions feed the catalyst proposal. For a backtest date, only items published before that date enter the archive. GDELT has no article text, so risk statements are under-counted. The theme pipeline starts at GDELT's first usable date.
    check: "the source list is versioned"
    open:
      - "EMPIRICS: GDELT's first usable date."

  - id: positioning
    name: Positioning feeds and score
    lane: s1
    kind: data
    lookahead: as-of
    access: mixed
    absorbs: [posdata]
    inputs: []
    outputs:
      - "the positioning score per company, with its lag"
      - "the crowded quintiles of the universe"
    rule: |
      The score has one input per leg, ranked within the leg, and the two arrive on different clocks: 13F crowding on the winner leg, the count of momentum-style filers holding the company, quarterly with a 45-day lag (PUBLIC), and short interest as a share of float on the loser leg, twice a month with a two-week lag (PUBLIC). A 13F count on a short would measure the wrong side. Crowded means the top quintile within the leg; for companies outside the book, the universe's top quintiles by each input are the second search scope. Both inputs are holdings counts, not functions of the residual covariance, so under no crowding the crowded set is independent of the loadings. In production, securities-lending utilisation (LICENSED), options open interest and ETF flows (PUBLIC), and prime-broker positioning (DESK-ONLY) are printed as separate lines. The longest input lag is printed beside the score.
    check: "the longest input lag is printed"
    open:
      - "EMPIRICS: the number of momentum-style filers."

  # ---------------------------------------------------------------- 2. the book
  - id: sort
    name: The 12-1 book
    lane: s2
    kind: deterministic
    lookahead: clean
    absorbs: [sort]
    inputs:
      - "daily returns, the point-in-time universe and the hedge instruments' returns"
    outputs:
      - "the two legs and the position weights"
      - "book returns"
    rule: |
      On the last trading day of each month the rule ranks every company on its return from twelve months before to one month before. The top decile is held long and the bottom decile short, value-weighted within each leg and dollar-neutral across them, so the winner weights sum to one and the loser weights to minus one. The book is rebuilt monthly and measured daily. The weight vector is the input to every book-level statistic.
    check: "leg sizes, the capitalisation profile and the sector counts are logged"

  - id: random
    name: Random portfolios
    lane: s2
    kind: deterministic
    lookahead: clean
    absorbs: [random]
    inputs:
      - "daily returns, the point-in-time universe and the hedge instruments' returns"
      - "the two legs and the position weights"
    outputs:
      - "200 random portfolios per date, matched on size, capitalisation and sector"
    rule: |
      For each formation date the rule draws 200 portfolios from the same universe, matched on the book's marginals in sequence, leg sizes, then capitalisation-decile counts, then sector counts, with the book's own companies in the pool; the only difference from the book is that they were not ranked on past returns. 200 puts ten draws above the 95th percentile. Sector matching is what makes the null useful for the text statistics, since a macro bet is usually expressed through a sector tilt. The random portfolios serve two statistics, the variance share and the theme's excess weight, each computed on every random portfolio by the box that computes it for the book.
    check: "the construction parameters are hashed and stored with each run"

  - id: exposure
    name: Macro exposures in hedgeable units
    lane: s2
    kind: deterministic
    lookahead: clean
    absorbs: [sensitivities, percentiles]
    inputs:
      - "the two legs and the position weights"
      - "six reference series and the bear state"
    outputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "the driving series and the leg that holds its exposure"
    rule: |
      One regression of each company's return on the market gives the residual return that every later statistic uses. One slope of that residual on each reference series, over a 126-day window that rolls daily, times the company's weight and summed over the book, is the exposure. It is printed in units a desk can hedge: DV01-equivalent dollars per $100m of book for the ten-year, CS01-equivalent dollars for the credit spread, a beta for the index, notional dollars for WTI and the dollar. One percentile is printed per series, against the book's own history since December 2013, and it is the percentile that can trigger a page. The driving series is the reference series with the highest own-history percentile that month; the page shows the leg that holds more of that exposure and the companies that contribute most.
    check: "sign stability across weighting, rebalance date, universe and window is reported in the appendix"

  # ---------------------------------------------------------------- 3. the theme
  - id: decompose
    name: Co-movement inside the book
    lane: s3
    kind: deterministic
    lookahead: clean
    absorbs: [covariance, pca, bridge]
    inputs:
      - "daily returns, the point-in-time universe and the hedge instruments' returns"
      - "the two legs and the position weights"
      - "200 random portfolios per date, matched on size, capitalisation and sector"
      - "six reference series and the bear state"
    outputs:
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios"
      - "the hedge instrument and its slope"
      - "R-squared per component and its largest series, for the page order"
    rule: |
      A Ledoit-Wolf shrunk covariance of the book's market-residual returns over 126 days is decomposed and its first three components kept. A component's statistic is the share of the residual book's variance it explains, printed with its percentile against the random portfolios; a component is above noise when it beats their 95th percentile, and a component whose company set has changed by a third or more since last month is not named that month. Its company set is the top quartile by absolute loading, and the sign is fixed so that a reversal is a negative component return. Sector returns are left in the covariance so that a theme inside a sector can be found; the placebo in the assignment box is what separates a theme from its sector. A regression of the component on the five non-market reference series gives the R-squared on which the page decides what it prints first: the driving-series exposure when the R-squared is above 0.5, the theme otherwise. Each candidate hedge instrument is residualised on the market the same way as the companies and the component is regressed on it; the instrument with the highest R-squared is the hedge, and its slope, the minimum-variance hedge ratio, sizes the hedge line. Each random portfolio is decomposed the same way.
    check: "the Jaccard overlap of the company set with the previous month's is printed; the condition number is printed"
    open:
      - "A covariance-only decomposition misses links between companies that were not historically correlated; the variance share is then understated for a theme that is spreading, and the search in the propagate box partly compensates."

  - id: context
    name: The embedding space
    lane: s3
    kind: model
    lookahead: model
    absorbs: [newsagent, embedspace]
    inputs:
      - "news sentences, rolling twelve months"
      - "risk statements per company, on both runs"
    outputs:
      - "the embedding space: clusters, centroids, the assignment distance, and the news weight per cluster"
    rule: |
      A language model labels 2,000 news sentences once as risk statements or not, with dates and company names redacted, and a classifier trained on those labels marks every sentence in the archive; the sentence itself is the record and its embedding is the encoder's. The encoder is one named public encoder on every date; its look-ahead is not bounded, and the design says so rather than claiming a mitigation. The news risk statements over the rolling twelve-month window and the filing risk statements of the book's and the random portfolios' component sets are embedded and clustered together, so headlines and filing sentences are one population and one distance applies to both. HDBSCAN finds the clusters and a noise set, at a minimum size of about two statements a month; a cluster is then treated as a ball around its centroid, an approximation the design accepts. The assignment distance is the 90th percentile of a member's distance to its own cluster's centroid, noise excluded. A cluster with fewer than 25 news members is company-specific.
    comparator: "a keyword rule on the registered term list for the statements; its records are the keyword run"
    check: "quote gate; precision and recall of the classifier and the keyword rule on hand-labelled news sentences; the number of clusters and the noise share, printed"
    open:
      - "EMPIRICS: the encoder and its published cutoff."

  - id: worrylist
    name: The PM's worry list
    lane: s3
    kind: human
    lookahead: human
    absorbs: [taxonomy]
    inputs:
      - "list edits after reading the page"
    outputs:
      - "the worry list, versioned"
    rule: |
      A registered list of about thirty external conditions, for example rates, the memory cycle, tariffs, a regulatory decision, financing. The PM adds or removes entries whenever a worry becomes relevant, usually after reading a page, and every edit is logged with a date. The list does not form a second set of reference points: on the live page an entry labels the cluster nearest its own reference point, the centroid of its 50 nearest news statements, when that distance is within the assignment distance. In the backtest there is no list: themes are clusters only, so the backtest scores the same object the page shows, with a different label. The list is used on the live page and on the memo-date example, where it is labelled as written with hindsight.
    check: "every edit is logged"

  - id: extract
    name: Risk statements from filings
    lane: s3
    kind: model
    lookahead: model
    absorbs: [riskextract]
    inputs:
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios"
      - "risk-factor sentences per company, dated"
      - "8-K and transcript sentences per company, dated"
    outputs:
      - "risk statements per company, on both runs"
    rule: |
      For every company in a component set above noise, and in each random portfolio's set, the rule gathers the risk-section and event sentences dated before the formation date. A language model labels 2,000 filing sentences once as risk statements or not, with company identity and dates redacted; a risk statement is a condition that would hurt the company. A classifier trained on those labels marks every sentence of every filing in the universe, cached by document, so that the book and the random sets are read by one instrument. The comparator is the keyword rule on the same sentences, and its records are the keyword run. Both are scored on the same hand-labelled sample.
    comparator: "a keyword rule on the registered term list; its records are the keyword run"
    check: "quote gate; precision and recall on hand-labelled filing sentences, for the classifier and the keyword rule side by side"
    open:
      - "EMPIRICS: the labelling model and its training cutoff date."

  - id: assign
    name: Theme assignment and label
    lane: s3
    kind: model
    lookahead: model
    absorbs: [cluster, namecluster]
    inputs:
      - "risk statements per company, on both runs"
      - "the embedding space: clusters, centroids, the assignment distance, and the news weight per cluster"
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios"
      - "the worry list, versioned"
    outputs:
      - "the theme per component: a cluster or none, its excess weight by leg, its runner-up, and one quote per company, on both runs"
      - "the theme label, with its quotes and news weight"
      - "the named component"
    rule: |
      A company counts toward a cluster when its nearest risk statement to that cluster's centroid is within the assignment distance, and only when a reversal of the component would cost the book on that company: a winner with a positive loading or a loser with a negative loading. It counts once, whatever the length of its filing, and the quote kept is that nearest statement. The theme's weight is the counted companies' share of the component set's total absolute loading, so it runs from zero to one; the placebo weight is the same share on the random portfolios' sets; the excess is the difference, in the same units. The theme is the cluster with the largest excess, provided that excess is larger than random sets reach on 95% of draws; otherwise the component has no theme above placebo, which is what keeps the sort's own axis from being named. The named component is the highest-variance component above noise with a theme. A list entry's name labels a cluster it reaches; otherwise a language model labels the cluster from its 20 central statements, with a keyword label printed beside it. Everything is computed on both runs, and the two themes are printed together with whether they agree.
    comparator: "the keyword label from the cluster's distinguishing terms, printed beside the model's label; the keyword run's theme beside the model run's"
    check: "placebo weight per cluster; a February-against-August check that filing season does not drive the excess weight; agreement of the theme between the two runs, printed"

  - id: propagate
    name: Search for the theme elsewhere
    lane: s3
    kind: deterministic
    lookahead: model
    absorbs: [propagate]
    inputs:
      - "the theme label, with its quotes and news weight"
      - "risk statements per company, on both runs"
      - "the crowded quintiles of the universe"
      - "the embedding space: clusters, centroids, the assignment distance, and the news weight per cluster"
    outputs:
      - "companies outside the component set with the theme, each with its quote"
    rule: |
      Once a theme is labelled, the rule searches the rest of the book and the universe's crowded quintiles. A company is marked as having the theme by the same rule as in the assignment box: its nearest classified risk statement to the theme's centroid is within the assignment distance, and that statement is the quote kept with the result. There is no cap and no reranking.
    check: "quote gate"

  - id: themescore
    name: Theme statistics and the hedge line
    lane: s3
    kind: deterministic
    lookahead: model
    absorbs: [themescore]
    inputs:
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "the named component"
      - "the two legs and the position weights"
      - "book returns"
      - "daily returns, the point-in-time universe and the hedge instruments' returns"
      - "the hedge instrument and its slope"
      - "the calendar state and the standardised quantile"
      - "window catalyst days"
    outputs:
      - "the book's variance share on the named component, with its percentile"
      - "the loss in basis points of book, by leg, if the component returns minus two sigma"
      - "the hedge line: instrument, notional, and the VaR before and after the hedge"
    rule: |
      Two statistics are printed for the named component. The first is the book's variance share on it, with its percentile against the random portfolios. The second is the loss in basis points of book if the component returns minus two of its ten-day sigmas, by leg: minus two sigma times the sum over the leg's companies of weight times loading. It is net, so companies that gain on a reversal offset those that lose. The hedge line hedges that loss with a short in the instrument the decomposition chose, sized by the minimum-variance hedge ratio, the slope of the component on the instrument's market-residual return: the loading is at most the norm of the weight vector, a few tenths for two value-weighted deciles. With a loading of 0.1 and a slope of 0.5 the short is $5m per $100m of book, and it removes the share of the component's variance that the instrument explains. The line prints the VaR before and after the hedge, the latter from the sigma of the hedged return over the current window and the tail model's standardised quantile in today's state; the market line is computed here too: the book's beta net of the short's market beta, and the index notional that flattens it.
    check: "the random-portfolio comparison for the variance share"

  # ---------------------------------------------------------------- 4. crowding
  - id: crowding
    name: Who is positioned on the theme
    lane: s4
    kind: deterministic
    lookahead: model
    absorbs: [poscluster, timebombs]
    inputs:
      - "the positioning score per company, with its lag"
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "the named component"
      - "companies outside the component set with the theme, each with its quote"
      - "the two legs and the position weights"
      - "daily returns, the point-in-time universe and the hedge instruments' returns"
    outputs:
      - "the overlap by leg, with its null and its history"
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "the squeeze state"
    rule: |
      The theme companies are the component companies whose nearest risk statement is within the assignment distance of the theme's centroid, plus the companies found by the search; the crowded companies are the top quintile of the positioning score within each leg. The overlap is the share of theme companies' book weight that is crowded, by leg, printed beside its null, the crowded set's share of the leg's weight, which is not one fifth because the score's inputs rise with size, as the loadings can; the size channel remains in the null, and the overlap is read against it, not as independence. From the crowded theme companies come two lists. The pre-catalyst list holds companies that rose with the component by more than one twenty-day standard deviation, the ones with the most recent gain at risk. The post-unwind list holds companies that have not yet moved after the component has fallen by more than one twenty-day sigma; on the loser leg these are the heavily shorted companies that have not yet rallied. The squeeze state is on when the loser-leg companies' value-weighted 20-day return, a rally being positive, exceeds one standard deviation with the market up. Neither list is printed until its event study has passed.
    check: "the count and weight of each list, with their history"

  # ---------------------------------------------------------------- 5. severity and timing
  - id: tail
    name: The tail model and its baselines
    lane: s5
    kind: deterministic
    lookahead: clean
    absorbs: [severity, baselines]
    inputs:
      - "book returns"
      - "the two legs and the position weights"
      - "earnings dates, FOMC dates and listed releases"
      - "six reference series and the bear state"
      - "approved catalysts, with dates and types"
    outputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book, with the observations behind them"
      - "the probability of the event"
      - "the unconditional line and the three conditioning ratios"
      - "the calendar state and the standardised quantile"
      - "window catalyst days"
    rule: |
      A window catalyst is an FOMC decision, an earnings day on which the reporting companies hold at least 10% of the book's gross weight, a floor kept in the register, or an approved catalyst; a ten-day start is inside a window when the ten sessions it covers contain one. CPI, payrolls and rebalances appear on the page and do not open windows, since windows around every release would cover nearly every day; the count of starts in each state is printed each year. The tail model is one line: the 5% quantile of the book's past ten-day returns, each divided by the book's volatility at the time, multiplied by today's volatility; the expected shortfall is the mean of the returns at or below that quantile, scaled the same way, and the probability of the event is the share of those standardised returns at or below the unconditional threshold. There are no fitted parameters and no state, and the page prints the non-overlapping observations behind the quantile. Three conditioning variables were tested and are not used: the bear state, the calendar state and the volatility tercile each add nothing measurable, and their ratios are printed beside the model. The calendar state is a page field and a scoring split. Text and positioning do not enter the model.
    check: "the unconditional line and the three conditioning ratios; the number of window catalysts and starts in each state, per year"

  - id: catalysts
    name: Catalyst proposal, live only
    lane: s5
    kind: model
    lookahead: live-only
    absorbs: [catagent]
    inputs:
      - "the theme label, with its quotes and news weight"
      - "items from the last five sessions"
      - "8-K and transcript sentences per company, dated"
    outputs:
      - "proposed catalysts with a date, a source quote and a type, beside the comparator's"
    rule: |
      Window catalysts and listed releases come from the calendars with no model. This box proposes the unscheduled ones, such as a foreign supplier's earnings or a regulatory readout. A language model reads the last five sessions' news and event text and proposes each catalyst with a date and a source quote; at most ten are shown. A model reading past news would propose the catalysts that turned out to matter, so this box runs on live data only and no backtest claim depends on it. The memo-date page carries its actual proposals beside the comparator's, with the approval column empty.
    comparator: "a term-list extractor over the same five sessions, taking dated sentences that name a component company; the PM's approval share for each list is printed"
    check: "a date and a quote are required"

  - id: catapprove
    name: PM approves catalysts
    lane: s5
    kind: human
    lookahead: human
    absorbs: [catapprove]
    inputs:
      - "proposed catalysts with a date, a source quote and a type, beside the comparator's"
    outputs:
      - "approved catalysts, with dates and types"
    rule: |
      The PM reviews proposals as they arrive, at most once a day, and approves each on its date and relevance rather than on any view of its outcome. The PM's main contribution is adding catalysts the model missed. An approved catalyst is a window catalyst: it opens a window in the tail model and a calendar page. Catalysts not yet approved appear on the page as proposed.
    check: "none"

  - id: analogue
    name: Analogues
    lane: s5
    kind: deterministic
    lookahead: model
    absorbs: [analogue]
    inputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "the French factor and the reversal record"
      - "six reference series and the bear state"
      - "book returns"
      - "the theme label, with its quotes and news weight"
    outputs:
      - "the five nearest past formation dates, what followed over ten days, and whether each is apt"
    rule: |
      A formation date's state is seven numbers: the six exposures and the trailing ten-day sigma; the bear state is carried beside it and is not in the distance, since it is off on nearly every date since 2013. Candidates are every formation date since December 2013, excluding the last year. The distance is Mahalanobis, with the covariance estimated over the candidates, since the exposures co-move. The five nearest dates are printed with what the book did over the following ten days, whether each fell in the reversal record, and the theme the pipeline named on that date where one exists. An analogue is apt when its bear state matches today's; the theme is annotation and does not decide aptness. No language model is involved.
    check: "each past date's state is regenerated from inputs public before it"

  # ---------------------------------------------------------------- 6. the page
  - id: trigger
    name: When a page is produced
    lane: s6
    kind: deterministic
    lookahead: clean
    mitigation: every trigger input is a price statistic or a calendar date
    absorbs: [eventrule]
    inputs:
      - "window catalyst days"
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "book returns"
    outputs:
      - "the page type and its fields, with each field's change since the last page"
      - "page dates and their outcomes"
    rule: |
      A calendar page is produced five sessions before each window catalyst. A threshold page is produced on the day the maximum of seven own-history percentiles, the largest variance share among the components above noise and the six exposures, crosses its own 95th percentile from below, so a run of days above the level gives one page. None of the seven reads text, so the trigger is clean; the VaR is not in the set, because a page it triggered would be scored against losses it already predicts. Otherwise a weekly summary is produced. The count of pages per year, by trigger, is printed. Every page resolves ten sessions after it is produced. A hit is a loss beyond the unconditional 5% quantile over those ten sessions; a miss is a page without one; a silence is such a loss over a span no page covered. The page dates and outcomes go to the scoring box, where the hit rate on threshold pages, one per crossing, is tested against the 5% base rate.
    check: "the count of pages per year, by type"

  - id: page
    name: The page
    lane: s6
    kind: output
    lookahead: model
    absorbs: [thepage, signoff, responselog]
    inputs:
      - "the page type and its fields, with each field's change since the last page"
      - "the theme label, with its quotes and news weight"
      - "the theme per component: a cluster or none, its excess weight by leg, its runner-up, and one quote per company, on both runs"
      - "the book's variance share on the named component, with its percentile"
      - "the loss in basis points of book, by leg, if the component returns minus two sigma"
      - "ten-day 5% VaR and expected shortfall, in bp of book, with the observations behind them"
      - "the probability of the event"
      - "the hedge line: instrument, notional, and the VaR before and after the hedge"
      - "the overlap by leg, with its null and its history"
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "the squeeze state"
      - "the positioning score per company, with its lag"
      - "approved catalysts, with dates and types"
      - "earnings dates, FOMC dates and listed releases"
      - "the driving series and the leg that holds its exposure"
      - "R-squared per component and its largest series, for the page order"
      - "the five nearest past formation dates, what followed over ten days, and whether each is apt"
      - "coverage by leg and by layer"
    outputs:
      - "one page, pushed to the reader"
      - "list edits after reading the page"
      - "the hand-labelled sample"
    rule: |
      Every forecast on the page is over ten trading days. The page is a template of nine fixed items rendered from stored outputs; the only free text is the quotes and the theme label, printed beside its keyword label. In order: the theme with its variance share, excess weight, runner-up and news weight; the loss in basis points by leg; the VaR and expected shortfall with the observations behind them, the probability of the event, and the hedge line with instrument, notional and the VaR before and after the hedge; the overlap with its null, the bear and squeeze states, and, once their event study has passed, the two lists; the catalysts, window and listed and proposed; the market exposure with its hedge, including the theme hedge's market beta, and the driving-series exposure, printed first when the bridge R-squared is above 0.5; the five analogues; each field's change since the last page; and a footer with text coverage, one line naming any item withheld and what it waits on, and a note that the numbers describe the paper 12-1 book, with the reader's beta to it. The conclusion is a fixed template: the risk, via the named component; the loss at minus two sigma by leg; the hedge, its notional and instrument; the VaR before and after it. It leaves the decision with the reader. The PM acknowledges each page, and the acknowledgement log is the response log's proxy until the PM's positions are an input; a research analyst labels sentences for the scoring box.
    check: "every quote passes the quote gate"
    open:
      - "The example page with numbers, required by the brief, is in the memo."

  # ---------------------------------------------------------------- 7. validation
  - id: scoring
    name: Registered tests
    lane: s7
    kind: deterministic
    lookahead: model
    validation: true
    absorbs: [register, labels, volvalidation, bombtest, themevalidation]
    inputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book, with the observations behind them"
      - "the probability of the event"
      - "the unconditional line and the three conditioning ratios"
      - "the calendar state and the standardised quantile"
      - "window catalyst days"
      - "book returns"
      - "page dates and their outcomes"
      - "the theme per component: a cluster or none, its excess weight by leg, its runner-up, and one quote per company, on both runs"
      - "risk statements per company, on both runs"
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "daily returns, the point-in-time universe and the hedge instruments' returns"
      - "the French factor and the reversal record"
      - "the hand-labelled sample"
      - "list edits after reading the page"
    outputs:
      - "coverage by state and the pinball ratio per ablation line, with intervals"
      - "precision and recall for the classifier and the keyword rule"
      - "each list's excess move over sector-matched companies, per unwind, and whether the test passed"
      - "the premise share, with its base rate"
    rule: |
      Before each test runs, the author writes its pass threshold, its detection floor and the sentence the memo will hold under each outcome; the register fixes the wording and the thresholds, not the inference, and every v2 result is in-sample. The tail model is scored every formation month from December 2015, about 130 by the memo date, and separately inside and outside windows: Kupiec's coverage test at that count accepts 3 to 10 breaches, and the ratio of the model's pinball loss to each baseline's is reported with a bootstrap interval, the model beating a baseline only when the interval excludes one. The hit rate on threshold pages, one per crossing, is tested against the 5% base rate. The classifier and the keyword rule are scored on hand-labelled sentences. The two lists are tested on the recorded unwinds since 2020 against sector-matched companies over ten sessions, and pass only if the mean excess move beats its floor and has the same sign on all but at most one unwind; a list that fails is not printed. The premise, that a theme is visible before a reversal, is measured over the recorded episodes and printed as a share beside the same share on calm windows. In production, a quarterly reading measures whether the pipeline surfaces themes before the PM adds them. The only test that has run is the first design's severity breach test, 2 in 42 forecasts, from a model with no text.
    check: "the smallest effect each test could detect is found by simulation before it runs, and a null is a finding only if that floor is below the effect of interest"
    open:
      - "EMPIRICS: the simulated floors; the unwind dates."

