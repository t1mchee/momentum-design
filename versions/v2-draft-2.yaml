# System design v2 — the redesign agreed with the advisor (2026-09-06), detail settled 2026-09-06.
# This describes the intended system as one design. No demo / production split anywhere in this file.
# Node fields: id, name, lane, kind (data | deterministic | model | human | output),
#   status (settled | draft | placeholder), inputs, outputs, rule, checks, on_failure, open, memo, v1 (what it replaces).
# Edge fields: from, to, carries, when, feedback (drawn outside the layout), hidden (layout constraint only).

meta:
  title: Momentum reversal-risk system, v2
  version: v2-draft-2
  updated: "2026-09-06"
  note: >
    The bet the design makes is the crescendo view: the theme is known to everyone, the PM can name it, and the
    system's job is to measure how much of the book hinges on it, where it has spread, who is positioned on it,
    and how much more the book will move around the next catalyst than the market prices. Discovery of themes is
    coverage, not alpha. Red badges are the remaining open points.

lanes:
  - {id: data, name: Data in}
  - {id: book, name: The book}
  - {id: decomp, name: "Step 1: decomposition"}
  - {id: context, name: "Step 3: news context (parallel)"}
  - {id: naming, name: "Step 2: name the component with text"}
  - {id: propagate, name: "Step 4: propagate the theme"}
  - {id: positioning, name: "Positioning, integrated"}
  - {id: catalysts, name: "Catalysts and the vol model"}
  - {id: output, name: Output}
  - {id: human, name: Human in the loop}
  - {id: research, name: Validation}

nodes:
  # ------------------------------------------------------------ data
  - id: prices
    name: Prices, returns, index membership
    lane: data
    kind: data
    status: settled
    inputs: []
    outputs: [daily returns per name, point-in-time universe]
    rule: Point-in-time universe from archived index-ETF holdings at announcement date; daily prices with corporate actions; delisted names terminate.
    checks: [reconciled against the French factor file]
    on_failure: hold the day's state
    open: []
    memo: "§2"
    v1: prices

  - id: filings
    name: Company filings and reports
    lane: data
    kind: data
    status: settled
    inputs: []
    outputs: [risk-factor and outlook text per name, dated at acceptance]
    rule: |
      For each name, the latest 10-K accepted before the formation date, plus the latest 10-Q's Part II Item 1A where it is newer. Sections read: Item 1A risk factors and the MD&A overview, cut by regex on the standard headers. Also read from the same node: earnings-call transcripts, equity research and dealer colour where the desk has them, each dated at receipt. Every extracted span must string-match its source before storage (the quote gate carries over from v1).
    checks: [coverage per name printed by leg; string-match gate]
    on_failure: name marked unread; coverage line shows it
    open: []
    memo: "§2"
    v1: filings (8-K in 91 days)

  - id: news
    name: News stream
    lane: data
    kind: data
    status: settled
    inputs: []
    outputs: [headlines and articles, timestamped at publication]
    rule: Bloomberg headlines and any other feed the desk deems relevant, plus Fed, Treasury and BLS release pages for the macro calendar. Held as a rolling twelve-month window that the embedding space is rebuilt from weekly, so the space updates slowly.
    checks: [timestamped at publication; source list versioned]
    on_failure: last embedding space used, flagged stale
    open: []
    memo: "§2"
    v1: none

  - id: posdata
    name: Positioning data
    lane: data
    kind: data
    status: settled
    inputs: []
    outputs: [positioning per name]
    rule: Prime-broker and dealer positioning where available (Goldman's periodic hedge-fund positioning is one published source), with within-leg co-movement, 13F overlap on the long side and short interest on the short side as the always-available measures. Combined into one positioning score per name, top quintile marked heavily positioned.
    checks: [each source dated at release, never at settlement]
    on_failure: positioning score absent; time-bomb reading suppressed and the page says so
    open: []
    memo: "§2, §7"
    v1: posdata, comovement, flows

  - id: analystchatter
    name: Analyst and dealer commentary
    lane: data
    kind: data
    status: settled
    inputs: []
    outputs: [analyst and dealer commentary, dated]
    rule: Equity research, dealer colour and earnings-call transcripts, read by the catalyst agent alongside news.
    checks: [dated at receipt]
    on_failure: catalysts proposed from news alone
    open: []
    memo: "§2"
    v1: none

  - id: options
    name: Options-implied volatility
    lane: data
    kind: data
    status: settled
    inputs: []
    outputs: [implied vol per name and around known event dates]
    rule: The market's pricing of vol around catalysts, the comparator the vol view is stated against. Not sufficient alone, since implied vol already clusters around known earnings dates; the system's edge is the cross-name propagation, not the date.
    checks: []
    on_failure: vol view stated against trailing realised vol instead, flagged
    open: []
    memo: "§2, §3"
    v1: none

  # ------------------------------------------------------------ book
  - id: sort
    name: 12-1 sort, the book
    lane: book
    kind: deterministic
    status: settled
    inputs: [daily returns per name, point-in-time universe]
    outputs: [winner leg, loser leg, book returns]
    rule: Rank on trailing 12-month return skipping the latest month; top and bottom decile; rebuilt monthly. The decomposition runs on both legs together and every reading is reported by leg, so the page says whether a theme is a long-crowding or short-crowding problem.
    checks: [leg sizes logged]
    on_failure: previous book carried
    open: []
    memo: "§1"
    v1: sort

  # ------------------------------------------------------------ step 1
  - id: covariance
    name: Covariance of the book's names
    lane: decomp
    kind: deterministic
    status: settled
    inputs: [daily returns per name, winner leg, loser leg]
    outputs: [covariance matrix over the book's names]
    rule: Daily returns over the trailing 126 trading days ending at formation, residualised to the market only. Sectors are not residualised, because sector is often the vehicle of the theme and stripping it would hide memory behind semiconductors. Six months matches the horizon over which a theme builds.
    checks: [condition number printed; window and residualisation versioned]
    on_failure: decomposition not run this period
    open:
      - Parked by the reviewer. A covariance-only decomposition misses links between names that were not historically correlated. Step 4 partly answers it by scanning non-component names for the theme's signature; the memo says so.
    memo: "§3 step 1"
    v1: replaces the eight-series exposure reading

  - id: pca
    name: Principal components and loadings
    lane: decomp
    kind: deterministic
    status: settled
    inputs: [covariance matrix over the book's names]
    outputs: [top three components, loadings per name, variance explained per component, component name sets]
    rule: Eigen-decomposition; the top three components each carry a theme. For each component, sign fixed so its loading-weighted return over the window is positive; names in the top quartile of absolute loading form the component set, with the sign of each name's loading kept. Variance explained is the weight the component's text carries downstream. Today the first component is memory.
    checks: [variance explained printed; stability of each component set across adjacent months]
    on_failure: theme naming not run this period
    open: []
    memo: "§3 step 1"

  # ------------------------------------------------------------ step 3 (parallel)
  - id: newsagent
    name: News quote extraction
    lane: context
    kind: model
    status: settled
    inputs: [headlines and articles, timestamped at publication]
    outputs: [macro-risk statements from news, dated]
    rule: A light model reads each item and extracts statements of macro risk over a one-year horizon, verbatim, with the date. These statements are the material the embedding space is built from.
    checks: [quote gate; sample audited monthly]
    on_failure: last embedding space used
    open: []
    memo: "§3 step 3"
    v1: none

  - id: embedspace
    name: Macro-theme embedding space
    lane: context
    kind: deterministic
    status: settled
    inputs: [macro-risk statements from news, dated, PM worry list, declared cluster phrases]
    outputs: [embedding space with theme centres and a distance threshold]
    rule: |
      Supplies the context v1 lacked, so that vaccine timing, travel resumption and retail footfall sit near each other. Two branches in fixed order. First, the news statements over the rolling window are embedded and clustered unsupervised, so the top macro stories emerge as dense regions. Second, the PM's short list of worries (about five) and any phrase the PM declares as a cluster are placed as fixed centroids. Company quotes are later assigned to the nearest centroid, PM or news, within a distance threshold; quotes beyond the threshold form residual clusters that the naming step labels afterwards. A PM worry with no mass around it is itself a reading and is printed as such.
    checks: [mass around each PM term printed; residual share printed]
    on_failure: cluster on company quotes alone, flagged context-free
    open: []
    memo: "§3 step 3"
    v1: vocabulary induction

  # ------------------------------------------------------------ step 2
  - id: pc1text
    name: Gather the component names' text
    lane: naming
    kind: deterministic
    status: settled
    inputs: [component name sets, loadings per name, risk-factor and outlook text per name, dated at acceptance]
    outputs: [text per component name with its loading weight]
    rule: All risk-factor and outlook passages are read for every name in the component set. Loading enters downstream as the weight of each extracted quote at clustering, so a theme carried by high-loading names counts more.
    checks: [coverage of the component set printed]
    on_failure: theme named on partial coverage, flagged
    open: []
    memo: "§3 step 2"

  - id: riskextract
    name: Risk-factor extraction
    lane: naming
    kind: model
    status: settled
    inputs: [text per component name with its loading weight]
    outputs: [risk-factor quotes per name, verbatim, with sign]
    rule: |
      A light model, one document one call, prompt along the lines of "extract up to three risk factors or macro risks over a one-year horizon that would cause this company to draw down significantly", returning for each a verbatim quote and a sign (the company gains or loses if the risk materialises). Replaces v1's single-condition question; whether the leg is priced on one condition becomes a property of the cluster, not of the filing.
    checks: [quote gate; a stratified hand-labelled sample each month measuring precision and recall by leg and by era]
    on_failure: record dropped and counted
    open: []
    memo: "§3 step 2"
    v1: extractor

  - id: cluster
    name: Cluster quotes in the context space
    lane: naming
    kind: deterministic
    status: settled
    inputs: [risk-factor quotes per name, verbatim, with sign, embedding space with theme centres and a distance threshold]
    outputs: [clusters of quotes with loading-weighted, time-decayed mass, by sign]
    rule: Each quote is embedded and assigned to the nearest centroid within the threshold, else to a residual cluster. Prior months' quotes are included with exponential decay, three-month half-life; each company contributes at most one vote per theme per quarter so a serial filer cannot dominate. Mass is loading-weighted and split by sign.
    checks: [cluster stability month to month; residual share]
    on_failure: previous clusters used
    open: []
    memo: "§3 step 2"
    v1: mapper and vocab

  - id: namecluster
    name: Name the cluster (theme)
    lane: naming
    kind: model
    status: settled
    inputs: [clusters of quotes with loading-weighted, time-decayed mass, by sign, macro-risk statements from news, dated]
    outputs: [theme name per cluster, with its supporting quotes]
    rule: An LLM reads the 20 quotes nearest the cluster centre and names what the cluster is about. Cross-compare with news by printing the nearest news cluster's name and its headline count beside the theme name; a company theme with no news mass is flagged as company-specific. The named cluster of the first component is the headline theme.
    checks: [names calibrated on random name sets of the same size; a name must be more plausible on the real cluster than on the random one]
    on_failure: cluster left unnamed; top quotes shown instead
    open: []
    memo: "§3 step 2"
    v1: labeller, mapper

  # ------------------------------------------------------------ step 4
  - id: propagate
    name: Scan the rest of the universe for the theme
    lane: propagate
    kind: model
    status: settled
    inputs: [theme name per cluster, with its supporting quotes, risk-factor and outlook text per name, dated at acceptance]
    outputs: [theme signature per name outside the component set, with quote and score]
    rule: Once a theme is named, an agent scans every name outside the component set, first the rest of the book and then the rest of the universe, for text relevant to the theme. Each name gets a relevance score from 0 to 3 with a verbatim quote; a score of 2 or more carries the signature. This is where the theme is found on names the covariance could not have linked to it, the answer to the parked supply-chain caveat.
    checks: [quote gate; signature rate on a random theme name as the placebo]
    on_failure: name marked unscanned
    open: []
    memo: "§3 step 4"
    v1: none

  - id: themescore
    name: Theme significance score
    lane: propagate
    kind: deterministic
    status: settled
    inputs: [variance explained per component, clusters of quotes with loading-weighted, time-decayed mass, by sign, theme signature per name outside the component set, with quote and score]
    outputs: [significance score per theme, ranked, by leg]
    rule: |
      Score = variance explained by the component × the theme's share of the component's loading-weighted text mass × (1 + the share of the book's weight outside the component that carries the signature). Reported by leg and by sign. Recomputed monthly at rebalance, with the news space refreshed weekly. The learning loop: every PM edit (theme added, removed, phrase declared) is logged as a labelled event, and once a quarter the share of PM-added themes the system had already surfaced is measured; that number says whether PM input can decrease.
    checks: [comparator is the PM typing the themes by hand each week; the quarterly overlap measure]
    on_failure: n/a
    open: []
    memo: "§3 step 5, §6"

  # ------------------------------------------------------------ positioning
  - id: poscluster
    name: Positioning overlap with the theme
    lane: positioning
    kind: deterministic
    status: settled
    inputs: [positioning per name, theme signature per name outside the component set, with quote and score, component name sets]
    outputs: [overlap of the heavily positioned set with the theme set; the non-overlap]
    rule: Names are grouped thematically (component set plus signature carriers) and by positioning (top quintile of the positioning score). The two usually overlap, since hedge funds are mostly positioned on one theme. The overlap and the non-overlap are both reported.
    checks: [overlap share printed with its history]
    on_failure: overlap not computed
    open: []
    memo: "§7"
    v1: comovement, flows, route3

  - id: timebombs
    name: Time bombs
    lane: positioning
    kind: deterministic
    status: settled
    inputs: [overlap of the heavily positioned set with the theme set; the non-overlap, daily returns per name]
    outputs: [names carrying the theme's signature, heavily positioned, not yet moving]
    rule: A name is a time bomb when it carries the theme's signature, sits in the top positioning quintile, and its trailing 20-day return is within one standard deviation of its own trailing-year distribution while the component set's loading-weighted return over the same window is beyond one. If the theme unwinds, these names have not yet paid, so the unwind could be larger than the component set alone implies.
    checks: [count and weight of time bombs printed with history]
    on_failure: n/a
    open: []
    memo: "§7, §6"

  # ------------------------------------------------------------ catalysts and vol
  - id: catagent
    name: Catalyst proposal
    lane: catalysts
    kind: model
    status: settled
    inputs: [theme name per cluster, with its supporting quotes, headlines and articles, timestamped at publication, analyst and dealer commentary, dated]
    outputs: [proposed catalysts per theme, dated, with source quote]
    rule: After themes are named, an LLM reads news and analyst and dealer commentary to propose the catalysts that matter for each theme, each with a date and a source quote. Memory example, Broadcom and Hynix earnings were the two catalysts this summer. Catalysts are the dates through which the book gets hurt while people are still dancing. The earlier idea of the LLM proposing monitoring metrics per theme is dropped.
    checks: [date and quote required; PM approval]
    on_failure: no catalyst listed; vol view undated
    open: []
    memo: "§3, §8"
    v1: calendar, catextract

  - id: volmodel
    name: Vol model around catalysts
    lane: catalysts
    kind: deterministic
    status: settled
    inputs: [significance score per theme, ranked, by leg, names carrying the theme's signature, heavily positioned, not yet moving, approved catalysts, added catalysts, book returns, implied vol per name and around known event dates, baseline vol forecast around the same catalysts]
    outputs: [forecast of the book's vol bump around each catalyst; comparison with implied]
    rule: |
      The claim is that the book hinges on one theme more than the market realises, so a catalyst for that theme matters more for the book than the market prices. Stated in vol, since a vol model is trainable and correlation implies vol anyway. Target: realised volatility of the book over the five trading days centred on the catalyst, as a ratio to trailing 60-day realised vol, so the model forecasts the event bump rather than the level. Regressors: theme score, the share of the book's weight carrying the theme's signature, the positioning overlap of that share, days to catalyst, and the GARCH forecast as a control so the system's contribution is measured over the baseline. Training set: for every formation date, the earnings dates of the component set's names in the following month from the filing calendar, knowable in advance. Output: the forecast bump beside implied vol around the same date.
    checks: [realised bump against forecast on every past catalyst; forecast error against GARCH]
    on_failure: GARCH baseline printed alone
    open: []
    memo: "§3, §5, §8"
    v1: severity

  # ------------------------------------------------------------ output
  - id: thepage
    name: The page, get out now or hedge now
    lane: output
    kind: output
    status: settled
    inputs: [significance score per theme, ranked, by leg, names carrying the theme's signature, heavily positioned, not yet moving, approved catalysts, added catalysts, forecast of the book's vol bump around each catalyst; comparison with implied, nearest past regimes, argued apt or not]
    outputs: [one page]
    rule: |
      The takeaway is "get out now or hedge now": de-gross if very long, or buy insurance while it is still cheap. Not alpha; it tells the PM to back down. The only claim is "this catalyst matters more for your book than the market thinks." Contents, in order: the headline theme and its score, by leg; the component set and where else the theme has spread; the time bombs; the approved catalysts with dates; the vol bump forecast against implied; what the usual screens show for contrast; the nearest past regimes. Every number links to a stored output and every theme to its quotes; prose is composed over fixed fields with a numeral gate, template fallback and daily canary as in v1.
    checks: [numeral gate; daily canary; every quote string-matched]
    on_failure: template with a banner
    open: []
    memo: "§6"
    v1: thepage, composer

  - id: analogue
    name: Historical regime analogues
    lane: output
    kind: model
    status: settled
    inputs: [significance score per theme, ranked, by leg, book returns, overlap of the heavily positioned set with the theme set; the non-overlap]
    outputs: [nearest past regimes, argued apt or not]
    rule: Kept from v1. The state vector is the theme scores, the first component's variance explained, the positioning overlap, the book's trailing realised vol, and the eight macro-series z-scores from v1 folded in as context. Retrieval is a covariance-aware distance with a one-year embargo; a three-role panel argues whether the match is apt behind a field-citation gate.
    checks: [field-citation gate; planted-claim test]
    on_failure: retrieval list alone
    open: []
    memo: "§3"
    v1: analogue, panel, zscore (folded)

  # ------------------------------------------------------------ human
  - id: pmworries
    name: PM presets the worry list
    lane: human
    kind: human
    status: settled
    inputs: []
    outputs: [PM worry list, declared cluster phrases]
    rule: The PM keeps a short list of the top worries, about five, edited whenever it changes and reviewed weekly. The PM can add a theme the system missed or declare that a phrase should be a cluster. Under the crescendo view this list is the theme most of the time; the system's job is to measure how much of the book hinges on it and where it has spread. The comparator for the theme machinery is this list alone.
    checks: [every edit logged as a labelled event]
    on_failure: system runs on news-derived themes alone
    open: []
    memo: "§3, §10"
    v1: signoff task 4, vocab naming

  - id: catapprove
    name: PM reviews catalysts
    lane: human
    kind: human
    status: settled
    inputs: [proposed catalysts per theme, dated, with source quote]
    outputs: [approved catalysts, added catalysts]
    rule: The PM scans proposed catalysts for reasonableness, approves or adds. Unapproved catalysts are shown as proposed.
    checks: []
    on_failure: unapproved catalysts shown as proposed
    open: []
    memo: "§10"
    v1: calendar acceptance

  # ------------------------------------------------------------ validation
  - id: register
    name: Pre-registration register
    lane: research
    kind: human
    status: settled
    inputs: []
    outputs: [rows with threshold and both outcome sentences written before each test]
    rule: Kept from v1 and restarted. Each test below gets a row with its threshold and the sentence carried under either outcome before it runs; the v1 rows are archived with their outcomes. The minus 432bp ten-day loss, frozen on the French file, stays as the event definition the backtests score against.
    checks: []
    on_failure: n/a
    open: []
    memo: "§5, Appendix C"
    v1: register

  - id: garch
    name: GARCH baseline
    lane: research
    kind: deterministic
    status: settled
    inputs: [book returns]
    outputs: [baseline vol forecast around the same catalysts]
    rule: GARCH(1,1) on the book's daily returns, refit at each formation date, forecasting the same five-day window around each catalyst. The practitioner baseline the system must beat.
    checks: []
    on_failure: n/a
    open: []
    memo: "§5"

  - id: volvalidation
    name: Realised vol around past catalysts
    lane: research
    kind: deterministic
    status: settled
    inputs: [forecast of the book's vol bump around each catalyst; comparison with implied, baseline vol forecast around the same catalysts, book returns]
    outputs: [forecast error of the system against GARCH and against implied, per catalyst and pooled]
    rule: For every formation date since the reconstruction begins, the earnings dates of the component set's names in the following month are the catalysts. Realised five-day vol around each is compared with the system's forecast, the GARCH forecast and implied. The system earns its place if its error is below GARCH's by a margin set in the register.
    checks: [register row with margin set in advance]
    on_failure: n/a
    open: []
    memo: "§5"

  - id: themevalidation
    name: Theme machinery against the PM's list
    lane: research
    kind: deterministic
    status: settled
    inputs: [significance score per theme, ranked, by leg, PM worry list, declared cluster phrases]
    outputs: [overlap of system themes with the PM list; themes the system found first]
    rule: Quarterly, the share of the PM's worries the system had surfaced before they were added, and the share of system themes the PM later adopted. This is the test of whether discovery adds anything beyond the list, and the number that decides whether PM input can decrease.
    checks: [register row]
    on_failure: n/a
    open: []
    memo: "§5"

edges:
  - {from: prices, to: sort, carries: returns and universe, when: monthly rebuild}
  - {from: prices, to: covariance, carries: daily returns per name, when: at rebalance}
  - {from: sort, to: covariance, carries: the book's names, both legs, when: at rebalance}
  - {from: covariance, to: pca, carries: covariance matrix, when: at rebalance}
  - {from: pca, to: pc1text, carries: component sets and loadings, when: at rebalance}
  - {from: filings, to: pc1text, carries: risk-factor and outlook text, when: at rebalance}
  - {from: pc1text, to: riskextract, carries: text per component name, loading-weighted, when: at rebalance}
  - {from: riskextract, to: cluster, carries: verbatim risk-factor quotes with sign, when: at rebalance}
  - {from: news, to: newsagent, carries: rolling twelve-month window, when: weekly}
  - {from: newsagent, to: embedspace, carries: dated macro-risk statements, when: weekly}
  - {from: pmworries, to: embedspace, carries: worry list and declared phrases, when: on change}
  - {from: embedspace, to: cluster, carries: context space, centres, threshold, when: at rebalance}
  - {from: cluster, to: namecluster, carries: clusters with weighted mass, when: at rebalance}
  - {from: newsagent, to: namecluster, carries: news clusters to cross-compare, when: at rebalance}
  - {from: namecluster, to: propagate, carries: named theme and its quotes, when: at rebalance}
  - {from: filings, to: propagate, carries: text of names outside the component set, when: at rebalance}
  - {from: pca, to: themescore, carries: variance explained, when: at rebalance}
  - {from: cluster, to: themescore, carries: text mass by theme, when: at rebalance}
  - {from: propagate, to: themescore, carries: signature share, when: at rebalance}
  - {from: posdata, to: poscluster, carries: positioning score per name, when: at release}
  - {from: propagate, to: poscluster, carries: signature carriers, when: at rebalance}
  - {from: pca, to: poscluster, carries: component sets, when: at rebalance}
  - {from: poscluster, to: timebombs, carries: overlap and non-overlap, when: at rebalance}
  - {from: prices, to: timebombs, carries: trailing returns, when: daily}
  - {from: namecluster, to: catagent, carries: named themes, when: after naming}
  - {from: news, to: catagent, carries: news, when: after naming}
  - {from: analystchatter, to: catagent, carries: commentary, when: after naming}
  - {from: catagent, to: catapprove, carries: proposed catalysts, when: after naming}
  - {from: catapprove, to: volmodel, carries: approved catalysts with dates, when: after approval}
  - {from: themescore, to: volmodel, carries: theme score, when: at rebalance}
  - {from: timebombs, to: volmodel, carries: time bombs, when: at rebalance}
  - {from: poscluster, to: volmodel, carries: positioning overlap, when: at rebalance}
  - {from: sort, to: volmodel, carries: book returns, when: daily}
  - {from: options, to: volmodel, carries: implied vol around event dates, when: daily}
  - {from: garch, to: volmodel, carries: baseline forecast as a control, when: daily}
  - {from: volmodel, to: thepage, carries: vol bump against implied, when: on catalyst horizon}
  - {from: themescore, to: thepage, carries: ranked themes by leg, when: at rebalance}
  - {from: timebombs, to: thepage, carries: time bombs, when: at rebalance}
  - {from: catapprove, to: thepage, carries: approved catalysts, when: after approval}
  - {from: themescore, to: analogue, carries: theme state, when: at rebalance}
  - {from: poscluster, to: analogue, carries: positioning overlap, when: at rebalance}
  - {from: sort, to: analogue, carries: book returns, when: at rebalance}
  - {from: analogue, to: thepage, carries: analogues, apt or not, when: at rebalance}
  - {from: sort, to: garch, carries: book returns, when: at formation}
  - {from: garch, to: volvalidation, carries: baseline forecast, when: backtest}
  - {from: volmodel, to: volvalidation, carries: system forecast, when: backtest}
  - {from: sort, to: volvalidation, carries: realised vol around past catalysts, when: backtest}
  - {from: themescore, to: themevalidation, carries: system themes, when: quarterly}
  - {from: pmworries, to: themevalidation, carries: PM list with edit history, when: quarterly}
  - {from: register, to: volvalidation, carries: threshold and both sentences, when: before the run}
  - {from: register, to: themevalidation, carries: threshold and both sentences, when: before the run}
  - {from: thepage, to: pmworries, carries: themes the PM adds or removes, when: on change, feedback: true}
  - {from: thepage, to: register, hidden: true}
