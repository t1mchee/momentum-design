nodes:
  # ============================================================ data in
  - id: prices
    name: Market data and calendars
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: index membership is taken at the effective date of each change, which follows the announcement; earnings dates are projected from the prior year; macro calendars are published in advance
    access: mixed
    inputs: []
    outputs:
      - "daily returns per company"
      - "point-in-time universe, about 300 companies per leg"
      - "sector codes"
      - "earnings dates per company"
      - "scheduled macro releases"
    rule: |
      The universe is the constituent list of the Russell 3000 ETF, taken from the fund's archived daily holdings at the effective date of each change (PUBLIC); the announcement precedes the effective date, so the backtest is late, not early. Daily prices are adjusted for corporate actions (PUBLIC, Stooq or Tiingo; CRSP in production, LICENSED). Sector codes come from EDGAR SIC codes (PUBLIC); GICS in production (LICENSED). Stooq and Tiingo contain no delisting returns, so a company delisted for performance leaves the book at a return of -30%, following Shumway, and any other delisted company at its last trade; no company is held at a zero return. In the backtest a company's next earnings date is projected as the date of its 8-K Item 2.02 one year earlier, moved to the same weekday; companies report on a stable annual cycle and the error is a few days. The realised date is used only to score the page. Live, company calendars give the date (PUBLIC). Scheduled macro releases (FOMC, CPI, payrolls, index rebalances) come from the published calendars (PUBLIC).
    checks:
      - "monthly correlation of the reconstructed book with the French factor, reported"
      - "the projected earnings date against the realised date, reported as a distribution of errors in days"
    on_failure: if a day's price or holdings file is missing, the previous day's state is held; the footer names the day

  - id: refseries
    name: Reference series and the bear state
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: none of the six is revised; a revised series, if ever added, is taken from ALFRED first prints
    access: public
    inputs: []
    outputs:
      - "six reference series"
      - "the bear state"
    rule: |
      The six reference series, with units: the S&P 500 return $m_t$; the change in the ten-year Treasury yield in basis points; the front-month WTI return; the return of the Fed's broad dollar index (FRED); the change in the ICE BofA US corporate option-adjusted spread in basis points (FRED); and the return of the ten largest Russell 3000 companies minus the return of the equal-weighted Russell 3000, constructed from the holdings file. The six are fixed. The bear state, after Daniel and Moskowitz, is $B_t = \mathbf{1}[\text{trailing 24-month S\&P 500 return} < 0]$. The two cross-asset principal components of v1 are retired because a reader could not tell from the page what a move in them meant.
    on_failure: the series is left off the page; the footer names it

  - id: filings
    name: Company text
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: clean
    mitigation: every document is dated at acceptance or receipt, and every extracted span must pass the quote gate
    access: mixed
    inputs: []
    outputs:
      - "risk-factor sentences per company, dated"
      - "8-K and transcript sentences per company, dated"
      - "coverage per company, by leg and by layer"
    rule: |
      Company text has two layers we can use now, and each feed is labelled by access. The context layer is Item 1A of the latest 10-K accepted before the formation date, plus the latest 10-Q's Part II Item 1A where it is newer, cut by regex on the standard headers and split into sentences (PUBLIC, EDGAR). The event layer is 8-K Items 2.02, 7.01 and 8.01 with exhibits (PUBLIC, EDGAR) and earnings-call transcripts (PUBLIC for a subset through free feeds; LICENSED for full coverage). A third layer, equity research (LICENSED) and dealer and prime-broker notes (DESK-ONLY), is production-only and would feed the same two steps, text gathering and propagation. Every extracted span must appear verbatim in its source before it is stored (the quote gate). Coverage per company, by leg and by layer, is printed in the page footer. Quote weights are understated on companies without text, so a theme concentrated in companies the free feeds miss is under-read.
    checks:
      - "coverage per company, by leg and by layer, printed in the footer"
      - "quote gate"
    on_failure: the company is marked unread on that layer; the coverage line shows it
    open:
      - "EMPIRICS: the free transcript feeds and the share of companies they cover."

  - id: news
    name: News
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: for each backtest date the embedding space is rebuilt from the archive as it stood on that date
    access: mixed
    inputs: []
    outputs:
      - "news sentences, timestamped, rolling twelve months"
      - "items from the last five sessions"
    rule: |
      News is used in two ways. A slow pass over a rolling twelve-month archive, rebuilt weekly, supplies the embedding space in which themes are located. A fast pass over the last five sessions supplies the catalyst proposal each day. Feeds: GDELT headlines and URLs (PUBLIC), Fed, Treasury and BLS release pages (PUBLIC), SEC press-release exhibits (PUBLIC), Bloomberg and Reuters headlines (LICENSED). Every item is timestamped at publication and split into sentences. GDELT contains no article text, so risk statements are under-counted and more themes are marked company-specific than a full-text feed would mark. The theme pipeline starts at GDELT's first usable date; on earlier months the tail model runs and the theme items are absent, and the footer says so.
    checks:
      - "the source list is versioned"
      - "for a backtest date, only items published before that date enter the rebuild"
    on_failure: the previous week's embedding space is reused; the footer marks it stale
    open:
      - "EMPIRICS: GDELT's first usable date for headline text."

  - id: posdata
    name: Positioning feeds and score
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: every source is keyed to its release date, never to settlement or period end; the longest input lag is printed with the score
    access: mixed
    inputs: []
    outputs:
      - "positioning score per company, with its lag"
      - "the crowded quintiles of the universe"
    rule: |
      The positioning score has one input per leg, ranked within the leg. On the winner leg it is 13F crowding: the number of momentum-style filers holding the company, where a momentum-style filer is one whose value-weighted holdings have an average 12-1 rank in the universe's top decile as of the filing quarter (PUBLIC, 45-day lag). On the loser leg it is short interest as a share of float (PUBLIC, two-week lag). A 13F count on a short would measure the wrong side, which is why the loser leg has its own input. Crowded means the top quintile of the score within the leg. For companies outside the book, the crowded quintiles are the universe's top quintile by 13F crowding and its top quintile by short interest; together they are the second search scope for propagation. Neither input is computed from returns, so the overlap's null in the positioning node is valid. The 45-day lag understates crowding while it builds and overstates it after the unwind has begun, so both vulnerable-name lists lag. Production feeds, each a separate line when present: securities-lending utilisation (LICENSED), options open interest (PUBLIC, delayed), ETF flows (PUBLIC), prime-broker positioning (DESK-ONLY). The longest input lag is printed wherever the score appears.
    checks:
      - "longest input lag printed"
    on_failure: the score, the overlap and the two lists are left off the page; the footer names them
    open:
      - "EMPIRICS: the number of momentum-style filers the definition yields."

  - id: options
    name: Option premia
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: premia are taken from surfaces as they stood on the date; where no surface exists the premium is left off the hedge line
    access: mixed
    inputs: []
    outputs:
      - "ten-day put premium per instrument, in per cent"
    rule: |
      For each hedge instrument the ten-day at-the-money put premium is taken from the option surface as it stood on the date (LICENSED for history through OptionMetrics; PUBLIC delayed data for the live date). It prices the hedge line and nothing else; the design does not compare implied moves with the VaR, because a single-name implied move and a book-level quantile are not on the same footing. Where no surface exists on the date, the hedge line is printed without a premium and the footer says so.
    on_failure: the premium is left off the hedge line; the footer says so

  - id: french
    name: French factor file and the reversal record
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: the threshold was frozen on the 1926 to 2022 sample before any test ran
    access: public
    inputs: []
    outputs:
      - "daily WML from 1926"
      - "the reversal record, 195 episodes since 1926"
    rule: |
      The file provides daily WML, French's winners-minus-losers momentum factor, from 1926: a long history and a check that the reconstruction matches a published series. French's construction (a 2x3 value-weighted sort) differs from ours, so the agreement is reported rather than assumed. On the published factor a reversal is a ten-day return at or below -432bp, the 5th percentile of overlapping ten-day factor returns from 1926 to 2022, frozen in advance; on the reconstructed book the event is the book's own unconditional 5% quantile, as the problem block states, with -432bp printed beside it as the long-run reference. The reversal record is every episode that breached the threshold, with breach days within 21 trading days collapsed to one episode (one month, the rebalance interval): 195 episodes since 1926, on the French file before December 2013 and on the reconstructed book after it. The record feeds the analogue search, the event study and the premise share.
    checks:
      - "the monthly correlation between the reconstructed book and the French factor is reported"
    open:
      - "EMPIRICS: the correlation statistic."

  # ============================================================ the book and the random portfolios
  - id: sort
    name: The 12-1 book
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: the ranking window closes at formation
    inputs:
      - "daily returns per company"
      - "point-in-time universe, about 300 companies per leg"
    outputs:
      - "the two legs and the position weights"
      - "leg sizes, capitalisation profile and sector counts"
      - "book returns"
    rule: |2
        $$w_i = \frac{\mathrm{cap}_i}{\sum_W \mathrm{cap}} \ (i \in W), \qquad w_i = -\frac{\mathrm{cap}_i}{\sum_L \mathrm{cap}} \ (i \in L), \qquad R_t = \sum_i w_i r_{it}$$
      On each formation date, the last trading day of the month, the rule ranks every company on its return from twelve months before to one month before, skipping the latest month; the top decile is held long and the bottom decile short, value-weighted within each leg and dollar-neutral across them. Formation and rebalance coincide; the book is rebuilt monthly and measured daily. The weight vector $w$ is the input to every book-level statistic, and every statistic is also reported for each leg separately.
    checks:
      - "leg sizes, the capitalisation profile and the sector counts are logged"
    on_failure: the previous month's book is used; the footer says so

  - id: random
    name: Random portfolios, the null
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: drawn on the same date from the point-in-time universe
    inputs:
      - "point-in-time universe, about 300 companies per leg"
      - "leg sizes, capitalisation profile and sector counts"
      - "sector codes"
    outputs:
      - "200 random portfolios per date, matched on size, capitalisation and sector"
    rule: |
      For each formation date the rule draws $N = 200$ portfolios from the point-in-time universe with the book's leg sizes, capitalisation deciles and sector counts, so that the only difference from the book is that they were not ranked on past returns. $N$ is 200 so that the 95th percentile of any statistic over the random portfolios rests on ten draws. The first-drawn leg of each plays the winner leg, so every spread is signed the same way as the book's and every percentile is one-sided. Sector matching is what makes the null useful for the text statistics: a macro bet is usually expressed through a sector tilt, and a universe base rate per worry-list entry would measure the tilt of the sort rather than the theme. This node outputs portfolios only. Every statistic the page prints for the book is computed on each random portfolio by the node that computes it for the book, and the book's percentile among them is what the page shows. The cost is that the decomposition, the classifier and the assignment run on 200 portfolios at every rebalance; the classifier's records are cached by document, so the cost is arithmetic, not model calls.
    checks:
      - "the construction parameters are hashed and stored with each run"

  # ============================================================ exposure
  - id: sensitivities
    name: Macro exposures
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: rolling windows close at formation
    inputs:
      - "the two legs and the position weights"
      - "six reference series"
      - "200 random portfolios per date, matched on size, capitalisation and sector"
    outputs:
      - "the exposure per reference series, for the book and for each random portfolio"
    rule: |
      One first-stage regression gives the residual used throughout the design, and one slope per company and series gives the exposure, both over the 126 trading days ending at formation:
        $$r_{it} = a_i + b_i m_t + u_{it}$$
        $$u_{it} = a + \beta_{is} x_{st} + e_{it} \quad (s = 2, \dots, 6), \qquad r_{it} = a + \beta_{i1} m_t + e_{it} \quad \text{(the market)}$$
        $$S_s = \sum_i w_i \beta_{is}$$
      126 days is half a year and the window of every rolling statistic in the design, so no two statistics disagree on the window. The same slopes are computed on each random portfolio.
    checks:
      - "sign stability across weighting, rebalance date, universe and window is reported in the appendix"
    on_failure: the series is left off the page; the footer names it

  - id: percentiles
    name: Exposure in hedgeable units, with its percentile
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: random portfolios are drawn on the same date; the history starts in December 2013
    inputs:
      - "the exposure per reference series, for the book and for each random portfolio"
    outputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "the driving series"
    rule: |
      For each series $S_s$ is printed in units a desk can hedge: $S_s$ times the book's NAV is the notional of that series the book is exposed to. For the ten-year it is stated as DV01-equivalent dollars per $100m of book, where DV01 is the dollar change in value for a one basis point move in yield; for the index and the mega-cap series as a beta; for WTI, the dollar and the credit spread as notional dollars of the series per $100m of book. The page prints one percentile per series, against the book's own history from December 2013, printed once 24 months of history exist; it is the percentile that can trigger a page. The percentile against the random portfolios, which shows whether the sort produced the exposure, goes to the appendix. The driving series is the one of the six on which the book's exposure has the highest own-history percentile that month; it is re-chosen at each rebalance and printed by name.

  - id: drivingseries
    name: Driving-series exposure
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: n/a
    inputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "the driving series"
    outputs:
      - "the driving-series exposure of the leg that holds more of it, in hedgeable units, with the companies that contribute most"
    rule: |
      This node reports the exposure to the driving series of the leg that holds the larger share of it, named on the page, in hedgeable units with its percentile, and the companies inside that leg that contribute most, ranked by $|w_i \beta_{is}|$.

  # ============================================================ decomposition
  - id: covariance
    name: Covariance of the book's companies
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: the window closes at formation
    inputs:
      - "daily returns per company"
      - "the two legs and the position weights"
      - "200 random portfolios per date, matched on size, capitalisation and sector"
    outputs:
      - "the shrunk covariance of the book's companies, and of each random portfolio's"
    rule: |2
        $$\Sigma = \mathrm{LedoitWolf}(u), \quad \text{constant-correlation target, over the 126 days ending at formation}$$
      $u$ is the first-stage residual from the exposures node. Shrinkage is needed because about 600 companies against 126 days would otherwise give a rank-deficient matrix. Sector returns are not removed, because a theme is often expressed through a sector and removing it would hide, for example, a memory-chip theme inside the semiconductor sector. The same matrix is estimated for each random portfolio.
    checks:
      - "the condition number is printed"
    on_failure: the decomposition is not run this period; the footer says so
    open:
      - "A covariance-only decomposition misses links between companies that were not historically correlated. The variance share is then understated for a theme that is spreading, and the propagation step partly compensates by searching other companies for the theme."

  - id: pca
    name: Components and the book's variance share
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: pure arithmetic on the point-in-time book, no estimation
    inputs:
      - "the shrunk covariance of the book's companies, and of each random portfolio's"
      - "the two legs and the position weights"
    outputs:
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "the leg-mean loadings per component"
      - "component sets of the random portfolios, with loadings"
    rule: |2
        $$\mathrm{VS}_k = \frac{\lambda_k (w' v_k)^2}{w' \Sigma w}, \qquad k = 1, 2, 3$$
      The first three eigenvectors of $\Sigma$ are kept; three is the most the page can carry. $\mathrm{VS}_k$ is the share of the position-weighted book's variance due to the component, as distinct from the share of company-level variance. A component is above noise when $\mathrm{VS}_k$ exceeds the 95th percentile of the same statistic on the random portfolios, each decomposed the same way; naming runs on components above noise only, and if none is, item 1 reads that no co-movement rises above what a random book of this size and sector mix shows. The sign of $v_k$ is fixed so that $w'v_k > 0$: the component's position-weighted return is positive and a reversal is a negative $f_k$. The component set is the top quartile of companies by $|v_{ik}|$, each keeping the sign of its loading. The leg-mean loadings, $m_W = \sum_W |w_i| v_{ik} / \sum_W |w_i|$ and $m_L$ likewise, are printed on one line of item 1 as description of how the component sits across the legs; no rule attaches to them. A component that is winners against losers with no shared condition has no worry-list entry with excess quote weight, so the placebo in the assignment node, not a flag, keeps the sort's own axis from being named as a theme. Each random portfolio's component sets and loadings are kept for the text placebo.
    checks:
      - "the Jaccard overlap of the company set with the previous month's set is printed; below 0.5, half the set has changed, and the component is marked unstable"
      - "percentile against random portfolios"
    on_failure: naming is not run; the footer says so

  - id: bridge
    name: Component against the reference series and the instruments
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: same window as the decomposition
    inputs:
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "six reference series"
    outputs:
      - "R-squared of each component on the reference series"
      - "the hedge instrument and its slope, per component"
      - "which statistic is printed first"
    rule: |
      The bridge regression, over the 126 days ending at formation:
        $$f_{kt} = a + \sum_{s=2}^{6} g_{ks} x_{st} + e_t$$
      The market is not a regressor, because $f_k$ is built from market residuals and its market coefficient would be zero by construction; $R^2_k$ is this regression's R-squared. If $R^2_k$ of the named component is above 0.5, a named macro series already explains most of the component, and the page opens with the driving-series exposure and prints the theme label as confirmation; below 0.5 it opens with the theme. Each candidate instrument is regressed on the component, $r_{Ht} = a + h_k f_{kt} + e_t$, so that $h_k$ is the instrument's return per unit of $f_k$, over the eleven sector ETFs and the tradeable instruments of the five non-market series (the ten-year future, the front-month WTI future, the dollar index future, a high-yield credit ETF, and the mega-cap pair, long the ten largest and short the equal-weighted ETF). The hedge instrument $H$ for each component is the one with the highest R-squared, and its slope $h_k$ sizes the hedge line in the theme-statistics node. The same regression on each random portfolio's first component gives the reference distribution of $R^2$.
    checks:
      - "the reference distribution of R-squared from the random portfolios"
    on_failure: the theme is printed first; the hedge line names the sector ETF holding the largest share of the component set

  # ============================================================ context space
  - id: newsagent
    name: News risk statements
    lane: context
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: dates and company names are redacted from the prompt; the model labels a sample once and a classifier on the encoder labels the rest; the keyword rule runs beside it on every date
    inputs:
      - "news sentences, timestamped, rolling twelve months"
    outputs:
      - "news risk statements, dated, on both runs"
    rule: |
      The unit is a sentence. A language model reads a sample of 2,000 news sentences, stratified by year, with dates and company names redacted, and labels each as a risk statement or not, where a risk statement is a statement of a condition that could hurt companies within a year. 2,000 gives a standard error near one percentage point on a precision near one half. A classifier head on the encoder is trained once on those labels and marks every sentence in the archive. A marked sentence is the record: its text is the span and its embedding is the encoder's embedding of the sentence itself. There is no paraphrase. The comparator is the keyword rule: the registered term list, a list of risk terms and modal phrases ("could", "may", "exposed to", "depends on") kept in the register, applied to each sentence. Both are scored on the same hand-labelled sample, and the keyword rule's records are the keyword run.
    checks:
      - "quote gate"
      - "precision and recall of the classifier and of the keyword rule on the hand-labelled news sentences"
    on_failure: the keyword run's statements are used; the footer says so

  - id: taxonomy
    name: The PM's worry list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: the list is used on the live page only; the backtest names themes from residual clusters, with no list
    inputs:
      - "PM edits"
    outputs:
      - "the worry list, versioned"
    rule: |
      A registered list of about thirty external conditions, for example rates, the memory cycle, tariffs, a regulatory decision, financing, with an 'other' entry. The PM adds or removes entries whenever a worry becomes relevant, and every edit is logged with a date. The list is used on the live page and on the memo-date example, where it is labelled as written with hindsight. In the backtest there is no list: themes are residual clusters only, so the backtest measures what the clustering finds unaided. The list's leading entry by news weight, on its own, is the baseline the live theme label is judged against.
    checks:
      - "every edit is logged; the 'other' entry is reviewed quarterly"
    on_failure: the previous version is used

  - id: embedspace
    name: Embedding space
    lane: context
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: one named encoder on every date, with BM25 retrieval beside it on every date; a theme statistic the BM25 run also produces is not an artefact of the encoder
    inputs:
      - "news risk statements, dated, on both runs"
      - "the worry list, versioned"
    outputs:
      - "the embedding space: news clusters, a reference point per list entry, the assignment distance, and news weight per entry"
    rule: |2
        $$d^* = q_{90}\{\, d(q, \text{centroid of } q\text{'s cluster}) \,\}, \qquad \mathrm{NW}_e = \#\{ q : d(q, \mathrm{ref}_e) \le d^* \}$$
      The encoder is one public sentence encoder with a published training cutoff, the same on every date, named in the package. Its look-ahead is not bounded: an encoder trained after 2020 places "vaccine timing" near "travel resumption" on a 2019 date because it read 2020. The mitigation is the BM25 run beside it on every date, which uses no learned associations: it assigns each statement to the cluster whose top-20 c-TF-IDF terms score highest under BM25, and the share of statements the two runs assign to the same cluster is printed. The news risk statements over the rolling twelve-month window are embedded and clustered with HDBSCAN at a minimum cluster size of 25, about two headlines a week over the window, the smallest topic the page would print; each cluster is labelled with its top keywords. $d^*$ is the 90th percentile of the distance from a news statement to its own cluster's centroid, so that nine in ten members of a dense topic count as within it. It is used for one comparison only, a risk sentence against a reference point, in three places: news weight, quote assignment and propagation. On the live page each worry-list entry gets a reference point, the centroid of its 50 nearest news statements, enough that one headline's wording does not move it; a three-word phrase and a forty-word sentence do not embed on the same scale, which is why the phrase seeds a search rather than being the point. The space is rebuilt weekly and every quote is re-assigned at each rebuild.
    checks:
      - "news weight per entry, printed"
      - "the share of assignments on which the encoder and BM25 agree, printed"
    on_failure: the previous week's space is reused; the footer marks it stale
    open:
      - "EMPIRICS: the encoder and its published cutoff."

  - id: pmworries
    name: PM edits the list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: edits are logged; the backtest runs without them
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "PM edits"
    rule: |
      The PM adds or removes list entries whenever a worry becomes relevant, usually after reading a page. Every entry, PM-added or not, is placed in the embedding space in the same way. Every edit is a dated event.
    checks:
      - "the edit log"

  # ============================================================ naming
  - id: gathertext
    name: Gather the component companies' text
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: documents are dated
    inputs:
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios, with loadings"
      - "risk-factor sentences per company, dated"
      - "8-K and transcript sentences per company, dated"
    outputs:
      - "risk-section sentences per component company, with its loading, for the book's sets and the random sets"
    rule: |
      For every company in a component set above noise, and in each random portfolio's component set, the rule gathers the sentences of the context and event layers dated before the formation date, each with the company's loading on the component.
    checks:
      - "coverage of the component set, by leg and by layer, printed in the footer"
    on_failure: the theme is named on the companies that have text; the coverage line shows the gap

  - id: riskextract
    name: Risk statements from filings
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: company identity and dates are redacted from the prompt; error is measured on hand labels split by whether the document predates the labelling model's training cutoff, and the gap bounds recall from training
    inputs:
      - "risk-section sentences per component company, with its loading, for the book's sets and the random sets"
    outputs:
      - "risk statements per company, on both runs"
    rule: |
      The unit is a sentence. A language model reads a sample of 2,000 filing sentences, stratified by year, leg and layer, with company identity, ticker and dates redacted, and labels each as a risk statement or not. A risk statement is a statement of a condition that would hurt the company; the sign is a loss by definition, and a statement that the company would benefit is not a risk statement. A classifier head on the encoder is trained once on those labels and marks every sentence of every filing in the universe, once, cached by document; the language model cannot read 200 random books' filings monthly, and one instrument on both sides keeps the model-keyword difference out of the excess weight. The comparator is the keyword rule on the same sentences, and its records are the keyword run. Both are scored on the same hand-labelled sample, split by whether the document is dated before or after the labelling model's training cutoff; the gap between the two error rates bounds how much the labels could owe to recall rather than reading.
    checks:
      - "quote gate"
      - "precision and recall on the hand-labelled filing sentences, before and after the cutoff, for the classifier and the keyword rule side by side"
    on_failure: the keyword run's records stand in; the footer says so
    open:
      - "EMPIRICS: the labelling model and its training cutoff date."

  - id: cluster
    name: Assign statements to themes, and pick the theme
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the statements and the space; a statement stays current until the next document, with no decay; every statement is re-assigned at each weekly rebuild
    inputs:
      - "risk statements per company, on both runs"
      - "the embedding space: news clusters, a reference point per list entry, the assignment distance, and news weight per entry"
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios, with loadings"
    outputs:
      - "per component above noise: the theme (an entry or a residual cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the named component"
    rule: |2
        $$Q_e = \sum_{i \in \text{set},\ s_i v_{ik} > 0,\ i \text{ has a statement within } d^* \text{ of } \mathrm{ref}_e} |v_{ik}|, \qquad P_e = \text{mean of the same over the random sets}, \qquad E_e = Q_e - P_e$$
        $$\text{theme} = \arg\max_e E_e \ \text{ if } \ E_e > q_{95}\{\max_e E_e \text{ over the random sets}\}, \ \text{ else none}$$
      Each risk statement is assigned to the nearest reference point within $d^*$: on the live page the worry-list entries, and on every date the news clusters, whose centroids are the reference points of the residual themes. A company counts once per entry, whatever the length of its filing, and the quote kept for it is its statement nearest the reference point. A company counts toward a theme only if a reversal of the component costs the book on that company, which is $s_i v_{ik} > 0$: a winner-leg company with a positive loading, which falls when $f_k$ falls, or a loser-leg company with a negative loading, which rallies when $f_k$ falls. Worked example: a loser-leg company with $v_{ik} > 0$ falls on a reversal, and the book, short it, gains; its stated risk does not count. The same sign rule gives the bp loss below, so the two lines agree on every company. $P_e$ is the same weight on each random portfolio's component set with its own loadings, so a boilerplate risk that every company lists shows zero excess weight, and a component that is winners against losers with no shared condition has no entry above the placebo. $Q_e$, $P_e$ and $E_e$ are computed by leg and summed. The theme and the runner-up are printed with their excess weights; if the runner-up is within 10% of the first, both are printed and the first is treated as the theme. The named component is the highest-variance component above noise whose theme is not none. A document's statements stay current until the same company files the next document on the same layer; there is no time decay. Everything in this node is computed on both runs, and the two themes are printed together.
    checks:
      - "placebo weight per entry"
      - "month-to-month stability of the assignment"
      - "agreement of the theme between the two runs, printed"
    on_failure: the previous assignment is used; the footer says so

  - id: namecluster
    name: Label the theme
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: the label is grounded in the 20 statements nearest the cluster centroid; a keyword label is printed beside it; the label is a label only, and no number is derived from it
    inputs:
      - "per component above noise: the theme (an entry or a residual cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the embedding space: news clusters, a reference point per list entry, the assignment distance, and news weight per entry"
    outputs:
      - "the theme label per component, with its quotes and the nearest news cluster"
    rule: |
      If the theme is a worry-list entry, its label is the entry's name. If it is a residual cluster, a language model reads the 20 statements nearest its centroid and names it; a c-TF-IDF keyword label, the top terms that distinguish the cluster from the others, is printed beside the model's label so the reader can check one against the other, and in the keyword run the keyword label is the label. The nearest news cluster's keyword label and its headline count are printed beside the theme. A residual theme is marked company-specific when fewer than 25 news statements, one HDBSCAN cluster's worth, lie within $d^*$ of its centroid.
    checks:
      - "the keyword label is printed"
    on_failure: the keyword label is printed alone

  # ============================================================ propagation
  - id: propagate
    name: Search other companies for the theme
    lane: propagate
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the statements and the space; the retrieval rule is the same on every date, backtest and live
    inputs:
      - "the theme label per component, with its quotes and the nearest news cluster"
      - "risk statements per company, on both runs"
      - "the crowded quintiles of the universe"
      - "the embedding space: news clusters, a reference point per list entry, the assignment distance, and news weight per entry"
    outputs:
      - "companies outside the component set with the theme, each with its quote"
    rule: |
      Once a theme is labelled, the rule searches two sets of companies outside the component set: the rest of the book, and the universe's crowded quintiles. The objects searched are the classifier's risk statements from those companies' filings, already embedded and cached. A company is marked as having the theme when at least one of its risk statements lies within $d^*$ of the theme's reference point, and that statement is the quote kept with the result. There is no cap on the number of companies and no reranking. As a control, the same search is run for the news cluster that led the archive twelve months earlier and is not today's theme; the share of companies it marks is printed as the method's false-positive rate beside the share for the real theme.
    checks:
      - "quote gate"
      - "false-positive rate from the wrong-theme control"
    on_failure: the company is marked as not searched

  - id: themescore
    name: Theme statistics
    lane: propagate
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the theme; nothing added here
    inputs:
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "the named component"
      - "the two legs and the position weights"
      - "the hedge instrument and its slope, per component"
      - "ten-day put premium per instrument, in per cent"
    outputs:
      - "the book's variance share on the named component, with its percentile"
      - "the loss in basis points of book, by leg, if the component returns minus two sigma over ten days"
      - "the hedge line: instrument, notional per $100m of book, premium in bp of book, and the unexplained share"
    rule: |2
        $$\text{bp loss}_{\text{leg}} = -2\,\sigma_k \sum_{i \in \text{leg}} w_i v_{ik}, \qquad \text{notional per \$100m} = 100\text{m} \cdot g_k / h_k \quad \text{(short } H\text{)}$$
      Two statistics are printed for the named component. The first is $\mathrm{VS}_k$, with its percentile against the random portfolios. The second is the loss in basis points of book if the component returns $-2\sigma_k$ over ten days, by leg, where the sum runs over every book company in the leg, since $v_k$ is defined over the whole book; it is net, so companies that gain on a reversal offset those that lose. The two legs sum to the book's bp loss, $-2\sigma_k g_k$. The hedge line hedges that loss. The instrument $H$ and its slope $h_k$ on the named component come from the bridge node, and the notional is the short position in $H$ that offsets the book's loading $g_k$, so on a move of $-2\sigma_k$ the hedge returns what the bp loss loses. The line prints the ten-day put premium on $H$ for that notional in bp of book, and the unexplained share, $1 - R^2$ of $r_H$ on $f_k$. Worked example: with $g_k = 0.5$ (the book returns half a unit per unit of $f_k$) and $h_k = 2$ (the instrument returns two units per unit of $f_k$), the short is $\$25$m of $H$ per $\$100$m of book, and a $-2\sigma_k$ move costs the book $\sigma_k$ and returns $\sigma_k$ on the hedge. Where no surface exists, the premium is left off. The statistics are recomputed weekly from the event layer and monthly from the decomposition.
    checks:
      - "the random-portfolio comparison for the variance share"
      - "a February-against-August check that filing season does not drive the statistics"

  # ============================================================ positioning
  - id: poscluster
    name: Positioning overlap with the theme
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the theme; positioning is taken as of its release date
    inputs:
      - "positioning score per company, with its lag"
      - "companies outside the component set with the theme, each with its quote"
      - "the named component"
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "the two legs and the position weights"
    outputs:
      - "the overlap and non-overlap by leg, with their history since January 2014"
      - "off-book theme companies in the crowded quintiles"
    rule: |2
        $$O = \frac{\sum_{i \in T \cap C} |w_i|}{\sum_{i \in T} |w_i|}, \qquad N = \frac{\sum_{i \in C \setminus T} |w_i|}{\sum_{i \in C} |w_i|}$$
      $T$ is the set of theme companies, the component set plus the companies found by propagation, and $C$ is the crowded set, the top quintile of the positioning score within the leg; both per leg. Neither positioning input is computed from returns, so under no crowding $C$ is independent of the loadings and the expected overlap is the crowded set's share of the leg's gross weight, $\sum_{i \in C} |w_i| / \sum_{i \in \text{leg}} |w_i|$, computed each month; it is above one fifth because large companies have more 13F holders. That is the null printed beside $O$, and the claim that funds are positioned on one theme is supported when the median of $O$ minus its null since January 2014 is above zero. Both are reported with their history since January 2014, when the reconstructed book begins. Theme companies outside the book have no leg; they are listed separately, with their universe quintile.
    checks:
      - "the overlap history is printed"
    on_failure: the overlap is left off the page; the footer says so

  - id: timebombs
    name: Vulnerable companies, two lists
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the overlap; returns and positioning are taken as of the date
    inputs:
      - "the overlap and non-overlap by leg, with their history since January 2014"
      - "daily returns per company"
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "positioning score per company, with its lag"
    outputs:
      - "the pre-catalyst list and the post-unwind list, by leg"
    rule: |2
        $$\text{pre-catalyst:}\ \ f_{k,20} > 0 \ \text{ and } \ r_{i,20}\operatorname{sign}(v_{ik}) > \mathrm{sd20}_i$$
        $$\text{post-unwind:}\ \ f_{k,20} < -\mathrm{sd20}_k \ \text{ and } \ |r_{i,20}| < \mathrm{sd20}_i$$
      Both lists are drawn from companies that are crowded and on the theme. $r_{i,20}$ and $f_{k,20}$ are trailing 20-day returns, and $\mathrm{sd20}$ is the standard deviation of rolling 20-day returns over the trailing year, a different quantity from $\sigma_k$. The pre-catalyst list holds the companies that rose with the component and have the largest recent gain at risk. The post-unwind list holds the companies that have not yet moved after the component has fallen by more than one twenty-day sigma. On the loser leg the post-unwind list is the heavily shorted theme companies that have not yet rallied, and a squeeze state line is printed when the loser leg's 20-day return exceeds its $\mathrm{sd20}$ with the market up. Neither list is printed until its event study has run.
    checks:
      - "the count and weight of each list, with their history"

  # ============================================================ tail model
  - id: baselines
    name: Two baselines and the calendar state
    lane: tail
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: earnings dates are projected from the prior year; macro releases are scheduled in advance
    inputs:
      - "book returns"
      - "the two legs and the position weights"
      - "earnings dates per company"
      - "scheduled macro releases"
    outputs:
      - "the calendar state of each day"
      - "the unconditional and calendar baseline VaR"
    rule: |2
        $$\mathrm{VaR}^{\text{unc}}_t = Q_{0.05}\{R_{u,u+10} : u \le t-10\}, \qquad \mathrm{VaR}^{\text{cal}}_t = Q_{0.05}\{R_{u,u+10} : u \le t-10,\ c(u) = c(t)\}$$
      A catalyst window is the ten sessions $[T-5, T+5)$ around an FOMC decision day or around a day on which the companies reporting earnings hold at least 10% of the book's gross weight $\sum_i |w_i|$; 10% is the share above which earnings days move the book's ten-day return by more than a tenth of a sigma, to be confirmed on the record at registration. CPI, payrolls and index rebalances are catalysts on the page but do not open windows: with ten-session windows around every scheduled release, nearly every day would be inside one and the state would say nothing. Eight FOMC days alone cover 80 sessions a year; the earnings days above the floor add the rest, and the count of starts in each state is printed each year rather than assumed. Five sessions before is one week to put on a hedge. The state $c(t)$ of a ten-day start is inside or outside a window. Both baselines are the book's own ten-day returns on the dates they happened, over every daily start since December 2013 whose target is realised; there are no draws, and the cross-section is not averaged. Live, an approved catalyst opens a window like a scheduled one.
    checks:
      - "the number of windows and of starts in each state, printed"

  - id: severity
    name: The tail model
    lane: tail
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: every input is a realised book return or a calendar date known in advance
    inputs:
      - "book returns"
      - "the calendar state of each day"
      - "the unconditional and calendar baseline VaR"
      - "approved catalysts, with dates and types"
      - "the bear state"
    outputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the probability of a ten-day return at or below the long-run threshold"
      - "the catalyst-window VaR and its increase over the outside-window VaR"
      - "the three ablation lines"
    rule: |2
        $$z_u = \frac{R_{u,u+10}}{\sigma_u}, \qquad q_c = Q_{0.05}\{ z_u : u \le t-10,\ c(u) = c(t) \}$$
        $$\mathrm{VaR}_t = \sigma_t\, q_c, \qquad \mathrm{ES}_t = \sigma_t \cdot \text{mean}\{ z_u : z_u \le q_c,\ c(u) = c(t) \}, \qquad P_t = \text{share of } \{ z_u : c(u) = c(t) \} \text{ at or below } -432\text{bp}/\sigma_t$$
      The tail model is the 5% quantile of the book's past ten-day returns, each divided by the book's volatility at the time, taken over past starts in the same calendar state as today and multiplied by today's volatility. There are no fitted parameters. The first scored date, December 2015, has about 500 daily starts; the split between states is printed, not assumed, and a 5% quantile of $n$ starts rests on $n/20$ observations, which the page prints beside the VaR. $P_t$ is the probability line the page prints beside the VaR: the share of past standardised returns in today's state at or below the long-run threshold scaled by today's volatility. The catalyst-window increase is $\sigma_t (q_{\text{inside}} - q_{\text{outside}})$. The ablation has three lines, printed on every run: the unconditional baseline (no scaling, no state), the calendar baseline (state, no scaling) and the model. Text and positioning do not enter the model; whether they sort the breaches is measured in the scoring node. The breach rate is also printed by bear state, $B_t$ on or off, as a check that a state the model does not use does not concentrate its breaches. Live and backtest apply one rule: an approved catalyst opens a window, and the window state is the only thing the model reads from the calendar.
    checks:
      - "the three ablation lines"
      - "breach rate by bear state"
    on_failure: the calendar baseline is reported in place of the model; the footer says so

  # ============================================================ catalysts
  - id: catagent
    name: Catalyst proposal (live only)
    lane: catalysts
    kind: model
    status: settled
    origin: v2
    lookahead: live-only
    mitigation: a model reading past news would propose the catalysts that turned out to matter, so this node runs on live data only and no backtest claim depends on it
    inputs:
      - "the theme label per component, with its quotes and the nearest news cluster"
      - "items from the last five sessions"
      - "8-K and transcript sentences per company, dated"
    outputs:
      - "proposed catalysts with a date, a source quote and a type, beside the comparator's"
    rule: |
      Scheduled catalysts (FOMC, CPI, payrolls, index rebalances, the component companies' earnings) come from the calendars without a model. This node proposes the unscheduled ones: company-specific and off-universe events, such as a foreign supplier's earnings or a regulatory readout. A language model reads the last five sessions' news and event text and proposes each catalyst with a date, a source quote and its type, scheduled or unscheduled. The comparator is a term-list extractor over the same five sessions: every dated sentence that matches the registered term list and names a component company or one of its listed suppliers and customers is a proposal. The PM's approval share for each list is printed. The memo-date page carries the model's actual proposals for the live theme beside the comparator's, with the approval column empty; that is the illustration, dated and without hindsight.
    checks:
      - "a date and a quote are required"
      - "the PM's approval share for the model's list and for the comparator's list"
    on_failure: only calendar catalysts are used

  - id: catapprove
    name: PM approves catalysts
    lane: catalysts
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: none needed; runs live only
    inputs:
      - "proposed catalysts with a date, a source quote and a type, beside the comparator's"
    outputs:
      - "approved catalysts, with dates and types"
    rule: |
      The PM reviews the proposals weekly; there are fewer than ten a week. The PM approves a catalyst on its date and relevance, not on any view of its outcome, and the PM's main contribution is adding catalysts the model missed. An approved catalyst opens a window in the tail model. Catalysts not yet approved appear on the page as proposed.
    on_failure: unapproved catalysts appear as proposed

  # ============================================================ analogues
  - id: analogue
    name: Analogues
    lane: analogue
    kind: deterministic
    status: settled
    origin: v1
    lookahead: model
    mitigation: inherited from the theme; each past date's state is computed from data as it stood on that date, and the twelve months before today are excluded
    inputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "the book's variance share on the named component, with its percentile"
      - "the overlap and non-overlap by leg, with their history since January 2014"
      - "book returns"
      - "the bear state"
      - "per component above noise: the theme (an entry or a residual cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the reversal record, 195 episodes since 1926"
    outputs:
      - "the five nearest past formation dates, what the book did over the following ten days, and whether each is apt"
    rule: |
      The state of a formation date is ten numbers: the six exposures $S_s$, $\mathrm{VS}_k$ of the named component, the overlap $O$, the trailing ten-day sigma $\sigma_t$ and $B_t$. Candidates are every formation date since December 2013, on which the reconstructed book and every dimension exist, excluding the twelve months before today. Each dimension is standardised by its own history to date, and the distance is Euclidean on the standardised values; with ten dimensions on about 130 dates a covariance adds little and a reader can check a Euclidean distance. The five nearest dates are printed with what the book did over the following ten days, and with whether each fell in the reversal record. An analogue is apt when its bear state matches today's and its theme is the same, or both dates have no theme; two dates have the same theme when their theme centroids in the embedding space are within $d^*$ of each other, which is the only way a news cluster on one date can be matched with one on another. No language model is involved. Five is what fits on the page.
    checks:
      - "each past date's state is regenerated from inputs public before it"
    on_failure: the five nearest dates are listed without an aptness mark

  # ============================================================ page and people
  - id: eventrule
    name: When a page is produced
    lane: page
    kind: deterministic
    status: settled
    origin: v1
    lookahead: model
    mitigation: inherited from the theme statistics; thresholds are registered
    inputs:
      - "approved catalysts, with dates and types"
      - "earnings dates per company"
      - "scheduled macro releases"
      - "the book's variance share on the named component, with its percentile"
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "book returns"
    outputs:
      - "the page type and its fields, with each field's change since the last page"
      - "page dates and their outcomes"
    rule: |2
        $$M_t = \max_k p_{kt}, \qquad \text{threshold page iff } M_t > q_{95}\{M_u : u < t\}$$
      A page is produced on either of two triggers. The calendar trigger produces one five sessions before each catalyst, scheduled or approved, with the catalyst-window VaR and its increase. The threshold trigger uses the own-history percentile $p_{kt}$ of each of seven statistics ($\mathrm{VS}_k$ of the named component and $S_1$ to $S_6$) and their maximum; the VaR is not in the set, because a page triggered by a high VaR would be scored against losses that a high VaR already predicts. The maximum crosses its own 95th percentile on 5% of days, about one day a month, by construction, and the page shows which statistic crossed. If neither trigger fires, a weekly summary is produced. Every page shows each field's change since the last page. Every page has a resolution date: a calendar page resolves at the catalyst, a threshold page at the ten-day horizon. A hit is $\text{event}_t = 1$ after a page; a miss is a page with $\text{event}_t = 0$; a silence is $\text{event}_t = 1$ with no page. The page dates and their outcomes go to the scoring node, where the hit rate on threshold-page days is tested against the 5% base rate. Weekly summaries are not scored. In production the page is kept current, pushed to the reader whenever it changes.
    checks:
      - "the measured false-page rate"

  - id: thepage
    name: The page
    lane: page
    kind: output
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the theme and the lists; nothing added here
    inputs:
      - "the page type and its fields, with each field's change since the last page"
      - "the theme label per component, with its quotes and the nearest news cluster"
      - "per component above noise: the theme (an entry or a residual cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the leg-mean loadings per component"
      - "the book's variance share on the named component, with its percentile"
      - "the loss in basis points of book, by leg, if the component returns minus two sigma over ten days"
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the probability of a ten-day return at or below the long-run threshold"
      - "the catalyst-window VaR and its increase over the outside-window VaR"
      - "the hedge line: instrument, notional per $100m of book, premium in bp of book, and the unexplained share"
      - "the overlap and non-overlap by leg, with their history since January 2014"
      - "off-book theme companies in the crowded quintiles"
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "positioning score per company, with its lag"
      - "the bear state"
      - "approved catalysts, with dates and types"
      - "the driving-series exposure of the leg that holds more of it, in hedgeable units, with the companies that contribute most"
      - "which statistic is printed first"
      - "the five nearest past formation dates, what the book did over the following ten days, and whether each is apt"
      - "coverage per company, by leg and by layer"
    outputs:
      - "one page, pushed to the reader"
    rule: |
      The reader is the PM running momentum, or the risk manager covering that book. Every forecast on the page is over ten trading days, and the catalyst window is ten trading days, so one horizon holds throughout. The page is a template of nine fixed items rendered from stored outputs; the only free text is the quotes, which pass the quote gate, and the theme label, which is printed beside its keyword label. Item 1 is the theme: its label, the book's variance share on the named component and its percentile, the theme's excess weight with the runner-up, the leg-mean loadings as one line of description, and the label from the keyword run beside the model's. Item 2 is the loss in basis points if the component returns minus two sigma, by leg. Item 3 is the ten-day VaR and expected shortfall with the number of observations behind them, the probability of a return at or below the long-run threshold, the catalyst-window VaR and its increase, and the hedge line. Item 4 is the positioning overlap by leg, the bear state and the squeeze state, the positioning lag, and the two vulnerable-name lists by leg once their event study has run. Item 5 is the catalysts with dates and types, approved and proposed. Item 6 is the driving-series exposure in hedgeable units, printed first when the named component's R-squared on the reference series is above 0.5. Item 7 is the five analogues with what followed and whether each is apt. Item 8 is each field's change since the last page. Item 9 is the footer: text coverage by layer; one line naming any item not on this page and the test or feed it waits on; and a note that the numbers describe the paper 12-1 book, with the reader's beta to that book if positions are an input, and otherwise the instruction to scale by that beta. The conclusion gives the direction of the risk and the sized hedge, and leaves the decision to exit with the reader; this is the decision the system informs. Every number links to a stored output and every theme to its quotes. The page records whether it was acknowledged.
    checks:
      - "every quote passes the quote gate"
    on_failure: the page is sent with the footer naming what is missing
    open:
      - "The example page with numbers, required by element 6 of the brief, is in the memo, not in this spec."

  - id: responselog
    name: Response log
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: the full log needs the reader's positions as an input; a proxy runs before that
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "looked at, ignored, or acted on, per page"
    rule: |
      Each page is logged as looked at, ignored, or acted on, and scored against a base rate: the share of weeks in which the PM changes the momentum exposure of the PM's own book, measured as its beta to the 12-1 book, with no page. That needs the reader's actual positions as an input, because the 12-1 book is a paper portfolio that no fund holds; it is the first item of the production path. Until positions are an input, the proxy is the acknowledgement log and the PM's two logged actions, list edits and catalyst approvals, within five sessions of a page; a page that produces neither is counted as read and not acted on. Before any PM exists, the proof of concept measures the page against its own baseline: on the formation date before each of the five recorded unwinds, whether the page's VaR, theme and hedge line differed from the unconditional baseline's, and how.
    checks:
      - "the base rate is stated before scoring"

  - id: signoff
    name: The human tasks
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: none needed; runs live only
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "acknowledged page, or the page sent unacknowledged"
      - "the hand-labelled sample"
    rule: |
      The PM acknowledges each page, or it is sent marked unacknowledged. The PM edits the worry list whenever a worry becomes relevant. The PM reviews proposed catalysts weekly. A research analyst, not the PM, labels sentences as risk statements or not: in the proof of concept 100 filing sentences, labelled once by the author, about two hours and a standard error of five points on precision; in production a stratified sample each month, checked by a second analyst.
    on_failure: the page is sent unacknowledged

  # ============================================================ validation
  - id: register
    validation: true
    name: Pre-registration register
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: clean
    mitigation: thresholds and both outcome sentences are written before each run
    inputs: []
    outputs:
      - "a row per test: threshold, detection floor, and the sentence that goes in the memo under each outcome"
    rule: |
      Before each test runs, the author writes its pass threshold and the sentence the memo will hold if the test passes and if it fails; when the result is in, the sentence for the other outcome is deleted. Before any test, the smallest effect it could detect is found by simulation, and a null result is a finding only if that floor is below the effect size of interest; otherwise the test is reported as too weak to see it. Every v2 test runs on dates that were used to build the design. What the register fixes in advance is the threshold, the floor and the two outcome sentences; it does not make a result out-of-sample, and no v2 result in the memo is called confirmatory. The forward seal from the memo date holds zero observations today. The memo's framing for every v2 result is: in-sample, registered thresholds. Rows that test the memo or the developer's process rather than the market are kept in a process appendix; the v1 rows are archived with their outcomes.
    checks:
      - "the build fails if any placeholder for an unresolved outcome remains in the memo"

  - id: labels
    validation: true
    name: Hand-labelled sample
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: the labels are used only to score the classifier and the keyword rule, never to train them
    inputs:
      - "the hand-labelled sample"
      - "risk statements per company, on both runs"
      - "news risk statements, dated, on both runs"
    outputs:
      - "precision and recall by leg, layer and cutoff side, for the classifier and the keyword rule"
    rule: |
      Sentences are labelled as risk statements or not, by hand, and the classifier's and the keyword rule's records are scored against them: precision and recall by leg, by layer and by whether the document is dated before or after the labelling model's training cutoff. Confidence intervals are binomial. The difference in error between pre- and post-cutoff records is the bound on how much the labels may owe to recall from training rather than reading. In production the error rates by stratum set the next month's stratum weights.
    open:
      - "Has not yet run; in the proof of concept the author labels 100 filing sentences."

  - id: volvalidation
    validation: true
    name: Scoring
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the theme; the tail model's inputs are realised returns and calendar dates
    inputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the catalyst-window VaR and its increase over the outside-window VaR"
      - "the three ablation lines"
      - "the unconditional and calendar baseline VaR"
      - "book returns"
      - "page dates and their outcomes"
      - "per component above noise: the theme (an entry or a residual cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the reversal record, 195 episodes since 1926"
      - "a row per test: threshold, detection floor, and the sentence that goes in the memo under each outcome"
    outputs:
      - "coverage and the pinball ratio per ablation line, with intervals"
      - "the hit rate on threshold-page days"
      - "the breach sort by theme weight"
      - "the premise share"
    rule: |2
        $$\text{breach}_t = \mathbf{1}[R_{t,t+10} \le \mathrm{VaR}_t], \qquad \rho(z) = z\,(0.05 - \mathbf{1}[z < 0])$$
      Coverage is scored on formation months from December 2015, one observation each, about 130 by the memo date. At 130 observations Kupiec's unconditional-coverage test at the 10% level accepts 3 to 10 breaches, 2.3% to 7.7%; eleven rejects; the row prints the region for the count at run time. The test rules out gross miscalibration and does not choose between the model and a baseline that also passes. The choice is made on pinball loss at $\tau = 0.05$, computed for the model and both baselines on the same months; the ratio of the model's loss to each baseline's is reported with a 90% interval from a block bootstrap of the months in blocks of six, longer than the horizon and the filing cycle, and the memo says the model beats a baseline only when the interval excludes one. The detection floor for the ratio is found by simulation before the run and stated in the row. Text is tested as a sort of the breach record: the breach months are split at the median of the theme's excess weight on the formation date, and the test resolves only if at least five of the six or seven breaches fall in the high half; the register labels it illustrative otherwise. The hit rate on threshold-page days is tested against the 5% base rate. The premise share is measured, not assumed: for each recorded episode with news on disk, the run says whether a theme rose above the placebo on the prior formation date, and the share is printed with its count beside the same share on formation dates with no episode, which is its base rate; if the two are alike, the memo says the theme machinery does not separate the episodes from calm months and the tail model, which does not use it, is the page's main number.
    checks:
      - "register row with threshold and floor"
    open:
      - "EMPIRICS: the simulated floor for the pinball ratio at the observation count available."

  - id: bombtest
    validation: true
    name: Event study for the vulnerable-name lists
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the lists; lists are frozen before the outcome window, and positioning is as of the date
    inputs:
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "daily returns per company"
      - "sector codes"
      - "the reversal record, 195 episodes since 1926"
      - "a row per test: threshold, detection floor, and the sentence that goes in the memo under each outcome"
    outputs:
      - "each list's excess move over sector-matched companies, per unwind"
    rule: |
      The event study covers the recorded unwinds since 2020 in the reversal record, each dated by its first breach day; the register lists them by date before the run. It measures whether the listed companies moved in the loss direction by more than sector-matched companies not on the list over the ten sessions after the freeze, using positioning data as it was available at the time. The pre-catalyst list is frozen 21 sessions before the first breach day; the post-unwind list five sessions after it. The freeze dates are set from the record, so the test is of list content, not of timing. The margin is set at registration as the median $\mathrm{sd20}$ of book companies, a data-derived number; the count of unwinds with the same sign is reported and not required. The detection floor at that count of unwinds is stated in the row. Neither list is printed on any page until this test has run. All five unwinds are design tier.
    checks:
      - "register row"
    on_failure: the lists are not printed
    open:
      - "EMPIRICS: the five first-breach dates from the reversal record."

  - id: themevalidation
    validation: true
    name: Theme pipeline against the PM's list
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: human
    mitigation: there is no history until a PM edits the list; this is a production measurement
    inputs:
      - "PM edits"
      - "per component above noise: the theme (an entry or a residual cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "a row per test: threshold, detection floor, and the sentence that goes in the memo under each outcome"
    outputs:
      - "the share of PM-added entries the pipeline had surfaced first; the share of residual themes the PM later adopted"
    rule: |
      Run quarterly, from two logs: the edit log (each entry the PM added, with its date) and the residual-cluster log (each residual cluster that was a component's theme, with its centroid and the date it was first named). For each added entry, the pipeline surfaced it first if a logged residual cluster lay within $d^*$ of the new entry's reference point before the edit date. For each logged residual cluster, the PM adopted it if an entry within $d^*$ of its centroid was added later. The two shares are printed with their counts. The first reading is four quarters after a PM starts editing the list.
    checks:
      - "register row"

