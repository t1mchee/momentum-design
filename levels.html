<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System design, by level</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<style>
  :root{--bg:#f6f5f1;--ink:#1f2328;--muted:#6b7280;--line:#c9c6bd;--card:#fff;--det:#4e7698;--model:#b5651d;--human:#9c8355;--data:#7a7a7a;--output:#2f7d5a;--open:#c62828;--edge:#9a9a9a;--group:#3b4a5a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  #top{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;white-space:nowrap;overflow:hidden;background:#fff;border-bottom:1px solid var(--line);z-index:5}
  #top b{font-size:14px;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
  #top .meta{color:var(--muted);font-size:12px}
  #top button,#top a.btn{font-size:11px;padding:2px 8px;border:1px solid var(--line);background:#fff;border-radius:4px;cursor:pointer;color:var(--ink);text-decoration:none}
  #top .legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--muted)}
  @media (max-width:1100px){#top .legend{display:none}}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
  #stage{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab}
  #stage.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  #edges{position:absolute;left:0;top:0;overflow:visible}
  #edges path.e{fill:none;stroke:var(--edge);stroke-width:1.4;transition:opacity .12s,stroke .12s}
  #edges path.e.soft{stroke-dasharray:4 4}
  #edges path.e.agg{stroke-width:2.2}
  #edges path.hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke}
  #edges.focus path.e{opacity:.1}
  #edges.focus path.e.on{opacity:1;stroke:var(--ink);stroke-width:2.4}
  .elabel{position:absolute;font-size:10.5px;color:var(--ink);background:#fffdf5;border:1px solid #e3dcc2;border-radius:3px;padding:2px 6px;pointer-events:none;white-space:pre;transform:translate(-50%,-50%);display:none;z-index:3;max-width:360px;white-space:normal}
  .elabel.show{display:block}
  .elabel.pin{border-color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.15);pointer-events:auto}
  .cluster{position:absolute;border:1.5px solid var(--group);border-radius:10px;background:rgba(59,74,90,.045);box-sizing:border-box}
  .cluster.sub{border-style:dashed;background:rgba(59,74,90,.03)}
  .cluster .ch{position:absolute;left:0;right:0;top:0;padding:5px 10px;font-weight:600;font-size:12.5px;color:var(--group);cursor:pointer;background:rgba(255,255,255,.7);border-radius:10px 10px 0 0;border-bottom:1px solid rgba(59,74,90,.2)}
  .cluster .ch small{font-weight:400;color:var(--muted);margin-left:8px}
  .node{position:absolute;width:200px;background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:7px 10px 8px;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;user-select:none;transition:opacity .12s;box-sizing:border-box;z-index:2}
  .node.kind-data{background:#ececea;border-radius:18px;border-color:#a9a9a6;border-style:double;border-width:3px}
  .node.kind-deterministic{background:#fff;border-radius:3px;border-left:5px solid var(--det)}
  .node.kind-model{background:#fdf1e6;border-radius:12px;border-color:var(--model);border-width:2px}
  .node.kind-human{background:#f7f0e2;border-color:var(--human);border-width:2px;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);padding-left:18px;padding-right:18px}
  .node.kind-output{background:#e9f4ee;border:3px double var(--output);border-radius:3px}
  .node.val{background:#f3eefa !important;border:2px dashed #6b4e9b !important;border-radius:4px !important;padding-left:10px !important;padding-right:10px !important;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px) !important}
  .node.val .nm{color:#3f2a66}
  .chip.val{background:#6b4e9b;color:#fff}
  .node.status-retired{opacity:.45;background:#f3f3f1;border-color:#bbb}
  .node.status-retired .nm{text-decoration:line-through}
  .node.group{width:270px;background:#fff;border:2px solid var(--group);border-radius:8px;padding:9px 12px 10px}
  .node.group .nm{font-size:14px}
  .node .syn{font-size:11px;color:#333;margin-top:4px;line-height:1.35}
  .node.group .cnt{font-size:10.5px;color:var(--muted);margin-top:5px}
  .node.sel{outline:2px solid var(--ink)}
  .node.dim{opacity:.25}
  .node .nm{font-weight:600;font-size:13px;line-height:1.25}
  .node .kd{font-size:10.5px;color:var(--muted);margin-top:3px}
  .chip{display:inline-block;font-size:9px;letter-spacing:.04em;padding:1px 5px;border-radius:3px;margin-right:4px;margin-top:4px;text-transform:uppercase;font-weight:600}
  .chip.kind-model{background:var(--model);color:#fff}.chip.kind-human{background:var(--human);color:#fff}.chip.kind-output{background:var(--output);color:#fff}.chip.kind-data{background:#6b6b68;color:#fff}.chip.kind-deterministic{background:var(--det);color:#fff}
  .chip.la-clean{background:#dcefe3;color:#1f5c3a}.chip.la-as-of{background:#dde8f3;color:#24476b}.chip.la-model{background:#f6dfc8;color:#7a3f0a}.chip.la-live-only{background:#f3cdcd;color:#8a1c1c}.chip.la-human{background:#efe4c9;color:#6b5322}
  .chip.ac-public{background:#dcefe3;color:#1f5c3a}.chip.ac-mixed{background:#f3e7c2;color:#6b5322}.chip.ac-licensed,.chip.ac-desk{background:#f3cdcd;color:#8a1c1c}
  .badge{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:var(--open);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
  #panel{position:fixed;top:44px;right:0;bottom:0;width:min(420px,100vw);box-sizing:border-box;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:14px 16px;transform:translateX(100%);transition:transform .15s;z-index:4}
  #panel.open{transform:none}
  #panel h2{margin:0 0 2px;font-size:16px}
  #panel .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:12px 0 3px}
  #panel ul{margin:0;padding-left:18px}
  #panel .rule{white-space:pre-wrap}
  #panel .open li{color:var(--open)}
  #panel .close{position:absolute;top:10px;right:12px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
  #story{position:fixed;top:44px;left:0;bottom:0;width:min(400px,100vw);box-sizing:border-box;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px 16px;transform:translateX(-100%);transition:transform .15s;z-index:4}
  #story.open{transform:none}
  #story h2{margin:0 0 6px;font-size:16px}
  #story .g{border-top:1px solid var(--line);padding:10px 0;cursor:pointer}
  #story .g:hover{background:#f7f7f4;margin:0 -16px;padding:10px 16px}
  #story .gn{font-weight:600}
  #story .gb{font-size:11.5px;color:var(--muted);margin:2px 0 4px}
  #story .gs{font-size:12.5px;color:#333}
  #story .close{position:absolute;top:10px;right:12px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
  #status{position:fixed;left:14px;bottom:10px;font-size:11px;color:var(--muted);background:#fff;padding:3px 8px;border:1px solid var(--line);border-radius:4px;z-index:5}
</style>
</head>
<body>
<div id="top"><b id="title">System design</b><span class="meta" id="version"></span>
  <button onclick="toggleStory()">the story</button><button onclick="collapseAll()">collapse all</button><button onclick="expandAll()">expand all</button><button onclick="fit()">fit</button><button onclick="toggleRetired()" id="retbtn">show retired</button>
  <a class="btn" href="index.html">full view</a>
  <div class="legend">
    <span><i class="sw" style="background:#fff;border:2px solid var(--group);border-radius:3px"></i>group = click to open</span>
    <span><i class="sw" style="background:#ececea;border:2px double #a9a9a6;border-radius:6px"></i>data</span>
    <span><i class="sw" style="background:#fff;border-left:3px solid var(--det)"></i>deterministic</span>
    <span><i class="sw" style="background:#fdf1e6;border:1.5px solid var(--model);border-radius:4px"></i>LLM</span>
    <span><i class="sw" style="background:#f7f0e2;border:1.5px solid var(--human);clip-path:polygon(3px 0,7px 0,10px 50%,7px 100%,3px 100%,0 50%)"></i>human</span>
    <span><i class="sw" style="background:#e9f4ee;border:2px double var(--output)"></i>output</span>
  </div>
</div>
<div id="stage"><div id="world"><svg id="edges"></svg></div></div>
<div id="panel"><button class="close" onclick="closePanel()">×</button><div id="pbody"></div></div>
<div id="story"><button class="close" onclick="toggleStory()">×</button><div id="sbody"></div></div>
<div id="status">loading…</div>
<script>
const SPEC=new URLSearchParams(location.search).get('spec')||'spec.yaml';
const NODE_W=200, GROUP_W=270;
let spec=null, groups=null, lastKey='', sel=null, view={x:20,y:20,k:1}, expanded=new Set(), showRetired=false, layoutCache=null;
const world=document.getElementById('world'), stage=document.getElementById('stage'), svg=document.getElementById('edges');
const SOFT=/unrun|refuted|never done|registered|join|live only|backtest only/i;
const softEdge=(e)=>SOFT.test((e.when||'')+' '+(e.mode||''));

async function loadText(path){const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});return r.text();}
function mergeSpec(over, base){
  if(!base) return over;
  const dropN=new Set(over.drop_nodes||[]); const dropE=new Set((over.drop_edges||[]).map(e=>e.from+'>'+e.to));
  const nodes=(base.nodes||[]).filter(n=>!dropN.has(n.id)).map(n=>({...n}));
  const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  (over.nodes||[]).forEach(n=>{ if(byId[n.id]) Object.assign(byId[n.id],n); else {nodes.push(n); byId[n.id]=n;} });
  const ids=new Set(nodes.map(n=>n.id));
  const edges=(base.edges||[]).filter(e=>ids.has(e.from)&&ids.has(e.to)&&!dropE.has(e.from+'>'+e.to)).concat(over.edges||[]);
  return {meta:over.meta||base.meta, lanes:over.lanes||base.lanes, nodes, edges};
}
async function poll(){
  try{
    const st=await loadText(SPEC); let doc=jsyaml.load(st); let key=st;
    if(doc&&doc.base){const bt=await loadText(doc.base); key+=bt; doc=mergeSpec(doc,jsyaml.load(bt));}
    const gt=await loadText('groups.yaml'); key+=gt;
    if(key!==lastKey){lastKey=key; spec=doc; groups=jsyaml.load(gt); indexGroups(); render(); renderStory(); document.getElementById('status').textContent='updated '+new Date().toLocaleTimeString();}
  }catch(e){document.getElementById('status').textContent='error: '+e.message;}
  setTimeout(poll,1000);
}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
// ---- hierarchy index
let gById={}, parentOf={}, nodeParent={};
function indexGroups(){
  gById={}; parentOf={}; nodeParent={};
  const walk=(g,parent)=>{ gById[g.id]=g; parentOf[g.id]=parent; (g.children||[]).forEach(c=>{ if(typeof c==='string') nodeParent[c]=g.id; else walk(c,g.id); }); };
  (groups.groups||[]).forEach(g=>walk(g,null));
}
function leafIds(g){ let out=[]; (g.children||[]).forEach(c=>{ if(typeof c==='string') out.push(c); else out=out.concat(leafIds(c)); }); return out; }
function ancestors(nid){ const a=[]; let p=nodeParent[nid]; while(p){a.unshift(p); p=parentOf[p];} return a; }
function rep(nid){ // representative: outermost collapsed ancestor, else the node
  const anc=ancestors(nid); for(const g of anc){ if(!expanded.has(g)) return g; } return nid; }
function isHidden(nid){ const anc=ancestors(nid); return anc.some(g=>gById[g].hidden)&&!showRetired; }
function kindSummary(ids){ const byId=Object.fromEntries(spec.nodes.map(n=>[n.id,n])); const c={}; ids.forEach(i=>{const n=byId[i]; if(!n) return; c[n.kind]=(c[n.kind]||0)+1;}); return c; }
function laSummary(ids){ const byId=Object.fromEntries(spec.nodes.map(n=>[n.id,n])); const c={}; ids.forEach(i=>{const n=byId[i]; if(!n||!n.lookahead) return; c[n.lookahead]=(c[n.lookahead]||0)+1;}); return c; }
function openCount(ids){ const byId=Object.fromEntries(spec.nodes.map(n=>[n.id,n])); return ids.reduce((a,i)=>a+((byId[i]&&byId[i].open)||[]).length,0); }

// ---- render
function render(){
  if(!spec||!groups) return;
  const m=spec.meta||{}; document.getElementById('title').textContent=(m.title||'System design')+', by level';
  const upd=m.updated instanceof Date?m.updated.toISOString().slice(0,10):m.updated; document.getElementById('version').textContent=[m.version,upd].filter(Boolean).join(' · ');
  world.querySelectorAll('.node,.elabel,.cluster').forEach(e=>e.remove());
  const byId=Object.fromEntries(spec.nodes.map(n=>[n.id,n]));
  const g=new dagre.graphlib.Graph({compound:true,multigraph:true});
  g.setGraph({rankdir:'TB',nodesep:44,ranksep:56,edgesep:16,marginx:30,marginy:30,ranker:'network-simplex'});
  g.setDefaultEdgeLabel(()=>({}));
  const els={}; const visible=new Set();
  // visible leaves and collapsed groups
  spec.nodes.forEach(n=>{ if(!nodeParent[n.id]) return; if(isHidden(n.id)) return; const r=rep(n.id); visible.add(r); });
  // create elements
  visible.forEach(id=>{
    const d=document.createElement('div');
    if(gById[id]){ const grp=gById[id]; const leaves=leafIds(grp).filter(x=>byId[x]&&!isHidden(x)); const ks=kindSummary(leaves), la=laSummary(leaves), no=openCount(leaves);
      d.className='node group'; d.dataset.id=id;
      const chips=Object.entries(ks).map(([k,v])=>`<span class="chip kind-${k}">${v} ${k==='model'?'LLM':k}</span>`).join('')+(la['live-only']?`<span class="chip la-live-only">${la['live-only']} live-only</span>`:'')+(la.model?`<span class="chip la-model">${la.model} model</span>`:'');
      d.innerHTML=`<div class="nm">${esc(grp.name)}</div><div class="syn">${esc(grp.synthesis||'').slice(0,170)}${(grp.synthesis||'').length>170?'…':''}</div><div>${chips}</div><div class="cnt">▸ ${leaves.length} steps, click to open</div>`+(no?`<div class="badge">${no}</div>`:'');
      d.onclick=(e)=>{e.stopPropagation(); if(e.altKey){showGroupPanel(grp);} else {expanded.add(id); render();}};
      g.setNode(id,{width:GROUP_W,height:0});
    } else { const n=byId[id]; d.className=`node kind-${n.kind||'deterministic'} status-${n.status||'draft'}`+(n.validation?' val':''); d.dataset.id=id;
      const kindLabel={data:'DATA IN',deterministic:'',model:'LLM',human:'HUMAN',output:'OUTPUT'}[n.kind||'deterministic']||'';
      const laText=n.lookahead;
      const laHide=(n.kind==='human'&&n.lookahead==='human')||(n.kind==='model'&&n.lookahead==='model')||n.status==='retired';
      const chips=(n.validation?`<span class="chip val">VALIDATION</span>`:'')+(kindLabel?`<span class="chip kind-${n.kind}">${kindLabel}</span>`:'')+((n.lookahead&&!laHide)?`<span class="chip la-${n.lookahead}" title="${esc(n.mitigation||'')}">${esc(laText)}</span>`:'')+(n.access?`<span class="chip ac-${esc(n.access)}">${esc(n.access)}</span>`:'');
      const no=(n.open||[]).length;
      const summary=(n.rule||'').replace(/\s+/g,' ').slice(0,110);
      d.innerHTML=`<div class="nm">${esc(n.name)}</div><div class="syn">${esc(summary)}${(n.rule||'').length>110?'…':''}</div><div>${chips}</div>`+(no?`<div class="badge">${no}</div>`:'');
      d.onclick=(e)=>{e.stopPropagation(); sel=id; showPanel(n); focus();};
      g.setNode(id,{width:NODE_W,height:0});
    }
    d.style.left='0px'; d.style.top='0px'; world.appendChild(d); els[id]=d;
  });
  Object.entries(els).forEach(([id,d])=>{ g.node(id).height=d.offsetHeight; });
  // clusters for expanded groups (only those with a visible member)
  const clusters=[];
  expanded.forEach(gid=>{ const grp=gById[gid]; if(!grp) return; const members=[...visible].filter(v=> (gById[v]?parentOf[v]===gid:nodeParent[v]===gid)); if(!members.length) return; g.setNode('cl_'+gid,{label:grp.name,clusterLabelPos:'top'}); members.forEach(mid=>g.setParent(mid,'cl_'+gid)); g.setNode('hdr_'+gid,{width:1,height:26}); g.setParent('hdr_'+gid,'cl_'+gid); members.forEach(mid=>g.setEdge('hdr_'+gid,mid,{weight:2,minlen:1},'hdr_'+gid+'_'+mid)); clusters.push(gid); });
  // nested clusters: an expanded subgroup inside an expanded parent
  clusters.forEach(gid=>{ const p=parentOf[gid]; if(p&&expanded.has(p)&&clusters.includes(p)) g.setParent('cl_'+gid,'cl_'+p); });
  // aggregate edges
  const agg={};
  spec.edges.forEach(e=>{ if(e.hidden) return; if(isHidden(e.from)||isHidden(e.to)) return; const a=rep(e.from), b=rep(e.to); if(a===b) return; if(!visible.has(a)||!visible.has(b)) return; const k=a+'>'+b; (agg[k]??={from:a,to:b,items:[],feedback:!!e.feedback,soft:softEdge(e)}).items.push(e); if(!e.feedback) agg[k].feedback=false; });
  Object.values(agg).forEach((ae,i)=>{ if(!ae.feedback) g.setEdge(ae.from,ae.to,{weight:Math.min(6,ae.items.length),minlen:1},'e'+i); ae.i=i; });
  // reading-order constraints: consecutive visible siblings (groups.yaml order) are chained with invisible edges
  const chain=(siblings)=>{ const vis=siblings.filter(id=>visible.has(id)); for(let i=1;i<vis.length;i++){ g.setEdge(vis[i-1],vis[i],{weight:60,minlen:1},'chain_'+vis[i]); } };
  chain((groups.groups||[]).filter(x=>!x.hidden||showRetired).map(x=>x.id));
  expanded.forEach(gid=>{ const grp=gById[gid]; if(!grp) return; chain((grp.children||[]).map(c=>typeof c==='string'?c:c.id)); });
  // pin sources
  const hasIn=new Set(Object.values(agg).filter(a=>!a.feedback).map(a=>a.to));
  g.setNode('__root',{width:1,height:1}); visible.forEach(id=>{ if(!hasIn.has(id)&&!(gById[id]&&gById[id].hidden)) g.setEdge('__root',id,{weight:20,minlen:1},'root_'+id); });
  dagre.layout(g);
  const gw=g.graph().width, gh=g.graph().height;
  visible.forEach(id=>{const p=g.node(id); els[id].style.left=(p.x-p.width/2)+'px'; els[id].style.top=(p.y-p.height/2)+'px';});
  // draw clusters
  clusters.forEach(gid=>{ const p=g.node('cl_'+gid); if(!p) return; const c=document.createElement('div'); c.className='cluster'+(parentOf[gid]?' sub':''); c.style.left=(p.x-p.width/2-10)+'px'; c.style.top=(p.y-p.height/2-6)+'px'; c.style.width=(p.width+20)+'px'; c.style.height=(p.height+16)+'px';
    const grp=gById[gid]; c.innerHTML=`<div class="ch" title="click to collapse">${esc(grp.name)}<small>▾ collapse · alt-click for the synthesis</small></div>`; c.querySelector('.ch').onclick=(e)=>{e.stopPropagation(); if(e.altKey) showGroupPanel(grp); else {expanded.delete(gid); [...expanded].forEach(x=>{ if(ancestorsG(x).includes(gid)) expanded.delete(x); }); render();}}; world.insertBefore(c, svg.nextSibling); });
  // edges
  svg.setAttribute('width',gw); svg.setAttribute('height',gh);
  svg.innerHTML=`<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#8a8a8a"/></marker><marker id="ahd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2328"/></marker></defs>`;
  Object.values(agg).forEach(ae=>{
    let pts;
    if(ae.feedback){ const a=g.node(ae.from), b=g.node(ae.to); const x0=a.x-a.width/2,y0=a.y,x1=b.x-b.width/2,y1=b.y; const bulge=Math.max(60,Math.abs(y1-y0)/4); pts=[{x:x0,y:y0},{x:x0-bulge,y:y0},{x:x1-bulge,y:y1},{x:x1,y:y1}]; }
    else { const ge=g.edge(ae.from,ae.to,'e'+ae.i); if(!ge) return; pts=ge.points; }
    const d=ae.feedback?`M${pts[0].x},${pts[0].y} C${pts[1].x},${pts[1].y} ${pts[2].x},${pts[2].y} ${pts[3].x},${pts[3].y}`:smooth(pts);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',d); p.setAttribute('class','e'+((ae.feedback||ae.soft)?' soft':'')+(ae.items.length>1?' agg':'')); p.setAttribute('marker-end','url(#ah)'); p.dataset.from=ae.from; p.dataset.to=ae.to; p.dataset.i=ae.i; svg.appendChild(p);
    const h=document.createElementNS('http://www.w3.org/2000/svg','path'); h.setAttribute('d',d); h.setAttribute('class','hit'); svg.appendChild(h);
    const mid=ae.feedback?{x:(pts[1].x+pts[2].x)/2,y:(pts[1].y+pts[2].y)/2}:pts[Math.floor(pts.length/2)];
    const lab=document.createElement('div'); lab.className='elabel'; lab.id='lab'+ae.i; lab.innerHTML=ae.items.slice(0,6).map(e=>`${esc(byId[e.from]?byId[e.from].name:e.from)} → ${esc(byId[e.to]?byId[e.to].name:e.to)}: ${esc(e.carries||'')}${(e.when||e.mode)?' <span style="color:#6b7280">('+esc([e.when,e.mode].filter(Boolean).join(', '))+')</span>':''}`).join('<br>')+(ae.items.length>6?`<br>… ${ae.items.length-6} more`:''); lab.style.left=mid.x+'px'; lab.style.top=mid.y+'px'; world.appendChild(lab);
    h.onmouseenter=()=>{lab.classList.add('show');p.classList.add('on');svg.classList.add('focus');};
    h.onmouseleave=()=>{if(!lab.classList.contains('pin')) lab.classList.remove('show'); if(!sel){p.classList.remove('on');svg.classList.remove('focus');}else focus();};
    h.onclick=(ev)=>{ev.stopPropagation(); const was=lab.classList.contains('pin'); world.querySelectorAll('.elabel.pin').forEach(l=>l.classList.remove('pin','show')); if(!was){lab.classList.add('pin','show');}};
  });
  layoutCache={gw,gh}; if(sel&&els[sel]) focus(); else {sel=null; focus();}
  applyView();
}
function ancestorsG(gid){ const a=[]; let p=parentOf[gid]; while(p){a.push(p); p=parentOf[p];} return a; }
function smooth(pts){ if(pts.length<3) return `M${pts[0].x},${pts[0].y} L${pts[pts.length-1].x},${pts[pts.length-1].y}`; let d=`M${pts[0].x},${pts[0].y}`; for(let i=1;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];d+=` Q${a.x},${a.y} ${(a.x+b.x)/2},${(a.y+b.y)/2}`;} const l=pts[pts.length-1]; return d+` L${l.x},${l.y}`; }
function focus(id){ id=id||sel; const paths=svg.querySelectorAll('path.e'), labs=world.querySelectorAll('.elabel'), cards=world.querySelectorAll('.node');
  if(!id){svg.classList.remove('focus');paths.forEach(p=>{p.classList.remove('on');p.setAttribute('marker-end','url(#ah)');});labs.forEach(l=>l.classList.remove('show'));cards.forEach(c=>c.classList.remove('dim','sel'));return;}
  const nb=new Set([id]); svg.classList.add('focus');
  paths.forEach(p=>{const on=p.dataset.from===id||p.dataset.to===id; p.classList.toggle('on',on); p.setAttribute('marker-end',on?'url(#ahd)':'url(#ah)'); if(on){nb.add(p.dataset.from);nb.add(p.dataset.to);} const l=document.getElementById('lab'+p.dataset.i); if(l) l.classList.toggle('show',false);});
  cards.forEach(c=>{c.classList.toggle('dim',!nb.has(c.dataset.id)); c.classList.toggle('sel',c.dataset.id===sel);}); }
function legendHTML(){ const L=(spec&&spec.meta&&spec.meta.legend)||null; const P=(spec&&spec.meta&&spec.meta.proof_of_concept)||null; const Q=(spec&&spec.meta&&spec.meta.problem)||null; let h=''; if(Q) h+='<div class="k" style="margin-top:14px">Problem</div><ul>'+Object.entries(Q).map(([k,v])=>'<li><b>'+esc(k)+'</b>: '+esc(String(v))+'</li>').join('')+'</ul>'; if(L) h+='<div class="k" style="margin-top:14px">Legend</div><ul>'+Object.entries(L).map(([k,v])=>'<li><b>'+esc(k)+'</b>: '+esc(String(v))+'</li>').join('')+'</ul>'; if(P){ const notes=P.path_notes||{}; const pathTxt=(P.path||[]).map(id=>notes[id]?esc(id)+' <span style="color:var(--muted)">('+esc(notes[id])+')</span>':esc(id)).join(', '); h+='<div class="k" style="margin-top:14px">Proof of concept</div><div>'+esc(P.hours||'')+'</div>'+(P.status?'<div style="margin-top:4px"><b>Status:</b> '+esc(P.status)+'</div>':'')+'<div style="margin-top:4px"><b>Path:</b> '+pathTxt+'</div><div style="margin-top:4px"><b>Produces:</b> '+esc(P.produces||'')+'</div><div style="margin-top:4px"><b>Deferred:</b> '+esc((P.deferred||[]).join(', '))+'</div>'+(P.described_only?'<div style="margin-top:4px"><b>Described only:</b> '+esc(P.described_only.join(', '))+'</div>':'')+'<div style="margin-top:4px"><b>Retired:</b> '+esc(spec.nodes.filter(n=>n.status==="retired").map(n=>n.id).join(', '))+'</div>'; } return h; }
function list(a){return (a&&a.length)?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span style="color:var(--muted)">none</span>';}
function showPanel(n){
  const byId=Object.fromEntries(spec.nodes.map(x=>[x.id,x]));
  const ins=spec.edges.filter(e=>e.to===n.id&&!e.hidden), outs=spec.edges.filter(e=>e.from===n.id&&!e.hidden);
  const io=(arr,dir)=>arr.length?'<ul>'+arr.map(e=>`<li><b>${esc((byId[dir==='in'?e.from:e.to]||{}).name||'')}</b>: ${esc(e.carries||'')}${(e.when||e.mode)?' <span style="color:var(--muted)">('+esc([e.when,e.mode].filter(Boolean).join(', '))+')</span>':''}</li>`).join('')+'</ul>':'<span style="color:var(--muted)">none</span>';
  const path=ancestors(n.id).map(g=>gById[g].short||gById[g].name).join(' › ');
  document.getElementById('pbody').innerHTML=`<h2>${esc(n.name)}</h2><div class="kd">${esc(path)} · ${esc(n.kind||'')} · ${esc(n.status||'')}${n.origin?' · '+esc(n.origin):''}${n.memo?' · memo '+esc(n.memo):''}</div>
  ${n.lookahead?`<div class="k">Look-ahead</div><div><span class="chip la-${esc(n.lookahead)}">${esc(n.lookahead)}</span> ${esc(n.mitigation||'')}</div>`:''}
  ${n.access?`<div class="k">Access</div><div><span class="chip ac-${esc(n.access)}">${esc(n.access)}</span> feeds labelled in the rule</div>`:''}
  <div class="k">Rule</div><div class="rule">${esc(n.rule)}</div>
  <div class="k">Receives</div>${io(ins,'in')}<div class="k">Sends</div>${io(outs,'out')}
  <div class="k">Checks</div>${list(n.checks)}<div class="k">On failure</div><div>${esc(n.on_failure||'')}</div>
  <div class="k">Open questions</div><div class="open">${list(n.open)}</div>`;
  document.getElementById('panel').classList.add('open');
}
function showGroupPanel(grp){
  const byId=Object.fromEntries(spec.nodes.map(x=>[x.id,x])); const leaves=leafIds(grp).filter(x=>byId[x]);
  const sub=(grp.children||[]).filter(c=>typeof c!=='string');
  document.getElementById('pbody').innerHTML=`<h2>${esc(grp.name)}</h2><div class="kd">${esc(grp.brief||'')}</div>
  <div class="k">What this step does</div><div class="rule">${esc(grp.synthesis||'')}</div>
  ${sub.length?`<div class="k">Sub-steps</div><ul>${sub.map(s=>`<li><b>${esc(s.name)}</b>: ${esc(s.synthesis||'')}</li>`).join('')}</ul>`:''}
  <div class="k">Components</div><ul>${leaves.map(id=>`<li><span class="chip kind-${byId[id].kind}">${byId[id].kind==='model'?'LLM':byId[id].kind}</span> ${esc(byId[id].name)}</li>`).join('')}</ul>`;
  document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open');sel=null;focus();}
function renderStory(){ if(!groups) return; document.getElementById('sbody').innerHTML=`<h2>How the system meets the brief</h2><div class="gb">Read top to bottom. Click a step to open it on the canvas.</div>`+legendHTML()+(groups.groups||[]).filter(g=>!g.hidden).map(g=>`<div class="g" onclick="openGroup('${g.id}')"><div class="gn">${esc(g.name)}</div><div class="gb">${esc(g.brief||'')}</div><div class="gs">${esc(g.synthesis||'')}</div></div>`).join(''); }
function openGroup(id){ expanded.add(id); render(); }
function toggleStory(){document.getElementById('story').classList.toggle('open');}
function collapseAll(){expanded.clear(); render(); fit();}
function expandAll(){Object.keys(gById).forEach(id=>{ if(!gById[id].hidden||showRetired) expanded.add(id); }); render(); fit();}
function toggleRetired(){showRetired=!showRetired; document.getElementById('retbtn').textContent=showRetired?'hide retired':'show retired'; render();}
function fit(){if(!layoutCache)return;const r=stage.getBoundingClientRect();view.k=Math.min(1.2,(r.width-20)/layoutCache.gw,(r.height-20)/layoutCache.gh);view.x=10;view.y=10;applyView();}
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.k})`;}
let drag=null;
stage.addEventListener('mousedown',e=>{drag={x:e.clientX-view.x,y:e.clientY-view.y};stage.classList.add('drag');});
window.addEventListener('mousemove',e=>{if(drag){view.x=e.clientX-drag.x;view.y=e.clientY-drag.y;applyView();}});
window.addEventListener('mouseup',()=>{drag=null;stage.classList.remove('drag');});
stage.addEventListener('wheel',e=>{e.preventDefault();const k=Math.min(3,Math.max(.15,view.k*(e.deltaY<0?1.1:0.9)));const r=stage.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;applyView();},{passive:false});
stage.addEventListener('click',()=>{world.querySelectorAll('.elabel.pin').forEach(l=>l.classList.remove('pin','show')); if(sel)closePanel();});
poll();
</script>
