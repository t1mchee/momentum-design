    lane: retired
    kind: deterministic
    status: retired
    origin: v1
    lookahead: clean
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. It triggered on none of the 195 recorded episodes; its inputs are now the positioning score and the overlap statistic.
    checks: []
    on_failure: n/a
    open: []

  - id: classify
    name: Route classification rule (retired)
    lane: retired
    kind: deterministic
    status: retired
    origin: v1
    lookahead: clean
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired after its test failed, with 44.1% of episodes fitting none of the three routes against a registered band of 5 to 30%. The reversal record it was applied to is stored with the French factor file. The memo reports the result that 77 of the 86 unassigned episodes were loser-leg losses in a rising market with no prior bear state.
    on_failure: n/a
    open: []

  - id: volmodel
    name: Vol model (retired, folded into the tail model)
    lane: retired
    kind: deterministic
    status: retired
    origin: v2
    lookahead: clean
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. Its regressors and the catalyst-window indicator are in the conditional tail model; its comparison is the component set's implied move; its symmetric five-day volatility target is replaced by the lower tail.
    checks: []
    on_failure: n/a
    open: []

