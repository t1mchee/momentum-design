# The simplified map: twenty-two boxes over the same design as spec.yaml (draft 11). Each box lists the
# full-view components it absorbs. The full view is the record; this map is the reading order for the memo,
# and each box's rule is the abridging paragraph the memo will use.
#
# Fields per box: id, name, lane (the step), kind (data | deterministic | model | human | output), lookahead
# (clean | as-of | model | live-only | human), access (data boxes), absorbs (ids in spec.yaml), inputs,
# outputs, rule, comparator (model boxes), check, open.
# Fields per edge: from, to, sends, when, mode, feedback.

meta:
  title: Momentum reversal-risk system, simplified map
  version: v2-draft-12-simple
  updated: "2026-09-07"
  problem:
    exposure: "the 12-1 momentum book: the top and bottom deciles of the Russell 3000 by return from twelve months before to one month before, value-weighted within each leg, dollar-neutral, rebuilt monthly"
    event: "a ten-day return of the reconstructed book at or below its own unconditional 5% quantile on the history since December 2013; the French factor's -432bp is the same quantile on the published factor over 1926 to 2022 and is printed as the long-run reference"
    horizon: "ten trading days, for every forecast on the page"
    user: "the PM running momentum, or the risk manager covering that book"
    decision: "whether and how much to hedge the book's exposure to the named theme before the next catalyst; the page gives the direction of the risk and the hedge, sized, and the reader decides"
  note: >
    The design assumes that the theme behind a reversal has been building in the news for some time and that
    the PM can put a label on it. The system measures how much of the book depends on that theme, where it has
    spread, who is positioned on it, and how much worse the book's tail becomes around the next catalyst. When
    a reversal comes from a theme that the news had not covered, the page shows no theme or the wrong one, and
    the VaR is unchanged, because the tail model does not take the theme.
  legend:
    box: "one box here absorbs one or more components of the full view; the panel lists them. The full view (index.html) is the record; this map is the reading order."
    kind: "data = a feed (grey pill); deterministic = a rule with no model (white box, blue band); model = a language-model component (orange); human = a person's task (tan hexagon); output = the page (green double border)."
    lookahead: "clean = uses only values that were public on the date; as-of = the values exist historically but are taken at their release date; model = a model trained after the date reads text from inside it; live-only = the box runs on live data only and no backtest claim depends on it; human = a person's input that a backtest runs without. A box's label is at least the strongest label among its backtest inputs."
    access: "public = every feed is public today; mixed = public feeds today, with licensed or desk-only feeds named for production."
    comparator: "a method that does the same job as a model step without a language model, printed beside it."
    quote gate: "every span a model extracts must appear verbatim in its source document, or the record is dropped and counted."
    two runs: "the risk statements are produced twice, by the classifier trained on language-model labels (the model run) and by the keyword rule (the keyword run); both are followed as far as the theme, and the page uses the model run."
    retired: "components retired from earlier drafts are listed in the full view with the reason; none appears here."

lanes:
  - {id: s1, name: "1. Inputs"}
  - {id: s2, name: "2. The book"}
  - {id: s3, name: "3. The theme"}
  - {id: s4, name: "4. Crowding"}
  - {id: s5, name: "5. Severity and timing"}
  - {id: s6, name: "6. The page"}
  - {id: s7, name: "7. Validation"}

nodes:
  # ---------------------------------------------------------------- 1. inputs
  - id: market
    name: Market data and calendars
    lane: s1
    kind: data
    lookahead: clean
    access: mixed
    absorbs: [prices, refseries, french, options]
    inputs: []
    outputs:
      - "daily returns and the point-in-time universe"
      - "six reference series and the bear state"
      - "earnings and macro calendars"
      - "the French factor and the reversal record"
      - "option premia"
    rule: |
      The universe is the Russell 3000 ETF's archived daily holdings, taken at the effective date of each change (PUBLIC). Daily prices come from Stooq or Tiingo (PUBLIC; CRSP in production, LICENSED). Six reference series give the macro exposures: the S&P 500, the ten-year yield, WTI, the broad dollar, the investment-grade spread, and the ten largest index companies against the equal-weighted index (PUBLIC). The bear state is an indicator that the trailing 24-month market return is negative. The earnings calendar in the backtest projects each company's date from its 8-K one year earlier; macro releases come from the published calendars. The French factor file gives the long history and the reversal record, 195 episodes since 1926. Options give the ten-day put premium on each hedge instrument (LICENSED for history; PUBLIC delayed data live), taken from surfaces as they stood on the date; it prices the hedge line and nothing else.
    check: "monthly correlation of the reconstructed book with the French factor, reported"
    open:
      - "EMPIRICS: the French correlation."

  - id: filings
    name: Company text
    lane: s1
    kind: data
    lookahead: clean
    access: mixed
    absorbs: [filings]
    inputs: []
    outputs:
      - "risk-factor sentences per company, dated"
      - "8-K and transcript sentences per company, dated"
      - "coverage by leg and by layer"
    rule: |
      The context layer is Item 1A of the latest 10-K accepted before the formation date, plus the latest 10-Q's risk factors where newer, split into sentences (PUBLIC, EDGAR). The event layer is 8-K Items 2.02, 7.01 and 8.01 with exhibits (PUBLIC) and earnings-call transcripts (PUBLIC for a subset; LICENSED for full coverage). Equity research and dealer notes form a third layer in production (LICENSED and DESK-ONLY). Every document is dated at acceptance. Every extracted span must appear verbatim in its source before it is stored. Quote weights are understated on companies without text, so a theme concentrated in companies the free feeds miss is under-read.
    check: "coverage per company, by leg and by layer, printed in the page footer"
    open:
      - "EMPIRICS: the free transcript feeds and the share of companies they cover."

  - id: news
    name: News
    lane: s1
    kind: data
    lookahead: as-of
    access: mixed
    absorbs: [news]
    inputs: []
    outputs:
      - "news sentences, rolling twelve months"
      - "items from the last five sessions"
    rule: |
      GDELT headlines and URLs, Fed, Treasury and BLS release pages, and SEC press-release exhibits (PUBLIC); Bloomberg and Reuters headlines in production (LICENSED). Every item is timestamped at publication and split into sentences. A rolling twelve-month archive feeds the embedding space; the last five sessions feed the catalyst proposal. For a backtest date, only items published before that date enter the archive. GDELT has no article text, so risk statements are under-counted. The theme pipeline starts at GDELT's first usable date.
    check: "the source list is versioned"
    open:
      - "EMPIRICS: GDELT's first usable date."

  - id: positioning
    name: Positioning feeds and score
    lane: s1
    kind: data
    lookahead: as-of
    access: mixed
    absorbs: [posdata]
    inputs: []
    outputs:
      - "the positioning score per company, with its lag"
      - "the crowded quintiles of the universe"
    rule: |
      The score has one input per leg, ranked within the leg: 13F crowding on the winner leg, the count of momentum-style filers holding the company (PUBLIC, 45-day lag), and short interest as a share of float on the loser leg (PUBLIC, two-week lag). A 13F count on a short would measure the wrong side. Crowded means the top quintile within the leg; for companies outside the book, the universe's top quintiles by each input are the second search scope. Neither input is computed from returns. In production, securities-lending utilisation (LICENSED), options open interest and ETF flows (PUBLIC), and prime-broker positioning (DESK-ONLY) are printed as separate lines. The longest input lag is printed wherever a positioning number appears.
    check: "longest input lag printed"
    open:
      - "EMPIRICS: the number of momentum-style filers."

  # ---------------------------------------------------------------- 2. the book
  - id: sort
    name: The 12-1 book
    lane: s2
    kind: deterministic
    lookahead: clean
    absorbs: [sort]
    inputs:
      - "daily returns and the point-in-time universe"
    outputs:
      - "the two legs and the position weights"
      - "book returns"
    rule: |
      On the last trading day of each month the rule ranks every company on its return from twelve months before to one month before. The top decile is held long and the bottom decile short, value-weighted within each leg and dollar-neutral across them, so the winner weights sum to one and the loser weights to minus one. The book is rebuilt monthly and measured daily. The weight vector is the input to every book-level statistic.
    check: "leg sizes, the capitalisation profile and the sector counts are logged"

  - id: random
    name: Random portfolios
    lane: s2
    kind: deterministic
    lookahead: clean
    absorbs: [random]
    inputs:
      - "daily returns and the point-in-time universe"
      - "the two legs and the position weights"
    outputs:
      - "200 random portfolios per date, matched on size, capitalisation and sector"
    rule: |
      For each formation date the rule draws 200 portfolios from the same universe with the same leg sizes, capitalisation deciles and sector counts, so that the only difference from the book is that they were not ranked on past returns; 200 puts ten draws above the 95th percentile. Sector matching is what makes the null useful for the text statistics, since a macro bet is usually expressed through a sector tilt. Every statistic the page prints for the book is computed on each random portfolio by the box that computes it for the book, and the book's percentile among them is what the page shows.
    check: "the construction parameters are hashed and stored with each run"

  - id: exposure
    name: Macro exposures in hedgeable units
    lane: s2
    kind: deterministic
    lookahead: clean
    absorbs: [sensitivities, percentiles, drivingseries]
    inputs:
      - "the two legs and the position weights"
      - "six reference series and the bear state"
      - "200 random portfolios per date, matched on size, capitalisation and sector"
    outputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "the driving series and the leg that holds its exposure"
    rule: |
      One regression of each company's return on the market gives the residual return that every later statistic uses. One slope of that residual on each reference series, over the 126 days ending at formation, times the company's weight and summed over the book, is the exposure. It is printed in units a desk can hedge: DV01-equivalent dollars per $100m of book for the ten-year, a beta for the index, notional dollars for the rest. One percentile is printed, against the book's own history since December 2013, and it is the percentile that can trigger a page; the percentile against the random portfolios goes to the appendix. The driving series is the reference series with the highest own-history percentile that month, and the page shows the leg that holds more of that exposure and the companies that contribute most.
    check: "sign stability across weighting, rebalance date, universe and window is reported in the appendix"

  # ---------------------------------------------------------------- 3. the theme
  - id: decompose
    name: Co-movement inside the book
    lane: s3
    kind: deterministic
    lookahead: clean
    absorbs: [covariance, pca, bridge]
    inputs:
      - "daily returns and the point-in-time universe"
      - "the two legs and the position weights"
      - "200 random portfolios per date, matched on size, capitalisation and sector"
      - "six reference series and the bear state"
    outputs:
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios"
      - "the hedge instrument and its slope"
      - "which statistic is printed first"
    rule: |
      A Ledoit-Wolf shrunk covariance of the book's residual returns over 126 days is decomposed and its first three components kept. A component's statistic is the share of the position-weighted book's variance it explains, printed with its percentile against the random portfolios; a component is above noise when it beats their 95th percentile. Its company set is the top quartile by absolute loading, and the sign is fixed so that a reversal is a negative component return. The leg-mean loadings are printed as description; no rule attaches to them. A regression of the component on the five non-market reference series decides what the page prints first: the driving-series exposure when the R-squared is above 0.5, the theme otherwise. The same regression, one instrument at a time over sector ETFs and macro futures, chooses the hedge instrument and gives the slope that sizes the hedge line. Each random portfolio is decomposed the same way.
    check: "the Jaccard overlap of the company set with the previous month's is printed; below 0.5 the component is marked unstable"
    open:
      - "A covariance-only decomposition misses links between companies that were not historically correlated; the variance share is then understated for a theme that is spreading, and the search in the propagate box partly compensates."

  - id: context
    name: News embedding space
    lane: s3
    kind: model
    lookahead: model
    absorbs: [newsagent, embedspace]
    inputs:
      - "news sentences, rolling twelve months"
      - "the worry list, versioned"
    outputs:
      - "the embedding space: news clusters, reference points, the assignment distance, and news weight per entry"
    rule: |
      A language model labels 2,000 news sentences once as risk statements or not, with dates and company names redacted, and a classifier trained on those labels marks every sentence in the archive; the sentence itself is the record and its embedding is the encoder's. The encoder is one named public encoder on every date, with a keyword retrieval beside it, so that a theme statistic the keyword run also produces is not an artefact of the encoder. The news risk statements over the rolling twelve-month window are clustered into topics under discussion, at a minimum size of about two headlines a week. The assignment distance is the 90th percentile of a statement's distance to its own cluster's centroid, so that nine in ten members of a dense topic count as within it; it is the one distance the design uses. On the live page each worry-list entry gets a reference point, the centroid of its 50 nearest news statements, and its news weight is the count of statements within the distance.
    comparator: "a keyword rule on the registered term list for the statements, and BM25 retrieval for the assignments; agreement is printed"
    check: "quote gate; precision and recall of the classifier and the keyword rule on hand-labelled news sentences"
    open:
      - "EMPIRICS: the encoder and its published cutoff."

  - id: worrylist
    name: The PM's worry list
    lane: s3
    kind: human
    lookahead: human
    absorbs: [taxonomy, pmworries]
    inputs:
      - "list edits after reading the page"
    outputs:
      - "the worry list, versioned"
    rule: |
      A registered list of about thirty external conditions, for example rates, the memory cycle, tariffs, a regulatory decision, financing, with an 'other' entry. The PM adds or removes entries whenever a worry becomes relevant, and every edit is logged with a date. The list is used on the live page and on the memo-date example, where it is labelled as written with hindsight. In the backtest there is no list: themes are news clusters only, so the backtest measures what the clustering finds unaided. The list's leading entry by news weight, on its own, is the baseline the live theme label is judged against.
    check: "every edit is logged; the 'other' entry is reviewed quarterly"

  - id: extract
    name: Risk statements from filings
    lane: s3
    kind: model
    lookahead: model
    absorbs: [gathertext, riskextract]
    inputs:
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios"
      - "risk-factor sentences per company, dated"
      - "8-K and transcript sentences per company, dated"
    outputs:
      - "risk statements per company, on both runs"
    rule: |
      For every company in a component set above noise, and in each random portfolio's set, the rule gathers the risk-section and event sentences dated before the formation date. A language model labels 2,000 filing sentences once as risk statements or not, with company identity and dates redacted; a risk statement is a condition that would hurt the company. A classifier trained on those labels marks every sentence of every filing in the universe, cached by document, so that the book and the random sets are read by one instrument. The comparator is the keyword rule on the same sentences, and its records are the keyword run. Both are scored on the same hand-labelled sample, split by whether the document predates the labelling model's training cutoff; the gap bounds how much the labels could owe to recall rather than reading.
    comparator: "a keyword rule on the registered term list; its records are the keyword run"
    check: "quote gate; precision and recall on hand-labelled filing sentences, before and after the cutoff, for the classifier and the keyword rule side by side"
    open:
      - "EMPIRICS: the labelling model and its training cutoff date."

  - id: assign
    name: Theme assignment and label
    lane: s3
    kind: model
    lookahead: model
    absorbs: [cluster, namecluster]
    inputs:
      - "risk statements per company, on both runs"
      - "the embedding space: news clusters, reference points, the assignment distance, and news weight per entry"
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios"
    outputs:
      - "the theme per component: its reference point or none, its excess weight by leg, its runner-up, and one quote per company, on both runs"
      - "the theme label, with its quotes and the nearest news cluster"
      - "the named component"
    rule: |
      A company counts toward a theme when one of its risk statements lies within the assignment distance of the theme's reference point and a reversal of the component would cost the book on that company (a winner with a positive loading, or a loser with a negative loading), and it counts once, whatever the length of its filing; the quote kept for it is its nearest statement. The theme's weight is the sum of those companies' absolute loadings, by leg; the placebo weight is the same on the random portfolios' sets; the excess is the difference. The theme is the reference point with the largest excess, provided that excess is larger than random sets reach on 95% of draws; otherwise the component has no theme above placebo, which is what keeps the sort's own axis from being named. The named component is the highest-variance component above noise with a theme. In the backtest the reference points are the news clusters; on the live page the worry-list entries are added. A list entry's label is its name. A residual cluster is labelled by a language model from its 20 central statements, with a keyword label printed beside it, and is marked company-specific when fewer than 25 news statements lie within the distance of its centroid. Everything is computed on both runs, and the two themes are printed together.
    comparator: "the keyword label from the cluster's distinguishing terms, printed beside the model's label; the keyword run's theme beside the model run's"
    check: "placebo weight per entry; month-to-month stability of the assignment; agreement of the theme between the two runs"

  - id: propagate
    name: Search for the theme elsewhere
    lane: s3
    kind: deterministic
    lookahead: model
    absorbs: [propagate]
    inputs:
      - "the theme label, with its quotes and the nearest news cluster"
      - "risk statements per company, on both runs"
      - "the crowded quintiles of the universe"
      - "the embedding space: news clusters, reference points, the assignment distance, and news weight per entry"
    outputs:
      - "companies outside the component set with the theme, each with its quote"
    rule: |
      Once a theme is labelled, the rule searches the rest of the book and the universe's crowded quintiles. A company is marked as having the theme when at least one of its classified risk statements lies within the assignment distance of the theme's reference point, and that statement is the quote kept with the result. There is no cap and no reranking. As a control, the same search is run for the news cluster that led the archive twelve months earlier and is not today's theme; the share of companies it marks is printed as the false-positive rate.
    check: "quote gate; the false-positive rate from the wrong-theme control"

  - id: themescore
    name: Theme statistics
    lane: s3
    kind: deterministic
    lookahead: model
    absorbs: [themescore]
    inputs:
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "the named component"
      - "the two legs and the position weights"
      - "the hedge instrument and its slope"
      - "option premia"
    outputs:
      - "the book's variance share on the named component, with its percentile"
      - "the loss in basis points of book, by leg, if the component returns minus two sigma"
      - "the hedge line"
    rule: |
      Two statistics are printed for the named component. The first is the book's variance share on it, with its percentile against the random portfolios. The second is the loss in basis points of book if the component returns minus two of its ten-day sigmas, by leg: minus two sigma times the sum over the leg's companies of weight times loading. It is net, so companies that gain on a reversal offset those that lose, and the two legs sum to the book's loss. The hedge line hedges that loss. The instrument and its slope on the component come from the decomposition, and the notional is the short position that offsets the book's loading on the component. The line prints the put premium for that notional in bp of book and the share of the component the instrument does not explain. With a loading of 0.5 and an instrument slope of 2, the short is $25m per $100m of book.
    check: "the random-portfolio comparison; a February-against-August check that filing season does not drive the statistics"

  # ---------------------------------------------------------------- 4. crowding
  - id: crowding
    name: Who is positioned on the theme
    lane: s4
    kind: deterministic
    lookahead: model
    absorbs: [poscluster, timebombs]
    inputs:
      - "the positioning score per company, with its lag"
      - "the three components: variance share with percentile, company sets with loadings, ten-day sigma, and which are above noise"
      - "the named component"
      - "companies outside the component set with the theme, each with its quote"
      - "the two legs and the position weights"
      - "daily returns and the point-in-time universe"
    outputs:
      - "the overlap of crowded companies with theme companies, by leg, with its history since 2014"
      - "the pre-catalyst list and the post-unwind list, by leg"
    rule: |
      The theme companies are the component set plus the companies found by the search; the crowded companies are the top quintile of the positioning score within each leg. The overlap is the share of theme companies' book weight that is crowded, by leg, with its history since 2014. Neither positioning input comes from returns, so under no crowding the overlap equals the crowded set's share of the leg's weight, which is above one fifth because large companies have more 13F holders; that null is printed beside the overlap, and the claim that funds are positioned on one theme holds if the median gap since 2014 is above zero. From the crowded theme companies come two lists. The pre-catalyst list holds companies that rose with the component by more than one twenty-day standard deviation, the ones with the most recent gain at risk. The post-unwind list holds companies that have not yet moved after the component has fallen by more than one twenty-day standard deviation; on the loser leg these are the heavily shorted companies that have not yet rallied, and a squeeze state line is printed when the loser leg's 20-day return exceeds its standard deviation with the market up. Neither list is printed until its event study has run.
    check: "the count and weight of each list, with their history"

  # ---------------------------------------------------------------- 5. severity and timing
  - id: tail
    name: The tail model and its baselines
    lane: s5
    kind: deterministic
    lookahead: clean
    absorbs: [severity, baselines]
    inputs:
      - "book returns"
      - "the two legs and the position weights"
      - "earnings and macro calendars"
      - "six reference series and the bear state"
      - "approved catalysts, with dates and types"
    outputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the probability of a return at or below the long-run threshold"
      - "the catalyst-window VaR and its increase"
      - "the three ablation lines"
    rule: |
      A catalyst window is the ten sessions from five before an FOMC decision, or a day on which the companies reporting earnings hold at least a tenth of the book's gross weight; other releases are catalysts on the page but do not open windows, since windows around every release would cover nearly every day. Each day is inside or outside a window, and the count in each state is printed each year. The tail model is the 5% quantile of the book's past ten-day returns, each divided by the book's volatility at the time, taken over past starts in the same state as today and multiplied by today's volatility; the expected shortfall is the mean of the returns at or below that quantile, scaled the same way. There are no fitted parameters. The page prints the number of observations behind each quantile, and the probability that the ten-day return is at or below the long-run threshold, from the same standardised returns. The two baselines are the same quantile with no scaling and no state, and with the state but no scaling, so the ablation is three lines a reader can compute by hand. Text and positioning do not enter the model; whether they sort the breaches is measured in the scoring box. Live, an approved catalyst opens a window like a scheduled one.
    check: "the three ablation lines; breach rate by bear state"

  - id: catalysts
    name: Catalyst proposal, live only
    lane: s5
    kind: model
    lookahead: live-only
    absorbs: [catagent]
    inputs:
      - "the theme label, with its quotes and the nearest news cluster"
      - "items from the last five sessions"
      - "8-K and transcript sentences per company, dated"
    outputs:
      - "proposed catalysts with a date, a source quote and a type, beside the comparator's"
    rule: |
      Scheduled catalysts, the macro releases and the component companies' earnings, come from the calendars with no model. This box proposes the unscheduled ones, such as a foreign supplier's earnings or a regulatory readout. A language model reads the last five sessions' news and event text and proposes each catalyst with a date and a source quote. A model reading past news would propose the catalysts that turned out to matter, so this box runs on live data only and no backtest claim depends on it. The memo-date page carries its actual proposals beside the comparator's, with the approval column empty.
    comparator: "a term-list extractor over the same five sessions, taking dated sentences that name a component company or its listed suppliers and customers; the PM's approval share for each list is printed"
    check: "a date and a quote are required"

  - id: catapprove
    name: PM approves catalysts
    lane: s5
    kind: human
    lookahead: human
    absorbs: [catapprove]
    inputs:
      - "proposed catalysts with a date, a source quote and a type, beside the comparator's"
    outputs:
      - "approved catalysts, with dates and types"
    rule: |
      The PM reviews the proposals weekly, fewer than ten a week, and approves each on its date and relevance rather than on any view of its outcome. The PM's main contribution is adding catalysts the model missed. An approved catalyst opens a window in the tail model. Catalysts not yet approved appear on the page as proposed.
    check: "none"

  - id: analogue
    name: Analogues
    lane: s5
    kind: deterministic
    lookahead: model
    absorbs: [analogue]
    inputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "the book's variance share on the named component, with its percentile"
      - "the overlap of crowded companies with theme companies, by leg, with its history since 2014"
      - "the theme per component: its reference point or none, its excess weight by leg, its runner-up, and one quote per company, on both runs"
      - "the French factor and the reversal record"
      - "six reference series and the bear state"
      - "book returns"
    outputs:
      - "the five nearest past formation dates, what followed over ten days, and whether each is apt"
    rule: |
      A formation date's state is ten numbers: the six exposures, the variance share, the overlap, the trailing ten-day sigma and the bear state. Candidates are every formation date since December 2013, excluding the last year. Each dimension is standardised by its own history, and the five nearest dates by Euclidean distance are printed with what the book did over the following ten days and whether each fell in the reversal record. An analogue is apt when its bear state matches today's and its theme centroid is within the assignment distance of today's. No language model is involved.
    check: "each past date's state is regenerated from inputs public before it"

  # ---------------------------------------------------------------- 6. the page
  - id: trigger
    name: When a page is produced
    lane: s6
    kind: deterministic
    lookahead: model
    absorbs: [eventrule]
    inputs:
      - "approved catalysts, with dates and types"
      - "earnings and macro calendars"
      - "the book's variance share on the named component, with its percentile"
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "book returns"
    outputs:
      - "the page type and its fields, with each field's change since the last page"
      - "page dates and their outcomes"
    rule: |
      A calendar page is produced five sessions before each catalyst, scheduled or approved. A threshold page is produced when the maximum of seven own-history percentiles, the variance share and the six exposures, crosses its own 95th percentile, which happens on about one day a month by construction. Otherwise a weekly summary is produced. A hit is a loss beyond the unconditional 5% quantile after a page; a miss is a page with no such loss; a silence is such a loss with no page. The page dates and their outcomes go to the scoring box, where the hit rate on threshold-page days is tested against the 5% base rate.
    check: "the measured false-page rate"

  - id: page
    name: The page
    lane: s6
    kind: output
    lookahead: model
    absorbs: [thepage, signoff, responselog]
    inputs:
      - "the page type and its fields, with each field's change since the last page"
      - "the theme label, with its quotes and the nearest news cluster"
      - "the theme per component: its reference point or none, its excess weight by leg, its runner-up, and one quote per company, on both runs"
      - "the book's variance share on the named component, with its percentile"
      - "the loss in basis points of book, by leg, if the component returns minus two sigma"
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the probability of a return at or below the long-run threshold"
      - "the catalyst-window VaR and its increase"
      - "the hedge line"
      - "the overlap of crowded companies with theme companies, by leg, with its history since 2014"
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "the positioning score per company, with its lag"
      - "approved catalysts, with dates and types"
      - "the driving series and the leg that holds its exposure"
      - "which statistic is printed first"
      - "the five nearest past formation dates, what followed over ten days, and whether each is apt"
      - "coverage by leg and by layer"
    outputs:
      - "one page, pushed to the reader"
      - "list edits after reading the page"
      - "the hand-labelled sample"
    rule: |
      Every forecast on the page is over ten trading days. The page is a template of nine fixed items rendered from stored outputs; the only free text is the quotes and the theme label, printed beside its keyword label. In order: the theme with its variance share, excess weight and runner-up; the loss in basis points by leg; the VaR and expected shortfall with the observations behind them, the probability of a return at or below the long-run threshold, the catalyst-window VaR, and the hedge line with instrument, notional and premium; the overlap, the bear and squeeze states, and, once their event study has run, the two lists; the catalysts, approved and proposed; the driving-series exposure, first when the bridge R-squared is above 0.5; the five analogues; each field's change since the last page; and a footer with text coverage, one line naming any item not on this page and what it waits on, and a note that the numbers describe the paper 12-1 book, with the reader's beta to it. The conclusion gives the direction of the risk and the sized hedge and leaves the decision with the reader. The PM acknowledges each page, edits the worry list, and approves catalysts; a research analyst labels sentences for the scoring box. Until the PM's positions are an input, the proxy for whether a page changed a decision is the acknowledgement and the two logged actions within five sessions of a page.
    check: "every quote passes the quote gate"
    open:
      - "The example page with numbers, required by the brief, is in the memo."

  # ---------------------------------------------------------------- 7. validation
  - id: scoring
    name: Registered tests
    lane: s7
    kind: deterministic
    lookahead: model
    validation: true
    absorbs: [register, labels, volvalidation, bombtest, themevalidation]
    inputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the catalyst-window VaR and its increase"
      - "the three ablation lines"
      - "book returns"
      - "page dates and their outcomes"
      - "the theme per component: its reference point or none, its excess weight by leg, its runner-up, and one quote per company, on both runs"
      - "risk statements per company, on both runs"
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "daily returns and the point-in-time universe"
      - "the French factor and the reversal record"
      - "the hand-labelled sample"
      - "list edits after reading the page"
    outputs:
      - "coverage and the pinball ratio per ablation line, with intervals"
      - "precision and recall for the classifier and the keyword rule"
      - "each list's excess move over sector-matched companies, per unwind"
      - "the premise share"
    rule: |
      Before each test runs, the author writes its pass threshold, its detection floor and the sentence the memo will hold under each outcome; the register fixes the wording and the thresholds, not the inference, and every v2 result is in-sample. The tail model is scored every formation month from December 2015, about 130 by the memo date: Kupiec's coverage test at that count accepts 3 to 10 breaches, and the ratio of the model's pinball loss to each baseline's is reported with a bootstrap interval, the model beating a baseline only when the interval excludes one. Text is tested as a sort of the breach record by the theme's excess weight, and the register labels it illustrative if fewer than five of the six or seven breaches fall on the high side. The classifier and the keyword rule are scored on hand-labelled sentences, split by the labelling model's cutoff. The two lists are tested on the five recorded unwinds since 2020 against sector-matched companies over ten sessions, with a data-derived margin. The premise, that a theme is visible before a reversal, is measured over the recorded episodes and printed as a share beside the same share on calm months. In production, a quarterly reading measures whether the pipeline surfaces themes before the PM adds them. The only test that has run is v1's severity breach test, 2 in 42 forecasts, from a model with no text.
    check: "the smallest effect each test could detect is found by simulation before it runs, and a null is a finding only if that floor is below the effect of interest"
    open:
      - "EMPIRICS: the simulated floors; the five unwind dates."

