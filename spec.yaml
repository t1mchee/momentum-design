  # ============================================================ page and people
  - id: eventrule
    name: When a page fires
    lane: page
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: thresholds registered
    inputs:
      - "approved catalysts, added catalysts, 10-day 5% VaR and ES"
      - "the catalyst-window conditional VaR"
      - "the ablation ladder, book variance share on the theme with its placebo percentile"
      - "share of book weight by leg carrying the theme in the loss direction, with its placebo"
      - "agreement line, per series, the exposure in hedgeable units, its cross-sectional percentile against random books, and its time-series percentile against the book's own history"
    outputs:
      - "calendar page"
      - "threshold page"
      - "weekly summary"
    rule: |
      Two triggers. Calendar: a page five sessions before each approved catalyst, carrying the catalyst-window VaR and the bump. Threshold: a page when the ten-day VaR, the book's variance share on its first component, or a conferred exposure crosses the 95th time-series percentile of its own history, at most two expected false pages a month on the registered null. Cross-sectional percentiles print as context and never fire. Weekly summary otherwise. Production form: a standing state pushed on change.
    checks:
      - "measured false-page rate"
    on_failure: template with a banner
    open: []
    memo: "§7"

  - id: thepage
    name: The page
    lane: page
    kind: output
    status: settled
    lookahead: none
    mitigation: n/a
    inputs:
      - "the page"
    outputs:
      - "one page"
      - "pushed"
    rule: |
      Horizon for every headline number: ten trading days. Order: (1) the theme, its book variance share and placebo percentile, the agreement line, by leg; (2) the loss in bp if the component set returns minus two sigma, signature carriers included, with direction from the composed sign; (3) the ten-day VaR and ES, and the catalyst-window VaR beside the component set's event-implied move and the sector ETF's implied move as the hedge price; (4) the pre-catalyst and contagion time-bomb lists by leg, with the positioning lag; (5) approved catalysts with dates and types; (6) the driving-series line in hedgeable units; (7) what the usual screens show; (8) the analogues; (9) what changed since the last page; (10) coverage by layer and the beta mapping: this is the paper 12-1 book, and the reader maps through his own beta. The takeaway is stated as the direction and the hedge, never as 'get out'. Every number links to a stored output; every theme to its quotes; prose over fixed fields with the numeral gate.
    checks:
      - "numeral gate"
      - "every quote string-matched"
    on_failure: template with a banner
    open: []
    memo: "§6"

  - id: falsifiers
    name: Falsifiers and the hit-and-miss log
    lane: page
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: n/a
    inputs:
      - "calendar page"
      - "threshold page"
      - "weekly summary, book returns"
    outputs:
      - "hit-and-miss log"
    rule: |
      Every page now has a date: calendar pages resolve at the catalyst, threshold pages at the ten-day horizon. A hit is a realised loss beyond the conditional VaR; a miss is a page with no such loss; a silence is a loss with no page. All three are counted and printed monthly.
    checks: []
    on_failure: n/a
    open: []
    memo: "§3, §7"

  - id: signoff
