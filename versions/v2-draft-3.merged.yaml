- id: propagate
  name: Scan the rest of the universe for the theme
  lane: propagate
  kind: model
  status: settled
  inputs:
  - theme name per cluster
  - with its supporting quotes
  - risk-factor and outlook text per name
  - dated at acceptance
  outputs:
  - theme signature per name outside the component set
  - with quote and score
  rule: Once a theme is named, an agent scans every name outside the component set, first the rest of the book and
    then the rest of the universe, for text relevant to the theme. Each name gets a relevance score from 0 to 3
    with a verbatim quote; a score of 2 or more carries the signature. This is where the theme is found on names
    the covariance could not have linked to it.
  checks:
  - quote gate; signature rate on a random theme name as the placebo
  on_failure: name marked unscanned
  open: []
  memo: §3 step 4
  v1: new
- id: themescore
  name: Theme significance score
  lane: propagate
  kind: deterministic
  status: settled
  inputs:
  - variance explained per component
  - clusters of quotes with loading-weighted
  - time-decayed mass
  - by sign
  - theme signature per name outside the component set
  - with quote and score
  outputs:
  - significance score per theme
  - ranked
  - by leg
  rule: 'Score = variance explained by the component × the theme''s share of the component''s loading-weighted text
    mass × (1 + the share of the book''s weight outside the component that carries the signature). Reported by leg
    and by sign. Recomputed monthly at rebalance, with the news space refreshed weekly. Learning loop: every PM
    edit is logged as a labelled event, and once a quarter the share of PM-added themes the system had already surfaced
    is measured.

    '
  checks:
  - comparator is the PM typing the themes by hand each week; the quarterly overlap measure
  on_failure: n/a
  open:
  - 'Join: the v1 Route 1 detector read condition concentration from the old text stage. Does it now read the theme
    score by leg, or is Route 1 retired in favour of the theme score directly?'
  memo: §3 step 5, §6
  v1: condmeasures
