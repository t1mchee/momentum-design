# System design v2, draft 7. Standalone (no base file). Applies docs/design/fixes-for-draft7.md in full:
# the seven joints (one theme per component, the ablation on two text series, book effect split into
# two signs, a closed proof-of-concept path, random-portfolio statistics computed by their own nodes, the
# bear state and the page items given producers), the contradictions between nodes, the missing
# definitions, and the writing pass. Retired components stay, with no edges.
#
# Fields per node: id, name, lane, kind (data | deterministic | model | human | output), status (settled |
# retired), origin (v1 | v2), lookahead (clean | as-of | model | live-only | human), mitigation, access
# (data nodes: public | mixed), inputs, outputs, rule, checks, on_failure, open, validation (true on the
# components that score other components).
# Fields per edge: from, to, carries, when (daily | weekly | monthly | at rebalance | on change | on event |
# on release | quarterly | once), mode (backtest and live | live only | backtest only), feedback, hidden.

meta:
  title: Momentum reversal-risk system, v2 draft 7
  version: v2-draft-7
  updated: "2026-09-06"
  problem:
    exposure: "the 12-1 momentum book: the top and bottom deciles of the Russell 3000 by return from twelve months before to one month before, value-weighted within each leg, dollar-neutral, rebuilt monthly"
    event: "a ten-day book return at or below -432bp, the 5th percentile of the French factor's ten-day returns from 1926 to 2022; the tail model targets the rolling 5% quantile of the same return, of which -432bp is the long-run value"
    horizon: "ten trading days, for every number on the page"
    user: "the PM running momentum, or the risk manager covering that book"
    decision: "whether and how much to hedge the book's exposure to the named theme before the next catalyst, and which names to trim; the page gives the direction of the risk and the hedge and leaves the decision with the reader"
  note: >
    The design assumes that the theme behind a reversal is known before the reversal happens: it has been
    building in the news for some time, and the PM can name it. The system's job is to measure how much of
    the book depends on that theme, where it has spread, who is positioned on it, and how much worse the
    book's tail becomes around the next catalyst. It names the theme from the worry list where an entry
    fits and from the residual clusters where none does; it cannot name a theme that is absent from the
    news. This is the known-theme assumption. The assumption fails when the reversal comes from a theme that
    nobody had named and that had not appeared in the news. On such a day the page shows no theme, or the
    wrong one, and the tail model reports its step-0 form, which uses prices and the calendar only. This case
    is common in the reversal record: 77 of the 86 episodes that v1's rules could not classify were
    loser-leg losses in a rising market with no prior bear state.
  legend:
    status: "settled = decided in v2; retired = replaced by v2, kept with the reason."
    origin: "v1 = a component carried over from the first design, rewritten here only in language; v2 = new."
    kind: "data = a feed (grey pill); deterministic = a rule with no model (white box, blue band); model = a language-model step (orange); human = a person's task (tan hexagon); output = the page (green double border)."
    lane: "a rendering row in the full view; the seven numbered steps in the levels view are the reading order."
    lookahead: >
      clean = uses only values that were public on the date; as-of = the values exist historically but must be
      taken at their release date; model = a model trained after the date reads text from inside it, and the
      mitigation says how that is bounded; live-only = no mitigation exists and the node is excluded from
      every backtest; human = a person's input that a backtest must run without.
    access: "public = every feed the node uses is public; mixed = public feeds now, with licensed or desk-only feeds in production, each labelled in the rule."
    direction: "every stated caveat says which way it biases the page, in a sentence that begins with the bias."
    edges: "carries = what passes along the edge; when = its cadence; mode = whether it exists in the backtest, live, or both; feedback = an edge that runs against the reading order."
    row: "a row of the pre-registration register (Appendix C of the memo)."
    quote gate: "every span a model extracts must appear verbatim in its source document, or the record is dropped and counted."
    comparator: "a method that does the same job as a model step without a language model, printed beside it, so the model's contribution is visible."
    seal: "a block of dates held back from all design work and opened once for a confirmatory test; the 2023-onward seal was opened in v1, so no unopened seal exists today."
    design tier: "a result measured on dates that were used to build the design; it is reported as in-sample and does not count as confirmatory."
    validation: "a component that scores another component and feeds nothing to the page; marked with its own shape on the canvas."
  proof_of_concept:
    hours: "about twenty for the whole project. The path below is the part of the design that runs today on public, as-of data."
    status: "planned; as of the memo date no v2 component has run"
    path: [prices, refseries, french, sort, random, covariance, pca, bridge, filings, news, newsagent, taxonomy, embedspace, pc1text, riskextract, cluster, namecluster, propagate, themescore, garch, eventbaseline, severity, register, volvalidation]
    path_notes:
      newsagent: "keyword comparator only; the language model is not run on news in the proof of concept"
      taxonomy: "the initial list, written on the memo date and labelled as such"
      propagate: "retrieval only, over the rest of the book; the positioning scope and the language-model reranking are deferred"
      severity: "steps 0 to 2b; the positioning overlap (step 3) and the PM's approved catalysts are deferred or live-only"
      volvalidation: "the implied-move comparison is marked illustrative, since the options history is deferred"
      register: "the rows for the tail-model scoring only"
    produces: "the tail-model scoring, steps 0 to 2b, with the keyword-versus-model ablation as the one registered test, on the full sample from December 2013; the result is design tier"
    deferred: [posdata, poscluster, timebombs, bombtest, options, catagent, catapprove, analogue, composer, sensitivities, zscore, route2, controls, labels]
    described_only: [pmworries, eventrule, thepage, signoff, responselog, themevalidation]

lanes:
  - {id: data, name: Data in}
  - {id: book, name: The book and its nulls}
  - {id: exposure, name: Exposure}
  - {id: decomp, name: Decomposition}
  - {id: context, name: Context space}
  - {id: naming, name: Naming}
  - {id: propagate, name: Propagation}
  - {id: positioning, name: Positioning}
  - {id: tail, name: Tail model}
  - {id: catalysts, name: Catalysts}
  - {id: analogue, name: Analogues}
  - {id: page, name: The page and the people}
  - {id: research, name: Validation}
  - {id: retired, name: Retired}

nodes:
  # ============================================================ data in
  - id: prices
    name: Market data and calendars
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: index membership is taken at the effective date of each change, which follows the announcement; earnings dates are projected from the prior year; macro calendars are published in advance
    access: public
    inputs: []
    outputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
      - "sector codes"
      - "earnings dates per name"
      - "scheduled macro releases"
    rule: |
      The universe is the constituent list of the Russell 3000 ETF, taken from the fund's archived daily holdings at the effective date of each change (PUBLIC); the announcement precedes the effective date, so the backtest is late, not early. Daily prices are adjusted for corporate actions (PUBLIC, Stooq or Tiingo; CRSP in production, LICENSED). Sector codes come from EDGAR SIC codes (PUBLIC); GICS in production (LICENSED). Stooq and Tiingo carry no delisting returns, so a name delisted for performance leaves the book at a return of -30%, following Shumway, and any other delisted name at its last trade; no name is carried forward at a zero return. In the backtest a name's next earnings date is projected as the date of its 8-K Item 2.02 one year earlier, moved to the same weekday; companies report on a stable annual cycle and the error is a few days. The realised date is used only to score the page. Live, company calendars give the date (PUBLIC). Scheduled macro releases (FOMC, CPI, payrolls, index rebalances) come from the published calendars (PUBLIC).
    checks:
      - "monthly correlation of the reconstructed book with the French factor, reported"
      - "the projected earnings date against the realised date, reported as a distribution of errors in days"
    on_failure: if a day's price or holdings file is missing, the previous day's state is held, with a note on the page
    open: []

  - id: refseries
    name: Six reference series and the bear state
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: none of the six is revised; a revised series, if ever added, is taken from ALFRED first prints
    access: public
    inputs: []
    outputs:
      - "six daily series"
      - "the bear state"
    rule: |
      The six series, with units: the S&P 500 return; the change in the ten-year Treasury yield in basis points; the front-month WTI return; the return of the Fed's broad dollar index (FRED); the change in the ICE BofA US corporate option-adjusted spread in basis points (FRED); and the return of the ten largest Russell 3000 names minus the return of the equal-weighted Russell 3000, constructed from holdings. The list is fixed. Its six percentiles are one family: a series is called unusual only above the 99.2nd percentile of its own history, which is the 95th adjusted for six series. Adding a series requires re-registering the family. The bear state, after Daniel and Moskowitz, is an indicator that the trailing 24-month S&P 500 return is negative, printed with the trailing 126-day market variance. The two cross-asset principal components of v1 are retired because a reader could not tell from the page what a move in them meant.
    checks:
      - "the family adjustment is applied to every percentile printed for the six"
    on_failure: the series is left off the page, with a note naming it
    open: []

  - id: filings
    name: Company text, in layers
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: clean
    mitigation: every document is dated at acceptance or receipt, and every extracted span must pass the quote gate
    access: mixed
    inputs: []
    outputs:
      - "risk-factor and MD&A text per name, dated"
      - "intra-quarter event text per name, dated"
      - "coverage per name, by leg and by layer"
    rule: |
      There are three layers of text, and each feed is labelled by access. The context layer is the latest 10-K accepted before the formation date plus the latest 10-Q's Part II Item 1A where it is newer; Item 1A and the Overview subsection of Item 7, where present, are cut by regex on the standard headers (PUBLIC, EDGAR). The event stream is 8-K Items 2.02, 7.01 and 8.01 with exhibits (PUBLIC, EDGAR) and earnings-call transcripts (PUBLIC for a subset through free feeds; LICENSED for full coverage). The production layer is equity research (LICENSED, not available to us now) and dealer colour and prime-broker notes (DESK-ONLY, not available to us now); in production it feeds the same two steps as the context layer, text gathering and propagation. Every extracted span must appear verbatim in its source before it is stored (the quote gate). Coverage per name, by leg and by layer, is an output and is printed in the page footer.
    checks:
      - "coverage per name, by leg and by layer, printed"
      - "quote gate"
    on_failure: the name is marked unread on that layer, and the coverage line shows it
    open:
      - "EMPIRICS: the free transcript feeds and the share of names they cover."

  - id: news
    name: News, slow and fast
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: for each backtest date the embedding space is rebuilt from the archive as it stood on that date
    access: mixed
    inputs: []
    outputs:
      - "headlines and release text, timestamped, rolling twelve months"
      - "items from the last five sessions"
    rule: |
      News is used in two ways. A slow pass over a rolling twelve-month archive, rebuilt weekly, supplies the embedding space in which themes are located. A fast pass over the last five sessions supplies the step that proposes catalysts each day. Feeds: GDELT headlines and URLs (PUBLIC), Fed, Treasury and BLS release pages (PUBLIC), SEC press-release exhibits (PUBLIC), Bloomberg and Reuters headlines (LICENSED, not available to us now). GDELT carries no article text, so risk statements are under-counted and more themes are flagged company-specific than a full-text feed would flag. Every item is timestamped at publication. Before GDELT's first usable date the space is built from filings text alone, and the page says so.
    checks:
      - "the source list is versioned"
      - "for a backtest date, only items published before that date enter the rebuild"
    on_failure: the previous week's embedding space is reused and marked stale on the page
    open:
      - "EMPIRICS: GDELT's first usable date for headline text."

  - id: posdata
    name: Positioning feeds and score
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: every source is keyed to its release date, never to settlement or period end; the longest input lag is printed with the score
    access: mixed
    inputs: []
    outputs:
      - "positioning score per name, with the longest input lag"
      - "short interest per name"
    rule: |
      Each name in the book gets a positioning score from two inputs, each converted to a rank within the name's leg. The first is comomentum: the name's average correlation with the other names in its leg over the trailing 126 trading days, on returns residual to the market and the six series (PUBLIC, from returns). The second is 13F crowding: the number of momentum-style filers holding the name, where a momentum-style filer is one whose holdings, value-weighted, have an average 12-1 rank in the universe's top decile as of the filing quarter (PUBLIC, 45-day lag). The score is the mean of the two ranks. Heavily positioned means the top quintile of the score within each leg of the book. For names outside the book the same two inputs are ranked within the universe, and the universe's top quintile by that score is the second search scope for propagation. On the loser leg 13F crowding counts long holders, so it measures long crowding in a short; short interest (PUBLIC, two-week lag) is the short-side measure and is printed beside the score without entering it. Because of the 45-day lag, the score understates crowding while it is building and overstates it after the unwind has begun, so both vulnerable-name lists lag: names join them late and leave them late. Production feeds, each printed as a separate line when present: securities-lending utilisation (LICENSED), options open interest (PUBLIC, delayed), ETF flows (PUBLIC), prime-broker aggregate colour and per-name positioning (DESK-ONLY, not available to us now). Because the inputs arrive with different lags, the longest of those lags is shown next to the score wherever the score appears.
    checks:
      - "longest input lag printed"
    on_failure: the score and the two lists of vulnerable names are omitted, with a note on the page
    open:
      - "EMPIRICS: the number of momentum-style filers the definition yields."

  - id: options
    name: Event-implied moves
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: historical implied moves are taken from surfaces as they stood on the date; where no history exists the comparison is marked illustrative
    access: mixed
    inputs: []
    outputs:
      - "per component name: implied earnings move, in per cent"
      - "the component set's implied ten-day move, loading-weighted, in per cent"
      - "sector ETF implied move, in per cent"
    rule: |
      The comparison for the catalyst-window increase in VaR is the component set's implied ten-day move. Each component name's implied earnings move (LICENSED for history through OptionMetrics; PUBLIC delayed data for the live date) is a one-day move; it is restated over ten days by adding the name's implied variance over the other nine days, as the square root of the earnings move squared plus nine times the 30-day implied variance per day. The set's move is the loading-weighted mean over the named component's set. The implied ten-day move of the sector ETF that holds the largest share of the component set's weight is printed beside it as the implied move of the hedge instrument (PUBLIC, delayed). The comparison is for the component names only; there is no book-level implied volatility. Where the history is missing, the comparison and the hedge line are left off the page. The VaR itself is unchanged, so nothing is biased.
    checks: []
    on_failure: the comparison is marked illustrative
    open: []

  - id: french
    name: French factor file and the reversal record
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: thresholds were frozen on the 1926 to 2022 sample before any test ran
    access: public
    inputs: []
    outputs:
      - "daily WML from 1926"
      - "the reversal record, 195 episodes since 1926"
    rule: |
      The file provides daily WML, French's winners-minus-losers momentum factor, from 1926: a long history and a check that the reconstruction matches a published series. French's construction (a 2x3 value-weighted sort) differs from ours, so we measure the agreement rather than assume it. Two thresholds come from the file and were frozen in advance: a reversal is a ten-day return at or below -432bp, the 5th percentile of overlapping ten-day factor returns from 1926 to 2022; a crash day is a daily return at or below -933bp, the 1st percentile of daily factor returns over the same dates. The reversal record is every episode that breached the ten-day threshold, with breach days within 21 trading days collapsed to one episode: 195 episodes since 1926, on the French file before December 2013 and on the reconstructed book after it. The record feeds the analogue search and the event study.
    checks:
      - "the monthly correlation between the reconstructed book and the French factor is reported"
    on_failure: n/a
    open:
      - "EMPIRICS: the correlation statistic, and confirmation that the crash-day threshold is defined on daily returns."

  # ============================================================ the book and its nulls
  - id: sort
    name: 12-1 sort, the book
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: the ranking window closes at formation
    inputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
    outputs:
      - "winner leg and loser leg"
      - "position weights"
      - "leg sizes and cap profile"
      - "book returns"
    rule: |
      On each formation date, the last trading day of the month, the rule ranks every name on its return from twelve months before to one month before, skipping the latest month; the top decile is held long and the bottom decile short. Within each leg names are value-weighted, the legs are dollar-neutral, and the book return is the winner return minus the loser return. Formation and rebalance coincide; the book is rebuilt monthly and measured daily. The position-weight vector w, positive for winners and negative for losers, is the input to every book-level statistic. The page prints value-weighted numbers, because mega-cap concentration is the theme most often under watch; equal-weighted versions are computed and kept in the appendix. The decomposition runs on both legs together, and every statistic is also reported for each leg separately.
    checks:
      - "leg sizes and the cap profile are logged"
    on_failure: the previous month's book is used, with a note at the top of the page
    open: []

  - id: random
    name: Random portfolios, the null
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: drawn on the same date from the point-in-time universe
    inputs:
      - "point-in-time universe, about 300 names per leg"
      - "leg sizes and cap profile"
      - "sector codes"
    outputs:
      - "N random portfolios per date, cap-matched"
      - "N random portfolios per date, cap-and-sector-matched"
    rule: |
      For each date we draw N random portfolios from the same universe with the same leg sizes and capitalisation deciles, so that the only difference from the book is that they were not ranked on past returns. N is 200 for every statistic printed in v2; v1 used 500 in the register and 120 for the cross-sort comparison, and those runs are labelled with their N. The first-drawn leg of each random portfolio plays the winner leg, so its spread is signed the same way as the book's and every percentile is one-sided. The cap-matched set is the main null for the exposure statistics. A second set also matched on sector is the main null for the text statistics, because a macro bet is usually expressed through a sector tilt, and is printed beside the first for the exposures. This node outputs portfolios only. Every statistic the design prints for the book is computed on each random portfolio by the node that computes it for the book, and the book's percentile among the random portfolios is what the page shows.
    checks:
      - "the construction parameters are hashed and stored with each run"
    on_failure: n/a
    open: []

  - id: controls
    name: Control sorts
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: same windows as the book
    inputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
    outputs:
      - "the cross-sort comparison, for the appendix"
      - "the book ranked 24 months earlier"
      - "the random-ranking control's spread per series"
    rule: |
      There are three controls. Two other return sorts on the same date, 6-1 and 24-13, test whether an exposure is specific to the 12-1 rule or generic to sorting on past returns; in v1 the 12-1 sort had the largest absolute exposure to the driving series of the three on 42.6% of 108 dates, against the 33% expected by chance. That comparison is kept in the appendix. The 12-1 book formed 24 months ago and held to today controls for persistent name characteristics. A sort on random rankings should show no exposure: its spread per series must lie inside the middle 90% of the random portfolios' spreads that day, and if it does not, the random-portfolio percentiles are withdrawn from the page for the day.
    checks:
      - "the random-ranking control sits inside its 90% range"
    on_failure: the random-portfolio percentiles are withdrawn for the day
    open:
      - "EMPIRICS: confirm that 42.6% is the driving-series statistic, and why 108 dates for the cross-sort comparison against 137 for the exposure test."

  # ============================================================ exposure
  - id: sensitivities
    name: Sensitivities, conferred and carried
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: rolling windows close before formation
    inputs:
      - "winner leg and loser leg"
      - "six daily series"
      - "the book ranked 24 months earlier"
      - "N random portfolios per date, cap-matched"
    outputs:
      - "conferred and carried spread per series"
      - "the same spreads on each random portfolio"
    rule: |
      For each name and each of the six series we fit a rolling slope over the trailing 126 trading days, one series at a time. The market series uses the raw slope; series two to six use market-residualised returns, with the raw slope kept in the appendix. Each leg's slope is value-weighted, and the winner-minus-loser spread of those slopes is measured twice: over the 126-day window ending at formation (the conferred exposure, because the ranking selected it) and over the window ending at the next formation, on the same names (the carried exposure). If an exposure is conferred but not carried, the ranking selected it and the book lost it during the holding period. The same spreads are computed on each random portfolio and on the book ranked 24 months earlier, which is printed beside the book's as the control for persistent name characteristics.
    checks:
      - "sign stability across weighting, rebalance date, universe and window is reported in the appendix"
    on_failure: the series is left off the page
    open: []

  - id: zscore
    name: Exposure in hedgeable units, with two percentiles
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: random portfolios are drawn on the same date; the history starts in December 2013
    inputs:
      - "conferred and carried spread per series"
      - "the same spreads on each random portfolio"
      - "the random-ranking control's spread per series"
    outputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the driving series"
    rule: |
      For each series the conferred spread is printed in units a desk can hedge: the slope times the book's NAV is the notional of that series the book is exposed to. For the ten-year it is stated as DV01-equivalent dollars per $100m of book, where DV01 is the dollar change in value for a one basis point move in yield; for the index and the mega-cap series as a beta; for WTI, the dollar and the credit spread as notional dollars of the series per $100m of book. The carried spread is printed beside it in the same units. Two percentiles are printed beside each. The first, against the random portfolios, shows whether the sort produced the exposure. The second, against the book's own history from December 2013 and printed only once 24 months of history exist, shows whether today is unusual; only this second percentile can trigger a page. The driving series is the one of the six on which the book's exposure has the highest time-series percentile that month; it is re-chosen at each rebalance and printed by name. The v1 test of the family maximum against random portfolios is not used. The node keeps its v1 id; it computes percentiles, not z-scores.
    checks:
      - "v1 claim 1 (market beta above the 95th random-portfolio percentile on 105 of 137 month-ends) is reproduced as a check that the measurement still works; it is not reported as a result"
    on_failure: n/a
    open: []

  - id: route2
    name: Driving-series exposure
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: n/a
    inputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the driving series"
    outputs:
      - "the driving-series exposure of the leg that holds more of it, in hedgeable units, with the names inside the leg that contribute most"
    rule: |
      Of the v1 detectors this is the one a desk would use, so it is kept, as a statistic rather than a route (a route was one of v1's three detector categories). It reports the exposure to the driving series of the leg that holds the larger share of it, named on the page, in hedgeable units with its two percentiles, and the names inside that leg that contribute most, where a name's contribution is its weight times its slope.
    checks: []
    on_failure: n/a
    open: []

  # ============================================================ decomposition
  - id: covariance
    name: Covariance of the book's names
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: the window closes at formation
    inputs:
      - "daily returns per name"
      - "winner leg and loser leg"
      - "N random portfolios per date, cap-and-sector-matched"
    outputs:
      - "shrunk covariance matrix over the book's names"
      - "shrunk covariance matrix over each random portfolio's names"
    rule: |
      We take daily returns over the trailing 126 trading days ending at formation, regress each name's return on the market and keep the residual, and estimate the covariance with Ledoit-Wolf shrinkage, because about 600 names against 126 days would otherwise give a rank-deficient matrix. Sector returns are not removed, because a theme is often expressed through a sector and removing it would hide, for example, a memory-chip theme inside the semiconductor sector. The same matrix is estimated for each random portfolio.
    checks:
      - "the condition number is printed"
    on_failure: the decomposition is not run this period, with a note on the page
    open:
      - "Parked: a covariance-only decomposition misses links between names that were not historically correlated. The bias runs one way: when a new link has formed, the component set is too small and the variance share is understated, so the page understates a theme that is spreading. The propagation step partly compensates by searching other names for the theme."

  - id: pca
    name: Components, book variance share, and sign
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: pure arithmetic on the point-in-time book, no estimation
    inputs:
      - "shrunk covariance matrix over the book's names"
      - "shrunk covariance matrix over each random portfolio's names"
      - "position weights"
    outputs:
      - "components above the noise threshold, at most three"
      - "per component: the book's variance share and its percentile against random portfolios"
      - "per component: the component set with each name's loading sign"
      - "per component: the case flag"
      - "per component: its daily return and ten-day sigma"
      - "the named component"
      - "price-correlated names"
      - "per random portfolio: its component set with loadings"
    rule: |
      We take the eigen-decomposition of the shrunk covariance and keep components whose eigenvalue exceeds the noise threshold, at most three. The threshold is the Marchenko-Pastur upper edge computed on the raw correlation matrix with q equal to the number of names over the number of days; components of the shrunk matrix whose eigenvalue exceeds it are kept. If no component passes, the page says that no co-movement rises above noise and naming does not run. For component k the statistic is the book's variance share, lambda_k (w'v_k)^2 / (w'Sigma w), which is the share of the position-weighted book's variance due to the component, as distinct from the share of name-level variance. It is printed with its percentile against the same statistic on the random portfolios, each decomposed the same way. The component's sign is that of w'v_k, so that its position-weighted return is positive and a reversal is a negative component return. The component set is the top quartile of names by absolute loading, each keeping the sign of its loading. For the case flag we compute each leg's mean loading, weighted by absolute position weight, and compare it with the root-mean-square loading. If the two leg means have opposite signs and each exceeds half the root-mean-square loading, the component is the momentum factor itself and enters the tail model as a state indicator; otherwise it is a theme. A theme the sort has fully aligned with, where the winners are its beneficiaries and the losers its victims, has the same loading pattern as the factor and is treated as the factor. The flag decides only how the component enters the tail model; naming still runs on it, and its name is printed as a diagnostic. The named component is the highest-variance component flagged as a theme, or the first component if all are flagged factor. Price-correlated names are names outside the component set whose 126-day correlation with the component exceeds the lowest correlation among the set's names; the share of book weight in them is a regressor in the tail model. As a diagnostic, each leg is decomposed separately and its first component printed beside the joint one. Each random portfolio's component set and loadings are kept for the text placebo.
    checks:
      - "the Jaccard overlap of the component set with the previous month's set is printed; below 0.5 the component is flagged unstable"
      - "percentile against random portfolios"
    on_failure: naming is not run, with a note on the page
    open: []

  - id: bridge
    name: Component against the six series
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: same window as the decomposition
    inputs:
      - "per component: its daily return and ten-day sigma"
      - "the named component"
      - "six daily series"
    outputs:
      - "R-squared and loadings of each component's return on the six series"
      - "which statistic is printed first"
    rule: |
      We regress each component's daily return on the six reference series over the same window. If the named component's R-squared is high, a named macro series (rates, oil) already explains the component and the text step can only confirm it. If it is low, only the text step can supply a name. When the named component's R-squared is above 0.5, the page opens with the driving-series exposure and prints the theme name as confirmation; below 0.5 it opens with the theme. The same regression on each random portfolio's named component gives the reference distribution of R-squared.
    checks:
      - "the reference distribution of R-squared from the random portfolios"
    on_failure: the theme is printed first by default
    open: []

  # ============================================================ context space
  - id: newsagent
    name: News risk-statement extraction
    lane: context
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: dates and entity names are redacted from the prompt; the model labels a sample once and a classifier on the pre-date encoder labels the rest
    inputs:
      - "headlines and release text, timestamped, rolling twelve months"
    outputs:
      - "risk statements from news, dated, each with a verbatim span and a short paraphrase"
    rule: |
      A small language model reads each item with dates and entity names redacted and extracts statements of macro risk that could materialise within a year, returning the verbatim span and a short paraphrase for embedding; the pipeline attaches the item's date. For example, the headline "Chipmakers warn tariff ruling could hit margins" gives the span "tariff ruling could hit margins". Its comparator is a keyword extractor using the registered term list, a list of risk terms and modal phrases ("could", "may", "exposed to", "depends on") kept in the register and separate from the worry list; applied to each sentence, it marks the sentence as a risk statement and takes the sentence itself as the paraphrase. The model and the comparator both run on every item and are scored on the same monthly audit sample. The comparator's statements are kept as a second series so that every downstream statistic can be recomputed on them. The model reads directly a sample of 2,000 items, stratified by year, labelled once; a classifier trained on those labels, using the encoder trained only on pre-date text, labels each remaining sentence as a risk statement or not, and the paraphrase is taken from the nearest labelled example. The paraphrase is only used for embedding, so a near neighbour's paraphrase serves.
    checks:
      - "quote gate"
      - "the monthly audit sample includes 30 news records; the model and the keyword comparator are scored on it side by side"
    on_failure: the keyword comparator's statements are used, with a note on the page
    open: []

  - id: taxonomy
    name: Registered worry list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: the list is frozen before each run; backtests before the list existed use the initial list, labelled human look-ahead, and are also run once with no list
    inputs:
      - "PM edits"
    outputs:
      - "about thirty external conditions with an 'other' entry, versioned"
    rule: |
      A registered list of about thirty external conditions, for example rates, the memory cycle, tariffs, a regulatory decision, financing, with an 'other' entry. It is versioned and reviewed quarterly from what accumulates under 'other'. The PM edits it whenever a new worry becomes relevant, and every edit is logged with a date. For dates before the list existed, backtests use the initial list written on the memo date; that list was written knowing 2014 to 2026 and is labelled human look-ahead, and the run with no list is the control for it. On the known-theme assumption, the entry with the most news weight (the number of news risk statements within the assignment distance of the entry's reference point) is usually the current theme, so the list on its own is the baseline the theme pipeline is judged against.
    checks:
      - "every edit is logged"
      - "quarterly review of the 'other' entry"
    on_failure: the previous version is used
    open: []

  - id: embedspace
    name: Embedding space with a date cutoff
    lane: context
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: the encoder's training cutoff precedes each backtest date; a BM25 keyword retrieval runs beside it as the comparator
    inputs:
      - "risk statements from news, dated, each with a verbatim span and a short paraphrase"
      - "about thirty external conditions with an 'other' entry, versioned"
    outputs:
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
      - "news weight per entry"
    rule: |
      The encoder is a masked language model with one version per calendar year, each trained only on text before that year, mean-pooled over tokens to give sentence vectors and fine-tuned for sentence similarity on pre-cutoff text; the current model is used for the live date. The bias runs one way: the current model has learnt associations the historical encoders had not, so on the live date it assigns more quotes to entries than the backtest did, and the live theme statistics are higher than the backtest would have shown for the same text. The news paraphrases over the rolling window are embedded and clustered with HDBSCAN at a minimum cluster size of 25, so that each dense cluster is a macro topic under discussion; each cluster is labelled with its top keywords. Each list entry gets a reference point: the entry's phrase embedding seeds a search for its 50 nearest news statements, and their centroid replaces it, because a three-word phrase and a forty-word sentence do not embed on the same scale. The assignment distance is the 90th percentile of member-to-centroid distance across the news clusters. News weight per entry is the number of news statements within the assignment distance of its reference point. The space is rebuilt weekly and every quote in the window is re-assigned at each rebuild. An entry with no news within the distance is printed as having no news weight. The whole procedure is run once more with no list, and if the largest cluster by quote weight differs from the leading entry, both are printed. The comparator is BM25 retrieval: each entry's phrase plus its top 20 c-TF-IDF terms as the query, over the paraphrases; agreement is the share of quotes both methods assign to the same entry.
    checks:
      - "news weight per entry is printed"
      - "the share of quotes beyond the distance from every entry is printed"
      - "agreement with the BM25 comparator is printed"
    on_failure: quotes are clustered without list reference points, with a note on the page
    open:
      - "EMPIRICS: the encoder family and its yearly cutoffs."

  - id: pmworries
    name: PM edits the list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: edits are logged; backtests run without them
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "PM edits"
    rule: |
      The PM adds or removes list entries whenever a worry becomes relevant, usually after reading a page. Every entry, PM-added or not, is placed in the embedding space the same way. Every edit is a dated event. The baseline against which the whole theme pipeline is judged is the list's leading entry by news weight on its own, with no language model.
    checks:
      - "the edit log"
    on_failure: the pipeline runs on news clusters alone
    open: []

  # ============================================================ naming
  - id: pc1text
    name: Gather the component names' text
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: documents are dated
    inputs:
      - "per component: the component set with each name's loading sign"
      - "per component: the case flag"
      - "per random portfolio: its component set with loadings"
      - "risk-factor and MD&A text per name, dated"
      - "intra-quarter event text per name, dated"
    outputs:
      - "text per component name, with its loading"
      - "text per random-set name, with its loading"
    rule: |
      For every name in a component set, and for every name in each random portfolio's component set, we gather all context-layer and event-stream passages, where a passage is a paragraph. At clustering, each quote from a name is weighted by the absolute value of that name's loading on the component. The node keeps its v1 id; naming may run on the second or third component.
    checks:
      - "coverage of the component set, by leg and by layer, is printed"
    on_failure: the theme is named on the names that have text, and the coverage line shows the gap
    open: []

  - id: riskextract
    name: Risk-statement extraction from filings
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: company name and date are redacted from the prompt; error is measured separately before and after the model's training cutoff, and the gap bounds recall from training; only post-cutoff months support a predictive claim
    inputs:
      - "text per component name, with its loading"
      - "text per random-set name, with its loading"
      - "precision and recall by leg, era and cutoff side"
    outputs:
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
      - "the keyword series: the same records from the keyword extractor"
    rule: |
      A small language model reads one section per call, split at paragraph boundaries above 6,000 tokens, with the company name, ticker and dates redacted, and extracts up to three risks that could cause a drawdown within a year, ranked by the model's judgement of severity. For each it returns a verbatim span, a short paraphrase for embedding, and a sign: whether the company loses or gains if the risk materialises. Item 1A statements are losses by construction; the sign does work in MD&A and event text, where a company may state that it benefits, for example from higher rates. Any span that does not appear verbatim in the source is rejected and counted. The model reads the book's component-set documents directly. Documents outside the component set, which includes the random portfolios' sets and the propagation scope, are labelled by a classifier distilled from the model's labels on the pre-date encoder, in the backtest and in production alike; every filing in the universe is extracted once and cached. Its comparator is a keyword extractor: the registered term list applied to each sentence of the same passages, scoring each sentence by its count of matched terms, taking the three highest-scoring sentences as the risks, the sentence as the paraphrase, and a loss sign by default. Both run on every document and are scored on the same hand-labelled sample. The comparator's records are the keyword series, and every text statistic downstream is computed on both series. Extraction error is measured on the monthly hand-labelled sample, split by leg, by era (December 2013 to 2019, 2020 to 2022, 2023 onward) and by whether the document is dated before or after the model's training cutoff; recall is measured on thirty whole documents a quarter, labelled in full. When the model version changes, every series this step feeds is recomputed and the page shows the change as a step.
    checks:
      - "quote gate"
      - "precision and recall on the hand-labelled sample, by stratum and cutoff side, for the model and for the keyword comparator side by side"
    on_failure: the record is dropped and counted, and the keyword comparator's record stands in
    open:
      - "EMPIRICS: the model and its training cutoff date."

  - id: cluster
    name: Assign quotes to list entries, and pick the theme
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: the encoder's cutoff precedes each date; a quote stays current until the next document, with no decay; every quote is re-assigned at each weekly rebuild
    inputs:
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
      - "the keyword series: the same records from the keyword extractor"
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
      - "per component: the component set with each name's loading sign"
    outputs:
      - "quote weight per list entry and per residual cluster, by leg, with the placebo weight and the excess weight"
      - "the component's theme: the entry or residual cluster with the largest excess weight, or none"
      - "the book-effect split of the theme's quotes"
    rule: |
      Each paraphrase is embedded with the pre-date encoder and assigned to the nearest list entry within the assignment distance. Quotes beyond the distance from every entry are clustered among themselves with the same HDBSCAN settings, and each of those residual clusters is named separately. A document's quotes stay current until the same company files the next document on the same layer; there is no time decay. Each quote gets two tags. Its book effect asks whether the book loses if this risk materialises: leg sign (+1 winner, -1 loser) times company sign (-1 if the company loses when the risk hits, +1 if it gains), where -1 means the book loses. Its alignment asks whether this risk materialising moves the name the same way a reversal of the component would: a reversal is a negative component return, a name falls on reversal when its loading is positive, so a quote is aligned when company sign times loading sign equals -1. Only aligned quotes count toward a component's theme weight; an unaligned quote is evidence of a different theme. Quote weights are the absolute loadings of aligned quotes, summed per entry and per residual cluster, by leg. The same assignment is run on each random portfolio's component set, weighted by its own loadings, which gives the placebo weight per entry, so a boilerplate risk that every company lists shows zero excess weight; the excess weight is the quote weight minus the placebo weight. The component's theme is the entry or residual cluster with the largest excess weight, provided that excess exceeds the 95th percentile of the largest excess any single entry reaches on the random portfolios' own sets; otherwise the component is marked as having no theme above placebo and is not named. The top three entries are printed with their excess weights, and if the second entry's excess is within 10% of the first's, both are printed and the first is treated as the theme. A residual cluster competes on the same footing, with its placebo weight being the weight of random-set quotes that fall into the same cluster. The book-effect split, the share of the theme's quote weight on which the book loses if the risk materialises, is printed beside the theme. Everything in this node is computed on both text series.
    checks:
      - "placebo weight per entry"
      - "the share of quotes in residual clusters"
      - "month-to-month stability of the assignment"
    on_failure: the previous assignment is used
    open: []

  - id: namecluster
    name: Name the theme
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: the name is grounded in the 20 quotes nearest the cluster centre; a keyword label is printed beside it; the name is a label only, and the tail model uses no number derived from it
    inputs:
      - "the component's theme: the entry or residual cluster with the largest excess weight, or none"
      - "quote weight per list entry and per residual cluster, by leg, with the placebo weight and the excess weight"
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
    outputs:
      - "theme name per component, with its supporting quotes"
      - "the nearest news cluster and its headline count"
    rule: |
      If the component's theme is a list entry, its name is the entry's name. If it is a residual cluster, a language model reads the 20 quotes nearest its centre and names it; a c-TF-IDF keyword label, the top terms that distinguish the cluster from the others, is printed beside the model's name so the reader can check one against the other. In the keyword series the keyword label is the name. The nearest news cluster's keyword label and headline count are printed beside the theme; a theme with no news cluster within the assignment distance of its centroid is flagged company-specific. The naming is calibrated by running it on sector-matched random name sets: a name must be more specific on the real cluster than on a random one, rated on a three-point scale by the second reader, a second research analyst who checks the first's labels.
    checks:
      - "calibration on sector-matched random sets"
      - "the keyword label is printed"
    on_failure: the keyword label is printed alone
    open: []

  # ============================================================ propagation
  - id: propagate
    name: Search other names for the theme
    lane: propagate
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: before the language model's training cutoff only retrieval with the pre-date encoder is used; the model reranks post-cutoff months only; the retrieval-only result is always printed beside the model's
    inputs:
      - "theme name per component, with its supporting quotes"
      - "risk-factor and MD&A text per name, dated"
      - "intra-quarter event text per name, dated"
      - "positioning score per name, with the longest input lag"
    outputs:
      - "theme names outside the component set, each with a score and a quote, on both series"
    rule: |
      Once a theme is named, we search two sets of names outside the component set: the rest of the book, and names outside the book that sit in the universe's top quintile by positioning score. Every passage in scope is embedded once with the pre-date encoder and cached. Retrieval by the theme's reference point returns the 200 nearest passages. The language model scores each candidate name from 0 to 3 for whether its filings contain the theme, each score with a verbatim span: 0 no mention; 1 the topic is mentioned without a risk statement; 2 a risk statement on the theme; 3 a risk statement naming it as a principal risk. A score of 2 or more marks the name as a theme name outside the component set. For backtest dates before the model's cutoff, the model is not used: a name is marked when its nearest passage is within the assignment distance. The keyword series uses that retrieval rule on every date. As a control, the same run is made with a plausible but wrong theme, the list entry that had the most news weight twelve months earlier, or the next entry if that one is the current theme; the share of names it marks is the method's false-positive rate and is printed beside the share for the real theme. When the model version changes, every series this step feeds is recomputed and the page shows the change as a step.
    checks:
      - "quote gate"
      - "false-positive rate from the wrong-theme control"
      - "the retrieval-only result is printed beside the model's"
    on_failure: the name is marked as not searched
    open:
      - "EMPIRICS: the model's training cutoff, and the number of post-cutoff months available for the reranking comparison."

  - id: themescore
    name: Theme statistics
    lane: propagate
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: adds no look-ahead beyond what its inputs have
    inputs:
      - "per component: the book's variance share and its percentile against random portfolios"
      - "the named component"
      - "per component: the component set with each name's loading sign"
      - "theme names outside the component set, each with a score and a quote, on both series"
      - "theme name per component, with its supporting quotes"
      - "news weight per entry"
      - "per component: its daily return and ten-day sigma"
      - "position weights"
    outputs:
      - "the book's variance share on the theme, with its percentile"
      - "the loss share: the share of book weight, by leg, in names that lose if the theme reverses, on both series, with its placebo share"
      - "the loss in basis points if the component returns minus two sigma over ten days"
      - "the agreement line"
    rule: |
      Two statistics are printed, each beside its random-portfolio comparison. The first is the book's variance share on the named component, with its percentile. The second is the loss share: the share of the book's weight, by leg, held in names that lose if the theme reverses, beside the same share for sector-matched random portfolios. A name in the component set loses if the theme reverses when leg sign times loading sign is positive. A theme name found by propagation that is inside the book loses when leg sign times its beta to the component over the 126-day window is positive. Theme names outside the book have no weight in the book and do not enter the share; they appear only in the positioning overlap. The loss share is computed on both text series, and the tail model's ablation uses one and then the other. The loss share is also stated as a loss in basis points of book NAV: sigma is the component's daily return standard deviation over the 126-day window scaled to ten days, and the loss is the sum over the component set of w_i times the name's loading times minus two sigma, plus the sum over in-book theme names of w_j times the name's beta to the component times minus two sigma. The agreement line records whether the list entry with the most news weight and the component's name are the same theme. For a list entry this is a string match; for a residual cluster the second reader decides. The statistics are recomputed weekly from the event stream and monthly from the decomposition.
    checks:
      - "both placebo comparisons"
      - "a check that the statistics are not driven by filing season, comparing February with August"
    on_failure: n/a
    open: []

  # ============================================================ positioning
  - id: poscluster
    name: Positioning overlap with the theme
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: positioning is taken as of its release date
    inputs:
      - "positioning score per name, with the longest input lag"
      - "theme names outside the component set, each with a score and a quote, on both series"
      - "per component: the component set with each name's loading sign"
    outputs:
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "the non-overlap"
      - "off-book theme names in the universe's top positioning quintile"
    rule: |
      The theme names are the component set plus the theme names found by propagation. The heavily positioned names are the top quintile of the positioning score within each leg of the book. The overlap is the share of the theme names' book weight that is heavily positioned, by leg; the non-overlap is the share of heavily positioned weight that is not on the theme. Both are reported with their history since January 2014, when the reconstructed book begins. Theme names outside the book have no leg; they are listed separately, with their universe positioning quintile. Whether hedge funds are mostly positioned on one theme is a claim, and the overlap history is the evidence for or against it: random assignment gives an overlap of 20%, and the claim is supported if the overlap's median since 2014 is above it.
    checks:
      - "the overlap history is printed"
      - "the history of the overlap statistic is kept"
    on_failure: the overlap is not computed, with a note on the page
    open: []

  - id: timebombs
    name: Vulnerable names, two lists
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: returns and positioning are taken as of the date
    inputs:
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "daily returns per name"
      - "per component: its daily return and ten-day sigma"
      - "positioning score per name, with the longest input lag"
    outputs:
      - "the pre-catalyst list, by leg"
      - "the post-unwind list, by leg"
    rule: |
      Two lists are produced, both drawn from names that are heavily positioned and on the theme. The pre-catalyst list holds names whose trailing 20-day return is beyond one standard deviation of their own rolling 20-day returns over the trailing year, in the direction of the component, where direction is the sign of the name's loading times the sign of the component's move; these are the names with the largest recent gain to give back. The post-unwind list holds names whose trailing 20-day return is within one standard deviation while the component has moved beyond one; these are the names that have not yet fallen. Both lists are split by leg, because a crowded short that has not yet rallied during a squeeze is the most likely target of the next one. Neither list is printed until its event study in the validation lane has run.
    checks:
      - "the count and weight of each list are printed with their history"
    on_failure: n/a
    open: []

  # ============================================================ tail model
  - id: severity
    name: Conditional tail model
    lane: tail
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: every regressor uses only values available on the formation date; earnings dates are projected from the prior year and macro releases are scheduled in advance
    inputs:
      - "book returns"
      - "the bear state"
      - "the book's variance share on the theme, with its percentile"
      - "the loss share: the share of book weight, by leg, in names that lose if the theme reverses, on both series, with its placebo share"
      - "price-correlated names"
      - "per component: the case flag"
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "approved catalysts, with dates and types"
      - "earnings dates per name"
      - "scheduled macro releases"
      - "GARCH vol forecast"
      - "calendar baseline VaR"
    outputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "the ablation sequence"
    rule: |
      The tail model is a linear quantile regression of the book's ten-day forward return at the 5% quantile, fitted on every day up to the formation date. Regressors: trailing volatility; the bear state and its interaction with market variance; the case flag as an indicator; the book's variance share on the named component; the share of book weight in price-correlated names; the loss share by leg; the positioning overlap; a catalyst-window indicator with days to the nearest catalyst, where the catalyst window is the ten trading days beginning five sessions before the catalyst; and the GARCH forecast and the calendar baseline as controls. In the backtest the catalysts are the scheduled macro releases and the component names' earnings, where a name's earnings count only when the names reporting inside the window together hold at least 10% of the component set's weight; live, the PM's approved catalysts are added. Outputs: the ten-day VaR and expected shortfall in bp of book; the VaR conditional on being inside a catalyst window, and its increase over the same model with the window indicator set to zero, which is the additional risk attributed to the catalyst. The ablation sequence is reported on every run. Step 0 uses trailing volatility, the bear state, the case flag, the catalyst-window terms and the two controls: everything price and calendar, no text. Step 1 adds the variance share and the share of book weight in price-correlated names. Step 2a adds the loss share computed on the keyword series. Step 2b replaces it with the loss share computed on the language-model series. Step 3 adds the positioning overlap and is the full model. If step 2b does not beat step 2a by the registered margin, the memo says that the language model adds nothing to identification beyond a keyword rule, and the keyword extractor takes its place in the daily loop. To show whether the quantile responds to the state variables, the breach rate is reported separately for each state: bear state on or off, case flag factor or theme, inside or outside a catalyst window.
    checks:
      - "prior result: v1's tail model, without the text regressors, breached 2 of 42 held-out forecasts"
      - "breach rate by state"
      - "the ablation sequence"
      - "expected shortfall is no milder than the VaR"
    on_failure: the step-0 model is reported in place of the full model, with a note on the page
    open: []

  - id: garch
    name: GARCH baseline
    lane: tail
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: refit at each formation date
    inputs:
      - "book returns"
    outputs:
      - "GARCH vol forecast"
    rule: |
      A GARCH(1,1) model on the book's daily returns, refit at each formation date. Its forecast enters the tail model as a control and the validation as the baseline that uses no calendar information.
    checks: []
    on_failure: n/a
    open: []

  - id: eventbaseline
    name: Calendar baseline
    lane: tail
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: earnings dates are projected from the prior year; macro releases are scheduled in advance
    inputs:
      - "book returns"
      - "position weights"
      - "earnings dates per name"
      - "scheduled macro releases"
    outputs:
      - "calendar baseline VaR"
    rule: |
      This is the baseline that uses the calendar. For each catalyst window it makes 1,000 draws of the book's window return. In each draw, every name reporting inside the window contributes one of its last eight announcement returns, drawn at random, times its book weight; every other name contributes a ten-day return drawn from its trailing year; and a macro release contributes the book's return on one of the last eight releases of that type. The 5th percentile of the draws is the baseline VaR. Outside a catalyst window the baseline is the 5th percentile of the book's ten-day returns over the trailing year. Any model given the earnings calendar will beat GARCH around scheduled events, so the tail model is required to beat this baseline as well.
    checks: []
    on_failure: n/a
    open: []

  # ============================================================ catalysts
  - id: catagent
    name: Catalyst proposal (live only)
    lane: catalysts
    kind: model
    status: settled
    origin: v2
    lookahead: live-only
    mitigation: none exists; a model reading past news would propose the catalysts that turned out to matter, so this step runs on live data only and no backtest claim depends on it
    inputs:
      - "theme name per component, with its supporting quotes"
      - "items from the last five sessions"
      - "intra-quarter event text per name, dated"
    outputs:
      - "proposed catalysts per theme, each with a date, a source quote and a type"
    rule: |
      Scheduled catalysts (FOMC, CPI, payrolls, index rebalances, the component names' earnings) come from the calendars in the market-data node and involve no model. This step proposes the unscheduled ones: company-specific and off-universe events, for example a foreign supplier's earnings or a regulatory readout. A language model reads the last five sessions' news and the event-stream text and proposes each catalyst with a date, a source quote, and its type marked as unscheduled; the type field takes the values scheduled and unscheduled. As an illustration written by hand, not a system output: when the memory cycle was the theme in mid-2026, the two catalysts that mattered were the earnings of Broadcom and of SK Hynix, the second an off-universe name.
    checks:
      - "a date and a quote are required"
    on_failure: only calendar catalysts are used
    open: []

  - id: catapprove
    name: PM reviews catalysts
    lane: catalysts
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: none needed; runs live only
    inputs:
      - "proposed catalysts per theme, each with a date, a source quote and a type"
    outputs:
      - "approved catalysts, with dates and types"
    rule: |
      The PM reviews the proposals weekly; there are fewer than ten a week. The PM approves a catalyst on its date and relevance, not on any view of its outcome, and the PM's main contribution is adding catalysts the model missed. Catalysts not yet approved are shown on the page as proposed.
    checks: []
    on_failure: unapproved catalysts are shown as proposed
    open: []

  # ============================================================ analogues
  - id: analogue
    name: Analogue retrieval
    lane: analogue
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: each past date's state is computed from data as it stood on that date; dates within one year of today are excluded
    inputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the book's variance share on the theme, with its percentile"
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "book returns"
      - "daily WML from 1926"
      - "the bear state"
      - "the reversal record, 195 episodes since 1926"
    outputs:
      - "the five nearest past dates, what the book did over the following ten days, and whether each is apt"
    rule: |
      The state of a date is a vector of the six exposures, the book's variance share on the named component, the positioning overlap, the book's trailing realised volatility, and the bear state. The theme and positioning entries exist from January 2014. Before December 2013 the six exposures are the French factor's own 126-day slopes on the six series that have history, labelled factor-level rather than name-level, and the distance uses the exposures, volatility and bear state only; the page says which. The distance between states is the Mahalanobis distance, using a covariance estimated on dates before December 2013 for the price dimensions and on the expanding window since 2014 for the theme and positioning dimensions. Candidates are dates in the reversal record and an equal number of quiet dates, dates at least 21 trading days from any episode drawn at random; dates within one year of today are excluded. A deterministic rule marks each analogue apt or not: its bear state and its case flag value (factor or theme) must match today's, and its theme must be the same list entry. Before 2014 aptness is judged on the bear state and the case flag only, and the page says so. In v1 this rule ran alongside the three-role panel, which is now retired; the rule is kept.
    checks:
      - "each past date's state is regenerated from inputs public before it"
    on_failure: the five nearest dates are listed without saying whether each is apt
    open: []

  # ============================================================ page and people
  - id: eventrule
    name: When a page is produced
    lane: page
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: thresholds are registered
    inputs:
      - "approved catalysts, with dates and types"
      - "earnings dates per name"
      - "scheduled macro releases"
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the book's variance share on the theme, with its percentile"
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "book returns"
    outputs:
      - "the page type and its fields, with each field's change since the last page"
      - "hit, miss and silence counts"
    rule: |
      A page is produced on either of two triggers. The calendar trigger produces one five sessions before each approved catalyst, with the catalyst-window VaR and its increase. The threshold trigger produces one when the maximum of the eight time-series percentiles (the ten-day VaR, the named component's variance share, and the six exposures) crosses the 95th percentile of its own history since December 2013; the maximum's own 95th percentile is crossed on 5% of days, about one day a month, by construction, and the page names the statistic that crossed. Percentiles against random portfolios are shown for context only and cannot trigger a page. If neither trigger fires, a weekly summary is produced. Every page carries each field's change since the last page. Every page has a resolution date: a calendar page resolves at the catalyst, a threshold page at the ten-day horizon. A hit is a realised loss beyond the unconditional 5% quantile of the book's ten-day return; a miss is a page with no such loss; a silence is such a loss with no page. The three are counted and printed monthly. A threshold page earns its place if hits on page days exceed the 5% that any day gives, and the register states that rate. Weekly summaries are not scored. In production the page is a continuously maintained state, pushed to the reader whenever it changes.
    checks:
      - "the measured false-page rate"
      - "hits, misses and silences, monthly"
    on_failure: the plain template is sent with a note at the top saying why
    open: []

  - id: composer
    name: Prose over fixed fields
    lane: page
    kind: model
    status: settled
    origin: v1
    lookahead: clean
    mitigation: prose only; every number in it is checked against the field it came from
    inputs:
      - "the page type and its fields, with each field's change since the last page"
    outputs:
      - "the composed page, or the template"
    rule: |
      A language model writes the prose over the fixed fields. A check rejects the page if any number in the prose fails to match the field it came from; a single mismatch is enough to send the plain template instead. For comparison, the template with the same fields and no prose is rendered daily into the log. Each day the composer is also run on a test date with a known correct page; if it fails that test, the template is sent. The blind comparison, register row 13, has two readers score the prose page and the template for the same date without knowing which is which; if it finds the template as useful as the prose, the prose is dropped and the template becomes the page.
    checks:
      - "the numeral check"
      - "the daily test date"
      - "blind comparison against the template, register row 13, not yet run"
    on_failure: the plain template is sent with a note at the top saying why
    open: []

  - id: thepage
    name: The page
    lane: page
    kind: output
    status: settled
    origin: v2
    lookahead: clean
    mitigation: n/a
    inputs:
      - "the composed page, or the template"
      - "the book's variance share on the theme, with its percentile"
      - "the agreement line"
      - "the loss in basis points if the component returns minus two sigma over ten days"
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "the component set's implied ten-day move, loading-weighted, in per cent"
      - "sector ETF implied move, in per cent"
      - "the pre-catalyst list, by leg"
      - "the post-unwind list, by leg"
      - "approved catalysts, with dates and types"
      - "the driving-series exposure of the leg that holds more of it, in hedgeable units, with the names inside the leg that contribute most"
      - "which statistic is printed first"
      - "the five nearest past dates, what the book did over the following ten days, and whether each is apt"
      - "theme name per component, with its supporting quotes"
      - "coverage per name, by leg and by layer"
    outputs:
      - "one page, pushed to the reader"
    rule: |
      The reader is the user named in the problem statement: the PM running momentum, or the risk manager covering that book. Every headline number is over ten trading days, and the catalyst window is ten trading days, so one horizon holds throughout. In order: (1) the theme, the book's variance share on it and its percentile, and the agreement line, by leg; (2) the loss in basis points if the component returns minus two sigma, and its direction; (3) the ten-day VaR and expected shortfall, and the catalyst-window VaR beside the component set's implied move and the sector ETF's implied move as the implied move of the hedge instrument; (4) the pre-catalyst and post-unwind lists by leg, with the positioning lag, once their event study has run, and until then a line saying that they are withheld; (5) approved catalysts with dates and types; (6) the driving-series exposure in hedgeable units, printed first when the bridge says so; (7) the five analogues with what followed and whether each is apt; (8) each field's change since the last page; (9) a footer with coverage by layer and a note that the numbers describe the paper 12-1 book. If the reader's positions are an input, the footer prints the reader's beta to that book; otherwise it tells the reader to scale by that beta. The conclusion states the direction of the risk and the hedge, and leaves the decision to exit with the reader; this is the decision the system informs. Every number links to a stored output and every theme to its quotes. The page records whether it was acknowledged; the requirement that the PM sign within two hours is dropped, because on the days a page is triggered the market is moving.
    checks:
      - "the numeral check"
      - "every quote passes the quote gate"
    on_failure: the plain template is sent with a note at the top saying why
    open:
      - "The example page with numbers, required by element 6 of the brief, lives in the memo, not in this spec."

  - id: responselog
    name: Response log (production only)
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: production only; it needs the reader's positions as an input
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "looked at, ignored, or acted on, per page"
    rule: |
      Each page is logged as looked at, ignored, or acted on, and scored against a base rate: the share of weeks in which the PM changes the momentum exposure of the PM's own book, measured as its beta to the 12-1 book, with no page. This log is the only way to measure whether a page changed a decision. It cannot exist until the reader's actual positions are an input to the system, because the 12-1 book is a paper portfolio that no fund holds. It is the first item of the production path.
    checks:
      - "the base rate is stated before scoring"
    on_failure: n/a
    open: []

  - id: signoff
    name: The human tasks
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: none needed; runs live only
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "acknowledged page, or the page shipped unacknowledged"
      - "monthly labelled sample"
    rule: |
      Four tasks need a person. The PM acknowledges each page, or it ships marked unacknowledged. The PM edits the worry list whenever a worry becomes relevant. The PM reviews proposed catalysts weekly. A research analyst, not the PM, labels a stratified sample of about 90 extracted records each month, 60 from filings and 30 from news, which the second reader, a second research analyst, checks.
    checks: []
    on_failure: the page ships unacknowledged
    open: []

  # ============================================================ validation
  - id: register
    validation: true
    name: Pre-registration register
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: clean
    mitigation: thresholds and both outcome sentences are written before each run
    inputs: []
    outputs:
      - "a row per test: threshold, margin, power, and the sentence that goes in the memo under each outcome"
    rule: |
      Before each test runs, a row records the pass threshold and the sentence that goes in the memo if the test passes and if it fails; when the result is in, the sentence for the other outcome is deleted. Before any test, the smallest effect it could detect is found by simulation; a null result is a finding only if that detection floor is below the effect size of interest, and otherwise the test is reported as too weak to see it. The 2023-onward seal was opened in v1 for the severity breach test. Every v2 test runs on the full sample from December 2013 and is labelled design tier; a forward seal from the memo date is the confirmatory sample. Rows that test the memo or the developer's process rather than the market are kept in a process appendix. The v1 rows are archived with their outcomes.
    checks:
      - "the build fails if any placeholder for an unresolved outcome remains in the memo"
    on_failure: n/a
    open:
      - "v1 rows 02, 03 and 05 have no result; row 23 was registered with two dates' numbers already known and is labelled so."

  - id: labels
    validation: true
    name: Hand-labelled sample
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: the labels are used only to score the model, never to train it
    inputs:
      - "monthly labelled sample"
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
    outputs:
      - "precision and recall by leg, era and cutoff side"
    rule: |
      About 90 records a month, drawn as a stratified sample by leg, by era (December 2013 to 2019, 2020 to 2022, 2023 onward) and by whether the document is dated before or after the model's training cutoff, labelled by a research analyst and checked by the second reader. Confidence intervals are classical; prediction-powered inference is not used because the sample is too small for it. The difference in error between pre- and post-cutoff records is the bound on how much the model may be recalling from training rather than reading.
    checks: []
    on_failure: the error estimate comes from the hand labels only
    open:
      - "Has not yet run; the ninety labels for v1's extractor were reserved for the author and never written."

  - id: volvalidation
    validation: true
    name: Tail-model scoring
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: catalyst dates come from the calendars, projected or scheduled in advance
    inputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "the ablation sequence"
      - "GARCH vol forecast"
      - "calendar baseline VaR"
      - "the component set's implied ten-day move, loading-weighted, in per cent"
      - "book returns"
      - "earnings dates per name"
      - "a row per test: threshold, margin, power, and the sentence that goes in the memo under each outcome"
    outputs:
      - "breach rate and pinball loss per ablation step, against both baselines, per catalyst type"
      - "the catalyst-window increase against the implied move, where history exists"
    rule: |
      There is one observation per formation month, about 150 from December 2013: the catalyst-window VaR on the window's first day against the realised ten-day book return, taking the nearest catalyst where a month has several. Standard errors are clustered by month, the effective sample size is stated, and the power calculation is registered before the run. Each ablation step is scored on breach rate and pinball loss against the GARCH baseline and the calendar baseline, per catalyst type (earnings, macro release, and live only, unscheduled). Pinball loss is the scoring rule for a quantile forecast: a breach costs 0.95 times its size and a non-breach costs 0.05 times the distance. The catalyst-window increase is compared with the component set's implied move where the options history exists, and otherwise the comparison is marked illustrative. The register row states the margins, proposed here and frozen before the run: at each step the breach rate must lie between 3% and 7%, the pinball loss must be at least 5% below each baseline's, and step 2b must reduce the pinball loss of step 2a by at least 2% for the language model to be judged to add anything. On months before the language model's training cutoff the two text series differ only in extraction and naming; the reranking difference exists on post-cutoff months only, and the count of those months is printed with the result.
    checks:
      - "register row with margin and power"
    on_failure: n/a
    open:
      - "EMPIRICS: the power calculation for the 3 to 7% band and the 2% and 5% margins at about 150 observations."

  - id: bombtest
    validation: true
    name: Event study for the vulnerable-name lists
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: lists are frozen before the outcome window; positioning is as of the date
    inputs:
      - "the pre-catalyst list, by leg"
      - "the post-unwind list, by leg"
      - "daily returns per name"
      - "the reversal record, 195 episodes since 1926"
      - "a row per test: threshold, margin, power, and the sentence that goes in the memo under each outcome"
    outputs:
      - "each list's excess move over sector-matched names not on the list, per unwind"
    rule: |
      On the five recorded unwinds since 2020 in the reversal record (November 2020, early 2021, November 2022, January 2025 and April 2025, each dated by its first breach day), the test asks whether the names on each list moved with the theme over the following twenty sessions by more than sector-matched names not on the list, measured as the return in the loss direction, using positioning data as it was available at the time. The pre-catalyst list is frozen 21 sessions before the first breach day; the post-unwind list five sessions after it; each is scored over the twenty sessions that follow its freeze. The registered margin, proposed here and frozen before the run: the listed names must move in the loss direction by at least 200bp more than the matched names, averaged over the five unwinds, with the same sign in at least four of the five. The detection floor at five unwinds is stated in the row. Neither list is printed on any page until this test has run. All five unwinds are design tier, since the 2023-onward seal was opened in v1.
    checks:
      - "register row"
    on_failure: the lists are not printed
    open:
      - "EMPIRICS: the five first-breach dates from the reversal record."

  - id: themevalidation
    validation: true
    name: Theme pipeline against the PM's list
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: human
    mitigation: there is no history until a PM edits the list; this is a production measurement
    inputs:
      - "the agreement line"
      - "PM edits"
      - "a row per test: threshold, margin, power, and the sentence that goes in the memo under each outcome"
    outputs:
      - "the share of PM-added entries the pipeline had surfaced first; the share of residual themes the PM later adopted"
    rule: |
      Run quarterly. It measures whether the pipeline finds themes the PM had not listed, and whether the PM needs to add fewer entries over time. The first reading is four quarters after a PM starts editing the list.
    checks:
      - "register row"
    on_failure: n/a
    open: []

  # ============================================================ retired
  - id: route1
    name: Route 1 detector (retired)
    lane: retired
    kind: deterministic
    status: retired
    origin: v1
    lookahead: clean
    mitigation: n/a
