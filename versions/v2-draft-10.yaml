# System design v2, draft 10. Standalone (no base file). Draft 9 plus notation: a symbol table in the
# legend, one line per regression, sum and sign rule where prose was carrying one, and four rule
# corrections the lines exposed (see changelog). Formulas are LaTeX, rendered by KaTeX in the viewers:
# $$...$$ on a line of its own for a display formula, $...$ inline; |x| for abs, \sum, \operatorname{sign},
# \mathrm{corr}, \mathbf{1}[.] for an indicator, q_{95} for a 95th percentile.
#
# Fields per node: id, name, lane, kind (data | deterministic | model | human | output), status (settled |
# retired), origin (v1 | v2), lookahead (clean | as-of | model | live-only | human), mitigation, access
# (data nodes: public | mixed), inputs, outputs, rule, checks, on_failure, open, validation (true on the
# components that score other components).
# Fields per edge: from, to, carries, when (daily | weekly | monthly | at rebalance | on change | on event |
# on release | quarterly | once), mode (backtest and live | live only | backtest only), feedback, hidden.

meta:
  title: Momentum reversal-risk system, v2 draft 10
  version: v2-draft-10
  updated: "2026-09-07"
  problem:
    exposure: "the 12-1 momentum book: the top and bottom deciles of the Russell 3000 by return from twelve months before to one month before, value-weighted within each leg, dollar-neutral, rebuilt monthly"
    event: >-
      a ten-day return of the reconstructed book at or below its own unconditional 5% quantile on the history since December 2013: $\text{event}_t = \mathbf{1}[R_{t,t+10} \le Q_{0.05}(R_{u,u+10},\ \text{Dec 2013} \le u \le t-10)]$. The tail model forecasts that quantile conditionally; a page is scored against the unconditional one. The French factor's -432bp is the same quantile on the published factor over 1926 to 2022, printed as the long-run reference and used for the reversal record before December 2013, where no reconstructed book exists
    horizon: "ten trading days, for every forecast on the page"
    user: "the PM running momentum, or the risk manager covering that book"
    decision: "whether and how much to hedge the book's exposure to the named theme before the next catalyst, and, once the event study on the vulnerable-name lists has run, which names to trim; the page gives the direction of the risk and the hedge, and the reader decides"
  note: >
    The design assumes that the theme behind a reversal is known before the reversal happens: it has been
    building in the news for some time, and the PM can name it. The system's job is to measure how much of
    the book depends on that theme, where it has spread, who is positioned on it, and how much worse the
    book's tail becomes around the next catalyst. It names the theme from the worry list where an entry
    fits and from the residual clusters where none does; it cannot name a theme that is absent from the
    news. This is the known-theme assumption. It fails when a reversal comes from a theme that nobody had
    labelled and that had not appeared in the news. On such a day the page shows no theme, or the wrong
    one, and the tail model reports its step-0 form,
    which uses prices and the calendar only. This case is common in the reversal record: 77 of the 86 episodes
    that v1's rules could not classify were loser-leg losses in a rising market with no prior bear state.
    Whether a theme had appeared in the news before those episodes has not been measured.
  legend:
    status: "settled = decided in v2; retired = replaced by v2, kept with the reason."
    origin: "v1 = a component retained from the first design, rewritten here only in language; v2 = new."
    kind: "data = a feed (grey pill); deterministic = a rule with no model (white box, blue band); model = a language-model component (orange); human = a person's task (tan hexagon); output = the page (green double border)."
    lane: "a rendering row in the full view; the seven numbered groups in the levels view are the reading order."
    lookahead: >
      clean = uses only values that were public on the date; as-of = the values exist historically but must be
      taken at their release date; model = a model trained after the date reads text from inside it, and the
      mitigation says how that is bounded; live-only = no mitigation exists and the node is excluded from
      every backtest; human = a person's input that a backtest must run without. A node's label is at least the
      strongest label among its backtest-mode inputs, in the order live-only, model, as-of, clean; a node's own
      mitigation field states only what the node adds. Human is not inherited: a backtest runs without the
      person, and where it runs on a frozen artefact of theirs, the initial worry list, that artefact's
      look-ahead is stated on the human node.
    access: "public = every feed the node uses is public; mixed = public feeds now, with licensed or desk-only feeds in production, each labelled in the rule. Data nodes have no inputs; each names its feeds in its rule."
    direction: "every stated caveat says which way it biases the page, in a sentence that begins with the bias."
    edges: "carries = what passes along the edge; when = its cadence; mode = whether it exists in the backtest, live, or both; feedback = an edge that runs against the reading order."
    row: "a row of the pre-registration register (Appendix C of the memo)."
    quote gate: "every span a model extracts must appear verbatim in its source document, or the record is dropped and counted."
    comparator: "a method that does the same job as a model component without a language model, printed beside it, so the model's contribution is visible."
    seal: "a block of dates held back from all design work and opened once for a confirmatory test; the 2023-onward seal was opened in v1, so no unopened seal exists today."
    design tier: "a result measured on dates that were used to build the design; it is reported as in-sample and does not count as confirmatory."
    validation: "a component that scores another component and feeds nothing to the page; marked with its own shape on the canvas."
    notation: >-
      LaTeX, rendered by KaTeX in the viewers; a display formula stands on a line of its own. Conventions: $|x|$ for the absolute value, $\sum$, $\operatorname{sign}$, $\mathrm{corr}$, $\mathbf{1}[\cdot]$ for an indicator, $q_{95}$ for a 95th percentile of a history. Every regression is written once, stating what is regressed on what, over which observations, and what is reported; a forward-return target is fitted only on observations whose target is realised. The system has one residualisation, $u$, and named estimators and tests are named, not derived.
  symbols:
    '$W, L$': "the winner and loser legs"
    '$w_i$': >-
      company $i$'s position weight: $\mathrm{cap}_i / \sum_W \mathrm{cap}$ for $i$ in $W$, and $-\mathrm{cap}_i / \sum_L \mathrm{cap}$ for $i$ in $L$, so $\sum_W w_i = 1$ and $\sum_L w_i = -1$
    '$s_i$': "the leg sign of company $i$: +1 in $W$, -1 in $L$"
    '$m_t, x_{st}$': >-
      the market (S&P 500) return, and reference series $s = 2, \dots, 6$ (ten-year yield change, WTI, the dollar, the credit spread, the mega-cap spread); 'the six reference series' means $m$ and $x_2, \dots, x_6$
    '$r_{it}, u_{it}$': >-
      company $i$'s daily return, and its residual from the one first-stage regression on the market, $r_{it} = a_i + b_i m_t + u_{it}$ over the trailing 126 days
    '$\Sigma, \lambda_k, v_k, v_{ik}$': >-
      the Ledoit-Wolf covariance of $u$ over the book's companies; its $k$-th eigenvalue and eigenvector; company $i$'s loading on component $k$
    '$f_{kt}, \sigma_k$': >-
      component $k$'s daily return, $f_{kt} = \sum_i v_{ik} u_{it}$, and its ten-day sigma, $\sqrt{10}$ times the sd of $f_k$ over the window
    '$\beta_{ik}$': >-
      the 126-day beta of $u_i$ on $f_k$ for a company outside the component set; for a set company the loading $v_{ik}$ is the same beta under $\Sigma$, which is why set companies use $v$ and found companies use $\beta$
    '$S_s$': >-
      the book's spread exposure to series $s$, $\sum_i w_i \beta_{is}$, with $\beta_{is}$ the slope of $u_i$ on $x_{st}$ (or of $r_i$ on $m_t$ for the market)
    '$\mathrm{VS}_k$': >-
      the book's variance share on component $k$, $\lambda_k (w'v_k)^2 / (w' \Sigma w)$
    '$E_e$': >-
      the excess quote weight of worry-list entry $e$, the book's aligned quote weight on $e$ minus the placebo weight from the random portfolios
    '$O$': "the positioning overlap: the share of theme companies' book weight that is in the crowded quintile, per leg"
    '$B_t$': "the bear state: 1 if the trailing 24-month market return is negative"
    '$R_{t,t+10}, Q_\tau, \mathrm{VaR}_t$': >-
      the book's ten-day forward return; its $\tau$-quantile; the tail model's conditional 5% quantile forecast on day $t$, a return, so negative
  proof_of_concept:
    hours: "about twenty for the whole project. The path below is the part of the design that runs today on public, as-of data."
    status: "planned; as of the memo date no v2 component has run"
    path: [prices, refseries, french, sort, random, covariance, pca, bridge, filings, news, newsagent, taxonomy, embedspace, pc1text, riskextract, cluster, namecluster, propagate, themescore, garch, eventbaseline, severity, register, volvalidation]
    path_notes:
      newsagent: "keyword comparator only; the language model is not run on news in the proof of concept"
      taxonomy: "the initial list, written on the memo date and labelled as such"
      propagate: "retrieval only, over the rest of the book; the positioning scope and the language-model reranking are deferred"
      severity: "steps 0 to 2b; the positioning overlap (step 3) and the PM's approved catalysts are deferred or live-only"
      volvalidation: "the implied-move comparison is marked illustrative, since the options history is deferred"
      register: "the rows for the tail-model scoring only"
    produces: "the tail-model scoring, steps 0 to 2b, with the keyword-versus-model ablation as the one registered test, on the full sample from December 2013; the result is design tier"
    deferred: [posdata, poscluster, timebombs, bombtest, options, catagent, catapprove, analogue, composer, sensitivities, zscore, route2, controls, labels]
    described_only: [pmworries, eventrule, thepage, signoff, responselog, themevalidation]

