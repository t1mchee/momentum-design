nodes:
  # ============================================================ data in
  - id: prices
    name: Market data and calendars
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: index membership is taken at the effective date of each change, which follows the announcement; earnings dates are projected from the prior year; FOMC dates are published in advance
    access: mixed
    inputs: []
    outputs:
      - "daily returns per company"
      - "point-in-time universe, about 300 companies per leg"
      - "sector codes"
      - "earnings dates per company"
      - "FOMC dates and listed macro releases"
      - "daily returns of the hedge instruments"
    rule: |
      The universe is the constituent list of the Russell 3000 ETF, taken from the fund's archived daily holdings at the effective date of each change (PUBLIC); the announcement precedes the effective date, so the backtest is late, not early. Daily prices are adjusted for corporate actions (PUBLIC, Stooq or Tiingo; CRSP in production, LICENSED). Sector codes come from EDGAR SIC codes (PUBLIC); GICS in production (LICENSED). Stooq and Tiingo contain no delisting returns, so a company delisted for performance leaves the book at a return of -30%, following Shumway, and any other delisted company at its last trade; no company is held at a zero return. In the backtest a company's next earnings date is projected as the date of its 8-K Item 2.02 one year earlier, moved to the same weekday; the error against the realised date is measured and printed. Live, company calendars give the date (PUBLIC). FOMC decision days, and the listed releases (CPI, payrolls, index rebalances) that appear on the page without opening windows, come from the published calendars (PUBLIC). The hedge instruments' daily returns (the eleven sector ETFs, the ten-year future, the front-month WTI future, the dollar index future, a high-yield credit ETF, and the mega-cap pair) are PUBLIC.
    checks:
      - "the projected earnings date against the realised date, as a distribution of errors in days"
    on_failure: if a day's price or holdings file is missing, the previous day's state is held and the day is listed in the footer

  - id: refseries
    name: Reference series and the bear state
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: none of the six is revised; a revised series, if ever added, is taken from ALFRED first prints
    access: public
    inputs: []
    outputs:
      - "six reference series"
      - "the bear state"
    rule: |
      The six reference series, with units: the S&P 500 return $m_t$; the change in the ten-year Treasury yield in basis points; the front-month WTI return; the return of the Fed's broad dollar index (FRED); the change in the ICE BofA US corporate option-adjusted spread in basis points (FRED); and the return of the ten largest Russell 3000 companies minus the return of the equal-weighted Russell 3000, constructed from the holdings file. The six are fixed. The bear state, after Daniel and Moskowitz, is $B_t = \mathbf{1}[\text{trailing 24-month S\&P 500 return} < 0]$.
    on_failure: the series is left off the page and listed in the footer

  - id: filings
    name: Company text
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: clean
    mitigation: every document is dated at acceptance or receipt, and every extracted span must pass the quote gate
    access: mixed
    inputs: []
    outputs:
      - "risk-factor sentences per company, dated"
      - "8-K and transcript sentences per company, dated"
      - "coverage per company, by leg and by layer"
    rule: |
      Company text has two layers we can use now, and each feed is labelled by access. The context layer is Item 1A of the latest 10-K accepted before the formation date, plus the latest 10-Q's Part II Item 1A where it is newer, cut by regex on the standard headers and split into sentences (PUBLIC, EDGAR). The event layer is 8-K Items 2.02, 7.01 and 8.01 with exhibits (PUBLIC, EDGAR) and earnings-call transcripts (PUBLIC for a subset through free feeds; LICENSED for full coverage). A third layer, equity research (LICENSED) and dealer and prime-broker notes (DESK-ONLY), is production-only and would feed the same two steps, text gathering and propagation. Every extracted span must appear verbatim in its source before it is stored (the quote gate). Coverage per company, by leg and by layer, gates the page: items 1 and 4 need the context layer, for the component set and for the crowded quintiles, and item 5 needs the event layer for the component set; an item is withheld when fewer than 80% of the companies it needs, by gross weight, are read on that layer, and the item and its coverage are listed in the footer. Quote weights are understated on companies without text, so a theme concentrated in companies the free feeds miss is under-read.
    checks:
      - "quote gate"
    on_failure: the company is marked unread on that layer, and the items that need it are withheld
    open:
      - "EMPIRICS: the free transcript feeds and the share of companies they cover."

  - id: news
    name: News
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: for each backtest date the embedding space is rebuilt from the archive as it stood on that date
    access: mixed
    inputs: []
    outputs:
      - "news sentences, timestamped, rolling twelve months"
      - "items from the last five sessions"
    rule: |
      News is used in two ways. A slow pass over a rolling twelve-month archive, rebuilt weekly, supplies the embedding space in which themes are located. A fast pass over the last five sessions supplies the catalyst proposal each day. Feeds: GDELT headlines and URLs (PUBLIC), Fed, Treasury and BLS release pages (PUBLIC), SEC press-release exhibits (PUBLIC), Bloomberg and Reuters headlines (LICENSED). Every item is timestamped at publication and split into sentences. GDELT contains no article text, so risk statements are under-counted and more themes are marked company-specific than a full-text feed would mark. The theme pipeline starts at GDELT's first usable date; on earlier months the tail model runs and the theme items are withheld and listed in the footer.
    checks:
      - "the source list is versioned"
      - "for a backtest date, only items published before that date enter the rebuild"
    on_failure: the previous week's embedding space is reused and marked stale in the footer
    open:
      - "EMPIRICS: GDELT's first usable date for headline text."

  - id: posdata
    name: Positioning feeds and score
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: every source is keyed to its release date, never to settlement or period end; the longest input lag is printed with the score
    access: mixed
    inputs: []
    outputs:
      - "positioning score per company, with its lag"
      - "the crowded quintiles of the universe"
    rule: |
      The positioning score has one input per leg, ranked within the leg, and the two inputs arrive on different clocks. On the winner leg it is 13F crowding: the number of momentum-style filers holding the company, quarterly with a 45-day lag (PUBLIC); a momentum-style filer is one whose holdings, value-weighted, have an average 12-1 percentile rank in the universe above a cutoff set in the register from the distribution of filers' average ranks, as of the filing quarter; the count of filers the cutoff yields is printed. On the loser leg it is short interest as a share of float, twice a month with a two-week lag (PUBLIC). A 13F count on a short would measure the wrong side, which is why the loser leg has its own input. Crowded means the top quintile of the score within the leg. For companies outside the book, the crowded quintiles are the universe's top quintile by 13F crowding and its top quintile by short interest; together they are the second search scope for propagation. Both inputs are holdings counts, not functions of the residual covariance, so the crowded set does not move with the loadings from month to month. Both rise with company size, as the loadings can, so the overlap's null is the crowded quintile's weight share, and the size channel is what remains in the null; the overlap is read against that null and not as independence. The 45-day lag understates crowding while it builds and overstates it after the unwind has begun, so both vulnerable-name lists lag. Production feeds, each a separate line when present: securities-lending utilisation (LICENSED), options open interest (PUBLIC, delayed), ETF flows (PUBLIC), prime-broker positioning (DESK-ONLY). The longest input lag is printed beside the score.
    on_failure: the score, the overlap and the two lists are withheld and listed in the footer
    open:
      - "EMPIRICS: the number of momentum-style filers the definition yields."

  - id: french
    name: French factor file and the reversal record
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: the threshold was frozen on the 1926 to 2022 sample before any test ran
    access: public
    inputs: []
    outputs:
      - "daily WML from 1926"
      - "the reversal record, 195 episodes since 1926"
    rule: |
      The file provides daily WML, French's winners-minus-losers momentum factor, from 1926: a long history and a check that the reconstruction matches a published series. French's construction (a 2x3 value-weighted sort) differs from ours, so the agreement between the two is measured and reported. On the published factor a reversal is a ten-day return at or below -432bp, the 5th percentile of overlapping ten-day factor returns from 1926 to 2022, frozen in advance; on the reconstructed book the event is the book's own unconditional 5% quantile, as the problem block states, with -432bp printed beside it as the long-run reference. The reversal record is every episode that breached the threshold, with breach days within 21 trading days collapsed to one episode (one month, the rebalance interval): 195 episodes since 1926, on the French file before December 2013 and on the reconstructed book after it. The record feeds the analogue search, the event study and the premise share; the unwinds since 2020 that the event study uses are listed by date in the register before it runs.
    checks:
      - "the monthly correlation between the reconstructed book and the French factor is reported"
    open:
      - "EMPIRICS: the correlation statistic."

  # ============================================================ the book and the random portfolios
  - id: sort
    name: The 12-1 book
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: the ranking window closes at formation
    inputs:
      - "daily returns per company"
      - "point-in-time universe, about 300 companies per leg"
    outputs:
      - "the two legs and the position weights"
      - "leg sizes, capitalisation profile and sector counts"
      - "book returns"
    rule: |2
        $$w_i = \frac{\mathrm{cap}_i}{\sum_W \mathrm{cap}} \ (i \in W), \qquad w_i = -\frac{\mathrm{cap}_i}{\sum_L \mathrm{cap}} \ (i \in L), \qquad R_t = \sum_i w_i r_{it}$$
      On each formation date, the last trading day of the month, the rule ranks every company on its return from twelve months before to one month before, skipping the latest month; the top decile is held long and the bottom decile short, value-weighted within each leg and dollar-neutral across them. Formation and rebalance coincide; the book is rebuilt monthly and measured daily. The weight vector $w$ is the input to every book-level statistic, and every statistic is also reported for each leg separately. Value-weighting inside a decile is concentrated: at recent formation dates the long leg has an effective number of names near ten, with one name near a quarter of the leg, and the book runs near 31% annualised against the published factor's 13%. The effective N and the weight norm $\|w\|_2$ are printed per leg on every date, and no book-level statistic is quoted without them.
    checks:
      - "leg sizes, the capitalisation profile and the sector counts are logged"
    on_failure: the previous month's book is used and listed in the footer

  - id: random
    name: Random portfolios, the null
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: drawn on the same date from the point-in-time universe
    inputs:
      - "point-in-time universe, about 300 companies per leg"
      - "leg sizes, capitalisation profile and sector counts"
      - "sector codes"
    outputs:
      - "200 random portfolios per date, matched on size, capitalisation and sector"
    rule: |
      For each formation date the rule draws $N = 200$ portfolios from the point-in-time universe, matched on the book's joint cell counts: for each leg, the number of companies in each (capitalisation decile, sector) cell is the book's, drawn without replacement within a portfolio from the point-in-time universe, with the book's own companies in the pool; a cell short of companies in the universe passes its shortfall to the next smaller decile in the same sector, and from the smallest decile to the next larger. The only difference from the book is that the random portfolios were not ranked on past returns. $N$ is 200 so that the 95th percentile of any statistic over the random portfolios rests on ten draws. The first-drawn leg of each plays the winner leg, so every statistic is signed the same way as the book's and every percentile is one-sided. Sector matching is what makes the null useful for the text statistics: a macro bet is usually expressed through a sector tilt, and a universe base rate per theme would measure the tilt of the sort rather than the theme. This node outputs portfolios only. The random portfolios serve two statistics, the variance share and the theme's excess weight; each is computed on every random portfolio by the node that computes it for the book, and the book's percentile among them is what the page shows. The cost is that the decomposition, the classifier and the assignment run on 200 portfolios at every rebalance; the classifier's records are cached by document, so the cost is arithmetic, not model calls.
    checks:
      - "the construction parameters are hashed and stored with each run"

  # ============================================================ exposure
  - id: sensitivities
    name: Macro exposures
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: the window rolls daily and closes on the day
    inputs:
      - "the two legs and the position weights"
      - "six reference series"
    outputs:
      - "the exposure per reference series"
      - "the residual u per company"
    rule: |
      One first-stage regression gives the residual used throughout the design, and one slope per company and series gives the exposure, both over a 126-day window that rolls daily:
        $$r_{it} = a_i + b_i m_t + u_{it}$$
        $$u_{it} = a + \beta_{is} x_{st} + e_{it} \quad (s = 2, \dots, 6), \qquad \beta_{i1} = b_i$$
        $$S_s = \sum_i w_i \beta_{is}$$
      Formation fixes the book's companies and weights for the month; the slopes and the exposure are recomputed every day on the window ending that day, which is what the daily percentile trigger reads. 126 days is half a year and the window of every rolling statistic in the design.
    checks:
      - "sign stability across weighting, rebalance date, universe and window is reported in the appendix"
    on_failure: the series is left off the page and listed in the footer

  - id: percentiles
    name: Exposure in hedgeable units, with its percentile
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: the history starts in December 2013
    inputs:
      - "the exposure per reference series"
    outputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "the driving series, the leg that holds more of it, and the companies that contribute most"
    rule: |
      For each series $S_s$ is printed in units a desk can hedge: $S_s$ times the book's NAV is the sensitivity of the book to that series. For the ten-year it is stated as DV01-equivalent dollars per $100m of book, where DV01 is the dollar change in value for a one basis point move in yield; for the credit spread as CS01-equivalent dollars per basis point; for the index and the mega-cap series as a beta; for WTI and the dollar as notional dollars of the series per $100m of book. One percentile is printed per series: the percentile of $|S_s|$ against the book's own history from December 2013, once 24 months of history exist, with the sign of $S_s$ beside it, so that an extreme exposure of either sign can trigger a page. The driving series is the one of the six on which the book's exposure has the highest own-history percentile that month; it is re-chosen at each rebalance and printed by name, with the leg that holds the larger share of it and the companies inside that leg that contribute most, ranked by $|w_i \beta_{is}|$.

  # ============================================================ decomposition
  - id: covariance
    name: Covariance of the book's companies
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: the window closes at formation
    inputs:
      - "the residual u per company"
      - "the two legs and the position weights"
      - "200 random portfolios per date, matched on size, capitalisation and sector"
    outputs:
      - "the shrunk covariance of the book's companies, and of each random portfolio's"
    rule: |2
        $$\Sigma = \mathrm{LedoitWolf}(u), \quad \text{constant-correlation target, over the 126 days ending at formation}$$
      $u$ is the first-stage residual carried from the exposures node, not recomputed here. Shrinkage is needed because about 600 companies against 126 days would otherwise give a rank-deficient matrix. Sector returns are not removed, because a theme is often expressed through a sector and removing it would hide, for example, a memory-chip theme inside the semiconductor sector; the placebo in the assignment node is what separates a theme from the sector it sits in. The same matrix is estimated for each random portfolio.
    checks:
      - "the condition number is printed; above the registered bound the decomposition is not run that month"
    on_failure: the decomposition is not run this period and is listed in the footer
    open:
      - "A covariance-only decomposition misses links between companies that were not historically correlated. The variance share is then understated for a theme that is spreading, and the propagation step partly compensates by searching other companies for the theme."

  - id: pca
    name: Components and the book's variance share
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: arithmetic on the shrunk covariance; the estimation is in the covariance node
    inputs:
      - "the shrunk covariance of the book's companies, and of each random portfolio's"
      - "the two legs and the position weights"
    outputs:
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios, with loadings"
    rule: |2
        $$\mathrm{VS}_k = \frac{\lambda_k (w' v_k)^2}{w' \Sigma w}, \qquad k = 1, 2, 3$$
      The first three eigenvectors of $\Sigma$ are kept; three is the most the page can carry. $\mathrm{VS}_k$ is the share of the market-residual book's variance due to the component; the book's market exposure is a separate line, item 6. A component is above noise when $\mathrm{VS}_k$ exceeds the 95th percentile of the same statistic on the random portfolios, each decomposed the same way; naming runs on components above noise only, and if none is, item 1 reads that no co-movement rises above what a random book of this size and sector mix shows. The sign of $v_k$ is fixed so that $w'v_k > 0$: the component's position-weighted return is positive and a reversal is a negative $f_k$. The component set is the top quartile of companies by $|v_{ik}|$, each keeping the sign of its loading. A component that is winners against losers with no shared condition has no theme with excess weight, so the placebo in the assignment node keeps the sort's own axis from being named as a theme. Each random portfolio's component sets and loadings are kept for the text placebo; the book's component $k$ is compared with each random portfolio's component of the same rank $k$.
    checks:
      - "the Jaccard overlap of the company set with the previous month's set is printed; below 0.5, a third or more of the set has changed, the component is marked unstable and is not named that month"
      - "percentile against random portfolios"
    on_failure: naming is not run and is listed in the footer

  - id: bridge
    name: Component against the reference series and the instruments
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: same window as the decomposition
    inputs:
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "six reference series"
      - "daily returns of the hedge instruments"
    outputs:
      - "R-squared of each component on the reference series, and the series with the largest coefficient"
      - "the hedge instrument, its slope, its market beta and its market-residual return, per component"
    rule: |
      The bridge regression, over the 126 days ending at formation:
        $$f_{kt} = a + \sum_{s=2}^{6} \gamma_{ks} x_{st} + e_t, \qquad f_{kt} = a + b_k u_{Ht} + e_t$$
      The market is not a regressor because it was removed at the first stage. $R^2_k$ and the series with the largest $|\gamma_{ks}|$ go to the page, which opens with that series' exposure when $R^2_k$ of the named component is above 0.5, since a named macro series then explains most of the component and the theme label confirms it. For the hedge, each candidate instrument is first residualised on the market with the same first-stage regression as the companies, giving $u_{Ht}$ and the instrument's market beta $\beta_H$; the component is then regressed on $u_{Ht}$, so that $b_k$ is the component's return per unit of the instrument's market-residual return, which is the minimum-variance hedge ratio. The candidates are the eleven sector ETFs, the ten-year future, the front-month WTI future, the dollar index future, a high-yield credit ETF, and the mega-cap pair (long the ten largest, short the equal-weighted ETF). The hedge instrument $H$ for each component is the candidate with the highest R-squared, and $b_k$ sizes the hedge line in the theme-statistics node. The market part of any hedge is not in this line: the book's market exposure and its hedge are item 6.
    on_failure: the hedge line names the sector ETF holding the largest share of the component set, with no size

  # ============================================================ context space
  - id: newsagent
    name: News risk statements
    lane: context
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: dates and company names are redacted from the prompt; the model labels a sample once and a classifier on the encoder labels the rest; the keyword rule runs beside it on every date
    inputs:
      - "news sentences, timestamped, rolling twelve months"
    outputs:
      - "news risk statements, dated, on both runs"
    rule: |
      The unit is a sentence. A language model reads a sample of 2,000 news sentences, stratified by year, with dates and company names redacted, and labels each as a risk statement or not, where a risk statement is a statement of a condition that could hurt companies within a year. 2,000 is the training set; its size is checked against the classifier's learning curve on 200 of the labels held out, and the scoring sample is the hand-labelled one. A classifier head on the encoder is trained once on those labels and marks every sentence in the archive. A marked sentence is the record: its text is the span and its embedding is the encoder's embedding of the sentence itself. The comparator is the keyword rule: the registered term list, a list of risk terms and modal phrases ("could", "may", "exposed to", "depends on") kept in the register, applied to each sentence. Both are scored on the same hand-labelled sample, and the keyword rule's records are the keyword run.
    checks:
      - "quote gate"
      - "precision and recall of the classifier and of the keyword rule on hand-labelled news sentences, in production; the proof of concept hand-scores filing sentences only"
    on_failure: the keyword run's statements are used and the substitution is listed in the footer

  - id: taxonomy
    name: The PM's worry list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: the list is used on the live page only; the backtest names themes from clusters, with no list
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "the worry list, versioned"
    rule: |
      A registered list of about thirty external conditions, for example rates, the memory cycle, tariffs, a regulatory decision, financing. The PM adds or removes entries whenever a worry becomes relevant, usually after reading a page, and every edit is logged with a date. The list does not form a second set of reference points: the entry's phrase is embedded with the same encoder, and its reference point is the centroid of the 50 news statements nearest that embedding. On the live page the entry labels the cluster whose centroid is nearest the reference point when that distance is within $d^*_c$, the centroid distance; a cluster no entry reaches keeps its model label; when two entries reach the same cluster the nearer labels it; and an entry that reaches no cluster, or loses one, is printed as having no news weight. The list is used on the live page and on the memo-date example, where it is labelled as written with hindsight. In the backtest there is no list: themes are clusters only, so the backtest scores the same object the page shows, with a different label.
    checks:
      - "every edit is logged"
    on_failure: the previous version is used

  - id: embedspace
    name: Embedding space
    lane: context
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: one named encoder on every date; its look-ahead is not bounded, and the legend says what follows from that
    inputs:
      - "news risk statements, dated, on both runs"
      - "risk statements per company, on both runs"
    outputs:
      - "the embedding space: clusters, their centroids, the two distances, the keyword labels, and the news weight per cluster"
    rule: |2
        $$d^* = q_{90}\{\, d(q, \text{centroid of } q\text{'s cluster}) : q \text{ a cluster member} \,\}, \qquad d^*_c = q_{10}\{\, \min_{e' \ne e} d(\text{centroid}_e, \text{centroid}_{e'}) \,\}, \qquad \mathrm{NW}_e = \#\{\text{news members of cluster } e\}$$
      The encoder is one public sentence encoder with a published training cutoff, the same on every date, named in the package. Its look-ahead is not bounded: an encoder trained after 2020 places "vaccine timing" near "travel resumption" on a 2019 date because it read 2020. The model run's news risk statements over the rolling twelve-month window and its filing risk statements of the book's and the random portfolios' component sets are embedded together and form the population that is clustered; the keyword run's statements are assigned into the clusters so formed and do not shape them. The embeddings are reduced before clustering, to about ten dimensions by UMAP under a cosine metric with a fixed seed, because a density clusterer on the full 384 dimensions finds no dense region at any population size; the reduced space is the clustering space and the encoder space is the assignment space. They are clustered together with HDBSCAN at a minimum cluster size of 25 and a minimum-samples parameter of 5, in the twelve-month window of statements, all entity-matched to the universe; the count of statements in the window is printed with the number of clusters. A cluster whose keyword label is generic risk-factor vocabulary, a list kept in the register (results, operations, adversely, condition, and the like), is not a theme. Clustering the two sources together puts headlines and filing sentences in one population, so one distance applies to both and a cluster's news members and filing members are counted on the same footing. HDBSCAN finds the number of clusters and a noise set; after clustering, a cluster is treated as the ball of radius $d^*$ around its centroid, which is an approximation, and noise points are excluded from the calibration of $d^*$. The centroid distance $d^*_c$ is the radius used where a centroid is compared with a reference point or another centroid, in the worry list, the theme log and the weekly matching; it is the 10th percentile of nearest-centroid distance, so two points within it are as close as the closest tenth of neighbouring clusters, and most pairs are not. A cluster is company-specific when it has fewer than 25 news members. Each cluster is labelled once here with its top c-TF-IDF terms, the terms that distinguish it from the other clusters; the labelling node prints that label. The space is rebuilt weekly and every statement is re-assigned at each rebuild. Clusters are matched across rebuilds by centroid: a cluster whose centroid lies within $d^*_c$ of a previous week's centroid keeps that cluster's identity and label. A theme whose cluster finds no match is carried for one week as the previous centroid and marked stale in the footer; a rebuild alone does not un-name a component.
    checks:
      - "the number of clusters, the noise share and the news weight per cluster are printed"
    on_failure: the previous week's space is reused and marked stale in the footer
    open:
      - "EMPIRICS: the encoder and its published cutoff."

  # ============================================================ naming
  - id: riskextract
    name: Risk statements from filings
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: company identity and dates are redacted from the prompt; the classifier and the keyword rule are scored on the same hand labels
    inputs:
      - "risk-factor sentences per company, dated"
      - "8-K and transcript sentences per company, dated"
    outputs:
      - "risk statements per company, on both runs"
    rule: |
      The unit is a sentence. A language model reads a sample of 2,000 filing sentences, stratified by year, leg and layer, with company identity, ticker and dates redacted, and labels each as a risk statement or not. A risk statement is a statement of a condition that would hurt the company; the sign is a loss by definition, and a statement that the company would benefit is not a risk statement. A classifier head on the encoder is trained once on those labels and marks every sentence of every filing in the universe, once, cached by document; the language model cannot read 200 random books' filings monthly, and one instrument on both sides keeps the model-keyword difference out of the excess weight. The comparator is the keyword rule on the same sentences, and its records are the keyword run. Both are scored on the same hand-labelled sample.
    checks:
      - "quote gate"
      - "precision and recall on the hand-labelled filing sentences, for the classifier and the keyword rule side by side"
    on_failure: the keyword run's records stand in and the substitution is listed in the footer
    open:
      - "EMPIRICS: the labelling model and its training cutoff date."

  - id: cluster
    name: Assign statements to themes, and pick the theme
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: ""
    inputs:
      - "risk statements per company, on both runs"
      - "the embedding space: clusters, their centroids, the two distances, the keyword labels, and the news weight per cluster"
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "component sets of the random portfolios, with loadings"
    outputs:
      - "per component above noise: the theme (a cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the named component"
      - "the theme companies in the component set, by leg"
    rule: |2
        $$Q_e = \frac{\sum_{i \in \text{set},\ \ell_i v_{ik} > 0,\ d(\text{nearest statement of } i,\ \mathrm{ref}_e) \le d^*} |v_{ik}|}{\sum_{i \in \text{set}} |v_{ik}|}, \qquad P_e = \text{mean of the same over the random sets}, \qquad E_e = Q_e - P_e$$
        $$\text{theme} = \arg\max_e E_e \ \text{ if } \ E_e > q_{95}\{\max_e E_e \text{ over the random sets}\}, \ \text{ else none}$$
      A company counts toward cluster $e$ when its risk statement nearest that cluster's centroid is within $d^*$, and once only, whatever the length of its filing; that statement is the quote kept for it. A company counts only if a reversal of the component costs the book on it, which is $\ell_i v_{ik} > 0$: a winner-leg company with a positive loading, which falls when $f_k$ falls, or a loser-leg company with a negative loading, which rallies when $f_k$ falls. Worked example: a loser-leg company with $v_{ik} > 0$ falls on a reversal, and the book, short it, gains; its stated risk does not count. The same sign rule gives the bp loss in the theme-statistics node, so the two agree on every company. $Q_e$ is a share of the component set's total absolute loading, so it runs from zero to one and the excess is in the same units: an excess of 0.3 means that companies holding three tenths more of the component's weight than a random book's would state the theme. $P_e$ is the same share on each random portfolio's component set with its own loadings, so a boilerplate risk that every company lists shows zero excess, and a component that is winners against losers with no shared condition has no cluster above the placebo. The theme and the runner-up are printed with their excess weights; if the runner-up is within 10% of the first, both are printed and the first is treated as the theme. The named component is the highest-variance component above noise whose theme is not none. The theme companies in the set are the members whose nearest statement is within $d^*$ of the theme's centroid, by leg; propagation adds to them. A set company with no filing on the context layer counts in the denominator and not the numerator, and the footer shows the coverage. A document's statements stay current until the same company files the next document on the same layer; there is no time decay. Everything in this node is computed on both runs, and the two themes are printed together with whether they agree.
    checks:
      - "placebo weight per cluster"
      - "agreement of the theme between the two runs, printed"
    on_failure: the previous assignment is used and listed in the footer

  - id: namecluster
    name: Label the theme
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: the label is grounded in the 20 statements nearest the cluster centroid; a keyword label is printed beside it; the label is a label only, and no number is derived from it
    inputs:
      - "per component above noise: the theme (a cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the worry list, versioned"
      - "the embedding space: clusters, their centroids, the two distances, the keyword labels, and the news weight per cluster"
    outputs:
      - "the theme label per component, with its quotes, its news weight, and whether it is company-specific"
    rule: |
      If a worry-list entry labels the theme's cluster, the label is the entry's name. Otherwise a language model reads the 20 statements nearest the cluster's centroid and names it, and the cluster's keyword label from the embedding space is printed beside the model's label so the reader can check one against the other; in the keyword run the keyword label is the label. The cluster's news weight is printed beside the label, and a cluster with fewer than 25 news members is marked company-specific.
    checks:
      - "the keyword label is printed"
    on_failure: the keyword label is printed alone

  # ============================================================ propagation
  - id: propagate
    name: Search other companies for the theme
    lane: propagate
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: ""
    inputs:
      - "the theme label per component, with its quotes, its news weight, and whether it is company-specific"
      - "risk statements per company, on both runs"
      - "the crowded quintiles of the universe"
      - "the embedding space: clusters, their centroids, the two distances, the keyword labels, and the news weight per cluster"
    outputs:
      - "companies outside the component set with the theme, each with its quote"
    rule: |
      Once a theme is labelled, the rule searches two sets of companies outside the component set: the rest of the book, and the universe's crowded quintiles. The objects searched are the classifier's risk statements from those companies' filings, already embedded and cached. A company is marked as having the theme by the same rule as in the assignment node: its risk statement nearest the theme's centroid is within $d^*$, and that statement is the quote kept with the result. There is no cap on the number of companies and no reranking.
    checks:
      - "quote gate"
    on_failure: the company is marked as not searched

  - id: themescore
    name: Theme statistics and the hedge line
    lane: propagate
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: ""
    inputs:
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "the named component"
      - "the two legs and the position weights"
      - "book returns"
      - "the hedge instrument, its slope, its market beta and its market-residual return, per component"
      - "the exposure per reference series"
      - "the standardised quantile"
    outputs:
      - "the book's variance share on the named component, with its percentile"
      - "the loss in basis points of book, by leg, if the component returns minus two sigma over ten days"
      - "the hedge line: instrument, notional per $100m of book, and the VaR before and after the hedge"
      - "the market line: the book's beta, the theme hedge's market beta, and the index notional that flattens the net"
    rule: |2
        $$\text{bp loss}_{\text{leg}} = -2\,\sigma_k \sum_{i \in \text{leg}} w_i v_{ik}, \qquad n = 100\text{m} \cdot g_k b_k \ \text{ (short } H\text{)}, \qquad \mathrm{VaR}^{\text{hedged}}_t = \sigma^{\text{hedged}}_t\, q, \quad \sigma^{\text{hedged}}_t = \text{ten-day sd of } R_t - (n/100\text{m})\, u_{Ht}$$
        $$\beta^{\text{net}} = S_1 - (n/100\text{m})\,\beta_H, \qquad \text{index notional per } \$100\text{m} = 100\text{m} \cdot \beta^{\text{net}}$$
      Two statistics are printed for the named component. The first is $\mathrm{VS}_k$, with its percentile against the random portfolios. The second is the loss in basis points of book if the component returns $-2\sigma_k$ over ten days, by leg, where the sum runs over every book company in the leg, since $v_k$ is defined over the whole book; it is net, so companies that gain on a reversal offset those that lose, and the two legs sum to $-2\sigma_k g_k$. The hedge line hedges that loss with a short in $H$, the instrument the bridge chose, sized by the minimum-variance ratio $b_k$: a short of $g_k b_k$ dollars of $H$ per dollar of book removes as much of the component's variance as $H$ can remove, a share $R^2$ of it, and no more. $g_k = w'v_k$ is at most $\|w\|_2$, which for two value-weighted deciles of 300 names is a few tenths, so $g_k$ is small: with $g_k = 0.1$ and $b_k = 0.5$, the short is $\$5$m of $H$ per $\$100$m of book. The line prints the VaR before and after the hedge: $\sigma^{\text{hedged}}_t$ is the ten-day sigma of the book's return less the hedge's market-residual return over the current 126-day window, and $q$ is the tail model's standardised quantile, so the hedged VaR is today's hedge applied to the current window, and the line is labelled so. The short is in the instrument itself, so it carries the instrument's market beta. The market line is computed here: the book's beta $S_1$ from the exposures node, less the hedge's contribution $(n/100\text{m})\,\beta_H$, gives the net beta, and the index notional that flattens it is the market hedge printed in item 6. The statistics are recomputed monthly from the decomposition and whenever the theme changes.
    checks:
      - "the random-portfolio comparison for the variance share"

  # ============================================================ positioning
  - id: poscluster
    name: Positioning overlap with the theme
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: ""
    inputs:
      - "positioning score per company, with its lag"
      - "companies outside the component set with the theme, each with its quote"
      - "the named component"
      - "the theme companies in the component set, by leg"
      - "the two legs and the position weights"
    outputs:
      - "the overlap by leg, with its null and its history"
      - "the crowded theme companies, by leg"
      - "off-book theme companies in the crowded quintiles"
    rule: |2
        $$O = \frac{\sum_{i \in T \cap C} |w_i|}{\sum_{i \in T} |w_i|}, \qquad O^{\text{null}} = \frac{\sum_{i \in C} |w_i|}{\sum_{i \in \text{leg}} |w_i|}$$
      $T$ is the set of theme companies, the component-set members whose nearest statement is within $d^*$ of the theme's centroid plus the companies found by propagation, and $C$ is the crowded set, the top quintile of the positioning score within the leg; both per leg. Under no relation between theme and crowding, the expected overlap is the crowded set's share of the leg's gross weight, computed each month. It is not one fifth, because the score's inputs vary with size: the winner-leg quintile, drawn on 13F counts, holds more than a fifth of the leg's weight, and the loser-leg quintile, drawn on short interest as a share of float, typically less. The overlap is printed with its null and its history since the theme pipeline begins. The crowded theme companies, $T \cap C$ by leg, are the input to the two vulnerable-name lists. Theme companies outside the book have no leg; they are listed separately, with their universe quintile.
    on_failure: the overlap and the lists are withheld and listed in the footer

  - id: timebombs
    name: Vulnerable companies, two lists
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: ""
    inputs:
      - "the crowded theme companies, by leg"
      - "daily returns per company"
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "the two legs and the position weights"
      - "six reference series"
    outputs:
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "the squeeze state"
    rule: |2
        $$\text{pre-catalyst:}\ \ f_{k,20} > 0 \ \text{ and } \ r_{i,20}\operatorname{sign}(v_{ik}) > \mathrm{sd20}_i, \qquad \text{post-unwind:}\ \ f_{k,20} < -\mathrm{sd20}_k \ \text{ and } \ |r_{i,20}| < \mathrm{sd20}_i$$
      Both lists are drawn from the crowded theme companies. $r_{i,20}$ and $f_{k,20}$ are trailing 20-day returns; $\mathrm{sd20}_i$ is the standard deviation of the company's rolling 20-day returns over the trailing year, and $\mathrm{sd20}_k = \sqrt{2}\,\sigma_k$, the component's ten-day sigma scaled to 20 days. The pre-catalyst list holds the companies that rose with the component and have the largest recent gain at risk. The post-unwind list holds the companies that have not yet moved after the component has fallen by more than one twenty-day sigma; on the loser leg these are the heavily shorted theme companies that have not yet rallied. The squeeze state is on when the loser-leg companies' value-weighted 20-day return, a rally being positive, exceeds one $\mathrm{sd20}$ of that return with the market, $m$, up over the same 20 days. Neither list is printed until its event study has passed.
    checks:
      - "the count and weight of each list, with their history"

  # ============================================================ tail model
  - id: baselines
    name: The calendar state and the unconditional baseline
    lane: tail
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: earnings dates are projected from the prior year; FOMC dates are published in advance
    inputs:
      - "book returns"
      - "the two legs and the position weights"
      - "earnings dates per company"
      - "FOMC dates and listed macro releases"
      - "approved catalysts, with dates and types"
    outputs:
      - "the calendar state of each day"
      - "the unconditional baseline VaR"
      - "window catalyst days"
    rule: |2
        $$c(t) = \mathbf{1}[\text{a window catalyst day lies in } \{t+1, \dots, t+10\}], \qquad \mathrm{VaR}^{\text{unc}}_t = Q_{0.05}\{R_{u,u+10} : u \le t-10\}$$
      A window catalyst is an FOMC decision day, a heavy earnings day, or a catalyst the PM has approved. A heavy earnings day is one on which the companies reporting hold at least 10% of the book's gross weight; the floor is set from the distribution of daily reporting weight over the history and kept in the register. The window catalyst days are an output, read by the trigger node. The state of a ten-day start $t$ is inside when the ten sessions its return covers, $t+1$ to $t+10$, contain a window catalyst day, and outside otherwise; the catalyst can fall anywhere in the span, so the return the state describes is the return that contains the event. Listed releases (CPI, payrolls, index rebalances) appear on the page and do not open windows: with windows around every scheduled release, nearly every day would be inside one and the state would say nothing. The count of starts in each state is printed each year. The state is a page field and a scoring split; the tail model does not read it. The unconditional baseline is the book's own ten-day returns on the dates they happened, over every daily start since December 2013 whose target is realised; there are no draws, and the cross-section is not averaged.
    checks:
      - "the number of window catalysts and of starts in each state, printed per year"

  - id: severity
    name: The tail model
    lane: tail
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: every input is a realised book return or a calendar date known in advance
    inputs:
      - "book returns"
      - "the unconditional baseline VaR"
    outputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book, with the observations behind them"
      - "the probability of the event"
      - "the standardised quantile"
    rule: |2
        $$z_u = \frac{R_{u,u+10}}{\sigma_u}, \qquad q = Q_{0.05}\{ z_u : u \le t-10 \}$$
        $$\mathrm{VaR}_t = \sigma_t\, q, \qquad \mathrm{ES}_t = \sigma_t \cdot \text{mean}\{ z_u : z_u \le q \}, \qquad P_t = \text{share of } \{ z_u \} \text{ at or below } \mathrm{VaR}^{\text{unc}}_t / \sigma_t$$
      The tail model is one line: the 5% quantile of the book's past ten-day returns, each divided by the book's volatility at the time, multiplied by today's volatility. There are no fitted parameters and no conditioning state. The observations behind the quantile are printed as the count of non-overlapping starts, $n/10$ for $n$ daily starts, and the tail count that the 5% quantile rests on, $n/200$. $P_t$ is the probability of the event on the problem block's definition, a ten-day return at or below the unconditional 5% quantile: the share of past standardised returns at or below that threshold scaled by today's volatility. It is checked in the scoring node against the realised share of returns below that threshold. Three conditioning variables were tested and are not used: the bear state, the calendar state and the volatility tercile each score within one of the scaled line on pinball loss, with intervals containing one, and the bear state degrades it on the published factor; the three ratios are printed in the scoring node beside the model as the record of why the model has no state. Text and positioning do not enter the model.
    checks:
      - "the two lines, unconditional and scaled, and the three conditioning ratios"
    on_failure: the unconditional baseline is reported in place of the model and the substitution is listed in the footer

  # ============================================================ catalysts
  - id: catagent
    name: Catalyst proposal (live only)
    lane: catalysts
    kind: model
    status: settled
    origin: v2
    lookahead: live-only
    mitigation: a model reading past news would propose the catalysts that turned out to matter, so this node runs on live data only and no backtest claim depends on it
    inputs:
      - "the theme label per component, with its quotes, its news weight, and whether it is company-specific"
      - "items from the last five sessions"
      - "8-K and transcript sentences per company, dated"
    outputs:
      - "proposed catalysts with a date, a source quote and a type, beside the comparator's"
    rule: |
      Window catalysts and listed releases come from the calendars without a model. This node proposes the unscheduled ones: company-specific and off-universe events, such as a foreign supplier's earnings or a regulatory readout. A language model reads the last five sessions' news and event text, with the theme label in the prompt as context and not as a filter, and proposes each catalyst with a date, a source quote and its type, scheduled or unscheduled. The comparator is a term-list extractor over the same five sessions: every dated sentence that matches the registered term list and names a component company is a proposal. Each list is capped at ten, the most recent first, so the two are compared like with like. The PM's approval share for each list is printed; it is the live step's only record. The memo-date page carries the model's actual proposals for the live theme beside the comparator's, with the approval column empty.
    checks:
      - "a date and a quote are required"
    on_failure: only calendar catalysts are used

  - id: catapprove
    name: PM approves catalysts
    lane: catalysts
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: none needed; runs live only
    inputs:
      - "proposed catalysts with a date, a source quote and a type, beside the comparator's"
    outputs:
      - "approved catalysts, with dates and types"
    rule: |
      The PM reviews proposals as they arrive, at most once a day, since a calendar page is produced five sessions before a window catalyst; the term list is reviewed weekly. The PM approves a catalyst on its date and relevance, not on any view of its outcome; the PM's main contribution is adding catalysts the model missed. An approved catalyst is a window catalyst: it is a calendar-page trigger and a window catalyst day for the scoring split; the tail model reads no state. Catalysts not yet approved appear on the page as proposed.
    on_failure: unapproved catalysts appear as proposed

  # ============================================================ analogues
  - id: analogue
    name: Analogues
    lane: analogue
    kind: deterministic
    status: settled
    origin: v1
    lookahead: model
    mitigation: ""
    inputs:
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "book returns"
      - "the bear state"
      - "the reversal record, 195 episodes since 1926"
      - "the theme label per component, with its quotes, its news weight, and whether it is company-specific"
    outputs:
      - "the five nearest past formation dates, what the book did over the following ten days, and whether each is apt"
    rule: |
      The state of a formation date is seven numbers: the six exposures $S_s$ and the trailing ten-day sigma $\sigma_t$. The bear state $B_t$ is carried beside the state and is not in the distance: it is a binary that is off on nearly every date since 2013, and a covariance-weighted distance would be dominated by it. Candidates are every formation date since December 2013, excluding the twelve months before today. The distance is Mahalanobis on the seven, with the covariance estimated over the candidate dates, since the exposures co-move and a Euclidean distance would count one shock several times. The five nearest dates are printed with what the book did over the following ten days, whether each fell in the reversal record, and the theme the pipeline named on that date where one exists. An analogue is apt when its bear state matches today's; the theme is shown beside it and does not decide aptness, because a theme exists on few candidate dates. No language model is involved. Five is what fits on the page.
    checks:
      - "each past date's state is regenerated from inputs public before it"
    on_failure: the five nearest dates are listed without an aptness mark

  - id: panel
    name: Analogue panel (live only)
    lane: analogue
    kind: model
    status: settled
    origin: v1
    lookahead: live-only
    mitigation: a model trained on what followed a past date cannot judge that date's aptness from memory, so the panel rules only on records it retrieves, every claim carries a verbatim span, and the node runs on live data only; no backtest claim depends on it
    inputs:
      - "the five nearest past formation dates, what the book did over the following ten days, and whether each is apt"
      - "risk statements per company, on both runs"
      - "the reversal record, 195 episodes since 1926"
      - "the theme label per component, with its quotes, its news weight, and whether it is company-specific"
    outputs:
      - "the panel's verdict per analogue: apt, not apt, or cannot be ruled on, with the field that decided it and the spans it cites"
    rule: |
      The one agentic step in the design. For each of the five analogues the distance rule returned, three model roles run in sequence with tools and not from memory: an advocate retrieves the condition records for the analogue date, the risk statements the extractor stored for the book's companies as of that date, and argues that the mechanism then matches today's theme, citing spans; a dissent retrieves the same records and the reversal record and argues the opposite; an adjudicator rules apt, not apt, or cannot be ruled on, and names the field that decided it. The gate is the rule the first design's test established: a mechanism claim is kept only when it cites a verbatim span from a condition record for that date, and a claim without one is dropped and counted; an analogue date with no condition record, which is every date before the filings corpus begins, is ruled cannot be ruled on; the model's memory of what followed that date is not admitted. The deterministic aptness rule, the bear-state match, is printed beside the verdict as the comparator, and the count of claims dropped by the gate is printed with each page. The memo-date page carries the panel's actual run for the live analogues; the 2020-10-31 run is the demonstration, labelled as a live-only component run on a historical date.
    checks:
      - "quote gate"
      - "planted mechanism claims: three with a record and three without, the gate keeps exactly the three with one"
    on_failure: the five analogues are printed with the deterministic mark only and the panel is listed in the footer as not run

  # ============================================================ page and people
  - id: eventrule
    name: When a page is produced
    lane: page
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: every trigger input is a price statistic or a calendar date; the named component decides the page's content, not whether it fires
    inputs:
      - "window catalyst days"
      - "the three components: variance share with its percentile, company set with loadings, daily return, ten-day sigma, and which are above noise"
      - "per reference series: the exposure in hedgeable units and its own-history percentile"
      - "book returns"
    outputs:
      - "the page type and its fields, with each field's change since the last page"
      - "page dates and their outcomes"
    rule: |2
        $$M_t = \max_k p_{kt}, \qquad \text{threshold page on day } t \ \text{ iff } \ M_t > q_{95}\{M_u : u < t\} \ \text{ and } \ M_{t-1} \le q_{95}\{M_u : u < t-1\}$$
      A page is produced on either of two triggers. The calendar trigger produces one five sessions before each window catalyst day, taken from the baselines node. The threshold trigger uses the own-history percentile $p_{kt}$ of each of seven statistics (the largest $\mathrm{VS}_k$ among the components above noise, and $S_1$ to $S_6$) and fires on the day their maximum crosses its own 95th percentile from below, so a run of days above the level produces one page; the VaR is not in the set, because a page triggered by a high VaR would be scored against losses that a high VaR already predicts. The own-history percentile of the largest variance share is computed in this node, against its own history since December 2015; when no component is above noise the seventh statistic is absent and $M_t$ is the maximum over six. None of the seven reads text, so the trigger is clean and the hit-rate test is a test of prices and the calendar. The count of pages per year, by trigger, is printed, not assumed: with 126-day windows the statistics are persistent, and crossings are far fewer than the days above the level. A weekly summary is produced when neither trigger fires. Every page shows each field's change since the last page. Every page resolves ten sessions after it is produced, which is the horizon of every forecast on it. A hit is $\text{event}_t = 1$ over those ten sessions; a miss is a page with $\text{event}_t = 0$; a silence is $\text{event}_t = 1$ over a ten-day span that no page covered. Page dates and outcomes go to the scoring node, where the hit rate on threshold pages, one outcome per crossing and non-overlapping, is tested against the 5% base rate. Weekly summaries are not scored. In production the page is kept current, pushed to the reader whenever it changes.
    checks:
      - "the count of pages per year, by type"

  - id: thepage
    name: The page
    lane: page
    kind: output
    status: settled
    origin: v2
    lookahead: model
    mitigation: ""
    inputs:
      - "the page type and its fields, with each field's change since the last page"
      - "the theme label per component, with its quotes, its news weight, and whether it is company-specific"
      - "per component above noise: the theme (a cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the named component"
      - "the book's variance share on the named component, with its percentile"
      - "the loss in basis points of book, by leg, if the component returns minus two sigma over ten days"
      - "ten-day 5% VaR and expected shortfall, in bp of book, with the observations behind them"
      - "the probability of the event"
      - "the hedge line: instrument, notional per $100m of book, and the VaR before and after the hedge"
      - "the market line: the book's beta, the theme hedge's market beta, and the index notional that flattens the net"
      - "the overlap by leg, with its null and its history"
      - "off-book theme companies in the crowded quintiles"
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "the squeeze state"
      - "positioning score per company, with its lag"
      - "the bear state"
      - "approved catalysts, with dates and types"
      - "FOMC dates and listed macro releases"
      - "the driving series, the leg that holds more of it, and the companies that contribute most"
      - "R-squared of each component on the reference series, and the series with the largest coefficient"
      - "the five nearest past formation dates, what the book did over the following ten days, and whether each is apt"
      - "the panel's verdict per analogue: apt, not apt, or cannot be ruled on, with the field that decided it and the spans it cites"
      - "coverage per company, by leg and by layer"
    outputs:
      - "one page, pushed to the reader"
    rule: |
      The reader is a discretionary macro PM whose book carries momentum-type exposure, or the risk manager covering it. Every forecast on the page is over ten trading days. The page is a template of nine fixed items rendered from stored outputs; the only free text is the quotes, which pass the quote gate, and the theme label, printed beside its keyword label. Item 1 is the theme: its label, the book's variance share on the named component and its percentile, the theme's excess weight with the runner-up, its news weight, and the label from the keyword run beside the model's. Item 2 is the loss in basis points if the component returns minus two sigma, by leg. Item 3 is the ten-day VaR and expected shortfall with the observations behind them, the probability of the event, and the hedge line: the instrument, the notional, and the VaR before and after the hedge. Item 4 is the positioning overlap by leg with its null, the bear state and the squeeze state, the positioning lag, and the two vulnerable-name lists by leg if their event study has passed. Item 5 is the catalysts: window catalysts and listed releases with dates, and proposed catalysts awaiting approval. Item 6 is the market line from the theme-statistics node, the book's beta net of the theme hedge and the index notional that flattens it, and the driving-series exposure in hedgeable units from the exposures node. The order of the page is decided in this node: when the named component's R-squared on the reference series is above 0.5, the page opens with the exposure to the series carrying the largest bridge coefficient and prints the theme label as confirmation; otherwise it opens with item 1. The bridge series and the driving series are different objects, one per component and one per book, and when they differ item 6 names both. Item 7 is the five analogues with what followed and whether each is apt. On the live page the analogue panel's verdict per analogue, with the field that decided it and the spans it cites, is printed beside the deterministic mark, and the count of claims its gate dropped. Item 8 is each field's change since the last page. Item 9 is the footer: text coverage by layer; one line naming any item not on this page and the feed or test it waits on; and a note that the numbers describe the paper 12-1 book, with the reader's beta to that book if positions are an input, and otherwise the instruction to scale by that beta. The conclusion is a fixed template: the risk (theme label, via the named component); the loss at minus two sigma by leg; the hedge (short, notional, instrument); the VaR before and after it. It leaves the decision to exit with the reader; this is the decision the system informs. Every number links to a stored output and every theme to its quotes. The page records whether it was acknowledged.
    checks:
      - "every quote passes the quote gate"
    on_failure: the page is sent with the missing items listed in the footer
    open:
      - "The example page with numbers, required by element 6 of the brief, is in the memo, not in this spec."

  - id: responselog
    name: Response log
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: the full log needs the reader's positions as an input; a proxy runs before that
    inputs:
      - "one page, pushed to the reader"
      - "the acknowledgement log"
    outputs:
      - "looked at, ignored, or acted on, per page"
    rule: |
      Each page is logged as looked at, ignored, or acted on, and scored against a base rate: the share of weeks in which the PM changes the momentum exposure of the PM's own book, measured as its beta to the 12-1 book, with no page. That needs the reader's actual positions as an input, because the 12-1 book is a paper portfolio that no fund holds; it is the first item of the production path. Until positions are an input, the proxy is the acknowledgement log and the PM's two logged actions, list edits and catalyst approvals, within five sessions of a page: acted on is an acknowledged page followed by an action, looked at is an acknowledged page with none, and ignored is an unacknowledged page. Before any PM exists, the proof of concept records, for the formation date before each recorded unwind, whether the page named a theme, sized a hedge, and whether its VaR was breached.
    checks:
      - "the base rate is stated before scoring"

  - id: signoff
    name: The human tasks
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: none needed; runs live only
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "the acknowledgement log"
      - "the hand-labelled sample"
    rule: |
      The PM acknowledges each page, or it is sent marked unacknowledged; the acknowledgement log is the response log's proxy. The PM's other two tasks, editing the worry list and approving catalysts, are the two human nodes that hold them. A research analyst, not the PM, labels sentences as risk statements or not: in the proof of concept 100 filing sentences, labelled once by the author, about two hours, with a standard error of about ten points on precision since precision is a share of the predicted positives; in production a stratified sample each month, checked by a second analyst.
    on_failure: the page is sent unacknowledged

  # ============================================================ validation
  - id: register
    validation: true
    name: Pre-registration register
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: clean
    mitigation: thresholds and both outcome sentences are written before each run
    inputs: []
    outputs:
      - "a row per test: threshold, detection floor, and the sentence that goes in the memo under each outcome"
    rule: |
      Before each test runs, the author writes its pass threshold and the sentence the memo will hold if the test passes and if it fails; when the result is in, the sentence for the other outcome is deleted. Before any registered test, the smallest effect it could detect is found by simulation, and a null result is a finding only if that floor is below the effect size of interest; otherwise the test is reported as too weak to see it. The premise share has no detection floor; its demotion rule is a comparison of two shares, stated in the scoring node. Every v2 test runs on dates that were used to build the design. What the register fixes in advance is the threshold, the floor and the two outcome sentences; it does not make a result out-of-sample, and no v2 result in the memo is called confirmatory. The forward seal from the memo date holds zero observations today. The memo's framing for every v2 result is: in-sample, registered thresholds. The register also holds the parameters fixed before a run: the earnings weight floor, set from the distribution of daily reporting weight; the condition-number bound; and the unwind dates for the event study, taken from the reversal record. Rows that test the memo or the developer's process rather than the market are kept in a process appendix; the v1 rows are archived with their outcomes.
    checks:
      - "the build fails if any placeholder for an unresolved outcome remains in the memo"

  - id: labels
    validation: true
    name: Hand-labelled sample
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: the labels are used only to score the classifier and the keyword rule, never to train them
    inputs:
      - "the hand-labelled sample"
      - "risk statements per company, on both runs"
      - "news risk statements, dated, on both runs"
    outputs:
      - "precision and recall, for the classifier and the keyword rule"
    rule: |
      Sentences are labelled as risk statements or not, by hand, and the classifier's and the keyword rule's records are scored against them: precision and recall on the whole sample, with binomial intervals; at 100 sentences no split by leg or layer would resolve. The classifier's gain over the keyword rule on this sample is the design's measured claim for where the language model adds value in extraction.
    open:
      - "Has not yet run; in the proof of concept the author labels 100 filing sentences."

  - id: volvalidation
    validation: true
    name: Scoring
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: ""
    inputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book, with the observations behind them"
      - "the probability of the event"
      - "the unconditional baseline VaR"
      - "the calendar state of each day"
      - "book returns"
      - "page dates and their outcomes"
      - "per component above noise: the theme (a cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "the reversal record, 195 episodes since 1926"
      - "a row per test: threshold, detection floor, and the sentence that goes in the memo under each outcome"
    outputs:
      - "coverage, by state and by volatility tercile, and the pinball ratio of the model to the unconditional line with its shuffled-volatility control, with intervals"
      - "the three conditioning ratios, each with its interval"
      - "the expected-shortfall and probability checks, by state"
      - "the hit rate on threshold pages and the silence rate"
      - "the premise share, with its base rate"
    rule: |2
        $$\text{breach}_t = \mathbf{1}[R_{t,t+10} \le \mathrm{VaR}_t], \qquad \rho(e) = e\,(0.05 - \mathbf{1}[e < 0]), \quad e = R_{t,t+10} - \mathrm{VaR}_t$$
      Coverage is scored on formation months from December 2015, one observation each, about 130 by the memo date, and split two ways as checks: by calendar state and by volatility tercile, since a pooled test can pass by averaging opposite errors and a reader is never in the pooled sample. At 130 observations Kupiec's unconditional-coverage test at the 10% level accepts 3 to 10 breaches, 2.3% to 7.7%; eleven rejects; the row prints the region for the count at run time. The test rules out gross miscalibration and does not choose between the model and a baseline that also passes. The choice is made on pinball loss at $\tau = 0.05$, computed for the model and the unconditional line on the same months; the ratio is reported with a 90% interval from a block bootstrap of the months in blocks of six months, two quarters, longer than the forecast horizon and the covariance window, and the model is reported as beating the line only when the interval excludes one. The gain has a negative control: the same forecast rebuilt on the volatility series shuffled across time, 200 times, must not reproduce it. The detection floor for the ratio is found by simulation before the run and stated in the row. The three conditioning variables, the bear state, the calendar state and the volatility tercile, are each scored as a ratio to the scaled line with the same bootstrap, and printed beside the model whether or not they are used. Two checks are printed with counts and no threshold: the mean realised return on breach months against the mean expected-shortfall line on those months; and the share of months whose return fell below the unconditional VaR against the mean probability line. The hit rate on threshold pages, one outcome per crossing, is tested against the 5% base rate with a binomial interval; the trigger reads prices and the calendar only. The silence rate, the share of event days that no page covered, is printed beside it. The premise share is measured, not assumed: for each recorded episode with news on disk, the run says whether a theme rose above the placebo on the prior formation date, and the share is printed with its count beside the same share on the calm windows, which is its base rate. The rule is set in advance: if the share on the episodes is at or below the share on the calm windows, the theme machinery is reported as not separating the episodes from calm months, and the tail model, which does not use it, is the page's main number; with eight episodes and three calm windows the shares are coarse, and the counts are printed beside them. The share is measured on the model run.
    checks:
      - "register row with threshold and floor"
    open:
      - "EMPIRICS: the simulated floor for the pinball ratio at the observation count available."

  - id: bombtest
    validation: true
    name: Event study for the vulnerable-name lists
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: ""
    inputs:
      - "the pre-catalyst list and the post-unwind list, by leg"
      - "daily returns per company"
      - "sector codes"
      - "the reversal record, 195 episodes since 1926"
      - "a row per test: threshold, detection floor, and the sentence that goes in the memo under each outcome"
    outputs:
      - "each list's excess move over sector-matched companies, per unwind, and whether the test passed"
    rule: |
      The event study covers the recorded unwinds since 2020 in the reversal record, listed by date in the register before the run, each dated by its first breach day. It measures whether the listed companies moved in the loss direction by more than sector-matched companies not on the list over the ten sessions after the freeze, using positioning data as it was available at the time. The pre-catalyst list is frozen 21 sessions before the first breach day; the post-unwind list five sessions after it. The freeze dates are set from the record, so the test is of list content, not of timing. The test passes when both conditions hold: the mean excess move across the unwinds exceeds the detection floor stated in the row, and the excess has the same sign on all but at most one unwind. A list that fails is not printed on any page and is listed in the footer. All unwinds are design tier.
    checks:
      - "register row"
    on_failure: the lists are not printed
    open:
      - "EMPIRICS: the first-breach dates from the reversal record."

  - id: themevalidation
    validation: true
    name: Theme pipeline against the PM's list
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: human
    mitigation: there is no history until a PM edits the list; this is a production measurement
    inputs:
      - "the worry list, versioned"
      - "per component above noise: the theme (a cluster) or none, its excess weight by leg, the runner-up, and one quote per company, on both runs"
      - "a row per test: threshold, detection floor, and the sentence that goes in the memo under each outcome"
    outputs:
      - "the share of PM-added entries the pipeline had surfaced first; the share of themes the PM later adopted"
    rule: |
      Run quarterly, from two logs: the edit log (each entry the PM added, with its date) and the theme log (each cluster that was a component's theme, with its centroid and the date it was first named). For each added entry, the pipeline surfaced it first if a logged theme centroid lay within $d^*_c$ of the new entry's reference point before the edit date. For each logged theme, the PM adopted it if an entry within $d^*_c$ of its centroid was added later. The two shares are printed with their counts. The first reading is four quarters after a PM starts editing the list.
    checks:
      - "register row"

