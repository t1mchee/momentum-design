  rule: 'Before each test runs, a row records the threshold and the sentence the memo carries if it clears and if
    it does not; closing a gap deletes the losing branch. Detection floors by simulation before any test (row 12):
    a null above the floor is a finding, below it the test was too weak (instrument-limited). Sealed years (2023
    onward) opened once under criteria written first. Revisions logged: horizon twenty to ten days (before any test);
    entropy withdrawn (§5.3); Route 1 severity state broadened after the prototype date (post-hoc, labelled).

    '
  checks:
