  - review
  - drafting
  rule: 'A referee (role 15) reads a results-stripped design against a checklist; a dissenting referee (role 16)
    is a second prompt written to disagree; a research assistant (role 17) writes code, reviews, drafts and self-audits,
    code trusted only on tests run, prose numbers must cite a field. Planted-flaw hit rate and clean-design false
    alarm are the checks (row 11: chance-corrected agreement 0.60, hit rate 0.80, false alarm 0.20). The drafting
    model twice proposed a statistical shortcut that did not hold (a mean-only bias correction applied to a nonlinear
    index; seed agreement as reliability), both caught in review. Package ledger: 81 experiments, 27 supported,
    21 refuted, the rest inconclusive, instrument-limited or underpowered. Fourteen instrument faults logged, twelve
    caught by an existing check.

