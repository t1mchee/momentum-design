    of absolute loading, each name keeping its loading sign. Case flag: if loadings are opposite-sign across the
    legs the component is the momentum factor itself (comomentum) and is handed to the tail model as a state, not
    to the naming pipeline; if same-sign it is a theme and goes to naming. Diagnostic beside it: the first component
    of each leg decomposed separately.

