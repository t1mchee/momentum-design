edges:
  # data to the book
  - {from: prices, to: sort, carries: "returns and the universe", when: "at rebalance", mode: "backtest and live"}
  - {from: prices, to: random, carries: "the universe and sector codes", when: "at rebalance", mode: "backtest and live"}
  - {from: sort, to: random, carries: "leg sizes, capitalisation profile and sector counts", when: "at rebalance", mode: "backtest and live"}
  - {from: prices, to: covariance, carries: "daily returns", when: "at rebalance", mode: "backtest and live"}
  - {from: sort, to: covariance, carries: "the book's companies, both legs", when: "at rebalance", mode: "backtest and live"}
  - {from: random, to: covariance, carries: "the random portfolios", when: "at rebalance", mode: "backtest and live"}
  - {from: sort, to: pca, carries: "position weights", when: "at rebalance", mode: "backtest and live"}
  - {from: covariance, to: pca, carries: "shrunk covariance, for the book and for each random portfolio", when: "at rebalance", mode: "backtest and live"}
