- id: volmodel
  name: Vol model around catalysts
  lane: catalysts
  kind: deterministic
  status: settled
  inputs:
  - significance score per theme
  - ranked
  - by leg
  - names carrying the theme's signature
  - heavily positioned
  - not yet moving
  - approved catalysts
  - added catalysts
  - book returns
  - implied vol per name and around known event dates
  - baseline vol forecast around the same catalysts
  outputs:
  - forecast of the book's vol bump around each catalyst; comparison with implied
  rule: 'The claim is that the book hinges on one theme more than the market realises, so a catalyst for that theme
    matters more for the book than the market prices. Stated in vol. Target: realised volatility of the book over
    the five trading days centred on the catalyst, as a ratio to trailing 60-day realised vol. Regressors: theme
    score, the share of the book''s weight carrying the theme''s signature, the positioning overlap of that share,
    days to catalyst, and the GARCH forecast as a control. Training set: for every formation date, the earnings
    dates of the component set''s names in the following month from the filing calendar, knowable in advance. Output:
    the forecast bump beside implied vol around the same date.

    '
  checks:
  - realised bump against forecast on every past catalyst; forecast error against GARCH
  on_failure: GARCH baseline printed alone
  open:
  - 'Join: the v1 severity node prints a 10-day 5% VaR from a quantile regression. Does the vol model replace it
    on the page, sit beside it, or feed it (a vol forecast is an input a conditional quantile could use)?'
