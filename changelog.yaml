# Design change log. Rendered in the viewer's History panel. Newest first.
# Each entry: version, date, file (snapshot under versions/), commit (empirics repo, once committed),
# summary, changes (what), reasoning (why), status (done | current | planned).

entries:
  - version: v2-draft-7
    date: "2026-09-06"
    file: versions/v2-draft-7.yaml
    status: current
    summary: Applies the draft-7 fix list in full. The four joints where a cold reader lost the thread are closed, every consumed quantity has a producer, the proof-of-concept path runs end to end as listed, and the text is rewritten under ten writing rules.
    changes:
      - "One theme per component: the cluster step picks the list entry or residual cluster with the largest excess weight over placebo, and only if that excess beats what random portfolios reach; otherwise the component has no theme above placebo."
      - "The ablation runs on two complete text series, keyword and language model, each carried through extraction, assignment, naming and propagation. Text enters the tail model as the loss share by leg. Step 0 holds everything price and calendar; step 3 is the full model."
      - "Book effect is split into two signs: whether the book loses if the risk materialises (leg times company sign) and whether the risk is aligned with a reversal of the component (company times loading sign). Only aligned quotes count toward a theme. The loss share is price-only."
      - "The proof-of-concept path closes: news, the keyword news extractor, the initial worry list, the embedding space, text gathering, retrieval-only propagation, theme statistics and the register join it. Every node has one of four statuses (path, deferred, described only, retired), and the block says that nothing in v2 has run."
      - "The random node outputs portfolios only; each statistic is computed on them by the node that computes it for the book. Extraction runs once over the whole universe, the model reading the component set's documents directly and a distilled classifier labelling the rest, in backtest and production alike."
      - "The bear state has a producer (the reference series). The four page items that had none (agreement line, expected shortfall, the change since the last page, coverage by layer) have producers and edges. The vulnerable-name lists are withheld from the page until their event study runs."
      - "One vocabulary for look-ahead labels (clean, as-of, model, live-only, human) in the spec, the legend and both viewers. The legend gains kind, lane, access, direction and edge fields. A problem block states exposure, event, horizon, user and decision at the top."
      - "Forty-three contradictions between nodes resolved, among them: the market series uses the raw slope; the named component replaces the first component wherever naming may have moved; the positioning score is defined for names outside the book; earnings dates are projected from the prior year so the window is known in advance; the analogue search states what it uses before 2014; pages are scored against the unconditional quantile."
      - "Forty-four terms defined or numbers supplied, among them WML, DV01, pinball loss, the calendar baseline's resampling, era, news weight, the second reader, the case-flag scale, the 0-3 propagation rubric, the overlap's unit and the 20% it must beat, the encoder schedule and the BM25 setup."
      - "Writing pass: no verbs of speech or thought for pages and rules; carry reserved for the conferred/carried pair; no label-colon fragments; the three sentences a PM would stop at rewritten; the ten rules appended to the rubric as the standard for later drafts."
    reasoning: >
      The draft-6 skeptic could follow the spine but lost the thread at four joints, and traced the
      proof-of-concept path to show it could not run as listed. The LLM-pattern report found the vocabulary
      tells gone and a third-generation residue left: personification, one word in five senses, and label
      fragments. Both were right, and the fixes are surgical: no component was added or removed except the
      statuses and edges needed to make every consumed quantity traceable to a producer.

  - version: v2-draft-6
    date: "2026-09-06"
    file: versions/v2-draft-6.yaml
    status: done
    summary: The AI-use fix from the two rubric evaluations, plus the agreed writing items; validation steps marked on the canvas.
    changes:
      - "A keyword extractor runs beside the language model in both extraction steps (filings and news), scored on the same hand labels, and its statements are kept as a second series."
      - "The tail model's ablation gains step 2a (keyword carriers) and step 2b (model carriers); if 2b does not beat 2a by the registered margin, the memo says the model adds nothing to identification and the keyword extractor takes its place."
      - "The known-theme assumption's failure case is stated in the header, with the 77-of-86 finding as its measure."
      - "Definitions added to the legend: comparator, seal, design tier, validation. The catalyst example is made self-contained."
      - "A direction of bias written for the covariance caveat, the 13F lag, the missing options history, the live-date encoder and headline-only news."
      - "Margins proposed and frozen for the tail-model scoring (breach rate 3 to 7 per cent; pinball loss 5 per cent below the event-density baseline; step 2b 2 per cent below 2a) and for the event study (200bp over matched names, same sign in four of five unwinds)."
      - "A proof-of-concept path in the header: the components that run on public, as-of data today, what they produce, and what is deferred."
      - "Validation components carry validation: true and render with their own shape, a notched purple card, in both viewers; the legend panel shows the proof-of-concept path."
    reasoning: >
      Both rubric evaluators capped AI use at 2 because the extraction steps had no deterministic comparator,
      and both said the design could not show that a language model beats a keyword rule. The other items are
      the ones both listed as raising the total most and are writing rather than new components.

  - version: v2-draft-5
    date: "2026-09-06"
    file: versions/v2-draft-5.yaml
    status: done
    summary: The fix list applied in full. Standalone spec; every number and definition supplied; coinages replaced; rules in plain sentences.
    changes:
      - "A. Mechanical: the eight edges from retired nodes removed; six series everywhere; inputs that nothing produced now have a producer; duplicate edges merged; the seal contradiction resolved by labelling every v2 test design tier; the contagion-list test timed after the unwind starts; lane names lose their step numbers."
      - "B. Definitions and numbers: the driving series (highest time-series percentile that month); the bp-loss mechanism (weights, loadings and carrier betas times minus two component sigma over ten days); historical catalyst dates from 8-K filing dates and macro calendars, supplied by the market-data node; one positioning quintile, within each leg; the case-flag rule (leg means opposite in sign and above 0.1); a 24-month minimum history for percentiles; the joint family trigger for pages; a ten-day catalyst window starting five sessions before; price-only carriers defined; R-squared cutoff 0.5; residual clusters formed by HDBSCAN; cluster size 25 and 50 nearest statements; the encoder described as a masked LM with a date cutoff, pooled and fine-tuned; a Jaccard stability check; comomentum and 13F crowding per name defined; a 126-day sensitivity window with the unspecified comparison dropped; hedgeable units defined; series units stated; dollar-neutral legs; the reversal record defined and housed with the French file; the aptness rule; the page-scoring base rate; the response-log base rate; blind prompts described."
      - "C. Vocabulary: twin, canary, anchor, signature, lane, line, reading, headline, fire, bump, rung, time bombs, mass, crescendo view, instrument, machinery, banner, standing state, bites, vehicle, flatten, fingerprinted, gap, engine check and object are gone; conferred, carried, quote gate, case flag, context layer, event stream, catalyst window, hit, miss, silence, placebo, embargo and supersession stay, each defined at first use."
      - "D. A legend in the spec's meta for status, origin, look-ahead, row and the quote gate, rendered in both viewers; the known-theme assumption stated once and used instead of 'crescendo view'."
      - "E and F. Every synthesis and every rule rewritten in plain sentences with a named agent; edges carry when and mode separately."
      - "Structure: the spec no longer extends the v1 baseline; carried-over components are marked origin v1."
    reasoning: >
      Tim accepted every proposal in fixes-for-draft5.md. The parsimony cuts are not applied; the design is
      written so that they can be applied later without reopening these fixes.

  - version: v2-draft-4
    date: "2026-09-06"
    file: versions/v2-draft-4.yaml
    status: done
    summary: The thirteen decisions applied; every node carries a look-ahead label; data feeds labelled by access.
    changes:
      - "D1 one tail model: the vol model is retired and its regressors, a catalyst-window indicator, GARCH and an event-density baseline enter the severity quantile regression; lower-tail target; ablation ladder reported every run."
      - "D2 comparator: the component set's event-implied move, with the sector ETF's implied move printed as the hedge price; no book-level implied vol is claimed."
      - "D3 PCA: the book's variance share with position weights, sign fixed relative to the book, loss-direction composition, placebo from random books, the same-sign versus opposite-sign case flag routing comomentum to the tail model, a bulk-edge cut with Ledoit-Wolf shrinkage, a per-leg diagnostic, and a bridging regression on the six series."
      - "D4 look-ahead: a lookahead field on every node (none, data, model, model-unmitigable, human) with its mitigation; date-constrained encoder for the context space, clustering and retrieval; blind prompts and a cutoff split for extraction; the catalyst agent live-only and out of the backtest; the analogue panel retired."
      - "D5 embedding mechanics: taxonomy entries as queries whose neighbours' centroid is the anchor; canonical paraphrases; threshold from within-cluster distances; supersession instead of decay; re-assignment at each rebuild; text mass against sector-matched random sets; a run without anchors."
      - "D6 retirements kept on the canvas as retired with a reason: labeller, panel, referees, Route 1, Route 3, the classification rule (inventory kept), the vol model; the two cross-asset PCs dropped from the reference series; the product formula replaced by two placebo-referenced readings; PPI dropped from the labels."
      - "D7 event rule: calendar-fired five sessions before an approved catalyst plus threshold-fired on time-series percentiles; cross-sectional percentiles print as context only; the standing-state form named for production."
      - "D8 time bombs as two objects, pre-catalyst and contagion, by leg, each with a registered event study on the five in-sample unwinds before printing."
      - "D9 positioning: comomentum and 13F crowding with equal weights, short interest as the loser-leg line, quintile over the book, maximum input lag printed; production feeds listed separately."
      - "D10 the page: bp loss under minus two sigma with direction, VaR and catalyst-window VaR beside the implied comparator and the hedge price, one ten-day horizon, what changed, beta mapping to the reader's book; 'get out now' dropped."
      - "D11 text: 10-K and 10-Q as the context layer, 8-Ks and transcripts as the event stream, GDELT and official release pages as the public news archive; every feed labelled PUBLIC, LICENSED or DESK-ONLY, including research, dealer colour, Bloomberg and per-name positioning as not available to us now."
      - "D12 organising principle: PCA first, with an agreement line against the taxonomy's top entry."
      - "D13 news in two lanes, slow context and a fast lane feeding the catalyst agent; up to three components behind the bulk edge."
      - "My own call, flagged: printed numbers use value weights, equal-weighted readings in the appendix."
    reasoning: >
      Tim accepted every pick in decisions-for-draft4.md, adding that all production feeds should be in the
      design with a clear public versus not-available label, and that the design need not be causal
      end to end because the proof of concept will be scoped to the clean parts. The look-ahead labels
      are the instrument for that scoping.

  - version: v2-draft-3
    date: "2026-09-06"
    file: versions/v2-draft-3.yaml
    status: done
    summary: Full system restored. The call redesigned one part; everything not discussed stays as in v1.
    changes:
      - Spec now extends the v1 baseline and overlays only the parts the call changed, so the diff against v1 is the file itself.
      - "Restored from v1, unchanged: eight reference series, random portfolios and same-rule sorts, sensitivities and z-scores, the labeller, Route 1 to 3 detectors, the classification rule, the severity quantile model, event rule, composer, falsifiers and hit-and-miss log, sign-off and response log, register, hand-labelled sample, referee roles."
      - "Replaced by the call's design: the loser-leg text pipeline (filings, filter, extractor, quote gate, mapper, vocabulary, condition measures, date-constrained readers, catalyst extraction) becomes decomposition, news context, naming, propagation; positioning becomes overlap and time bombs; the calendar becomes catalyst proposal with PM review; the claim-6 evidence node becomes the theme and vol validations."
      - Added the vol model beside severity rather than in place of it, with the join flagged.
      - Five join points flagged as open where the new part meets the untouched part.
    reasoning: >
      Tim's instruction: what was discussed on the call is the loser-leg pipeline and its consequences; parts not
      discussed remain as they were. Draft 2 had dropped the routes, severity, z-scores and register on my own
      proposal, which was accepted in the moment but exceeded the call's scope. Restoring them keeps the design
      honest about what has actually been decided, and the joins are where the next decisions sit.

  - version: v2-draft-2
    date: "2026-09-06"
    file: versions/v2-draft-2.yaml
    commit: 3db2ca749
    status: done
    summary: The fourteen open questions answered and folded in; demo-versus-production split removed.
    changes:
      - Decomposition on both legs, reported by leg; 126-day market-residual covariance; top three components; top-quartile absolute loadings.
      - Embedding space built in two branches, unsupervised news clusters then PM terms as fixed centroids, with a distance threshold and residual clusters.
      - Extraction prompt changed to up to three one-year risk factors with sign; quote gate and hand labels kept.
      - Clustering with three-month half-life decay and one vote per company per theme per quarter.
      - Propagation over the whole universe with a 0 to 3 relevance score, 2 as the threshold.
      - Theme score formula, time-bomb definition, vol model target and regressors, GARCH(1,1) control, validation nodes.
      - All "for the demo" qualifiers removed; sources are the intended ones.
      - "Dropped (superseded in draft 3): routes, classifier, severity, z-scores, falsifiers, the proof-of-concept node."
    reasoning: >
      Tim asked for a proposed solution to each open question before implementing, then accepted them as written.
      He also ruled that the spec is the hypothetical system with no demo split at this stage, which is now a
      standing instruction.

  - version: v2-draft-1
    date: "2026-09-06"
    file: versions/v2-draft-1.yaml
    status: done
    summary: Transcription of the advisor call, with every unclear point attached to its node as a question.
    changes:
      - Eleven lanes following the call's numbered sections, steps 1 to 5, positioning, catalysts and vol, output, human, validation.
      - 29 nodes, 46 edges, 54 open questions, plus a placeholder node listing the v1 components with no decision.
    reasoning: >
      Tim sent the call notes and asked for them implemented in the sheet with questions on anything unclear.
      The notes covered one part of the system; the placeholder node was the first flag that the rest was undecided.

  - version: v1-baseline
    date: "2026-09-06"
    file: versions/v1-baseline.yaml
    status: done
    summary: The memo's existing design, transcribed node by node from commit f3a9c75.
    changes:
      - 40 nodes across nine lanes, 56 edges, 82 open questions carried over from the cold read and the ML review.
    reasoning: >
      Tim asked for the existing design populated first so the redesign could be laid against it.

