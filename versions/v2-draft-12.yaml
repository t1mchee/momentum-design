# System design v2, draft 12. Standalone (no base file). Draft 11 with the corrections from its
# catch-out read (docs/reviews/pm-catchout-v2-draft-11.md). Draft 11 was draft 10 simplified under one rule, from the
# PM catch-out read and its fix list (fixes-for-draft11-proposal.md): where there was a decision, the
# simpler mechanism that can be walked through with one example was taken. Retired components stay, with
# the reason and no edges. Formulas are LaTeX, rendered by KaTeX: $$...$$ on a line of its own for a
# display formula, $...$ inline; |x| for abs, \sum, \operatorname{sign}, \mathbf{1}[.] for an indicator,
# q_{95} for a 95th percentile of a history.
#
# Fields per node: id, name, lane, kind (data | deterministic | model | human | output), status (settled |
# retired), origin (v1 | v2), lookahead (clean | as-of | model | live-only | human), mitigation, access
# (data nodes: public | mixed), inputs, outputs, rule, checks, on_failure, open, validation (true on the
# components that score other components). Empty checks, on_failure and open fields are omitted.
# Fields per edge: from, to, carries, when (daily | weekly | monthly | at rebalance | on change | on event |
# on release | quarterly | once), mode (backtest and live | live only | backtest only), feedback.

meta:
  title: Momentum reversal-risk system, v2 draft 12
  version: v2-draft-12
  updated: "2026-09-07"
  problem:
    exposure: "the 12-1 momentum book: the top and bottom deciles of the Russell 3000 by return from twelve months before to one month before, value-weighted within each leg, dollar-neutral, rebuilt monthly"
    event: >-
      a ten-day return of the reconstructed book at or below its own unconditional 5% quantile on the history since December 2013: $\text{event}_t = \mathbf{1}[R_{t,t+10} \le Q_{0.05}(R_{u,u+10},\ \text{Dec 2013} \le u \le t-10)]$. The tail model forecasts that quantile conditionally; a page is scored against the unconditional one. The French factor's -432bp is the same quantile on the published factor over 1926 to 2022, printed as the long-run reference and used for the reversal record before December 2013, where no reconstructed book exists
    horizon: "ten trading days, for every forecast on the page"
    user: "the PM running momentum, or the risk manager covering that book"
    decision: "whether and how much to hedge the book's exposure to the named theme before the next catalyst, and, once the event study on the vulnerable-name lists has run, which companies to trim; the page gives the direction of the risk and the hedge, sized, and the reader decides"
  note: >
    The design assumes that the theme behind a reversal has been building in the news for some time and that
    the PM can put a label on it. The system measures how much of the book depends on that theme, where it
    has spread, who is positioned on it, and how much worse the book's tail becomes around the next catalyst.
    In the backtest it finds themes as clusters of risk statements in the news; on the live page the PM's
    worry list gives those clusters names. This is the known-theme assumption. It fails when a reversal
    comes from a theme that had not appeared in the news. On such a day the page shows no theme, or the
    wrong one, and the VaR is unchanged, because the tail model does not take the theme. This case may be
    common: 77 of the 86 episodes that v1's rules could not classify were loser-leg losses in a rising
    market with no prior bear state. Whether a theme was visible before those episodes is measured, not
    assumed; the premise share is an output of the scoring node.
  legend:
    status: "settled = decided in v2; retired = replaced, kept with the reason."
    origin: "v1 = a component retained from the first design, rewritten here only in language; v2 = new."
    kind: "data = a feed (grey pill); deterministic = a rule with no model (white box, blue band); model = a language-model component (orange); human = a person's task (tan hexagon); output = the page (green double border)."
    lane: "a rendering row in the full view; the seven numbered groups in the levels view are the reading order."
    lookahead: >
      clean = uses only values that were public on the date; as-of = the values exist historically but must be
      taken at their release date; model = a model trained after the date reads text from inside it; live-only
      = the node runs on live data only and no backtest claim depends on it; human = a person's input that a
      backtest runs without. A node's label is at least the strongest label among its backtest-mode inputs.
      The label decides one thing: a statistic labelled model enters a registered test only beside its
      comparator run, which is clean or as-of, and the row reports both.
    access: "public = every feed the node uses is public; mixed = public feeds now, with licensed or desk-only feeds named for production. LICENSED = a commercial feed we would buy for production; DESK-ONLY = a feed available only inside a fund; neither is available to us now."
    comparator: "a method that does the same job as a model step without a language model, printed beside it, so the model's contribution is visible."
    quote gate: "every span a model extracts must appear verbatim in its source document, or the record is dropped and counted."
    two runs: "the risk statements are produced twice, by the classifier trained on language-model labels (the model run) and by the keyword rule (the keyword run). Both runs are followed as far as the theme, so the theme's excess weight and its label exist on both; propagation, the statistics and the page use the model run."
    model version: "when a model's version changes, every stream it feeds is recomputed and the page prints the level shift."
    seal: "a block of dates held back from all design work and opened once for a confirmatory test; the 2023-onward seal was opened in v1, so no unopened seal exists today."
    design tier: "a result measured on dates that were used to build the design; it is reported as in-sample and does not count as confirmatory."
    validation: "a component that scores another component and feeds nothing to the page; marked with its own shape on the canvas."
    notation: "LaTeX rendered by KaTeX. Every rule that computes a number gives its line first and its sentence second. Every regression is written once, stating what is regressed on what, over which observations, and what is reported; a forward-return target is used only on observations whose target is realised. The system has one residualisation, $u$. Named estimators and tests are named, not derived."
  symbols:
    '$W, L$': "the winner and loser legs"
    '$w_i$': >-
      company $i$'s position weight: $\mathrm{cap}_i / \sum_W \mathrm{cap}$ for $i$ in $W$, and $-\mathrm{cap}_i / \sum_L \mathrm{cap}$ for $i$ in $L$, so $\sum_W w_i = 1$ and $\sum_L w_i = -1$; $\sum_i |w_i| = 2$ is the gross weight
    '$R_t, R_{t,t+10}$': "the book's daily return, $\\sum_i w_i r_{it}$, and its ten-day forward return from start $t$"
    '$m_t, x_{st}$': >-
      the market (S&P 500) return, and reference series $s = 2, \dots, 6$ (ten-year yield change, WTI, the dollar, the credit spread, the mega-cap spread); 'the six reference series' means $m$ and $x_2, \dots, x_6$
    '$r_{it}, u_{it}$': >-
      company $i$'s daily return, and its residual from the one first-stage regression on the market, $r_{it} = a_i + b_i m_t + u_{it}$ over the trailing 126 days
    '$\Sigma, \lambda_k, v_k, v_{ik}$': >-
      the Ledoit-Wolf covariance of $u$ over the book's companies; its $k$-th eigenvalue and eigenvector; company $i$'s loading on component $k$
    '$f_{kt}, \sigma_k, g_k$': >-
      component $k$'s daily return, $f_{kt} = \sum_i v_{ik} u_{it}$; its ten-day sigma, $\sqrt{10}$ times the sd of $f_k$ over the window; the book's loading on it, $g_k = w'v_k$
    '$S_s$': "the book's exposure to series $s$, $\\sum_i w_i \\beta_{is}$, with $\\beta_{is}$ the 126-day slope of $u_i$ on $x_{st}$ (of $r_i$ on $m_t$ for the market)"
    '$\mathrm{VS}_k$': "the book's variance share on component $k$, $\\lambda_k (w'v_k)^2 / (w' \\Sigma w)$"
    '$d^*, \mathrm{NW}_e$': "the assignment distance, and the news weight of worry-list entry $e$: the number of news risk statements within $d^*$ of its reference point"
    '$E_e$': "the excess quote weight of entry $e$: the component set's aligned weight on $e$ minus the placebo weight from the random portfolios"
    '$O$': "the positioning overlap: the share of theme companies' book weight that is in the crowded quintile, per leg"
    '$\sigma_t, c(t), B_t$': "the book's ten-day sigma at $t$ ($\\sqrt{10}$ times the sd of $R$ over the trailing 126 days); the calendar state of $t$, inside or outside a catalyst window; the bear state, 1 if the trailing 24-month market return is negative"
    '$\mathrm{VaR}_t, \mathrm{ES}_t$': "the tail model's ten-day 5% quantile forecast and expected shortfall on day $t$, returns, so negative"
  proof_of_concept:
    status: "planned; as of the memo date no v2 component has run. News on disk is headline sets for eight registered episode windows (2018-02, 2019-09, 2020-11, 2021-01, 2022-11, 2024-08, 2025-01, 2025-04) and three calm windows, not a daily archive, so the theme pipeline runs on those eleven formation dates and the memo date; the tail model runs on every month"
    path: [prices, refseries, french, sort, random, covariance, pca, bridge, filings, news, newsagent, embedspace, gathertext, riskextract, cluster, namecluster, propagate, themescore, baselines, severity, labels, register, volvalidation]
    path_notes:
      newsagent: "keyword rule only; the language model does not label news in the proof of concept"
      embedspace: "one named public encoder, BM25 beside it"
      riskextract: "the language model labels 2,000 filing sentences once; the classifier runs on the universe"
      news: "the eight episode windows and three calm windows on disk, and the trailing twelve months for the memo date"
      propagate: "retrieval over the rest of the book only; the crowded scope needs the positioning feeds"
      labels: "100 filing sentences, labelled once by the author"
      register: "the rows for the coverage test, the pinball ratio and the labels"
    produces: "(1) the tail model's coverage and pinball ratio on about 130 months against both baselines, with the probability line, in-sample with registered thresholds; (2) precision and recall of the classifier and of the keyword rule on 100 hand labels; (3) the theme, its excess weight, its label and its quotes on the memo date, on both runs; (4) the same on the formation date before each of the eight episode windows and on the three calm windows; (5) the premise share over the eight episodes, with the calm windows as its base rate"
    deferred: [posdata, poscluster, timebombs, bombtest, options, catagent, catapprove, analogue, sensitivities, percentiles, drivingseries, taxonomy]
    described_only: [pmworries, eventrule, thepage, signoff, responselog, themevalidation]

