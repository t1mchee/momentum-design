# System design v2, draft 5. Standalone (no base file). Applies docs/design/fixes-for-draft5.md in full:
# dangling references removed, every number and definition supplied, coinages replaced by plain words,
# rules rewritten with a finite verb and a named agent. Retired components stay, with no edges.
#
# Fields per node: id, name, lane, kind (data | deterministic | model | human | output), status (settled |
# retired), origin (v1 | v2), lookahead (none | data | model | model-unmitigable | human), mitigation, access
# (data nodes: public | mixed), inputs, outputs, rule, checks, on_failure, open.
# Fields per edge: from, to, carries, when (daily | weekly | monthly | at rebalance | on change | on event |
# on release | quarterly | once), mode (backtest and live | live only | backtest only), feedback, hidden.

meta:
  title: Momentum reversal-risk system, v2 draft 5
  version: v2-draft-5
  updated: "2026-09-06"
  note: >
    The design assumes that the theme behind a reversal is known before the reversal, builds in the news,
    and can be named by the PM. The system's job is to measure how much of the book depends on that theme,
    where it has spread, who is positioned on it, and how much worse the book's tail becomes around the next
    catalyst. It does not try to discover the theme. Call this the known-theme assumption.
  legend:
    status: "settled = decided in v2; retired = replaced by v2, kept with the reason."
    origin: "v1 = a component carried over from the first design, rewritten here only in language; v2 = new."
    lookahead: >
      clean = uses only values that were public on the date; as-of = the values exist historically but must be
      taken at their release date; model = a model trained after the date reads text from inside it, and the
      mitigation says how that is bounded; live only = no mitigation exists and the node is excluded from
      every backtest; human = a person's input that a backtest must run without.
    row: "a row of the pre-registration register (Appendix C of the memo)."
    quote gate: "every span a model extracts must appear verbatim in its source document, or the record is dropped and counted."

lanes:
  - {id: data, name: Data in}
  - {id: book, name: The book and its nulls}
  - {id: exposure, name: Exposure}
  - {id: decomp, name: Decomposition}
  - {id: context, name: Context space}
  - {id: naming, name: Naming}
  - {id: propagate, name: Propagation}
  - {id: positioning, name: Positioning}
  - {id: tail, name: Tail model}
  - {id: catalysts, name: Catalysts}
  - {id: analogue, name: Analogues}
  - {id: page, name: The page and the people}
  - {id: research, name: Validation}
  - {id: retired, name: Retired}

nodes:
  # ============================================================ data in
  - id: prices
    name: Market data and calendars
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: none
    mitigation: index membership is taken at the announcement date of each change, which precedes the effective date; calendars are known in advance
    access: public
    inputs: []
    outputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
      - "sector codes"
      - "earnings dates per name"
      - "scheduled macro releases"
    rule: |
      The universe is the constituent list of the Russell 3000 ETF, taken from the fund's archived daily holdings at the announcement date of each change (public). Daily prices are adjusted for corporate actions (public, Stooq or Tiingo; CRSP in production, licensed). Sector codes come from EDGAR SIC codes (public); GICS in production (licensed). A delisted name leaves the book at its delisting return; it is not carried forward at a zero return. Earnings dates per name come from the filing dates of 8-K Item 2.02 historically and from company calendars live (public). Scheduled macro releases (FOMC, CPI, payrolls, index rebalances) come from the published calendars (public). The page prints value-weighted numbers, because mega-cap concentration is the theme most often under watch; equal-weighted versions are computed and kept in the appendix.
    checks:
      - "monthly correlation of the reconstructed book with the French factor, reported"
    on_failure: the previous day's state is held and the page states it
    open: []

  - id: refseries
    name: Six reference series
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: data
    mitigation: revised series are taken from ALFRED first-print vintages; none of the six is revised, so the mitigation is a safeguard
    access: public
    inputs: []
    outputs:
      - "six daily series"
    rule: |
      The six series, with units: the S&P 500 return; the change in the ten-year yield in basis points; the front-month WTI return; the dollar index return; the change in the investment-grade credit spread in basis points; and the return of the ten largest index names minus the return of the equal-weighted index, constructed from holdings. The list is fixed and its tests are corrected for multiple comparisons as one family. Adding a series requires re-registering the family. The two cross-asset principal components of v1 are retired because they could not be read on the page.
    checks:
      - "the family correction is applied to every percentile printed for the six"
    on_failure: the series is left off the page and the page names it
    open: []

  - id: filings
    name: Company text, in layers
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: none
    mitigation: every document is dated at acceptance or receipt, and every extracted span must pass the quote gate
    access: mixed
    inputs: []
    outputs:
      - "risk-factor and outlook text per name, dated"
      - "intra-quarter event text per name, dated"
    rule: |
      Text comes in three layers, each feed labelled by access. The context layer is the latest 10-K accepted before the formation date plus the latest 10-Q's Part II Item 1A where it is newer; Item 1A and the MD&A overview are cut by regex on the standard headers (PUBLIC, EDGAR). The event stream is 8-K Items 2.02, 7.01 and 8.01 with exhibits (PUBLIC, EDGAR) and earnings-call transcripts (PUBLIC for a subset through free feeds; LICENSED for full coverage). The production layer is equity research (LICENSED, not available to us now) and dealer colour and prime-broker notes (DESK-ONLY, not available to us now). Every extracted span must appear verbatim in its source before storage; this is the quote gate referred to throughout.
    checks:
      - "coverage per name, by leg and by layer, printed"
      - "quote gate"
    on_failure: the name is marked unread on that layer and the coverage line shows it
    open: []

  - id: news
    name: News, slow and fast
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: data
    mitigation: for each backtest date the embedding space is rebuilt from the archive as it stood on that date
    access: mixed
    inputs: []
    outputs:
      - "headlines and articles, timestamped, rolling twelve months"
      - "items from the last five sessions"
    rule: |
      News is processed twice. A slow process over a rolling twelve-month archive, rebuilt weekly, supplies the embedding space in which themes are placed. A fast process over the last five sessions supplies the catalyst proposer each day. Feeds: GDELT headlines and URLs (PUBLIC; article text is not included), Fed, Treasury and BLS release pages (PUBLIC), SEC press-release exhibits (PUBLIC), Bloomberg and Reuters headlines (LICENSED, not available to us now). Every item is timestamped at publication.
    checks:
      - "the source list is versioned"
      - "for a backtest date, only items published before that date enter the rebuild"
    on_failure: the previous week's embedding space is reused and the page marks it stale
    open: []

  - id: posdata
    name: Positioning feeds and score
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: data
    mitigation: every source is keyed to its release date, never to settlement or period end; the longest input lag is printed with the score
    access: mixed
    inputs: []
    outputs:
      - "positioning score per name, with the longest input lag"
      - "short interest per name"
    rule: |
      Each name gets a positioning score from two inputs, each converted to a rank within the name's leg. The first is comomentum: the name's average residual correlation with the other names in its leg over the trailing 126 trading days (PUBLIC, from returns). The second is 13F crowding: the number of momentum-style filers holding the name, where a momentum-style filer is one whose holdings sit in the top decile of 12-1 rank on average (PUBLIC, 45-day lag). The score is the mean of the two ranks. Short interest (PUBLIC, two-week lag) is reported beside the score as a separate measure for the loser leg; it does not enter the score. Heavily positioned means the top quintile of the score within each leg of the book. Production feeds, each printed as a separate line when present: securities-lending utilisation (LICENSED), options open interest (PUBLIC, delayed), ETF flows (PUBLIC), prime-broker aggregate colour and per-name positioning (DESK-ONLY, not available to us now). Whenever the page prints the score it also prints the longest reporting lag among the score's inputs on that day.
    checks:
      - "longest input lag printed"
      - "the history of the overlap statistic is kept"
    on_failure: the score is omitted, the two lists of vulnerable names are omitted, and the page states that they are missing
    open: []

  - id: options
    name: Event-implied moves
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: data
    mitigation: historical implied moves are taken from surfaces as they stood on the date; where no history exists the comparison is marked illustrative
    access: mixed
    inputs: []
    outputs:
      - "implied ten-day move per component name, in per cent"
      - "sector ETF implied move, in per cent"
    rule: |
      The comparison for the catalyst-window increase in VaR is the component set's event-implied move: each component name's implied earnings move (LICENSED for history through OptionMetrics; PUBLIC delayed data for the live date), weighted by its loading on the first component, stated as a ten-day move in per cent. The implied move of the sector ETF that holds the largest share of the component set's weight is printed beside it as the cost of the hedge (PUBLIC, delayed). We do not construct a book-level implied volatility; the comparison is made for the component names only.
    checks: []
    on_failure: the comparison is marked illustrative
    open: []

  - id: french
    name: French factor file and the reversal record
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: none
    mitigation: thresholds were frozen on the 1926 to 2022 sample before any test ran
    access: public
    inputs: []
    outputs:
      - "daily WML from 1926"
      - "the reversal record, 195 episodes since 1926"
    rule: |
      The file provides a long history and a check that the reconstruction matches a published series. French's construction (a 2x3 value-weighted sort) differs from ours, so we measure the agreement rather than assume it. Two thresholds come from the file and were frozen in advance: a reversal is a ten-day return at or below -432bp, the 5th percentile of overlapping ten-day factor returns from 1926 to 2022; a crash day is a daily return at or below -933bp, the 1st percentile of daily factor returns over the same dates. The reversal record is every episode that breached the ten-day threshold, breach days within 21 days collapsed to one episode: 195 episodes since 1926, on the French file before December 2013 and on the reconstructed book after it. The record feeds the analogue and the validation.
    checks:
      - "the monthly correlation between the reconstructed book and the French factor is reported"
    on_failure: n/a
    open:
      - "EMPIRICS: the correlation statistic, and confirmation that the crash-day threshold is defined on daily returns."

  # ============================================================ the book and its nulls
  - id: sort
    name: 12-1 sort, the book
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: the ranking window closes at formation
    inputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
    outputs:
      - "winner leg and loser leg"
      - "position weights"
      - "leg sizes and cap profile"
      - "book returns"
    rule: |
      On each formation date the rule ranks every name on its return from twelve months before to one month before, skipping the latest month; the top decile is held long and the bottom decile short. Within each leg names are value-weighted, the legs are dollar-neutral, and the book return is the winner return minus the loser return. The book is rebuilt monthly and measured daily. The position-weight vector w, positive for winners and negative for losers, is the input to every book-level statistic. The decomposition runs on both legs together, and every statistic is also reported for each leg separately.
    checks:
      - "leg sizes and the cap profile are logged"
    on_failure: the previous month's book is used and the page states this at the top
    open: []

  - id: random
    name: Random portfolios, the null
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: drawn on the same date from the point-in-time universe
    inputs:
      - "point-in-time universe, about 300 names per leg"
      - "leg sizes and cap profile"
      - "sector codes"
    outputs:
      - "N random portfolios per date, cap-matched"
      - "N random portfolios per date, cap-and-sector-matched"
      - "the same statistics computed on each random portfolio: exposures, eigenvalues, variance shares, quote weights"
    rule: |
      For each date we draw N random portfolios from the same universe with the same leg sizes and capitalisation deciles, so that the only difference from the book is that they were not ranked on past returns. N is 200 for every statistic printed in v2; v1 used 500 in the register and 120 for the cross-sort comparison, and those runs are labelled with their N. The cap-matched set is the main null for the exposure statistics. A second set also matched on sector is the main null for the text statistics, because a macro bet is usually expressed through a sector tilt, and is printed beside the first for the exposures. Every statistic the design prints for the book is also computed on each random portfolio, and the book's percentile among them is what the page shows.
    checks:
      - "the construction parameters are hashed and stored with each run"
    on_failure: n/a
    open: []

  - id: controls
    name: Control sorts
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: same windows as the book
    inputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
    outputs:
      - "6-1 and 24-13 sorted books"
      - "the book ranked 24 months earlier"
      - "a random-ranking control"
    rule: |
      Three controls. Two other return sorts on the same date, 6-1 and 24-13, test whether an exposure is specific to the 12-1 rule or generic to sorting on past returns; in v1 the 12-1 sort had the largest exposure on 42.6% of 108 dates against a third by chance. The book as ranked 24 months earlier controls for persistent name characteristics. A control sort on random rankings should show no exposure; its normal range is the middle 90% of its own placebo distribution, and if it leaves that range the day's null result is withdrawn.
    checks:
      - "the random-ranking control sits inside its 90% range"
    on_failure: the day's null result is withdrawn
    open:
      - "EMPIRICS: why 108 dates for the cross-sort comparison against 137 for the exposure test."

  # ============================================================ exposure
  - id: sensitivities
    name: Sensitivities, conferred and carried
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: rolling windows close before formation
    inputs:
      - "winner leg and loser leg"
      - "six daily series"
      - "the book ranked 24 months earlier"
    outputs:
      - "conferred and carried spread per series"
    rule: |
      For each name and each of the six series we fit a rolling slope over the trailing 126 trading days, one series at a time, on market-residualised returns; the raw slope is kept in the appendix. The winner-minus-loser spread of those slopes is measured twice: over the ranking window, which we call the conferred exposure because the ranking selected it, and over the holding period, the carried exposure. A conferred exposure with no carried one is a sort that selected something the book then lost. The spread of the book ranked 24 months earlier is printed beside it as the control for persistent name characteristics.
    checks:
      - "sign stability across weighting, rebalance date, universe and window is reported in the appendix"
    on_failure: the series is left off the page
    open: []

  - id: zscore
    name: Exposure in hedgeable units, with two percentiles
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: random portfolios are drawn on the same date; the history starts in December 2013
    inputs:
      - "conferred and carried spread per series"
      - "N random portfolios per date, cap-matched"
      - "N random portfolios per date, cap-and-sector-matched"
    outputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the driving series"
    rule: |
      For each series the conferred spread is printed in units a desk can hedge: the slope times the book's NAV is the notional of that series the book is exposed to, stated for the ten-year as DV01-equivalent dollars per $100m of book and for the index as a beta. Two percentiles are printed beside it. The first is against the random portfolios and answers whether the sort produced the exposure. The second is against the book's own history from December 2013, with a minimum of 24 months before it is printed, and answers whether today is unusual. Only the second can trigger a page. The driving series is the one of the six on which the book's exposure has the highest time-series percentile that month; it is re-chosen at each rebalance and printed by name. The v1 family-maximum statistic is not used.
    checks:
      - "v1 claim 1 (market beta above the 95th random-portfolio percentile on 105 of 137 month-ends) is used to check the instrument, not reported as a result"
    on_failure: n/a
    open: []

  - id: route2
    name: Driving-series exposure
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: n/a
    inputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the driving series"
    outputs:
      - "the winner leg's exposure to the driving series, in hedgeable units, with the names inside the leg that carry it"
    rule: |
      This is the one v1 detector a desk would use. It is kept as a statistic and no longer called a route. It reports the winner leg's exposure to the driving series in hedgeable units, its two percentiles, and which names inside the leg carry most of it.
    checks: []
    on_failure: n/a
    open: []

  # ============================================================ decomposition
  - id: covariance
    name: Covariance of the book's names
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: the window closes at formation
    inputs:
      - "daily returns per name"
      - "winner leg and loser leg"
    outputs:
      - "shrunk covariance matrix over the book's names"
    rule: |
      We take daily returns over the trailing 126 trading days ending at formation, remove the market return, and estimate the covariance with Ledoit-Wolf shrinkage, because about 600 names against 126 days would otherwise give a rank-deficient matrix. Sector returns are not removed, because a theme is often expressed through a sector and removing it would hide, for example, memory behind semiconductors.
    checks:
      - "the condition number is printed"
    on_failure: the decomposition is not run this period and the page states it
    open:
      - "Parked by the advisor: a covariance-only decomposition misses links between names that were not historically correlated. The propagation step partly answers it by searching other names for the theme."

  - id: pca
    name: Components, book variance share, and sign
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: arithmetic on the point-in-time book
    inputs:
      - "shrunk covariance matrix over the book's names"
      - "position weights"
      - "the same statistics computed on each random portfolio: exposures, eigenvalues, variance shares, quote weights"
    outputs:
      - "components above the noise threshold, at most three"
      - "per component: the book's variance share and its percentile against random portfolios"
      - "per component: the component set with each name's loading sign"
      - "per component: the case flag"
      - "per component: its daily return and ten-day sigma"
      - "price-only carriers"
    rule: |
      We take the eigen-decomposition of the shrunk covariance and keep components whose eigenvalue exceeds the Marchenko-Pastur noise threshold, at most three. For component k the statistic is the book's variance share, lambda_k (w'v_k)^2 / (w'Sigma w), which is the share of the position-weighted book's variance the component carries, not the share of name-level variance. It is printed with its percentile against the same statistic on the random portfolios. The component's sign is fixed so that its position-weighted return over the window is positive. The component set is the top quartile of names by absolute loading, each keeping the sign of its loading. Case flag: we compute the loading-weighted mean loading in each leg; if the two means have opposite signs and each exceeds 0.1 in absolute value, the component is the momentum factor itself and enters the tail model as a state variable rather than being named; otherwise it is a theme and passes to naming, with the two leg means printed. If the first component is the factor, naming runs on the second. Price-only carriers are names outside the component set whose 126-day correlation with the component exceeds that of the lowest name in the set; they are used by the tail model's ablation. As a diagnostic, each leg is decomposed separately and its first component printed beside the joint one.
    checks:
      - "the Jaccard overlap of the component set with the previous month's set is printed; below 0.5 the component is flagged unstable"
      - "percentile against random portfolios"
    on_failure: naming is not run and the page states it
    open: []

  - id: bridge
    name: Component against the six series
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: same window as the decomposition
    inputs:
      - "per component: its daily return and ten-day sigma"
      - "six daily series"
    outputs:
      - "R-squared and loadings of each component's return on the six series"
    rule: |
      We regress each component's daily return on the six reference series over the same window. A high R-squared means the component is already explained by a named macro series (a rates bet, an oil bet) and the text step can only confirm that; a low R-squared means the text step is the only source of a name. Above 0.5 the driving-series exposure leads the page and the theme name is printed as confirmation; below 0.5 the theme leads.
    checks:
      - "the same regression on the random portfolios' first components gives the reference distribution of R-squared"
    on_failure: the theme leads by default
    open: []

  # ============================================================ context space
  - id: newsagent
    name: News risk-statement extraction
    lane: context
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: the prompt is blind to dates and entity names; in the backtest the model labels a sample once and a classifier on the pre-date encoder labels the rest
    inputs:
      - "headlines and articles, timestamped, rolling twelve months"
    outputs:
      - "risk statements from news, dated, each with a verbatim span and a short paraphrase"
    rule: |
      A small language model reads each item with dates and entity names redacted and extracts statements of macro risk that could materialise within a year, returning the verbatim span, a short paraphrase for embedding, and the item's date. In the backtest the model labels a sample once; a classifier trained on those labels, using the encoder trained only on pre-date text, labels each remaining sentence as a risk statement or not, and the paraphrase is taken from the nearest labelled example.
    checks:
      - "quote gate"
      - "a monthly audit sample is labelled by hand"
    on_failure: the previous week's statements are reused and the page states it
    open: []

  - id: taxonomy
    name: Registered worry list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: the list is frozen before each run; backtests use the list as it stood on the date and are also run once with no list
    inputs:
      - "PM edits"
    outputs:
      - "about thirty external conditions with an 'other' entry, versioned"
    rule: |
      A registered list of about thirty external conditions, for example rates, the memory cycle, tariffs, a regulatory decision, financing, with an 'other' entry. It is versioned and reviewed quarterly from what accumulates under 'other'. The PM edits it whenever a new worry becomes relevant, and every edit is logged with a date. On the known-theme assumption, the entry with the most news weight is usually the current theme, so the list on its own is the baseline the theme pipeline is judged against.
    checks:
      - "every edit is logged"
      - "quarterly review of the 'other' entry"
    on_failure: the previous version is used
    open: []

  - id: embedspace
    name: Embedding space with a date cutoff
    lane: context
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: the encoder's training cutoff precedes each backtest date; a BM25 keyword retrieval runs beside it as the comparator
    inputs:
      - "risk statements from news, dated, each with a verbatim span and a short paraphrase"
      - "about thirty external conditions with an 'other' entry, versioned"
    outputs:
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
    rule: |
      The encoder is a masked language model whose training cutoff precedes each date, mean-pooled over tokens to give sentence vectors and fine-tuned for sentence similarity on pre-cutoff text; the current model is used for the live date. The news paraphrases over the rolling window are embedded and clustered with HDBSCAN at a minimum cluster size of 25, so that each dense cluster is a macro topic under discussion; each cluster is labelled with its top keywords. Each list entry gets a reference point: the centroid of its 50 nearest news statements, rather than the embedding of the short phrase itself, because a three-word phrase and a forty-word sentence do not embed on the same scale. The assignment distance is the 90th percentile of member-to-centroid distance across the news clusters. The space is rebuilt weekly and every quote in the window is re-assigned at each rebuild. An entry with no news within the distance is printed as having no news weight. The whole procedure is run once more with no list, and if the leading theme differs, both are printed.
    checks:
      - "news weight per entry is printed"
      - "the share of quotes beyond the distance from every entry is printed"
      - "agreement with the BM25 comparator is printed"
    on_failure: quotes are clustered without list reference points and the page states it
    open: []

  - id: pmworries
    name: PM edits the list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: edits are logged; backtests run without them
    inputs: []
    outputs:
      - "PM edits"
    rule: |
      The PM adds, removes or promotes list entries whenever a worry becomes relevant. Every entry, PM-added or not, is placed in the embedding space the same way. Every edit is a dated event. The baseline against which the whole theme pipeline is judged is the list's leading entry on its own, with no model.
    checks:
      - "the edit log"
    on_failure: the pipeline runs on news clusters alone
    open: []

  # ============================================================ naming
  - id: pc1text
    name: Gather the component names' text
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: documents are dated
    inputs:
      - "per component: the component set with each name's loading sign"
      - "per component: the case flag"
      - "risk-factor and outlook text per name, dated"
      - "intra-quarter event text per name, dated"
    outputs:
      - "text per component name, with its loading"
    rule: |
      For every name in a theme-case component set we gather all context-layer and event-stream passages. At clustering, each quote from a name is weighted by the absolute value of that name's loading on the component.
    checks:
      - "coverage of the component set, by leg and by layer, is printed"
    on_failure: the theme is named on the names that have text and the page states the coverage
    open: []

  - id: riskextract
    name: Risk-statement extraction from filings
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: the prompt is blind to the company name and the date; extraction error is measured separately on documents dated before and after the model's training cutoff, and the difference bounds how much pre-cutoff accuracy could come from the model having seen the documents in training; only post-cutoff months support any predictive claim
    inputs:
      - "text per component name, with its loading"
    outputs:
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
    rule: |
      A small language model reads one document per call with the company name, ticker and dates redacted, and extracts up to three risks that could cause a significant drawdown within a year. For each it returns a verbatim span, a short paraphrase for embedding, and a sign: whether the company loses or gains if the risk materialises. Item 1A statements are losses by construction; the sign carries information in MD&A and event text, where a company may state that it benefits, for example from higher rates. Any span that does not appear verbatim in the source is rejected and counted. Extraction error is measured on the monthly hand-labelled sample, split by leg, by era and by whether the document is dated before or after the model's training cutoff. In production the extraction is distilled to a classifier on the pre-date encoder that labels each sentence as a risk statement or not, and its sign. When the model version changes, every series this step feeds is recomputed and the page shows the change as a step.
    checks:
      - "quote gate"
      - "precision and recall on the hand-labelled sample, by stratum and cutoff side"
    on_failure: the record is dropped and counted
    open:
      - "EMPIRICS: the model and its training cutoff date."

  - id: cluster
    name: Assign quotes to list entries
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: the encoder's cutoff precedes each date; a quote stays current until the next document, with no decay; every quote is re-assigned at each weekly rebuild
    inputs:
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
      - "N random portfolios per date, cap-and-sector-matched"
    outputs:
      - "quote weight per list entry and per residual cluster, by leg and by book effect, with the placebo weight"
    rule: |
      Each paraphrase is embedded with the pre-date encoder and assigned to the nearest list entry within the assignment distance. Quotes beyond the distance from every entry are clustered among themselves with the same HDBSCAN settings; each of those residual clusters is named separately. A document's quotes stay current until the same company files the next document on the same layer; there is no time decay. Each quote's book effect is the product of three signs: +1 for the winner leg and -1 for the loser leg; the sign of the name's loading on the component; and -1 if the company loses when the risk materialises, +1 if it gains. A product of -1 means the book loses if the risk materialises. Quote weights, which are the absolute loadings, are summed separately for the two products. The same assignment is run on the filings of the sector-matched random portfolios, which gives the placebo weight per entry, so a boilerplate risk that every company lists shows zero excess weight.
    checks:
      - "placebo weight per entry"
      - "the share of quotes in residual clusters"
      - "month-to-month stability of the assignment"
    on_failure: the previous assignment is used
    open: []

  - id: namecluster
    name: Name the theme
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: the name is grounded in the 20 quotes nearest the cluster centre; a keyword label is printed beside it; the name is a label, not a number the tail model uses
    inputs:
      - "quote weight per list entry and per residual cluster, by leg and by book effect, with the placebo weight"
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
    outputs:
      - "theme name per component, with its supporting quotes"
      - "the nearest news cluster and its headline count"
    rule: |
      For a list entry the name is the entry. For a residual cluster a language model reads the 20 quotes nearest its centre and names it; a c-TF-IDF keyword label, the top terms that distinguish the cluster, is printed beside the model's name so the reader can check one against the other. The nearest news cluster's keyword label and headline count are printed beside the theme; a theme with no news within the distance is flagged company-specific. The naming is calibrated by running it on sector-matched random name sets: a name must be more specific on the real cluster than on a random one, rated by a second reader.
    checks:
      - "calibration on sector-matched random sets"
      - "the keyword label is printed"
    on_failure: the keyword label is printed alone
    open: []

  # ============================================================ propagation
  - id: propagate
    name: Search other names for the theme
    lane: propagate
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: before the language model's training cutoff only retrieval with the pre-date encoder is used; the model reranks post-cutoff months only; the retrieval-only result is always printed beside the model's
    inputs:
      - "theme name per component, with its supporting quotes"
      - "risk-factor and outlook text per name, dated"
      - "intra-quarter event text per name, dated"
      - "positioning score per name, with the longest input lag"
    outputs:
      - "theme carriers: names outside the component set whose filings carry the theme, each with a score and a quote"
    rule: |
      Once a theme is named, we search two sets of names outside the component set: the rest of the book, and names outside the book that sit in the universe's top quintile by positioning score. Every passage in scope is embedded once with the pre-date encoder and cached. Retrieval by the theme's reference point returns the 200 nearest passages; the language model scores each candidate name from 0 to 3 for whether its filings carry the theme, each score with a verbatim span; a score of 2 or more marks the name as a theme carrier. For backtest dates before the model's cutoff, the model is not used: a name is a carrier if its nearest passage is within the assignment distance. Control: the same run with a plausible but wrong theme, taken as the list entry with the most news weight twelve months earlier; the share of names it marks as carriers is printed beside the true rate as the method's false-positive rate. When the model version changes, every series this step feeds is recomputed and the page shows the change as a step.
    checks:
      - "quote gate"
      - "false-positive rate from the wrong-theme control"
      - "the retrieval-only result is printed beside the model's"
    on_failure: the name is marked unscanned
    open: []

  - id: themescore
    name: Theme statistics
    lane: propagate
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: the look-ahead risk is whatever its inputs carry; none is added here
    inputs:
      - "per component: the book's variance share and its percentile against random portfolios"
      - "quote weight per list entry and per residual cluster, by leg and by book effect, with the placebo weight"
      - "theme carriers: names outside the component set whose filings carry the theme, each with a score and a quote"
      - "R-squared and loadings of each component's return on the six series"
      - "about thirty external conditions with an 'other' entry, versioned"
      - "per component: its daily return and ten-day sigma"
    outputs:
      - "the book's variance share on the theme, with its percentile"
      - "the share of book weight, by leg, in names that lose if the theme reverses, with its placebo share"
      - "the loss in basis points if the component returns minus two sigma over ten days"
      - "the agreement line"
      - "which statistic leads the page"
    rule: |
      Two statistics are printed, each beside its random-portfolio comparison. The first is the book's variance share on the theme component, with its percentile. The second is the share of the book's weight, by leg, held in names whose book effect is a loss if the theme reverses, counting the component set and the theme carriers, beside the same share for sector-matched random portfolios. The second is also stated as a loss in basis points of book NAV: sigma is the component's daily return standard deviation over the 126-day window scaled to ten days, and the loss is the sum over the component set of w_i times the name's loading times minus two sigma, plus the sum over theme carriers of w_j times the carrier's beta to the component over the same window times minus two sigma. The agreement line states whether the list entry with the most news weight and the component's name are the same theme, decided by string match on the list entry, and by the second reader for a residual cluster. The bridge R-squared decides which statistic leads the page: above 0.5 the driving-series exposure, below it the theme. The statistics are recomputed weekly from the event stream and monthly from the decomposition. Every PM edit to the list is a dated event, and once a quarter the share of PM-added entries that the pipeline had already surfaced is measured.
    checks:
      - "both placebo comparisons"
      - "a check that the statistics are not driven by filing season, comparing February with August"
    on_failure: n/a
    open: []

  # ============================================================ positioning
  - id: poscluster
    name: Positioning overlap with the theme
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: data
    mitigation: positioning is taken as of its release date
    inputs:
      - "positioning score per name, with the longest input lag"
      - "theme carriers: names outside the component set whose filings carry the theme, each with a score and a quote"
      - "per component: the component set with each name's loading sign"
    outputs:
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "the non-overlap"
    rule: |
      The theme names are the component set plus the theme carriers. The heavily positioned names are the top quintile of the positioning score within each leg of the book. Both the overlap and the non-overlap are reported by leg, with their history since January 2014, when both daily holdings and 13F overlap begin. The history is what tests the claim that hedge funds are mostly positioned on one theme, instead of the design assuming it. This replaces what v1 called Route 3.
    checks:
      - "the overlap history is printed"
    on_failure: the overlap is not computed and the page states it
    open: []

  - id: timebombs
    name: Vulnerable names, two lists
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: returns and positioning are taken as of the date
    inputs:
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "daily returns per name"
      - "per component: its daily return and ten-day sigma"
      - "positioning score per name, with the longest input lag"
    outputs:
      - "vulnerable names before a catalyst, by leg"
      - "vulnerable names after an unwind has started, by leg"
    rule: |
      Two lists are produced, both drawn from names that are heavily positioned and carry the theme. The first applies before a catalyst: names whose trailing 20-day return is beyond one standard deviation of their own trailing year in the same direction as the component. These are the names with the largest recent gain to lose. The second applies after an unwind has started: names whose trailing 20-day return is within one standard deviation while the component has moved beyond one. These are the names that have not yet fallen. Both lists are split by leg, because a crowded short that has not yet rallied during a squeeze is the most likely target of the next one. Neither list is printed until its event study in the validation lane has run.
    checks:
      - "the count and weight of each list are printed with their history"
    on_failure: n/a
    open: []

  # ============================================================ tail model
  - id: severity
    name: Conditional tail model
    lane: tail
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: every regressor uses only values available on the formation date; the earnings calendar is known in advance
    inputs:
      - "book returns"
      - "the book's variance share on the theme, with its percentile"
      - "the share of book weight, by leg, in names that lose if the theme reverses, with its placebo share"
      - "price-only carriers"
      - "per component: the case flag"
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "approved catalysts, with dates and types"
      - "earnings dates per name"
      - "scheduled macro releases"
      - "GARCH vol forecast"
      - "event-density baseline VaR"
    outputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "the ablation sequence"
    rule: |
      There is one tail model. It is a linear quantile regression of the book's ten-day forward return at the 5% quantile, fitted on every day up to the formation date. Regressors: trailing volatility; the Daniel-Moskowitz bear-state terms (a bear indicator and its interaction with market variance); the momentum-factor state from the case flag, as an indicator; the book's variance share on the theme; the share of book weight in names that lose if the theme reverses, by leg; the positioning overlap; a catalyst-window indicator with days to the nearest catalyst, where the catalyst window is the ten trading days beginning five sessions before the catalyst; and the GARCH forecast and the event-density baseline as controls. In the backtest the catalysts are the component names' earnings dates and the scheduled macro releases; live, the PM's approved catalysts are added. Outputs: the ten-day VaR and expected shortfall in bp of book; the VaR conditional on being inside a catalyst window, and its increase over the same model with the window indicator set to zero, which is the additional risk attributed to the catalyst. The ablation sequence is reported on every run: step 0 uses trailing volatility and the bear state; step 1 adds the variance share and the price-only carriers; step 2 adds the theme carriers found from text; step 3 adds the positioning overlap. To show whether the quantile responds to the state variables, the breach rate is reported separately for each state.
    checks:
      - "breach rate on the held-out years in v1, 2 of 42"
      - "breach rate by state"
      - "the ablation sequence"
      - "expected shortfall is no milder than the VaR"
    on_failure: the unconditional 5% quantile is reported instead
    open: []

  - id: garch
    name: GARCH baseline
    lane: tail
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: refit at each formation date
    inputs:
      - "book returns"
    outputs:
      - "GARCH vol forecast"
    rule: |
      A GARCH(1,1) model on the book's daily returns, refit at each formation date. Its forecast enters the tail model as a control and the validation as the baseline that does not know the calendar.
    checks: []
    on_failure: n/a
    open: []

  - id: eventbaseline
    name: Event-density baseline
    lane: tail
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: the earnings calendar is known in advance
    inputs:
      - "book returns"
      - "position weights"
      - "earnings dates per name"
      - "scheduled macro releases"
    outputs:
      - "event-density baseline VaR"
    rule: |
      The baseline that knows the calendar. For each catalyst window, each name's historical announcement returns are resampled with the window's reporting weights to give a distribution of window returns for the book, and the 5th percentile of that distribution is the baseline VaR. Any model that knows the earnings calendar will beat GARCH around scheduled events, so the tail model is required to beat this baseline as well.
    checks: []
    on_failure: n/a
    open: []

  # ============================================================ catalysts
  - id: catagent
    name: Catalyst proposal (live only)
    lane: catalysts
    kind: model
    status: settled
    origin: v2
    lookahead: model-unmitigable
    mitigation: none exists; a model reading past news would propose the catalysts that turned out to matter, so this step runs on live data only and no backtest claim depends on it
    inputs:
      - "theme name per component, with its supporting quotes"
      - "items from the last five sessions"
      - "intra-quarter event text per name, dated"
    outputs:
      - "proposed catalysts per theme, each with a date, a source quote and a type"
    rule: |
      Scheduled catalysts (FOMC, CPI, payrolls, index rebalances, the component names' earnings) come from the calendars in the market-data node and involve no model. This step proposes the unscheduled ones: company-specific and off-universe events, for example a foreign supplier's earnings or a regulatory readout. A language model reads the last five sessions' news and the event-stream text and proposes each catalyst with a date, a source quote and the type unscheduled. In the memory example this summer, Broadcom and Hynix earnings were the two catalysts that mattered.
    checks:
      - "a date and a quote are required"
      - "PM approval"
    on_failure: only calendar catalysts are used
    open: []

  - id: catapprove
    name: PM reviews catalysts
    lane: catalysts
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: live only
    inputs:
      - "proposed catalysts per theme, each with a date, a source quote and a type"
    outputs:
      - "approved catalysts, with dates and types"
    rule: |
      The PM reviews the proposals weekly; there are fewer than ten. The PM approves a catalyst on its date and relevance, not on any view of its outcome, and the PM's main contribution is adding catalysts the model missed. Catalysts not yet approved are shown on the page as proposed.
    checks: []
    on_failure: unapproved catalysts are shown as proposed
    open: []

  # ============================================================ analogues
  - id: analogue
    name: Analogue retrieval
    lane: analogue
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: each past date's state is computed from data as it stood on that date; dates within one year of today are excluded
    inputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the book's variance share on the theme, with its percentile"
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "book returns"
      - "the reversal record, 195 episodes since 1926"
    outputs:
      - "the five nearest past dates, what the book did over the following ten days, and whether each is apt"
    rule: |
      The state of a date is a vector of the six exposures, the book's variance share on its first component, the positioning overlap, the book's trailing realised volatility, and the bear state. The theme and positioning entries exist from January 2014; for earlier dates the distance uses the exposures, volatility and bear state only, and the page says which. Distance is Mahalanobis on the pre-sample covariance. Candidates are dates in the reversal record and an equal number of quiet dates; dates within one year of today are excluded. A deterministic rule decides whether an analogue is apt: its bear state and the sign of its case flag must match today's, and its theme must be the same list entry. This rule ran beside the retired three-role panel; the panel is gone and the rule remains.
    checks:
      - "each past date's state is regenerated from inputs public before it"
    on_failure: the five nearest dates are listed without an aptness verdict
    open: []

  # ============================================================ page and people
  - id: eventrule
    name: When a page is produced
    lane: page
    kind: deterministic
    status: settled
    origin: v1
    lookahead: none
    mitigation: thresholds are registered
    inputs:
      - "approved catalysts, with dates and types"
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the book's variance share on the theme, with its percentile"
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "book returns"
    outputs:
      - "calendar page, threshold page, or weekly summary"
      - "hit, miss and silence counts"
    rule: |
      A page has two triggers. Calendar: a page is produced five sessions before each approved catalyst, carrying the catalyst-window VaR and its increase. Threshold: a page is produced when the daily maximum across the monitored statistics (the ten-day VaR, the first component's variance share, and the six exposures) crosses the 95th percentile of its own history since December 2013; this joint form gives at most two expected false pages a month, and the page names the statistic that crossed. Percentiles against random portfolios are shown for context only and cannot trigger a page. If neither trigger fires, a weekly summary is produced. Every page has a resolution date: a calendar page resolves at the catalyst, a threshold page at the ten-day horizon. A hit is a realised loss beyond the conditional VaR; a miss is a page with no such loss; a silence is a loss with no page. The three are counted and printed monthly, and the register states the hit rate a page type must beat, which for a threshold page is the 5% base rate. Weekly summaries are not scored. In production the page would be a continuously maintained state, pushed to the reader whenever it changes.
    checks:
      - "the measured false-page rate"
      - "hits, misses and silences, monthly"
    on_failure: the plain template is sent with a note at the top saying why
    open: []

  - id: composer
    name: Prose over fixed fields
    lane: page
    kind: model
    status: settled
    origin: v1
    lookahead: none
    mitigation: prose only; every number in it is checked against the field it came from
    inputs:
      - "calendar page, threshold page, or weekly summary"
    outputs:
      - "the composed page, or the template"
    rule: |
      A language model writes the prose over the fixed fields. A check rejects the page if any number in the prose fails to match the field it came from; one mismatch and the plain template is sent instead. For comparison, the template with the same fields and no prose is rendered daily into the log. Each day the composer is also run on a test date with a known correct page; if it fails that test, the template is sent. If the blind comparison (register row 13) finds the template as useful as the prose, the prose is dropped and the template becomes the page.
    checks:
      - "the numeral check"
      - "the daily test date"
      - "blind comparison against the template, register row 13, not yet run"
    on_failure: the plain template is sent with a note at the top saying why
    open: []

  - id: thepage
    name: The page
    lane: page
    kind: output
    status: settled
    origin: v2
    lookahead: none
    mitigation: n/a
    inputs:
      - "the composed page, or the template"
      - "the loss in basis points if the component returns minus two sigma over ten days"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "implied ten-day move per component name, in per cent"
      - "sector ETF implied move, in per cent"
      - "vulnerable names before a catalyst, by leg"
      - "vulnerable names after an unwind has started, by leg"
      - "approved catalysts, with dates and types"
      - "the winner leg's exposure to the driving series, in hedgeable units, with the names inside the leg that carry it"
      - "the five nearest past dates, what the book did over the following ten days, and whether each is apt"
      - "theme name per component, with its supporting quotes"
    outputs:
      - "one page, pushed to the reader"
    rule: |
      Every headline number is over ten trading days, and the catalyst window is ten trading days, so one horizon holds throughout. In order: (1) the theme, the book's variance share on it and its percentile, the agreement line, by leg; (2) the loss in basis points if the component returns minus two sigma, and its direction; (3) the ten-day VaR and expected shortfall, and the catalyst-window VaR beside the component set's implied move and the sector ETF's implied move as the cost of the hedge; (4) the two lists of vulnerable names by leg, with the positioning lag; (5) approved catalysts with dates and types; (6) the driving-series exposure in hedgeable units, which leads the page when the bridge R-squared is above 0.5; (7) the five analogues with what followed and whether each is apt; (8) what changed since the last page; (9) a footer with coverage by layer and the note that the numbers describe the paper 12-1 book, with the reader's beta to it printed if positions are an input and otherwise the instruction to scale by that beta. The conclusion states the direction of the risk and the hedge. It does not tell the reader to exit. Every number links to a stored output and every theme to its quotes. The page records whether it was acknowledged; the requirement that the PM sign within two hours is dropped, because on the days a page is triggered the market is moving.
    checks:
      - "the numeral check"
      - "every quote passes the quote gate"
    on_failure: the plain template is sent with a note at the top saying why
    open: []

  - id: responselog
    name: Response log (production only)
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: production only; it needs the reader's positions as an input
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "looked at, ignored, or acted on, per page"
    rule: |
      Each page is logged as looked at, ignored, or acted on, and scored against a base rate: the share of weeks in which the PM changes the relevant position with no page. This log is the only way to measure whether a page changed a decision. It cannot exist until the reader's actual positions are an input to the system, because the 12-1 book is a paper portfolio that no fund holds. It is the first item of the production path.
    checks:
      - "the base rate is stated before scoring"
    on_failure: n/a
    open: []

  - id: signoff
    name: The human tasks
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: live only
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "acknowledged page, or the page shipped unacknowledged"
      - "monthly labelled sample"
    rule: |
      Four tasks need a person. The PM acknowledges each page, or it ships marked unacknowledged. The PM edits the worry list whenever a worry becomes relevant. The PM reviews proposed catalysts weekly. A research analyst, not the PM, labels a stratified sample of about 90 extracted records each month, which a second reader checks.
    checks: []
    on_failure: the page ships unacknowledged
    open: []

  # ============================================================ validation
  - id: register
    name: Pre-registration register
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: none
    mitigation: thresholds and both outcome sentences are written before each run
    inputs: []
    outputs:
      - "a row per test: threshold, margin, power, and the sentence carried under each outcome"
    rule: |
      Before each test runs, a row records the pass threshold and the sentence the memo will carry if the test passes and if it fails; when the result is in, the sentence for the other outcome is deleted. Before any test, the smallest effect it could detect is found by simulation; a null result is a finding only if that detection floor is below the effect size of interest, and otherwise the test is reported as too weak to see it. The 2023-onward seal was spent in v1 on the severity breach test. Every v2 test runs on the full sample from December 2013 and is labelled design tier; a forward seal from the memo date is the confirmatory sample. Rows that test the memo or the developer's process rather than the market are kept in a process appendix. The v1 rows are archived with their outcomes.
    checks:
      - "the build fails if any placeholder for an unresolved outcome remains in the memo"
    on_failure: n/a
    open:
      - "v1 rows 02, 03 and 05 have no result; row 23 was registered with two dates' numbers already known and is labelled so."

  - id: labels
    name: Hand-labelled sample
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: the labels audit the model and are never fed to it
    inputs:
      - "monthly labelled sample"
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
    outputs:
      - "precision and recall by leg, era and cutoff side"
    rule: |
      About 90 records a month, drawn as a stratified sample by leg, by era and by whether the document is dated before or after the model's training cutoff, labelled by a research analyst and checked by a second reader. Confidence intervals are classical; prediction-powered inference is not used because the sample is too small for it. The difference in error between pre- and post-cutoff records is the bound on how much the model may be recalling from training rather than reading.
    checks: []
    on_failure: the error estimate comes from the hand labels only
    open:
      - "Has not yet run; the ninety labels for v1's extractor were reserved for Tim and never written."

  - id: volvalidation
    name: Tail-model scoring
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: catalyst dates come from the calendars, known in advance
    inputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "the ablation sequence"
      - "GARCH vol forecast"
      - "event-density baseline VaR"
      - "implied ten-day move per component name, in per cent"
      - "book returns"
      - "earnings dates per name"
      - "a row per test: threshold, margin, power, and the sentence carried under each outcome"
    outputs:
      - "breach rate and pinball loss per ablation step, against both baselines, per catalyst type"
      - "the catalyst-window increase against the implied move, where history exists"
    rule: |
      There is one observation per formation month: the catalyst-window VaR on the window's first day against the realised ten-day book return, taking the nearest catalyst where a month has several. Standard errors are clustered by month, the effective sample size is stated, and the power calculation is registered before the run. Each ablation step is scored on breach rate and pinball loss against the GARCH baseline and the event-density baseline. The catalyst-window increase is compared with the component set's implied move where the options history exists, and otherwise the comparison is marked illustrative. The register row states the margin by which the model must beat the baselines.
    checks:
      - "register row with margin and power"
    on_failure: n/a
    open: []

  - id: bombtest
    name: Event study for the vulnerable-name lists
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: none
    mitigation: lists are frozen before the outcome window; positioning is as of the date
    inputs:
      - "vulnerable names before a catalyst, by leg"
      - "vulnerable names after an unwind has started, by leg"
      - "daily returns per name"
      - "a row per test: threshold, margin, power, and the sentence carried under each outcome"
    outputs:
      - "each list's excess move over sector-matched names not on the list, per unwind"
    rule: |
      On the five recorded unwinds since 2020 (November 2020, the first quarter of 2021, November 2022, January 2025 and April 2025), the test asks whether the names on each list moved with the theme over the following twenty sessions by more than sector-matched names not on the list, measured as the return in the loss direction, using positioning data as it was available at the time. The pre-catalyst list is taken as of the month before each unwind; the contagion list as of five sessions after the unwind's first breach day. Neither list is printed on any page until this test has run. All five unwinds are design tier, since the 2023-onward seal was spent in v1.
    checks:
      - "register row"
    on_failure: the lists are not printed
    open: []

  - id: themevalidation
    name: Theme pipeline against the PM's list
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: human
    mitigation: there is no history until a PM edits the list; this is a production measurement
    inputs:
      - "the agreement line"
      - "PM edits"
      - "a row per test: threshold, margin, power, and the sentence carried under each outcome"
    outputs:
      - "the share of PM-added entries the pipeline had surfaced first; the share of residual themes the PM later adopted"
    rule: |
      Run quarterly. It measures whether the pipeline finds themes the PM had not listed, and whether the PM needs to add fewer entries over time. The first reading is four quarters after a PM starts editing the list.
    checks:
      - "register row"
    on_failure: n/a
    open: []

  # ============================================================ retired
  - id: route1
    name: Route 1 detector (retired)
    lane: retired
    kind: deterministic
    status: retired
    origin: v1
    lookahead: none
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. It read the old text stage's condition concentration, which no longer exists; the per-leg theme statistics now cover the case it detected, a short leg concentrated on one condition.
    checks: []
    on_failure: n/a
    open: []

  - id: route3
    name: Route 3 detector (retired)
    lane: retired
    kind: deterministic
    status: retired
    origin: v1
    lookahead: none
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. It fired on none of the 195 recorded episodes; its inputs are now the positioning score and the overlap statistic.
    checks: []
    on_failure: n/a
    open: []

  - id: classify
    name: Route classification rule (retired)
    lane: retired
    kind: deterministic
    status: retired
    origin: v1
    lookahead: none
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired after its test failed, with 44.1% of episodes fitting none of the three routes against a registered band of 5 to 30%. The reversal record it was applied to now lives with the French file. The memo reports the result that 77 of the 86 unassigned episodes were loser-leg losses in a rising market with no prior bear state.
    checks: []
    on_failure: n/a
    open: []

  - id: volmodel
    name: Vol model (retired, folded into the tail model)
    lane: retired
    kind: deterministic
    status: retired
    origin: v2
    lookahead: none
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. Its regressors and the catalyst-window indicator are in the conditional tail model; its comparison is the component set's implied move; its symmetric five-day volatility target is replaced by the lower tail.
    checks: []
    on_failure: n/a
