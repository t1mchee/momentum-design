      - "with source quote"
      - "typed scheduled or unscheduled"
    rule: Scheduled macro catalysts (FOMC, CPI, payrolls, index rebalances) are taken from calendars with no model. The LLM proposes company and off-universe catalysts (a foreign supplier's earnings, a regulatory readout) from the fast news lane and event text, each with a date, a source quote and a type. A 2025 model reading 2019 news would propose what mattered, so this node runs live only and is absent from the backtest.
    checks:
