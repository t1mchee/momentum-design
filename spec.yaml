      - "sector ETF implied move, book returns"
    outputs:
      - "breach rates and pinball loss per ablation rung, per catalyst type"
      - "the bump against the implied comparator where it exists"
    rule: One observation per formation month (the month's catalyst window), errors clustered by month, effective sample stated, power statement registered first. The tail model's rungs are scored on breach rate and pinball loss against GARCH and the event-density baseline; the catalyst-window VaR is compared with the component set's event-implied move where the history exists, otherwise marked illustrative. The register carries the margin.
