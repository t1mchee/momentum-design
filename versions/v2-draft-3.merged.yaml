  - theme signature per name outside the component set
  - with quote and score
  - component name sets
  outputs:
  - overlap of the heavily positioned set with the theme set; the non-overlap
  rule: Names are grouped thematically (component set plus signature carriers) and by positioning (top quintile
    of the positioning score). The two usually overlap, since hedge funds are mostly positioned on one theme. Both
    the overlap and the non-overlap are reported.
  checks:
  - overlap share printed with its history
  on_failure: overlap not computed
  open:
  - 'Join: the v1 Route 3 detector (crowded exit, read at rebalance from co-movement and holder overlap) covers
    the same ground. Fold Route 3 into this node, or keep it as the by-leg crowding reading beside it?'
  memo: §7
  v1: comovement, flows
- id: timebombs
  name: Time bombs
  lane: positioning
  kind: deterministic
  status: settled
  inputs:
  - overlap of the heavily positioned set with the theme set; the non-overlap
  - daily returns per name
  outputs:
  - names carrying the theme's signature
  - heavily positioned
  - not yet moving
  rule: A name is a time bomb when it carries the theme's signature, sits in the top positioning quintile, and its
    trailing 20-day return is within one standard deviation of its own trailing-year distribution while the component
    set's loading-weighted return over the same window is beyond one. If the theme unwinds, these names have not
    yet paid, so the unwind could be larger than the component set alone implies.
  checks:
  - count and weight of time bombs printed with history
  on_failure: n/a
  open: []
  memo: §7, §6
  v1: new
