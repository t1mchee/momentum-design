nodes:
  # ============================================================ data in
  - id: prices
    name: Market data and calendars
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: index membership is taken at the effective date of each change, which follows the announcement; earnings dates are projected from the prior year; macro calendars are published in advance
    access: public
    inputs: []
    outputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
      - "sector codes"
      - "earnings dates per name"
      - "scheduled macro releases"
    rule: |
      The universe is the constituent list of the Russell 3000 ETF, taken from the fund's archived daily holdings at the effective date of each change (PUBLIC); the announcement precedes the effective date, so the backtest is late, not early. Daily prices are adjusted for corporate actions (PUBLIC, Stooq or Tiingo; CRSP in production, LICENSED). Sector codes come from EDGAR SIC codes (PUBLIC); GICS in production (LICENSED). Stooq and Tiingo contain no delisting returns, so a company delisted for performance leaves the book at a return of -30%, following Shumway, and any other delisted company at its last trade; no company is held at a zero return. In the backtest a company's next earnings date is projected as the date of its 8-K Item 2.02 one year earlier, moved to the same weekday; companies report on a stable annual cycle and the error is a few days. The realised date is used only to score the page. Live, company calendars give the date (PUBLIC). Scheduled macro releases (FOMC, CPI, payrolls, index rebalances) come from the published calendars (PUBLIC).
    checks:
      - "monthly correlation of the reconstructed book with the French factor, reported"
      - "the projected earnings date against the realised date, reported as a distribution of errors in days"
    on_failure: if a day's price or holdings file is missing, the previous day's state is held, with a note on the page
    open: []

  - id: refseries
    name: Six reference series and the bear state
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: none of the six is revised; a revised series, if ever added, is taken from ALFRED first prints
    access: public
    inputs: []
    outputs:
      - "six daily series"
      - "the bear state"
    rule: |
      The six reference series, with units: the S&P 500 return; the change in the ten-year Treasury yield in basis points; the front-month WTI return; the return of the Fed's broad dollar index (FRED); the change in the ICE BofA US corporate option-adjusted spread in basis points (FRED); and the return of the ten largest Russell 3000 companies minus the return of the equal-weighted Russell 3000, constructed from Russell 3000 holdings. The six are fixed. Its six percentiles are one family: a series is called unusual only above the 99.2nd percentile of its own history (\(1 - 0.05/6 = 0.992\)), which is the 95th adjusted for six series. Adding a series requires re-registering the family. The bear state, after Daniel and Moskowitz, is $B_t = \mathbf{1}[\text{trailing 24-month S\&P 500 return} < 0]$, printed with the trailing 126-day market variance. Two cross-asset principal components are retired because their moves lacked clear economic meaning on the page.
    checks:
      - "the family adjustment is applied to every percentile printed for the six"
    on_failure: the series is left off the page, with a note naming it
    open: []

  - id: filings
    name: Company text, in layers
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: clean
    mitigation: every document is dated at acceptance or receipt, and every extracted span must pass the quote gate
    access: mixed
    inputs: []
    outputs:
      - "risk-factor and MD&A text per name, dated"
      - "intra-quarter event text per name, dated"
      - "coverage per name, by leg and by layer"
    rule: |
      Company text has three layers, and each feed is labelled by access. The context layer is the latest 10-K accepted before the formation date plus the latest 10-Q's Part II Item 1A where it is newer; Item 1A and the Overview subsection of Item 7, where present, are cut by regex on the standard headers (PUBLIC, EDGAR). The event stream is 8-K Items 2.02, 7.01 and 8.01 with exhibits (PUBLIC, EDGAR) and earnings-call transcripts (PUBLIC for a subset through free feeds; LICENSED for full coverage). The production layer is equity research (LICENSED, not available to us now) and dealer colour and prime-broker notes (DESK-ONLY, not available to us now); in production it feeds the same two nodes as the context layer, text gathering and propagation. Every extracted span must appear verbatim in its source before it is stored (the quote gate). Coverage per company, by leg and by layer, is an output and is printed in the page footer. The bias is one-sided: quote weights and the loss share are understated on companies without text, so a theme concentrated in companies the free feeds miss is under-read.
    checks:
      - "coverage per name, by leg and by layer, printed"
      - "quote gate"
    on_failure: the company is marked unread on that layer, and the coverage line shows it
    open:
      - "EMPIRICS: the free transcript feeds and the share of names they cover."

  - id: news
    name: News, slow and fast
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: for each backtest date the embedding space is rebuilt from the archive as it stood on that date
    access: mixed
    inputs: []
    outputs:
      - "headlines and release text, timestamped, rolling twelve months"
      - "items from the last five sessions"
    rule: |
      News is used in two ways. A slow pass over a rolling twelve-month archive, rebuilt weekly, supplies the embedding space in which themes are located. A fast pass over the last five sessions supplies catalyst proposal each day. Feeds: GDELT headlines and URLs (PUBLIC), Fed, Treasury and BLS release pages (PUBLIC), SEC press-release exhibits (PUBLIC), Bloomberg and Reuters headlines (LICENSED, not available to us now). GDELT contains no article text, so risk statements are under-counted and more themes are flagged company-specific than a full-text feed would flag. Every item is timestamped at publication. The theme pipeline starts at GDELT's first usable date; on earlier months the tail model runs on its steps 0 and 1 only, with a note on the page.
    checks:
      - "the source list is versioned"
      - "for a backtest date, only items published before that date enter the rebuild"
    on_failure: the previous week's embedding space is reused and marked stale on the page
    open:
      - "EMPIRICS: GDELT's first usable date for headline text."

  - id: posdata
    name: Positioning feeds and score
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: every source is keyed to its release date, never to settlement or period end; the longest input lag is printed with the score
    access: mixed
    inputs: []
    outputs:
      - "positioning score per name, with the longest input lag"
      - "short interest per name"
    rule: |
      Each company in the book gets a positioning score from two inputs, each converted to a rank within the company's leg. The first is comomentum: the mean over the other companies $j$ in $i$'s leg of $\mathrm{corr}(u_i, u_j)$ over the trailing 126 trading days, on the market-residual returns $u$ (PUBLIC, from returns). The second is 13F crowding: the number of momentum-style filers holding the company, where a momentum-style filer is one whose holdings, value-weighted, have an average 12-1 rank in the universe's top decile as of the filing quarter (PUBLIC, 45-day lag). The score is the mean of the two ranks. Heavily positioned means the top quintile of the score within each leg of the book. For companies outside the book the same two inputs are ranked within the universe, and the universe's top quintile by that score is the second search scope for propagation. On the loser leg 13F crowding counts long holders, so it measures long crowding in a short; short interest (PUBLIC, two-week lag) is the short-side measure and is printed beside the score without entering it. Because of the 45-day lag, the score understates crowding while it is building and overstates it after the unwind has begun, so both vulnerable-name lists lag: companies join them late and leave them late. Production feeds, each printed as a separate line when present: securities-lending utilisation (LICENSED), options open interest (PUBLIC, delayed), ETF flows (PUBLIC), prime-broker aggregate colour and per-company positioning (DESK-ONLY, not available to us now). Because the inputs arrive with different lags, the longest of those lags is shown next to the score wherever the score appears.
    checks:
      - "longest input lag printed"
    on_failure: the score and the two lists of vulnerable names are omitted, with a note on the page
    open:
      - "EMPIRICS: the number of momentum-style filers the definition yields."

  - id: options
    name: Event-implied moves
    lane: data
    kind: data
    status: settled
    origin: v2
    lookahead: as-of
    mitigation: historical implied moves are taken from surfaces as they stood on the date; where no history exists the comparison is marked illustrative
    access: mixed
    inputs: []
    outputs:
      - "per component name: implied earnings move, in per cent"
      - "the component set's implied ten-day move, loading-weighted, in per cent"
      - "sector ETF implied move, in per cent"
      - "the hedge line: instrument, notional per $100m of book, and ten-day premium in bp of book"
    rule: |
      The comparison for the catalyst-window increase in VaR is the component set's implied ten-day move. Each component company's implied earnings move $m_{e,i}$ (LICENSED for history through OptionMetrics; PUBLIC delayed data for the live date) is a one-day move; it is restated over ten days by adding the company's implied variance over the other nine days, with $\sigma_{30}$ the annualised 30-day implied volatility:
        $$m_{10,i} = \sqrt{m_{e,i}^2 + 9\,\sigma_{30,i}^2 / 252}$$
        $$\text{set move} = \frac{\sum_{i \in \text{set}} |v_{ik}|\, m_{10,i}}{\sum_{i \in \text{set}} |v_{ik}|}$$
      The implied ten-day move of the sector ETF that holds the largest share of the component set's weight is printed beside it as the implied move of the hedge instrument (PUBLIC, delayed). The hedge line names the instrument: the sector ETF, or the driving series' instrument when the bridge puts macro exposure first. It gives the notional per $100m of book, from the book's 126-day beta to the instrument, and the ten-day at-the-money put premium in bp of book (PUBLIC, delayed; illustrative where no history exists). The comparison is for the component companies only; there is no book-level implied volatility. Where the history is missing, the comparison is marked illustrative and the hedge line is left off. The VaR itself is unchanged, so nothing is biased.
    checks: []
    on_failure: the comparison is marked illustrative
    open: []

  - id: french
    name: French factor file and the reversal record
    lane: data
    kind: data
    status: settled
    origin: v1
    lookahead: clean
    mitigation: thresholds were frozen on the 1926 to 2022 sample before any test ran
    access: public
    inputs: []
    outputs:
      - "daily WML from 1926"
      - "the reversal record, 195 episodes since 1926"
    rule: |
      The file provides daily WML, French's winners-minus-losers momentum factor, from 1926: a long history and a check that the reconstruction matches a published series. French's construction (a 2x3 value-weighted sort) differs from ours, so the agreement is reported rather than assumed. One threshold comes from the file and was frozen in advance: on the published factor a reversal is a ten-day return at or below -432bp, the 5th percentile of overlapping ten-day factor returns from 1926 to 2022; on the reconstructed book the event is the book's own unconditional 5% quantile, as the problem block states, and -432bp is printed beside it as the long-run reference. The reversal record is every episode that breached the threshold, with breach days within 21 trading days collapsed to one episode: 195 episodes since 1926, on the French file before December 2013 and on the reconstructed book after it. The record feeds the analogue search and the event study.
    checks:
      - "the monthly correlation between the reconstructed book and the French factor is reported"
    on_failure: n/a
    open:
      - "EMPIRICS: the correlation statistic. The v1 crash-day threshold (-933bp, stated as a daily 1st percentile) is retired from the design; the package should confirm or correct the number before the memo cites it."

  # ============================================================ the book and its nulls
  - id: sort
    name: 12-1 sort, the book
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: the ranking window closes at formation
    inputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
    outputs:
      - "winner leg and loser leg"
      - "position weights"
      - "leg sizes and cap profile"
      - "book returns"
    rule: |
      On each formation date, the last trading day of the month, the rule ranks every company on its return from twelve months before to one month before, skipping the latest month; the top decile is held long and the bottom decile short. Within each leg companies are value-weighted, the legs are dollar-neutral, and the book return is the winner return minus the loser return: $w_i = \mathrm{cap}_i / \sum_W \mathrm{cap}$ for $i$ in $W$ and $-\mathrm{cap}_i / \sum_L \mathrm{cap}$ for $i$ in $L$, so $\sum_W w_i = 1$ and $\sum_L w_i = -1$, and $R_t = \sum_i w_i r_{it}$. Formation and rebalance coincide; the book is rebuilt monthly and measured daily. The position-weight vector $w$, positive for winners and negative for losers, is the input to every book-level statistic. The page prints value-weighted numbers, because mega-cap concentration is the theme most often monitored; equal-weighted versions are computed and kept in the appendix. The decomposition runs on both legs together, and every statistic is also reported for each leg separately.
    checks:
      - "leg sizes and the cap profile are logged"
    on_failure: the previous month's book is used, with a note at the top of the page
    open: []

  - id: random
    name: Random portfolios, the null
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: drawn on the same date from the point-in-time universe
    inputs:
      - "point-in-time universe, about 300 names per leg"
      - "leg sizes and cap profile"
      - "sector codes"
    outputs:
      - "N random portfolios per date, cap-matched"
      - "N random portfolios per date, cap-and-sector-matched"
    rule: |
      For each date we draw N random portfolios from the same universe with the same leg sizes and capitalisation deciles, so that the only difference from the book is that they were not ranked on past returns. N is 200 for every statistic printed in v2; v1 used 500 in the register and 120 for the cross-sort comparison, and those runs are labelled with their N. The first-drawn leg of each random portfolio plays the winner leg, so its spread shares the book's sign convention and every percentile is one-sided. The cap-matched set is the main null for the exposure statistics. A second set also matched on sector is the main null for the text statistics, because a macro bet is usually expressed through a sector tilt, and is printed beside the first for the exposures. This node outputs portfolios only. Every statistic the design prints for the book is computed on each random portfolio by the node that computes it for the book, and the book's percentile among the random portfolios appears on the page.
    checks:
      - "the construction parameters are hashed and stored with each run"
    on_failure: n/a
    open: []

  - id: controls
    name: Control sorts
    lane: book
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: same windows as the book
    inputs:
      - "daily returns per name"
      - "point-in-time universe, about 300 names per leg"
    outputs:
      - "the cross-sort comparison, for the appendix"
      - "the book ranked 24 months earlier"
    rule: |
      Two other return sorts on the same date, 6-1 and 24-13, test whether an exposure is specific to the 12-1 rule or generic to sorting on past returns; in v1 the 12-1 sort had the largest absolute exposure to the driving series of the three on 42.6% of 108 dates, against the 33% expected by chance. That comparison is kept in the appendix. The 12-1 book formed 24 months ago and held to today controls for persistent company characteristics. The v1 control sort on random rankings is dropped: the random portfolios are that control.
    checks:
      - "the cross-sort comparison is reproduced each month"
    on_failure: n/a
    open:
      - "EMPIRICS: confirm that 42.6% is the driving-series statistic, and why 108 dates for the cross-sort comparison against 137 for the exposure test."

  # ============================================================ exposure
  - id: sensitivities
    name: Sensitivities, conferred and carried
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: rolling windows close before formation
    inputs:
      - "winner leg and loser leg"
      - "six daily series"
      - "the book ranked 24 months earlier"
      - "N random portfolios per date, cap-matched"
    outputs:
      - "conferred and carried spread per series"
      - "the same spreads on each random portfolio"
    rule: |
      One first-stage regression gives the residual used throughout the design, and one slope per company and series gives the exposure, both over the trailing 126 trading days:
        $$r_{it} = a_i + b_i m_t + u_{it}$$
        $$u_{it} = a + \beta_{is} x_{st} + e_{it} \quad \text{for } s = 2, \dots, 6$$
        $$r_{it} = a + \beta_{i1} m_t + e_{it} \quad \text{for the market}$$
        $$S_s = \sum_i w_i \beta_{is}$$
      The raw slope of $r_{it}$ on $x_{st}$ is kept in the appendix. $S_s$ is measured twice: over the window ending at formation (the conferred exposure) and over the same window ending at the next formation, on the same companies (the carried exposure). If an exposure is conferred but not carried, the ranking selected it and the book lost it during the holding period. The same spreads are computed on each random portfolio and on the book ranked 24 months earlier, which is printed beside the book's as the control for persistent company characteristics.
    checks:
      - "sign stability across weighting, rebalance date, universe and window is reported in the appendix"
    on_failure: the series is left off the page
    open: []

  - id: zscore
    name: Exposure in hedgeable units, with two percentiles
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: random portfolios are drawn on the same date; the history starts in December 2013
    inputs:
      - "conferred and carried spread per series"
      - "the same spreads on each random portfolio"
    outputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the driving series"
    rule: |
      For each series the conferred spread is printed in units a desk can hedge: the slope times the book's NAV is the notional of that series the book is exposed to. For the ten-year it is stated as DV01-equivalent dollars per $100m of book; DV01 is the dollar change in value for a one basis point move in yield. For the index and the mega-cap series it is stated as a beta; for WTI, the dollar and the credit spread as notional dollars of the series per $100m of book. The carried spread is printed beside it in the same units. Two percentiles are printed beside each. The first, against the random portfolios, shows whether the sort produced the exposure. The second, against the book's own history from December 2013 and printed only once 24 months of history exist, shows whether today is unusual; only this second percentile can trigger a page. The driving series is the one of the six on which the book's exposure has the highest time-series percentile that month; it is re-chosen at each rebalance and printed by label. The v1 test of the family maximum against random portfolios is not used. The node keeps its v1 id; it computes percentiles, not z-scores.
    checks:
      - "v1 claim 1 (market beta above the 95th random-portfolio percentile on 105 of 137 month-ends) is reproduced as a check that the measurement still works; it is not reported as a result"
    on_failure: n/a
    open: []

  - id: route2
    name: Driving-series exposure
    lane: exposure
    kind: deterministic
    status: settled
    origin: v1
    lookahead: clean
    mitigation: n/a
    inputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the driving series"
    outputs:
      - "the driving-series exposure of the leg that holds more of it, in hedgeable units, with the names inside the leg that contribute most"
    rule: |
      This node reports the driving-series exposure of the leg holding the larger share, in hedgeable units with its two percentiles. It lists the top contributing companies in that leg, ranked by position weight times slope.
    checks: []
    on_failure: n/a
    open: []

  # ============================================================ decomposition
  - id: covariance
    name: Covariance of the book's names
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: the window closes at formation
    inputs:
      - "daily returns per name"
      - "winner leg and loser leg"
      - "N random portfolios per date, cap-and-sector-matched"
    outputs:
      - "shrunk covariance matrix over the book's names"
      - "shrunk covariance matrix over each random portfolio's names"
    rule: |
      $\Sigma = \operatorname{LedoitWolf}(u)$ over the book's companies, with $u$ the first-stage residual from the sensitivities node over the 126 days ending at formation, and the constant-correlation target. Shrinkage is needed because about 600 companies against 126 days would otherwise give a rank-deficient matrix. Sector returns are not removed, because a theme is often expressed through a sector and removing it would hide, for example, a memory-chip theme inside the semiconductor sector. The same matrix is estimated for each random portfolio.
    checks:
      - "the condition number is printed"
    on_failure: the decomposition is not run this period, with a note on the page
    open:
      - "Parked: a covariance-only decomposition misses links between companies that were not historically correlated. The bias is one-sided: when a new link has formed, the component set is too small and the variance share is understated, so the page understates a theme that is spreading. Propagation partly compensates by searching other companies for the theme."

  - id: pca
    name: Components, book variance share, and sign
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: pure arithmetic on the point-in-time book, no estimation
    inputs:
      - "shrunk covariance matrix over the book's names"
      - "shrunk covariance matrix over each random portfolio's names"
      - "position weights"
    outputs:
      - "components above the noise threshold, at most three"
      - "per component: the book's variance share and its percentile against random portfolios"
      - "per component: the component set with each name's loading sign"
      - "per component: the case flag"
      - "per component: its daily return and ten-day sigma"
      - "the named component"
      - "price-correlated names"
      - "per random portfolio: its component set with loadings"
    rule: |
      The number of components kept, $K \le 3$, is the number of eigenvalues of the sample correlation matrix of $u$ that exceed the Marchenko-Pastur edge $(1 + \sqrt{N/T})^2$, with $N$ companies and $T = 126$ days; the components are the first $K$ eigenvectors $v_k$ of $\Sigma$. If $K = 0$, naming does not run, with a note on the page that no co-movement rises above noise.
        $$\mathrm{VS}_k = \frac{\lambda_k (w' v_k)^2}{w' \Sigma w}$$
      $\mathrm{VS}_k$ is the share of the position-weighted book's variance due to the component, as distinct from the share of company-level variance. It is printed with its percentile against the same statistic on the random portfolios, each decomposed the same way. The sign of $v_k$ is fixed so that $w'v_k > 0$: the component's position-weighted return is positive and a reversal is a negative $f_k$. The component set is the top quartile of companies by $|v_{ik}|$, each keeping the sign of its loading. The case flag uses each leg's weighted mean loading:
        $m_W = \sum_W |w_i|\, v_{ik} / \sum_W |w_i|$,   $m_L$ likewise
        factor  iff  $\operatorname{sign}(m_W) \ne \operatorname{sign}(m_L)$  and  $\min(|m_W|, |m_L|) > 0.5\,\operatorname{rms}(v_k)$
      A factor component enters the tail model as a state indicator; otherwise the component is a theme. A theme the sort has fully aligned with, where the winners are its beneficiaries and the losers its victims, has the same loading pattern as the factor and is treated as the factor. The flag decides only how the component enters the tail model; naming still runs on it, and its label is printed as a diagnostic. The named component is the highest-variance component flagged as a theme, or the first component if all are flagged factor. Price-correlated companies are companies outside the component set with $|\mathrm{corr}(u_i, f_k)| > \min_{j \in \text{set}} |\mathrm{corr}(u_j, f_k)|$ over the window; the share of book weight in them is a regressor in the tail model. As a diagnostic, each leg is decomposed separately and its first component printed beside the joint one. Each random portfolio's component set and loadings are kept for the text placebo.
    checks:
      - "the Jaccard overlap of the component set with the previous month's set is printed; below 0.5 the component is flagged unstable"
      - "percentile against random portfolios"
    on_failure: naming is not run, with a note on the page
    open: []

  - id: bridge
    name: Component against the six series
    lane: decomp
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: same window as the decomposition
    inputs:
      - "per component: its daily return and ten-day sigma"
      - "the named component"
      - "six daily series"
    outputs:
      - "R-squared and loadings of each component's return on the six series"
      - "which statistic is printed first"
    rule: |
      The bridge regression, over the 126 days ending at formation:
        $$f_{kt} = a + \sum_{s=2}^{6} g_{ks} x_{st} + e_t$$
      The market is not a regressor, because $f_k$ is built from market residuals and its market coefficient would be zero by construction; $R^2_k$ is this regression's R-squared. If $R^2_k$ of the named component is high, a named macro series (rates, oil) already explains the component and the text pipeline can only confirm it. If it is low, only the text pipeline can supply a label. When $R^2_k$ of the named component is above 0.5, the page opens with the driving-series exposure and prints the theme label as confirmation; below 0.5 it opens with the theme. The same regression on each random portfolio's named component gives the reference distribution of $R^2$.
    checks:
      - "the reference distribution of R-squared from the random portfolios"
    on_failure: the theme is printed first by default
    open: []

  # ============================================================ context space
  - id: newsagent
    name: News risk-statement extraction
    lane: context
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: dates and entity names are redacted from the prompt; the model labels a sample once and a classifier on the pre-date encoder labels the rest
    inputs:
      - "headlines and release text, timestamped, rolling twelve months"
    outputs:
      - "risk statements from news, dated, each with a verbatim span and a short paraphrase"
    rule: |
      A small language model reads each item with dates and company names redacted and extracts statements of macro risk that could materialise within a year, returning the verbatim span and a short paraphrase for embedding; the pipeline attaches the item's date. For example, the headline "Chipmakers warn tariff ruling could hit margins" gives the span "tariff ruling could hit margins". Its comparator is a keyword extractor using the registered term list, a list of risk terms and modal phrases ("could", "may", "exposed to", "depends on") kept in the register and separate from the worry list; applied to each sentence, it marks the sentence as a risk statement and takes the sentence itself as the paraphrase. The model and the comparator both run on every item and are scored on the same monthly audit sample. The comparator's statements are kept as a second run so that every downstream statistic can be recomputed on them. The model reads directly a sample of 2,000 items, stratified by year, labelled once. For each calendar year a classifier head is trained on that year's encoder using only labelled items dated before the year, and it labels each remaining sentence of the year as a risk statement or not; the paraphrase is taken from the nearest labelled example. The first year with enough labels to train a head is stated with the result. The paraphrase is only used for embedding, so a near neighbour's paraphrase serves.
    checks:
      - "quote gate"
      - "the monthly audit sample includes 30 news records; the model and the keyword comparator are scored on it side by side"
    on_failure: the keyword comparator's statements are used, with a note on the page
    open:
      - "EMPIRICS: the first year with enough labelled items to train a classifier head."

  - id: taxonomy
    name: Registered worry list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: the list is frozen before each run; backtests before the list existed use the initial list, labelled human look-ahead, and are also run once with no list
    inputs:
      - "PM edits"
    outputs:
      - "about thirty external conditions with an 'other' entry, versioned"
    rule: |
      A registered list of about thirty external conditions, for example rates, the memory cycle, tariffs, a regulatory decision, financing, with an 'other' entry. It is versioned and reviewed quarterly from what accumulates under 'other'. The PM edits it whenever a new worry becomes relevant, and every edit is logged with a date. For dates before the list existed, backtests use the initial list written on the memo date; that list was written knowing 2014 to 2026 and is labelled human look-ahead, and the run with no list is the control for it. The bias is one-sided: backtest theme weights are overstated because the initial list holds themes that later mattered. News weight is the count of news risk statements within the assignment distance of an entry's reference point. Under the known-theme assumption, the list's leading entry by news weight forms the baseline.
    checks:
      - "every edit is logged"
      - "quarterly review of the 'other' entry"
    on_failure: the previous version is used
    open: []

  - id: embedspace
    name: Embedding space with a date cutoff
    lane: context
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: the encoder's training cutoff precedes each backtest date; a BM25 keyword retrieval runs beside it as the comparator
    inputs:
      - "risk statements from news, dated, each with a verbatim span and a short paraphrase"
      - "about thirty external conditions with an 'other' entry, versioned"
    outputs:
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
      - "news weight per entry"
    rule: |
      The encoder is a masked language model with one version per calendar year, each trained only on text before that year, mean-pooled over tokens to give sentence vectors and fine-tuned for sentence similarity on pre-cutoff text; the current model is used for the live date. The bias is one-sided. Because the current model has learned associations unavailable to historical encoders, it assigns more live quotes to entries. Live theme statistics are therefore higher than the backtest's for the same text. The news paraphrases over the rolling twelve-month window are embedded and clustered with HDBSCAN at a minimum cluster size of 25, so that each dense cluster is a macro topic under discussion; each cluster is labelled with its top keywords. Each list entry gets a reference point: the entry's phrase embedding seeds a search for its 50 nearest news statements, and their centroid replaces it, because a three-word phrase and a forty-word sentence do not embed on the same scale. The assignment distance $d^*$ is the 90th percentile of member-to-centroid distance across the news clusters, and the news weight of entry $e$ is $\mathrm{NW}_e = \#\{\text{news statements } q : d(q, \mathrm{ref}_e) \le d^*\}$. The space is rebuilt weekly and every quote in the window is re-assigned at each rebuild. An entry with no news within the distance is printed as having no news weight. The whole procedure is run once more with no list, and if the largest cluster by quote weight differs from the leading entry, both are printed. The comparator is BM25 retrieval: each entry's phrase plus its top 20 c-TF-IDF terms as the query, over the paraphrases; agreement is the share of quotes both methods assign to the same entry.
    checks:
      - "news weight per entry is printed"
      - "the share of quotes beyond the distance from every entry is printed"
      - "agreement with the BM25 comparator is printed"
    on_failure: quotes are clustered without list reference points, with a note on the page
    open:
      - "EMPIRICS: the encoder family and its yearly cutoffs."

  - id: pmworries
    name: PM edits the list
    lane: context
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: edits are logged; backtests run without them
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "PM edits"
    rule: |
      The PM adds or removes list entries whenever a worry becomes relevant, usually after reading a page. Every entry, PM-added or not, is placed in the embedding space in the same way. Every edit is a dated event. The baseline against which the theme pipeline is judged is the list's leading entry by news weight alone, without a language model.
    checks:
      - "the edit log"
    on_failure: the pipeline runs on news clusters alone
    open: []

  # ============================================================ naming
  - id: pc1text
    name: Gather component companies' text
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: documents are dated
    inputs:
      - "per component: the component set with each name's loading sign"
      - "per component: the case flag"
      - "per random portfolio: its component set with loadings"
      - "risk-factor and MD&A text per name, dated"
      - "intra-quarter event text per name, dated"
    outputs:
      - "text per component name, with its loading"
      - "text per random-set name, with its loading"
    rule: |
      For every company in a component set, and for every company in each random portfolio's component set, we gather all context-layer and event-stream passages. A passage is a paragraph. At clustering, each quote from a company is weighted by the absolute value of that company's loading on the component. The node keeps its v1 id; naming may run on the second or third component.
    checks:
      - "coverage of the component set, by leg and by layer, is printed"
    on_failure: the theme is named on the names that have text, and the coverage line shows the gap
    open: []

  - id: riskextract
    name: Risk-statement extraction from filings
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: company name and date are redacted from the prompt; error is measured separately before and after the model's training cutoff, and the gap bounds recall from training; only post-cutoff months support a predictive claim
    inputs:
      - "text per component name, with its loading"
      - "text per random-set name, with its loading"
      - "precision and recall by leg, era and cutoff side"
    outputs:
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
      - "the keyword series: the same records from the keyword extractor"
    rule: |
      A small language model reads one section per call, split at paragraph boundaries above 6,000 tokens, with company identity, ticker and dates redacted, and extracts up to three risks that could cause a drawdown within a year, ranked by the model's judgement of severity. For each it returns a verbatim span, a short paraphrase for embedding, and a sign: whether the company loses or gains if the risk materialises. Item 1A statements are losses by construction; the sign does work in MD&A and event text, where a company may state that it benefits, for example from higher rates. Any span that does not appear verbatim in the source is rejected and counted. The model reads the book's component-set documents directly, and its records supply the quotes and the naming. A classifier distilled from the model's labels on the pre-date encoder runs on every document in scope, the component set included, the random portfolios' sets and the propagation scope; every filing in the universe is classified once and cached. The theme weights and the placebo are computed from the classifier's records on both sides, so treatment and placebo use one instrument, and the agreement between the model's direct records and the classifier's on the component set is printed as the distillation check. In the ablation the model run uses the classifier distilled from the model. A keyword extractor serves as comparator. It applies the registered term list to each sentence of the same passages, scoring by matched terms, and takes the three highest-scoring sentences as risks with default loss signs. Both run on every document and are scored on the same hand-labelled sample. The comparator's records form the keyword run, and every downstream text statistic is computed on both runs. Extraction error is measured on the monthly hand-labelled sample, split by leg, by era (December 2013 to 2019, 2020 to 2022, 2023 onward) and by whether the document is dated before or after the model's training cutoff; recall is measured on thirty whole documents a quarter, labelled in full. The error rates from the hand-labelled sample set the stratum weights of the next month's sample and are used for nothing else. When the model version changes, every data stream this node feeds is recomputed and the page displays the level shift.
    checks:
      - "quote gate"
      - "the distillation check: agreement between the model's direct records and the classifier's on the component set"
      - "precision and recall on the hand-labelled sample, by stratum and cutoff side, for the model and for the keyword comparator side by side"
    on_failure: the record is dropped and counted, and the keyword comparator's record stands in
    open:
      - "EMPIRICS: the model and its training cutoff date."

  - id: cluster
    name: Assign quotes to list entries, and pick the theme
    lane: naming
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: the encoder's cutoff precedes each date; a quote stays current until the next document, with no decay; every quote is re-assigned at each weekly rebuild
    inputs:
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
      - "the keyword series: the same records from the keyword extractor"
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
      - "per component: the component set with each name's loading sign"
    outputs:
      - "quote weight per list entry and per residual cluster, by leg, with the placebo weight and the excess weight"
      - "the component's theme: the entry or residual cluster with the largest excess weight, or none"
      - "the theme's excess quote weight by leg, on both series"
      - "the book-effect split of the theme's quotes"
    rule: |
      Each paraphrase is embedded with the pre-date encoder and assigned to the nearest list entry within the assignment distance $d^*$. Quotes beyond $d^*$ from every entry are clustered among themselves with the same HDBSCAN settings, and each of those residual clusters is labelled separately. A document's quotes stay current until the same company files the next document on the same layer; there is no time decay. Each quote $q$ from company $i(q)$, with company sign $c_q$ (-1 if the company loses when the risk hits, +1 if it gains), gets two tags:
        book effect  $b_q = s_{i(q)}\, c_q$          (-1: the book loses if the risk materialises)
        aligned      iff  $c_q \operatorname{sign}(v_{i(q)k}) = -1$   (the risk moves the company the same way a reversal would)
      Only aligned quotes count toward a component's theme weight; an unaligned quote is evidence of a different theme. The weights on both sides use the distilled classifier's records:
        $Q_e = \sum |v_{i(q)k}|$ over aligned quotes $q$ assigned to $e$, by leg
        $P_e$ = the mean of the same over the random portfolios' component sets, each weighted by its own loadings
        $E_e = Q_e - P_e$
        theme $= \arg\max_e E_e$   if  $E_e > q_{95}(\max_e E_e \text{ over the random sets})$,  else none
      A boilerplate risk that every company lists therefore shows zero excess weight. The top three entries are printed with their excess weights, and if the runner-up's $E_e$ is within 10% of the first's, both are printed and the first is treated as the theme. A residual cluster competes on the same footing, with its placebo weight being the weight of random-set quotes that fall into the same cluster. The book-effect split, the share of the theme's quote weight with $b_q = -1$, is printed beside the theme. Everything in this node is computed on both text runs.
    checks:
      - "placebo weight per entry"
      - "the share of quotes in residual clusters"
      - "month-to-month stability of the assignment"
    on_failure: the previous assignment is used
    open: []

  - id: namecluster
    name: Name the theme
    lane: naming
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: the name is grounded in the 20 quotes nearest the cluster centre; a keyword label is printed beside it; the name is a label only, and the tail model uses no number derived from it
    inputs:
      - "the component's theme: the entry or residual cluster with the largest excess weight, or none"
      - "quote weight per list entry and per residual cluster, by leg, with the placebo weight and the excess weight"
      - "embedding space with a reference point per list entry, news clusters, and an assignment distance"
    outputs:
      - "theme name per component, with its supporting quotes"
      - "the nearest news cluster and its headline count"
    rule: |
      If the component's theme is a list entry, its label is the entry's label. If it is a residual cluster, a language model reads the 20 quotes nearest its centre and names it; a c-TF-IDF keyword label, the top terms that distinguish the cluster from the others, is printed beside the model's name so the reader can check one against the other. In the keyword run the keyword label is the theme label. The nearest news cluster's keyword label and headline count are printed beside the theme; a theme with no news cluster within the assignment distance of its centroid is flagged company-specific. The naming is calibrated by running it on sector-matched random company sets: a label must be more specific on the real cluster than on a random one, rated on a three-point scale by the second reader, who checks the first analyst's labels.
    checks:
      - "calibration on sector-matched random sets"
      - "the keyword label is printed"
    on_failure: the keyword label is printed alone
    open: []

  # ============================================================ propagation
  - id: propagate
    name: Search other names for the theme
    lane: propagate
    kind: model
    status: settled
    origin: v2
    lookahead: model
    mitigation: before the language model's training cutoff only retrieval with the pre-date encoder is used; the model reranks post-cutoff months only; the retrieval-only result is always printed beside the model's
    inputs:
      - "theme name per component, with its supporting quotes"
      - "risk-factor and MD&A text per name, dated"
      - "intra-quarter event text per name, dated"
      - "positioning score per name, with the longest input lag"
    outputs:
      - "theme names outside the component set, each with a score and a quote, on both series"
    rule: |
      Once a theme is named, we search two sets of companies outside the component set: the rest of the book, and companies outside the book that sit in the universe's top quintile by positioning score. Every passage in scope is embedded once with the pre-date encoder and cached. Retrieval by the theme's reference point returns the 200 nearest passages. The language model scores each candidate company from 0 to 3 for whether its filings contain the theme, each score with a verbatim span: 0 no mention; 1 the topic is mentioned without a risk statement; 2 a risk statement on the theme; 3 a risk statement naming it as a principal risk. A score of 2 or more marks the company as a theme company outside the component set. For backtest dates before the model's cutoff, the model is not used: a company is marked when its nearest passage is within the assignment distance. The keyword run uses that retrieval rule on every date. As a control, the same run is made with a plausible but wrong theme: the list entry that had the most news weight twelve months earlier, or the next entry if that one is the current theme. The share of companies it marks is the false-positive rate and is printed beside the share for the real theme. When the model version changes, every data stream this node feeds is recomputed and the page displays the level shift.
    checks:
      - "quote gate"
      - "false-positive rate from the wrong-theme control"
      - "the retrieval-only result is printed beside the model's"
    on_failure: the name is marked as not searched
    open:
      - "EMPIRICS: the model's training cutoff, and the number of post-cutoff months available for the reranking comparison."

  - id: themescore
    name: Theme statistics
    lane: propagate
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the text inputs; nothing added here
    inputs:
      - "per component: the book's variance share and its percentile against random portfolios"
      - "the named component"
      - "per component: the component set with each name's loading sign"
      - "theme names outside the component set, each with a score and a quote, on both series"
      - "theme name per component, with its supporting quotes"
      - "news weight per entry"
      - "per component: its daily return and ten-day sigma"
      - "position weights"
    outputs:
      - "the book's variance share on the theme, with its percentile"
      - "the loss share: the share of book weight, by leg, in names that lose if the theme reverses"
      - "the share of book weight, by leg, in in-book companies outside the component set with the theme, on both series"
      - "the loss in basis points if the component returns minus two sigma over ten days"
      - "the agreement line"
    rule: |
      Two statistics are printed, each beside its random-portfolio comparison. The first is $\mathrm{VS}_k$ for the named component, with its percentile. The second is the loss share, the share of book weight in companies that lose if the theme reverses, and its value in basis points of book:
        $L_{\text{leg}} = \sum |w_i|$ over set companies with $s_i \operatorname{sign}(v_{ik}) > 0$, plus found in-book companies $j$ with $s_j \operatorname{sign}(\beta_{jk}) > 0$
        bp loss $= -2\sigma_k \big( \sum_{i \in \text{set}} w_i v_{ik} + \sum_{j\ \text{found}} w_j \beta_{jk} \big)$
      The bp loss is net: set companies that gain on a reversal offset those that lose. Theme companies outside the book have no weight in the book and do not enter either line; they appear only in the positioning overlap. The loss share is a page statistic and not a tail-model regressor, because once the theme is fixed it is price arithmetic. What the tail model takes from this node is the share of book weight, by leg, in in-book companies outside the component set that propagation found with the theme, computed on both text runs. The agreement line records whether the list entry with the most news weight and the component's theme label match. For a list entry this is a string match; for a residual cluster the second reader decides. The statistics are recomputed weekly from the event stream and monthly from the decomposition.
    checks:
      - "both placebo comparisons"
      - "a check that the statistics are not driven by filing season, comparing February with August"
    on_failure: n/a
    open: []

  # ============================================================ positioning
  - id: poscluster
    name: Positioning overlap with the theme
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the theme names; positioning is taken as of its release date
    inputs:
      - "positioning score per name, with the longest input lag"
      - "theme names outside the component set, each with a score and a quote, on both series"
      - "per component: the component set with each name's loading sign"
      - "position weights"
    outputs:
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "the non-overlap"
      - "off-book theme names in the universe's top positioning quintile"
    rule: |
      $T$ is the set of theme companies, the component set plus the companies found by propagation, and $C$ is the crowded set, the top quintile of the positioning score within each leg of the book. Per leg:
        $$O = \frac{\sum_{i \in T \cap C} |w_i|}{\sum_{i \in T} |w_i|}$$
        $$N = \frac{\sum_{i \in C \setminus T} |w_i|}{\sum_{i \in C} |w_i|}$$
      Both are reported with their history since January 2014, when the reconstructed book begins. Theme companies outside the book have no leg; they are listed separately, with their universe positioning quintile. Whether hedge funds are mostly positioned on one theme is a claim, and the overlap history is the evidence for or against it: random assignment gives $O = 0.2$, and the claim is supported if the median of $O$ since 2014 is above it.
    checks:
      - "the overlap history is printed"
      - "the history of the overlap statistic is kept"
    on_failure: the overlap is not computed, with a note on the page
    open: []

  - id: timebombs
    name: Vulnerable names, two lists
    lane: positioning
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the overlap; returns and positioning are taken as of the date
    inputs:
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "daily returns per name"
      - "per component: its daily return and ten-day sigma"
      - "positioning score per name, with the longest input lag"
    outputs:
      - "the pre-catalyst list, by leg"
      - "the post-unwind list, by leg"
    rule: |
      Two lists are produced, both drawn from companies that are heavily positioned and on the theme. With $r_{i,20}$ the company's trailing 20-day return, $f_{k,20}$ the component's, and $\mathrm{sd}_{20}$ the standard deviation of rolling 20-day returns over the trailing year (a different quantity from $\sigma_k$):
        pre-catalyst list:  $r_{i,20}\, \operatorname{sign}(v_{ik})\, \operatorname{sign}(f_{k,20}) > \mathrm{sd}_{20,i}$
        post-unwind list:   $|r_{i,20}| < \mathrm{sd}_{20,i}$  and  $|f_{k,20}| > \mathrm{sd}_{20,k}$
      The first are the companies with the largest recent gain at risk; the second are the companies that have not yet fallen. Both lists are split by leg, because a crowded short that has not yet rallied during a squeeze is the most likely target of the next one. Neither list is printed until its event study in the validation lane has run.
    checks:
      - "the count and weight of each list are printed with their history"
    on_failure: n/a
    open: []

  # ============================================================ tail model
  - id: severity
    name: Conditional tail model
    lane: tail
    kind: deterministic
    status: settled
    origin: v1
    lookahead: model
    mitigation: inherited from the theme regressors; every regressor uses only values available on the formation date, earnings dates are projected from the prior year and macro releases are scheduled in advance
    inputs:
      - "book returns"
      - "the bear state"
      - "the book's variance share on the theme, with its percentile"
      - "the theme's excess quote weight by leg, on both series"
      - "the share of book weight, by leg, in in-book companies outside the component set with the theme, on both series"
      - "price-correlated names"
      - "per component: the case flag"
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "approved catalysts, with dates and types"
      - "earnings dates per name"
      - "scheduled macro releases"
      - "GARCH vol forecast"
      - "calendar baseline VaR"
    outputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "the ablation sequence"
    rule: |
      The tail model is a quantile regression for the 5% quantile of the book's ten-day forward return:
        $$Q_{0.05}(R_{t,t+10} \mid x_t) = x_t' \theta$$
      $\theta$ is fitted by quantile regression on formation days $u \le t - 10$, so that every target in the fit is realised. The regressors $x_t$ enter by ablation step, and every step is reported on every run:
        step 0   trailing volatility; $B_t$ and $B_t$ times market variance; the case flag; the catalyst-window indicator and days to the nearest catalyst; the GARCH forecast and the calendar baseline as controls
        step 1   adds $\mathrm{VS}_k$ and the share of book weight in price-correlated companies
        step 2a  adds $E_e$ by leg and the found in-book company weight share, on the keyword run
        step 2b  the same two on the model run, in place of 2a
        step 3   adds $O$; this is the full model
      The catalyst window is the ten sessions $[T-5, T+5)$ around catalyst date $T$. In the backtest the catalysts are the scheduled macro releases and the component companies' earnings, where a company's earnings count only when the companies reporting inside the window together hold at least 10% of the component set's weight; live, the PM's approved catalysts are added. Outputs are the ten-day VaR and expected shortfall in bp of book, and the catalyst-window VaR with its increase, $\mathrm{VaR}(x_t) - \mathrm{VaR}(x_t \text{ with the window indicator set to } 0)$, which is the additional risk attributed to the catalyst. The comparison of 2b with 2a tests whether the language model's extraction, labelling and reranking add anything beyond a keyword rule run through the same embedding space; it does not test a rule against a model, since both runs are embedded by the same encoder. If step 2b does not beat step 2a by the registered margin, the memo reports that the language model adds nothing to identification beyond a keyword rule, and the keyword extractor takes its place in production. To show whether the quantile responds to the state variables, the breach rate is reported separately for each state: $B_t$ on or off, case flag factor or theme, inside or outside a catalyst window.
    checks:
      - "prior result: v1's tail model, without the text regressors, breached 2 of 42 held-out forecasts"
      - "breach rate by state"
      - "the ablation sequence"
      - "expected shortfall is no milder than the VaR"
    on_failure: the step-0 model is reported in place of the full model, with a note on the page
    open: []

  - id: garch
    name: GARCH baseline
    lane: tail
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: refit at each formation date
    inputs:
      - "book returns"
    outputs:
      - "GARCH vol forecast"
    rule: |
      The rule fits a GARCH(1,1) model on the book's daily returns, refit at each formation date. Its forecast enters the tail model as a control and the validation as the baseline that uses no calendar information.
    checks: []
    on_failure: n/a
    open: []

  - id: eventbaseline
    name: Calendar baseline
    lane: tail
    kind: deterministic
    status: settled
    origin: v2
    lookahead: clean
    mitigation: earnings dates are projected from the prior year; macro releases are scheduled in advance
    inputs:
      - "book returns"
      - "position weights"
      - "earnings dates per name"
      - "scheduled macro releases"
    outputs:
      - "calendar baseline VaR"
    rule: |
      This is the baseline that uses the calendar. For each catalyst window it makes 1,000 draws $d$ of the book's window return:
        $$R^{(d)} = \sum_{i\ \text{reporting}} w_i\, r_i^{\mathrm{ann},(d)} + \sum_{i\ \text{other}} w_i\, r_i^{10,(d)}$$
      where a reporting company contributes one of its last eight announcement returns, drawn at random, and every other company contributes one of its ten-day returns from the trailing year. When the window contains a macro release, the other companies' ten-day returns are drawn from the ten-day windows around the last eight releases of that type, not from the trailing year. The release therefore enters through the company returns and is not added a second time at book level. The 5th percentile of the draws is the baseline VaR. Outside a catalyst window the baseline is the 5th percentile of the book's ten-day returns over the trailing year. Any model given the earnings calendar will beat GARCH around scheduled events, so the tail model is required to beat this baseline as well.
    checks: []
    on_failure: n/a
    open: []

  # ============================================================ catalysts
  - id: catagent
    name: Catalyst proposal (live only)
    lane: catalysts
    kind: model
    status: settled
    origin: v2
    lookahead: live-only
    mitigation: none exists; a model reading past news would propose the catalysts that turned out to matter, so this node runs on live data only and no backtest claim depends on it
    inputs:
      - "theme name per component, with its supporting quotes"
      - "items from the last five sessions"
      - "intra-quarter event text per name, dated"
    outputs:
      - "proposed catalysts per theme, each with a date, a source quote and a type, beside the comparator's proposals"
    rule: |
      Scheduled catalysts (FOMC, CPI, payrolls, index rebalances, component companies' earnings) come from market-data calendars without a model. This node proposes unscheduled ones: company-specific and off-universe events, such as foreign supplier earnings or regulatory readouts. A language model reads the last five sessions' news and event-stream text, proposing each catalyst with date, source quote, and unscheduled type. A deterministic extractor serves as comparator over the same five sessions. Any dated sentence matching the registered term list that names a component company or its suppliers is a proposal. The PM's approval share for each list is printed. As a hand-written illustration: when the memory cycle was the theme in mid-2026, the two relevant catalysts were earnings of Broadcom and of SK Hynix, an off-universe company.
    checks:
      - "a date and a quote are required"
      - "the PM's approval share for the model's list and for the comparator's list, side by side"
    on_failure: only calendar catalysts are used
    open: []

  - id: catapprove
    name: PM reviews catalysts
    lane: catalysts
    kind: human
    status: settled
    origin: v2
    lookahead: human
    mitigation: none needed; runs live only
    inputs:
      - "proposed catalysts per theme, each with a date, a source quote and a type, beside the comparator's proposals"
    outputs:
      - "approved catalysts, with dates and types"
    rule: |
      The PM reviews the proposals weekly; there are fewer than ten a week. The PM approves a catalyst on its date and relevance, not on any view of its outcome. The PM's main contribution is adding catalysts the model missed. Catalysts not yet approved appear on the page as proposed.
    checks: []
    on_failure: unapproved catalysts are shown as proposed
    open: []

  # ============================================================ analogues
  - id: analogue
    name: Analogue retrieval
    lane: analogue
    kind: deterministic
    status: settled
    origin: v1
    lookahead: model
    mitigation: inherited from the theme inputs; each past date's state is computed from data as it stood on that date, and dates within one year of today are excluded
    inputs:
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "the book's variance share on the theme, with its percentile"
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "book returns"
      - "daily WML from 1926"
      - "the bear state"
      - "the reversal record, 195 episodes since 1926"
    outputs:
      - "the five nearest past dates, what the book did over the following ten days, and whether each is apt"
    rule: |
      The state of a date is a vector of the six exposures, the book's variance share on the named component, the positioning overlap, trailing realised volatility, and the bear state. Theme and positioning entries exist from January 2014. Before December 2013 the six exposures are the French factor's own 126-day slopes on available series, labelled factor-level rather than company-level, and the distance uses the exposures, volatility and bear state only, with a note on the page. The distance between states is the Mahalanobis distance, using a covariance estimated on dates before December 2013 for price dimensions and on the expanding window since 2014 for theme and positioning dimensions. Candidates are dates in the reversal record and an equal number of quiet dates drawn at random at least 21 trading days from any episode; dates within one year of today are excluded. A deterministic rule marks each analogue apt or not: its bear state and case flag value (factor or theme) must match today's, and its theme must share the list entry. Before 2014 aptness is judged on the bear state and the case flag only, with a note on the page.
    checks:
      - "each past date's state is regenerated from inputs public before it"
    on_failure: the five nearest dates are listed without saying whether each is apt
    open: []

  # ============================================================ page and people
  - id: eventrule
    name: When a page is produced
    lane: page
    kind: deterministic
    status: settled
    origin: v1
    lookahead: model
    mitigation: inherited from the tail model; thresholds are registered
    inputs:
      - "approved catalysts, with dates and types"
      - "earnings dates per name"
      - "scheduled macro releases"
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the book's variance share on the theme, with its percentile"
      - "per series: the exposure in hedgeable units, its percentile against random portfolios, and its percentile against the book's own history"
      - "book returns"
    outputs:
      - "the page type and its fields, with each field's change since the last page"
      - "hit, miss and silence counts"
    rule: |
      A page is produced on either of two triggers. The calendar trigger produces one five sessions before each approved catalyst, with the catalyst-window VaR and its increase. The threshold trigger uses the own-history percentile $p_{kt}$ of each of eight statistics (the ten-day VaR, with a larger loss at a higher percentile; $\mathrm{VS}_k$ of the named component; and $S_1, \dots, S_6$), and the maximum over them:
        $M_t = \max_k p_{kt}$;   threshold page  iff  $M_t > q_{95}(M_u,\ u < t)$
      The maximum's own 95th percentile is crossed on 5% of days, about one day a month, by construction, and the page shows which statistic crossed. Percentiles against random portfolios are context only and cannot trigger a page. If neither trigger fires, a weekly summary is produced. Every page shows each field's change since the last page. Every page has a resolution date: a calendar page resolves at the catalyst, a threshold page at the ten-day horizon. A hit is $\text{event}_t = 1$ (the problem block's definition) after a page; a miss is a page with $\text{event}_t = 0$; a silence is $\text{event}_t = 1$ with no page. The three are counted and printed monthly. A threshold page is justified if hits on page days exceed the 5% base rate, and the register states that rate. Weekly summaries are not scored. In production the page is kept current, pushed to the reader whenever it changes.
    checks:
      - "the measured false-page rate"
      - "hits, misses and silences, monthly"
    on_failure: the plain template is sent with a note at the top saying why
    open: []

  - id: composer
    name: Prose over fixed fields
    lane: page
    kind: model
    status: settled
    origin: v1
    lookahead: model
    mitigation: inherited from the page fields; the prose adds nothing, and every number in it is checked against the field it came from
    inputs:
      - "the page type and its fields, with each field's change since the last page"
    outputs:
      - "the composed page, or the template"
    rule: |
      A language model writes the prose over the fixed fields. A check rejects the page if any number in the prose fails to match the field it came from; a single mismatch is enough to send the plain template instead. For comparison, the template with the same fields and no prose is rendered daily into the log. The composer runs daily on a test date with a known correct page; if it fails, the plain template is sent. A blind comparison has two readers score the prose page and the template without knowing which is which; if the template proves equally useful, the prose is dropped and the template becomes the page.
    checks:
      - "the numeral check"
      - "the daily test date"
      - "blind comparison against the template, register row 13, not yet run"
    on_failure: the plain template is sent with a note at the top saying why
    open: []

  - id: thepage
    name: The page
    lane: page
    kind: output
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the theme and the tail model; nothing added here
    inputs:
      - "the composed page, or the template"
      - "the book's variance share on the theme, with its percentile"
      - "the agreement line"
      - "the loss in basis points if the component returns minus two sigma over ten days"
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "the component set's implied ten-day move, loading-weighted, in per cent"
      - "sector ETF implied move, in per cent"
      - "the hedge line: instrument, notional per $100m of book, and ten-day premium in bp of book"
      - "the pre-catalyst list, by leg"
      - "the post-unwind list, by leg"
      - "the overlap of the heavily positioned names with the theme names, by leg, with its history since January 2014"
      - "off-book theme names in the universe's top positioning quintile"
      - "short interest per name"
      - "positioning score per name, with the longest input lag"
      - "the bear state"
      - "approved catalysts, with dates and types"
      - "the driving-series exposure of the leg that holds more of it, in hedgeable units, with the names inside the leg that contribute most"
      - "which statistic is printed first"
      - "the five nearest past dates, what the book did over the following ten days, and whether each is apt"
      - "theme name per component, with its supporting quotes"
      - "the book-effect split of the theme's quotes"
      - "coverage per name, by leg and by layer"
    outputs:
      - "one page, pushed to the reader"
    rule: |
      The reader is the PM running momentum, or the risk manager covering that book. Every headline number is over ten trading days, and the catalyst window is ten trading days, so one horizon holds throughout. The page has nine items, in order. Item 1 is the leading component and the theme. If the leading component is flagged factor, the item reads that the leading co-movement is the momentum factor itself, with its diagnostic label, and the named theme follows as the second component with its variance share. Otherwise the item is the theme, the book's variance share on it and its percentile, the top three entries with their excess weights, the book-effect split, and the agreement line, by leg. Item 2 is the loss in basis points if the component returns minus two sigma, its direction, and the loss share by leg. Item 3 is the ten-day VaR and expected shortfall, the catalyst-window VaR beside the component set's implied move, and the hedge line with the instrument's implied move and premium. Item 4 is the positioning overlap by leg with the bear state in a state line, short interest and the positioning lag, and the pre-catalyst and post-unwind lists by leg once their event study has run; until then a line records that they are withheld. Item 5 is the approved catalysts with dates and types. Item 6 is the driving-series exposure in hedgeable units, printed first when the named component's R-squared on the reference series is above 0.5. Item 7 is the five analogues with what followed and whether each is apt. Item 8 is each field's change since the last page. Item 9 is a footer with coverage by layer and a note that the numbers describe the paper 12-1 book. If the reader's positions are an input, the footer prints the reader's beta to that book; otherwise it tells the reader to scale by that beta. The conclusion gives the direction of the risk and the hedge, and leaves the decision to exit with the reader; this is the decision the system informs. Every number links to a stored output and every theme to its quotes. The page records whether it was acknowledged.
    checks:
      - "the numeral check"
      - "every quote passes the quote gate"
    on_failure: the plain template is sent with a note at the top saying why
    open:
      - "The example page with numbers, required by element 6 of the brief, is in the memo, not in this spec."

  - id: responselog
    name: Response log (production only)
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: production only; it needs the reader's positions as an input
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "looked at, ignored, or acted on, per page"
    rule: |
      Each page is logged as looked at, ignored, or acted on, and scored against a base rate: the share of weeks in which the PM changes the momentum exposure of the PM's own book, measured as its beta to the 12-1 book, with no page. This log is the only way to measure whether a page changed a decision. It cannot exist until the reader's actual positions are an input to the system, because the 12-1 book is a paper portfolio that no fund holds. It is the first item of the production path.
    checks:
      - "the base rate is stated before scoring"
    on_failure: n/a
    open: []

  - id: signoff
    name: The human tasks
    lane: page
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: none needed; runs live only
    inputs:
      - "one page, pushed to the reader"
    outputs:
      - "acknowledged page, or the page shipped unacknowledged"
      - "monthly labelled sample"
    rule: |
      The PM acknowledges each page, or it is sent marked unacknowledged. The PM edits the worry list whenever a worry becomes relevant. The PM reviews proposed catalysts weekly. A research analyst labels a stratified sample of about 90 extracted records each month (60 from filings, 30 from news), which the second reader, a second research analyst, checks.
    checks: []
    on_failure: the page ships unacknowledged
    open: []

  # ============================================================ validation
  - id: register
    validation: true
    name: Pre-registration register
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: clean
    mitigation: thresholds and both outcome sentences are written before each run
    inputs: []
    outputs:
      - "a row per test: threshold, margin, power, and the sentence that goes in the memo under each outcome"
    rule: |
      Before each test runs, a row records the pass threshold and the sentence that goes in the memo if the test passes and if it fails; when the result is in, the sentence for the other outcome is deleted. Before any test, the smallest effect it could detect is found by simulation; a null result is a finding only if that detection floor is below the effect size of interest, and otherwise the test is reported as too weak to see it. The 2023-onward seal was opened in v1 for the severity breach test. Every v2 test runs on the full sample from December 2013 and is labelled design tier; a forward seal from the memo date is the confirmatory sample. Rows that test the memo or the developer's process rather than the market are kept in a process appendix. The v1 rows are archived with their outcomes.
    checks:
      - "the build fails if any placeholder for an unresolved outcome remains in the memo"
    on_failure: n/a
    open:
      - "v1 rows 02, 03 and 05 have no result; row 23 was registered with two dates' numbers already known and is labelled so."

  - id: labels
    validation: true
    name: Hand-labelled sample
    lane: research
    kind: human
    status: settled
    origin: v1
    lookahead: human
    mitigation: the labels are used only to score the model, never to train it
    inputs:
      - "monthly labelled sample"
      - "risk statements per name, each with a verbatim span, a sign and a short paraphrase"
    outputs:
      - "precision and recall by leg, era and cutoff side"
    rule: |
      A research analyst labels about 90 records each month, drawn as a stratified sample by leg, by era (December 2013 to 2019, 2020 to 2022, 2023 onward), and by whether the document is dated before or after the model's training cutoff. The second reader checks each label. Confidence intervals are classical; prediction-powered inference is not used because the sample is too small for it. The difference in error between pre- and post-cutoff records is the bound on how much the model may be recalling from training rather than reading.
    checks: []
    on_failure: the error estimate comes from the hand labels only
    open:
      - "Has not yet run; the ninety labels for v1's extractor were reserved for the author and never written."

  - id: volvalidation
    validation: true
    name: Tail-model scoring
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the tail model; catalyst dates come from the calendars, projected or scheduled in advance
    inputs:
      - "ten-day 5% VaR and expected shortfall, in bp of book"
      - "the VaR conditional on a catalyst window, and its increase over the unconditional VaR"
      - "the ablation sequence"
      - "GARCH vol forecast"
      - "calendar baseline VaR"
      - "the component set's implied ten-day move, loading-weighted, in per cent"
      - "book returns"
      - "earnings dates per name"
      - "a row per test: threshold, margin, power, and the sentence that goes in the memo under each outcome"
    outputs:
      - "breach rate and pinball loss per ablation step, against both baselines, per catalyst type"
      - "the catalyst-window increase against the implied move, where history exists"
    rule: |
      Every formation month from December 2015 yields one unconditional VaR observation against realised ten-day book returns (about 130 observations). Months with catalysts yield one catalyst-window observation on the catalyst window's first day, selecting the nearest catalyst. Both VaR series, the unconditional and the catalyst-window, are scored, so the state-conditional breach rates and the threshold trigger's VaR are tested on the same observations as the catalyst-window VaR. The effective sample size is stated, and the power calculation is registered before the run. Each ablation step is scored on breach rate and pinball loss against the GARCH and calendar baselines, per catalyst type (earnings, macro release, and live unscheduled). A breach is $\mathbf{1}[R_{t,t+10} \le \mathrm{VaR}_t]$, with $\mathrm{VaR}_t$ a return quantile and so negative. Pinball loss is the scoring rule for a quantile forecast: a breach costs 0.95 times its size, and a non-breach costs 0.05 times the distance, $\rho(z) = z\,(0.05 - \mathbf{1}[z < 0])$ with $z$ the realised return minus the forecast, averaged over observations. The catalyst-window increase is compared with the component set's implied move where options history exists; otherwise the comparison is marked illustrative. The register row states the margins, proposed here and frozen before the run. At each step the breach rate must pass Kupiec's unconditional-coverage test at the 10% level, with the count and the acceptance range printed in the row (roughly 2% to 9% at 130 observations). The pinball loss must be at least 5% below each baseline's. Step 2b must reduce the pinball loss of step 2a by at least 2% for the language model to be judged to add anything. On months before the model's training cutoff the two text runs differ in extraction and naming only; reranking differences appear on post-cutoff months only, and that month count is printed.
    checks:
      - "register row with margin and power"
    on_failure: n/a
    open:
      - "EMPIRICS: the power calculation for the coverage test and the 2% and 5% margins at about 130 observations."

  - id: bombtest
    validation: true
    name: Event study for the vulnerable-name lists
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: model
    mitigation: inherited from the lists; lists are frozen before the outcome window, and positioning is as of the date
    inputs:
      - "the pre-catalyst list, by leg"
      - "the post-unwind list, by leg"
      - "daily returns per name"
      - "sector codes"
      - "the reversal record, 195 episodes since 1926"
      - "a row per test: threshold, margin, power, and the sentence that goes in the memo under each outcome"
    outputs:
      - "each list's excess move over sector-matched names not on the list, per unwind"
    rule: |
      The event study covers the five recorded unwinds since 2020 in the reversal record (November 2020, early 2021, November 2022, January 2025 and April 2025), each dated by its first breach day. It measures whether the listed companies moved in the loss direction by more than sector-matched companies not on the list over the following twenty sessions, using positioning data as it was available at the time. The pre-catalyst list is frozen 21 sessions before the first breach day; the post-unwind list five sessions after it; each is scored over the twenty sessions following its freeze. The registered margin requires listed companies to exceed matched controls by at least 200bp in the loss direction across the five unwinds. The excess move must share the loss direction in at least four of the five unwinds. The detection floor at five unwinds is stated in the row. Neither list is printed on any page until this test has run. All five unwinds are design tier, since the 2023-onward seal was opened in v1.
    checks:
      - "register row"
    on_failure: the lists are not printed
    open:
      - "EMPIRICS: the five first-breach dates from the reversal record."

  - id: themevalidation
    validation: true
    name: Theme pipeline against the PM's list
    lane: research
    kind: deterministic
    status: settled
    origin: v2
    lookahead: human
    mitigation: there is no history until a PM edits the list; this is a production measurement
    inputs:
      - "the agreement line"
      - "PM edits"
      - "a row per test: threshold, margin, power, and the sentence that goes in the memo under each outcome"
    outputs:
      - "the share of PM-added entries the pipeline had surfaced first; the share of residual themes the PM later adopted"
    rule: |
      Run quarterly. It measures whether the pipeline finds themes the PM had not listed, and whether the PM needs to add fewer entries over time. The first reading is four quarters after a PM starts editing the list.
    checks:
      - "register row"
    on_failure: n/a
    open: []

  # ============================================================ retired
  - id: route1
    name: Route 1 detector (retired)
    lane: retired
    kind: deterministic
    status: retired
    origin: v1
    lookahead: clean
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. Its input was the old text stage's condition concentration, the share of the loser leg's quotes on its top condition, which no longer exists; the per-leg theme statistics now cover the case it detected, a short leg concentrated on one condition.
    checks: []
    on_failure: n/a
    open: []

