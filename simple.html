<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System design, simplified</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.5/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.5/katex.min.js"></script>
<script src="math.js"></script>
<link rel="stylesheet" href="canvas.css?v=3">
</head>
<body>
<div id="top"><b id="title">System design, simplified</b><span class="meta" id="version"></span>
  <span class="steps"><span class="lbl">steps</span><span id="stepbtns" style="display:flex;gap:4px"></span></span>
  <span class="sp"></span>
  <span class="grp"><button id="b_fit" title="F">fit</button><button id="b_open">all open</button><button id="b_close">all closed</button></span><span class="grp"><button id="b_data" title="draw the data feeds as lines">data lines</button><button id="b_ret" hidden>retired</button></span><span class="grp"><button id="b_story">story</button><button id="b_key">key</button></span>
  <a class="btn" href="index.html">full design</a>
</div>
<div id="stage"><div id="world"><svg id="edges"></svg></div></div>
<div id="left" class="drawer"><button class="close" id="left_close">×</button>
  <div class="tabs"><button id="tab_step">step</button><button id="tab_story">story</button><button id="tab_key">key</button></div>
  <div id="pane_step" hidden><div class="muted">Click a step header on the canvas, or a number in the top bar.</div></div>
  <div id="pane_story" hidden></div>
  <div id="pane_key" hidden></div>
</div>
<div id="right" class="drawer"><button class="close" id="right_close">×</button><div id="rbody"></div></div>
<div id="key">
  <span><i class="sw" style="background:#ececea;border:2px double #a9a9a6;border-radius:6px"></i>data in</span>
  <span><i class="sw" style="background:#fff;border:1px solid #c9c6bd;border-left:3px solid #4e7698"></i>rule</span>
  <span><i class="sw" style="background:#fdf1e6;border:1.5px solid #b5651d;border-radius:4px"></i>LLM</span>
  <span><i class="sw" style="background:#f7f0e2;border:1.5px solid #9c8355;clip-path:polygon(3px 0,8px 0,11px 50%,8px 100%,3px 100%,0 50%)"></i>human</span>
  <span><i class="sw" style="background:#e9f4ee;border:2px double #2f7d5a"></i>page</span>
  <span><i class="sw" style="background:#f3eefa;border:1.5px dashed #6b4e9b;clip-path:polygon(3px 0,11px 0,11px 8px,8px 11px,0 11px,0 3px)"></i>validation</span>
  <span><i class="ln"></i>backtest and live</span><span><i class="ln live"></i>live only</span><span><i class="ln bt"></i>backtest only</span><span><i class="ln fb"></i>feedback</span>
  <span><i class="ln up"></i>upstream of the selection</span><span><i class="ln down"></i>downstream</span>
</div>
<script>window.CANVAS={spec:'simple.yaml',groups:'groups.yaml',simple:true};</script>
<script src="canvas.js?v=3"></script>
</body>
</html>
