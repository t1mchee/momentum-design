# System design v2, draft 17. Standalone (no base file). Retired components stay, with the reason and no
# edges. Formulas are LaTeX, rendered by KaTeX: $$...$$ on a line of its own for a display formula, $...$
# inline; |x| for abs, \sum, \operatorname{sign}, \mathbf{1}[.] for an indicator, q_{95} for a 95th
# percentile of a history.
#
# Fields per node: id, name, lane, kind (data | deterministic | model | human | output), status (settled |
# retired), origin (v1 | v2), lookahead (clean | as-of | model | live-only | human), mitigation (empty means
# inherited from the inputs), access (data nodes: public | mixed), inputs, outputs, rule, checks,
# on_failure, open, validation (true on the components that score other components). Empty checks,
# on_failure and open fields are omitted.
# Fields per edge: from, to, carries, when (daily | weekly | monthly | at rebalance | on change | on event |
# on release | quarterly | once), mode (backtest and live | live only | backtest only), feedback.

meta:
  title: Momentum reversal-risk system, v2 draft 17
  version: v2-draft-17
  updated: "2026-09-07"
  problem:
    exposure: "the 12-1 momentum book: the top and bottom deciles of the Russell 3000 by return from twelve months before to one month before, value-weighted within each leg, dollar-neutral, rebuilt monthly"
    event: >-
      a ten-day return of the reconstructed book at or below its own unconditional 5% quantile on the history since December 2013: $\text{event}_t = \mathbf{1}[R_{t,t+10} \le Q_{0.05}(R_{u,u+10},\ \text{Dec 2013} \le u \le t-10)]$. The tail model forecasts that quantile conditionally; a page is scored against the unconditional one. The French factor's -432bp is the same quantile on the published factor over 1926 to 2022, printed as the long-run reference and used for the reversal record before December 2013, where no reconstructed book exists
    horizon: "ten trading days, for every forecast on the page"
    user: "a discretionary macro PM whose book carries momentum-type exposure, or the risk manager covering it"
    decision: "whether and how much to hedge the book's exposure to the named theme before the next catalyst, from the VaR before and after the sized hedge on the page, and, once the event study on the vulnerable-name lists has passed, which companies to trim; the reader decides"
  note: >
    The design assumes that the theme behind a reversal has been building in the news for some time and that
    the PM can put a label on it. The system measures how much of the book depends on that theme, where it
    has spread, who is positioned on it, and how much worse the book's tail becomes around the next catalyst.
    It finds themes as clusters of risk statements in the news and in filings; on the live page the PM's
    worry list gives those clusters names. The assumption is that the theme is visible in advance. It fails when a reversal
    comes from a theme that had not appeared in the news. On such a day the page shows no theme, or the
    wrong one, and the VaR is unchanged, because the tail model does not take the theme. This case may be
    common: 77 of the 86 episodes that the first design's rules could not classify were loser-leg losses in
    a rising market with no prior bear state. Whether a theme was visible before those episodes is measured,
    not assumed; the premise share is an output of the scoring node, and the data on disk allow it to be
    measured on eight episodes against three calm windows.
  legend:
    status: "settled = decided in v2; retired = replaced, kept with the reason."
    origin: "v1 = a component retained from the first design, rewritten here only in language; v2 = new."
    kind: "data = a feed (grey pill); deterministic = a rule with no model (white box, blue band); model = a language-model component (orange); human = a person's task (tan hexagon); output = the page (green double border)."
    lane: "a rendering row in the full view; the seven numbered groups in the levels view are the reading order."
    lookahead: >
      clean = uses only values that were public on the date; as-of = the values exist historically but must be
      taken at their release date; model = a model trained after the date reads text from inside it; live-only
      = the node runs on live data only and no backtest claim depends on it; human = a person's input that a
      backtest runs without. A node's label is at least the strongest label among its backtest-mode inputs, and
      an empty mitigation field means the label is inherited. The encoder in the embedding space is the one
      unbounded look-ahead in the design: every text statistic inherits it; the registered tests of the tail model and the trigger use no text
      statistic, the event study and the premise share do and are labelled model and reported as such; a
      dated encoder family is the production fix.
    access: "public = every feed the node uses is public; mixed = public feeds now, with licensed or desk-only feeds named for production. LICENSED = a commercial feed we would buy for production; DESK-ONLY = a feed available only inside a fund; neither is available to us now."
    comparator: "a method that does the same job as a model step without a language model, printed beside it, so the model's contribution is visible."
    quote gate: "every span a model extracts must appear verbatim in its source document, or the record is dropped and counted."
    two runs: "the risk statements are produced twice, by the classifier trained on language-model labels (the model run) and by the keyword rule (the keyword run). Both are assigned in the same embedding space and followed as far as the theme, so the theme and its excess weight exist on both; propagation, the statistics and the page use the model run."
    model version: "when a model's version changes, every stream it feeds is recomputed and the page prints the level shift."
    seal: "a block of dates held back from all design work and opened once for a confirmatory test; the 2023-onward seal was opened in v1, so no unopened seal exists today."
    design tier: "a result measured on dates that were used to build the design; it is reported as in-sample and does not count as confirmatory."
    validation: "a component that scores another component and feeds nothing to the page; marked with its own shape on the canvas."
    footer: "the page's last item: it lists every item withheld on that page with the feed or test it waits on, and marks any input that is stale."
    notation: "LaTeX rendered by KaTeX. Every rule that computes a number gives its line first and its sentence second. Every regression is written once, stating what is regressed on what, over which observations, and what is reported; a forward-return target is used only on observations whose target is realised. The system has one residualisation, $u$, applied to companies and to hedge instruments alike. Named estimators and tests are named, not derived."
  symbols:
    '$W, L$': "the winner and loser legs"
    '$w_i$': >-
      company $i$'s position weight: $\mathrm{cap}_i / \sum_W \mathrm{cap}$ for $i$ in $W$, and $-\mathrm{cap}_i / \sum_L \mathrm{cap}$ for $i$ in $L$, so $\sum_W w_i = 1$ and $\sum_L w_i = -1$; $\sum_i |w_i| = 2$ is the gross weight
    '$\ell_i$': "the leg sign of company $i$: +1 in $W$, -1 in $L$"
    '$R_t, R_{t,t+10}$': "the book's daily return, $\\sum_i w_i r_{it}$, and its ten-day forward return from start $t$"
    '$m_t, x_{st}$': >-
      the market (S&P 500) return, and reference series $s = 2, \dots, 6$ (ten-year yield change, WTI, the dollar, the credit spread, the mega-cap spread); 'the six reference series' means $m$ and $x_2, \dots, x_6$
    '$r_{it}, u_{it}$': >-
      company $i$'s daily return, and its residual from the one first-stage regression on the market, $r_{it} = a_i + b_i m_t + u_{it}$ over the trailing 126 days, rolling daily
    '$\Sigma, \lambda_k, v_k, v_{ik}$': >-
      the Ledoit-Wolf covariance of $u$ over the book's companies; its $k$-th eigenvalue and eigenvector; company $i$'s loading on component $k$
    '$f_{kt}, \sigma_k, g_k$': >-
      component $k$'s daily return, $f_{kt} = \sum_i v_{ik} u_{it}$; its ten-day sigma, $\sqrt{10}$ times the sd of $f_k$ over the window; the book's loading on it, $g_k = w'v_k$
    '$\beta_{is}, S_s$': "the 126-day slope of $u_i$ on $x_{st}$ for $s = 2, \\dots, 6$, with $\\beta_{i1} = b_i$ for the market, and the book's exposure to series $s$, $\\sum_i w_i \\beta_{is}$"
    '$\gamma_{ks}, R^2_k$': "the bridge coefficients of $f_k$ on the five non-market series, and that regression's R-squared"
    '$H, u_H, b_k, \beta_H$': "the hedge instrument for component $k$, its market-residual return, the slope of $f_k$ on $u_H$, which is the minimum-variance hedge ratio, and the instrument's market beta"
    '$\mathrm{VS}_k$': "the share of the market-residual book's variance on component $k$, $\\lambda_k (w'v_k)^2 / (w' \\Sigma w)$"
    '$d^*, d^*_c$': "the assignment distance: the 90th percentile of a cluster member's distance to its own cluster's centroid, noise points excluded; and the centroid distance: the 10th percentile of a centroid's distance to its nearest other centroid, so two centroids within it are as close as the closest tenth of neighbouring pairs"
    '$Q_e, P_e, E_e$': "for theme $e$: the component set's weight on it as a share of the set's total absolute loading; the same on the random portfolios' sets, averaged; the excess, $Q_e - P_e$"
    '$T, C, O$': "the theme companies, the component-set members whose nearest statement is within $d^*$ of the theme's centroid plus the companies found by propagation; the crowded companies; the overlap, the share of $T$'s book weight that is in $C$, per leg"
    '$\sigma_t, c(t), B_t$': "the book's ten-day sigma at $t$ ($\\sqrt{10}$ times the sd of $R$ over the trailing 126 days); the calendar state of start $t$, inside or outside a window; the bear state, 1 if the trailing 24-month market return is negative"
    '$z_u, q$': "the standardised ten-day return $R_{u,u+10}/\\sigma_u$, and the 5% quantile of $z$ over all past starts"
    '$\mathrm{VaR}_t, \mathrm{ES}_t, P_t$': "the tail model's ten-day 5% quantile forecast and expected shortfall on day $t$, returns, so negative; and the probability of the event on day $t$"
    '$p_{kt}, M_t$': "statistic $k$'s percentile against its own history on day $t$, and the maximum over the monitored statistics"
    '$r_{i,20}, f_{k,20}, \mathrm{sd20}$': "trailing 20-day returns of a company and of a component, and their 20-day standard deviations"
  proof_of_concept:
    status: "three artifacts: the tail model with its controls and the three conditioning nulls; the theme on 2020-10-30 with verbatim quotes; the page for 2020-10-30 rendered from the two. News on disk is headline sets for eight registered episode windows (2018-02, 2019-09, 2020-11, 2021-01, 2022-11, 2024-08, 2025-01, 2025-04) and three calm windows, not a daily archive, so the theme pipeline runs on those eleven formation dates; the tail model runs on every month of the reconstructed book"
    path: [prices, refseries, french, sort, random, sensitivities, covariance, pca, bridge, filings, news, newsagent, embedspace, riskextract, cluster, namecluster, themescore, baselines, severity, register, volvalidation, panel]
    path_notes:
      newsagent: "keyword rule only; the language model does not label news in the proof of concept"
      news: "the eight episode windows and three calm windows on disk, and the trailing twelve months for the memo date"
      embedspace: "one named public encoder"
      riskextract: "the language model labels 2,000 filing sentences once; the classifier runs on the universe"
      propagate: "retrieval over the rest of the book only; the crowded scope needs the positioning feeds"
      labels: "not run: the author wrote the extraction prompt and cannot be the annotator; a paid annotation pool with two annotators per item is the production item. In its place, planted-span tests with constructed ground truth"
      register: "the rows for the coverage test, the pinball ratio, the three conditioning comparisons and the theme test"
      panel: "the 2020-10-31 run from the first design's planted-claim test renders item 7 of the page, labelled as a live-only component run on a historical date"
    produces: "(1) the tail model on the reconstructed book: coverage of the scaled line and the unconditional line, the pinball ratio with its shuffled-volatility control, the fitted-regression comparison, and the three conditioning variables tested and not used (bear state, calendar state, volatility tercile), each with its ratio and interval, in-sample with registered thresholds; (2) the theme on 2020-10-30: the cluster pipeline's outcome on the eleven registered dates with the coverage it rests on, and the verbatim quotes that name the theme, from the pipeline where it fires and from the 8-K survival-condition reading beside it; (3) the page for 2020-10-30 rendered from (1) and (2), every number linked to its stored output, with item 7 from the analogue panel's run on that date. The hand labels, the memo-date page and the premise share are production-path items"
    deferred: [posdata, poscluster, timebombs, bombtest, catagent, catapprove, analogue, percentiles, taxonomy, propagate, labels]
    described_only: [eventrule, thepage, signoff, responselog, themevalidation]

