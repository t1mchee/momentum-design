# System design v2, draft 4. Extends the v1 baseline; overlays the advisor call (draft 3) plus the thirteen
# decisions of docs/design/decisions-for-draft4.md. Every node carries `lookahead` (none | data | model |
# model-unmitigable | human) with a `mitigation`, and every data node carries `access` per feed
# (public | licensed | desk), so the causal spine and the public subset can be read off the canvas.
# Status: settled | memo (v1, unchanged) | retired (kept on the canvas with a reason).

base: versions/v1-baseline.yaml

meta:
  title: Momentum reversal-risk system, v2 draft 4
  version: v2-draft-4
  updated: "2026-09-06"
  note: >
    One tail model (severity, with the catalyst and text features inside it), the PCA object corrected to the
    book's variance share with sign composition and a placebo, a registered worry taxonomy as the fixed
    anchors of a date-constrained embedding space, retirements kept on the canvas, and a look-ahead label on
    every node. Data nodes list every intended feed with its access: public, licensed, or desk-only.

lanes:
  - {id: data, name: Data in}
  - {id: book, name: The book and its nulls}
  - {id: exposure, name: Exposure reading}
  - {id: decomp, name: "Step 1: decomposition"}
  - {id: context, name: "Step 3: context space"}
  - {id: naming, name: "Step 2: name the component"}
  - {id: propagate, name: "Step 4: propagate"}
  - {id: positioning, name: Positioning}
  - {id: routes, name: Tail model}
  - {id: catalysts, name: Catalysts}
  - {id: context2, name: Analogue}
  - {id: page, name: The page and the people}
  - {id: research, name: Validation}

drop_nodes: [filter, extractor, quotegate, mapper, vocab, condmeasures, datereader, catextract, comovement, flows, calendar, caldata, evidence]
drop_edges:
  - {from: sort, to: filings}
  - {from: zscore, to: analogue}
  - {from: condmeasures, to: analogue}
  - {from: zscore, to: labeller}
nodes:
  # ============================================================ data in
  - id: prices
    name: Prices, returns, index membership
    lane: data
    kind: data
    status: settled
    lookahead: none
    mitigation: point-in-time universe from archived holdings at announcement date
    access: public
    inputs: []
    outputs:
      - "daily returns per name"
      - "point-in-time universe"
      - "sector codes"
    rule: |
      Universe from the archived daily holdings of the Russell 3000 ETF at the date each change was announced (public); daily prices with corporate actions (public, Stooq or Tiingo; CRSP licensed in production); SIC codes from EDGAR (public), GICS in production (licensed). Delisted names terminate, never flatten. Printed numbers use value weights, since mega-cap concentration is the theme most often under watch; equal-weighted readings are computed and kept in the appendix.
    checks:
      - "reconciled against the French factor file"
    on_failure: hold the day's state
    open: []
    memo: "§2"

  - id: refseries
    name: Six reference series
    lane: data
    kind: data
    status: settled
    lookahead: data
    mitigation: ALFRED first-print vintages where FRED-hosted
    access: public
    inputs: []
    outputs:
      - "six daily series"
    rule: S&P 500; ten-year yield change; front-month WTI; dollar index; investment-grade spread; the ten largest index names against the equal-weighted index, constructed from holdings. The two cross-asset principal components of v1 are retired (uninterpretable on the page). Fixed list, familywise-corrected; grows only by re-registration.
    checks:
      - "family charged as a group"
    on_failure: series withheld; page says which
    open: []
    memo: "§3.1"

  - id: filings
    name: Company text, layered
    lane: data
    kind: data
    status: settled
    lookahead: none
    mitigation: dated at acceptance or receipt; verbatim spans string-matched
    access: mixed
    inputs: []
    outputs:
      - "risk-factor and outlook text per name, dated"
      - "intra-quarter event text per name, dated"
    rule: |
      Three layers, each feed labelled. Context layer: the latest 10-K accepted before the formation date plus the latest 10-Q's Part II Item 1A where newer, Item 1A and the MD&A overview cut by regex (PUBLIC, EDGAR). Event stream: 8-K Items 2.02, 7.01 and 8.01 with exhibits (PUBLIC, EDGAR), earnings-call transcripts (PUBLIC for a subset via free feeds; LICENSED for full coverage). Production layer: equity research (LICENSED, not available to us now), dealer colour and prime-broker notes (DESK-ONLY, not available to us now). Every extracted span must string-match its source before storage.
    checks:
      - "coverage per name printed by leg and by layer"
      - "string-match gate"
    on_failure: name marked unread on that layer
    open: []
    memo: "§2"

  - id: news
    name: News, two lanes
    lane: data
    kind: data
    status: settled
    lookahead: data
    mitigation: the context space is rebuilt as-of each backtest date from the archive
    access: mixed
    inputs: []
    outputs:
      - "headlines and articles, timestamped"
      - "fast-lane items"
    rule: |
      Slow lane: a rolling twelve-month archive rebuilt weekly into the context space. Feeds: GDELT (PUBLIC), Fed, Treasury and BLS release pages (PUBLIC), SEC press-release 8-K exhibits (PUBLIC), Bloomberg and Reuters headlines (LICENSED, not available to us now). Fast lane: the last five sessions' items scanned daily for new dense regions, feeding the catalyst agent only. Each item timestamped at publication.
    checks:
      - "source list versioned"
      - "as-of rebuild for backtests"
    on_failure: last space used, flagged stale
    open: []
    memo: "§2"

  - id: posdata
    name: Positioning, named components
    lane: data
    kind: data
    status: settled
    lookahead: data
    mitigation: every source keyed to release date, never settlement; maximum input lag printed
    access: mixed
    inputs: []
    outputs:
      - "positioning score per name"
      - "with its lag"
    rule: |
      Score = 0.5 × comomentum rank (within-leg co-movement beyond fundamentals; PUBLIC, from returns) + 0.5 × 13F crowding rank (overlap among momentum-style filers; PUBLIC, 45-day lag). Short interest (PUBLIC, two-week lag) is the loser-leg reading printed beside it, not mixed in. Top quintile over the book marked heavily positioned. Production feeds, each printed as a separate line when present: securities-lending utilisation (LICENSED), options open interest (PUBLIC, delayed), ETF flows (PUBLIC), prime-broker aggregate colour and per-name positioning (DESK-ONLY, not available to us now). The maximum lag of any input to the score is printed on the day it is printed.
    checks:
      - "lag printed"
      - "overlap history"
    on_failure: score absent; time-bomb lines suppressed and the page says so
    open: []
    memo: "§2, §7"

  - id: options
    name: Event-implied moves
    lane: data
    kind: data
    status: settled
    lookahead: data
    mitigation: historical surfaces as-of; where absent the comparison is marked illustrative
    access: mixed
    inputs: []
    outputs:
      - "implied event move per component name"
      - "sector ETF implied move"
    rule: The comparator for the catalyst claim is the component set's event-implied move, each name's implied earnings move (LICENSED for history, OptionMetrics; PUBLIC delayed for the live date) weighted by loading. The relevant sector ETF's implied move around the same date (PUBLIC delayed) is printed beside it as the price of the hedge. No book-level implied vol is constructed; the claim is stated for the component set.
    checks: []
    on_failure: comparison marked illustrative
    open: []
    memo: "§2, §3"

  # ============================================================ book
  - id: sort
    name: 12-1 sort, the book
    lane: book
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: trailing window closed at formation
    inputs:
      - "daily returns per name"
      - "point-in-time universe"
    outputs:
      - "winner leg"
      - "loser leg"
      - "position weights"
      - "book returns"
    rule: As v1. Rank on trailing 12-month return skipping the latest month; top and bottom decile; rebuilt monthly, measured daily. Position weights w (positive winners, negative losers) are the object every book-level statistic uses. Decomposition on both legs; every reading reported by leg.
    checks:
      - "leg sizes logged"
    on_failure: previous book carried with a banner
    open: []
    memo: "§1"

  # ============================================================ exposure
  - id: zscore
    name: Conferred exposure, one line per series
    lane: exposure
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: random portfolios drawn on the same date
    inputs:
      - "leg spread per series"
      - "N random books per date"
    outputs:
      - "per series"
      - "the exposure in hedgeable units"
      - "its cross-sectional percentile against random books"
      - "and its time-series percentile against the book's own history"
    rule: The v1 reading kept as a line, not an alarm. For each of the six series, the conferred spread is printed in hedgeable units (dollars of ten-year duration equivalent, index beta, and so on), with two percentiles beside it, against the random portfolios (is this the sort's doing) and against the book's own history (is today unusual). Only the second can fire a page. The family-maximum form stays retired. The former Route 2 reading is this line for the driving series.
    checks:
      - "claim 1 as an instrument check"
      - "not a finding"
    on_failure: n/a
    open: []
    memo: "§3.1"

  - id: labeller
    name: Labeller (retired)
    lane: exposure
    kind: model
    status: retired
    lookahead: model
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. Duplicate of the cluster-naming role and unvalidated (row 10 unrun). The series name is printed instead.
    checks: []
    on_failure: n/a
    open: []
    memo: "—"

  # ============================================================ step 1
  - id: covariance
    name: Covariance of the book's names
    lane: decomp
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: trailing window closed at formation
    inputs:
      - "daily returns per name"
      - "winner leg"
      - "loser leg"
    outputs:
      - "shrunk covariance matrix over the book's names"
    rule: Daily returns over the trailing 126 trading days ending at formation, residualised to the market only; Ledoit-Wolf shrinkage because N is about 600 against T of 126. Sectors are not residualised, since sector is often the vehicle of the theme.
    checks:
      - "condition number printed"
      - "the same matrix built on random books gives the placebo eigenvalues"
    on_failure: decomposition not run this period
    open: []
    memo: "§3 step 1"

  - id: pca
    name: Components, book share, and sign
    lane: decomp
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: arithmetic on the point-in-time book
    inputs:
      - "shrunk covariance matrix over the book's names"
      - "position weights"
    outputs:
      - "components above the bulk edge"
      - "per component the book's variance share, its placebo percentile, the component set with signs, and the case flag"
    rule: |
      Eigen-decomposition; components kept while their eigenvalue clears the Marchenko-Pastur bulk edge, at most three. For component k the headline is the book's variance share, λ_k (w'v_k)² / (w'Σw), not the name-level variance explained, with its percentile against the same statistic on cap- and sector-matched random books. Sign fixed so the component's position-weighted return over the window is positive. Component set: top quartile of absolute loading, each name keeping its loading sign. Case flag: if loadings are opposite-sign across the legs the component is the momentum factor itself (comomentum) and is handed to the tail model as a state, not to the naming pipeline; if same-sign it is a theme and goes to naming. Diagnostic beside it: the first component of each leg decomposed separately.
    checks:
      - "placebo percentile"
      - "stability of the set across adjacent months"
      - "per-leg diagnostic"
    on_failure: theme naming not run
    open: []
    memo: "§3 step 1"

  - id: bridge
    name: Component against the six series
    lane: decomp
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: same windows
    inputs:
      - "components above the bulk edge"
      - "six daily series"
    outputs:
      - "R² and loadings of each component's return on the six series"
    rule: Each component's daily return regressed on the six reference series over the same window. High R² means arithmetic has already named the theme (a rates bet, an oil bet) and the text step is confirmatory; low R² means the text step is doing real work. Printed as the bridge between the exposure line and the theme reading, and it decides which is the headline that month.
    checks:
      - "R² against the same regression on random books' first components"
    on_failure: n/a
    open: []
    memo: "§3 step 1"

  # ============================================================ step 3
  - id: newsagent
    name: News risk-statement extraction
    lane: context
    kind: model
    status: settled
    lookahead: model
    mitigation: date- and name-blind prompt; distilled to a dated classifier for the backtest
    inputs:
      - "headlines and articles"
      - "timestamped"
    outputs:
      - "macro-risk statements from news"
      - "dated"
      - "with a canonical short paraphrase"
    rule: A light model extracts statements of macro risk over a one-year horizon, verbatim plus a canonical short paraphrase for embedding, with the date. In the backtest the LLM labels a sample once and a small classifier on the date-constrained encoder does the rest.
    checks:
      - "quote gate"
      - "monthly audit sample"
    on_failure: last space used
    open: []
    memo: "§3 step 3"

  - id: taxonomy
    name: Registered worry taxonomy
    lane: context
    kind: human
    status: settled
    lookahead: human
    mitigation: frozen before each run; backtests run with the taxonomy as of the date, and once without it
    inputs:
      - "PM edits"
    outputs:
      - "about thirty external conditions with an 'other' bucket"
      - "versioned"
    rule: Replaces 'about five worries'. A registered list of about thirty external conditions (rates, the memory cycle, tariffs, a regulatory decision, financing, and so on) with an 'other' bucket, versioned, reviewed quarterly from the 'other' residue. The PM edits it whenever something bites; every edit is logged as a labelled event. Under the crescendo view the top entry by mass is the theme most of the time.
    checks:
      - "every edit logged"
      - "quarterly 'other' review"
    on_failure: last version used
    open: []
    memo: "§3, §10"

  - id: embedspace
    name: Date-constrained context space
    lane: context
    kind: deterministic
    status: settled
    lookahead: model
    mitigation: ChronoBERT-class encoder with a cutoff before each backtest date; BM25 as the lexical twin
    inputs:
      - "macro-risk statements from news"
      - "dated"
      - "with a canonical short paraphrase"
      - "about thirty external conditions with an 'other' bucket"
      - "versioned"
    outputs:
      - "context space with anchors"
      - "news clusters"
      - "and a threshold"
    rule: |
      Encoder: a date-constrained sentence encoder (ChronoBERT-class) whose training cutoff precedes each date; the current model for the live date. News paraphrases over the rolling window are embedded and clustered unsupervised (HDBSCAN, minimum cluster size registered) so the dense macro stories emerge. Each taxonomy entry is placed as a query: its anchor is the centroid of its nearest news statements, not the phrase's own vector, so a three-word entry is not competing with forty-word sentences. Threshold: the 90th percentile of within-cluster member-to-centroid distance across the news clusters. The space is rebuilt weekly and every in-window quote is re-assigned at each rebuild. A taxonomy entry with no news mass is printed as such. Run once more without the taxonomy anchors; if the headline theme changes, both are printed.
    checks:
      - "mass per entry"
      - "residual share"
      - "with-and-without-anchors comparison"
      - "BM25 twin agreement"
    on_failure: cluster on company quotes alone, flagged
    open: []
    memo: "§3 step 3"

  # ============================================================ step 2
  - id: pc1text
    name: Gather the component names' text
    lane: naming
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: dated documents
    inputs:
      - "components above the bulk edge"
      - "per component the book's variance share, its placebo percentile, the component set with signs, and the case flag, risk-factor and outlook text per name, dated"
      - "intra-quarter event text per name, dated"
    outputs:
      - "text per component name with loading weight and sign"
    rule: All context-layer and event-stream passages for every name in a theme-case component set. Loading enters as the quote weight at clustering.
    checks:
      - "coverage of the set printed by leg and by layer"
    on_failure: theme named on partial coverage, flagged
    open: []
    memo: "§3 step 2"

  - id: riskextract
    name: Risk-factor extraction
    lane: naming
    kind: model
    status: settled
    lookahead: model
    mitigation: name- and date-blind prompt; cutoff-split error comparison; distil to a dated classifier; post-cutoff months carry the predictive claim
    inputs:
      - "text per component name with loading weight and sign"
    outputs:
      - "risk-factor quotes per name"
      - "verbatim"
      - "with sign and canonical paraphrase"
    rule: |
      A light model, one document one call, blind to the company name and the date: extract up to three risk factors over a one-year horizon that would cause a significant drawdown, each with a verbatim quote, a sign (the company gains or loses if the risk materialises) and a canonical short paraphrase. Sign is informative from MD&A and event text; Item 1A is downside by construction. Quote gate applies. Extraction error measured on the stratified monthly sample split at the model's training cutoff; the difference bounds contamination. Production path: distil to a classifier on the dated encoder.
    checks:
      - "quote gate"
      - "hand-labelled sample by leg, era and cutoff side"
    on_failure: record dropped and counted
    open: []
    memo: "§3 step 2"

  - id: cluster
    name: Assign quotes in the context space
    lane: naming
    kind: deterministic
    status: settled
    lookahead: model
    mitigation: dated encoder; supersession instead of decay; re-assignment at each rebuild
    inputs:
      - "risk-factor quotes per name"
      - "verbatim"
      - "with sign and canonical paraphrase"
      - "context space with anchors"
      - "news clusters"
      - "and a threshold"
    outputs:
      - "mass per taxonomy entry and residual cluster"
      - "loading-weighted"
      - "by leg and by loss direction"
      - "with its sector-matched placebo"
    rule: |
      Each paraphrase is embedded with the dated encoder and assigned to the nearest anchor within the threshold, else to a residual cluster. Supersession, not decay: a document's quotes are current until the next document from that company on that layer. Mass is loading-weighted and composed into loss direction (leg × loading sign × quote sign). The same assignment run on the filings of sector-matched random sets of the same size gives the placebo mass per entry, so a boilerplate risk shared by every company reads as zero excess.
    checks:
      - "placebo mass"
      - "residual share"
      - "stability month to month"
    on_failure: previous assignment used
    open: []
    memo: "§3 step 2"

  - id: namecluster
    name: Name the theme
    lane: naming
    kind: model
    status: settled
    lookahead: model
    mitigation: names grounded in the 20 nearest quotes; c-TF-IDF label as the deterministic twin; low stakes
    inputs:
      - "mass per taxonomy entry and residual cluster"
      - "loading-weighted"
      - "by leg and by loss direction"
      - "with its sector-matched placebo"
      - "context space with anchors"
      - "news clusters"
      - "and a threshold"
    outputs:
      - "theme name per component with its supporting quotes"
      - "the nearest news cluster and its headline count"
    rule: For a taxonomy entry the name is the entry. For a residual cluster an LLM reads the 20 quotes nearest its centre and names it; the c-TF-IDF label prints beside it as the twin. Cross-compare with news by printing the nearest news cluster's name and headline count; a theme with no news mass is flagged company-specific. Calibrated on sector-matched random name sets.
    checks:
      - "placebo calibration on sector-matched sets"
      - "twin printed"
    on_failure: twin label printed alone
    open: []
    memo: "§3 step 2"

  # ============================================================ step 4
  - id: propagate
    name: Propagate the theme
    lane: propagate
    kind: model
    status: settled
    lookahead: model
    mitigation: retrieval with the dated encoder is the historical instrument; LLM rerank only on post-cutoff months; retrieval-only as the twin
    inputs:
      - "theme name per component with its supporting quotes"
      - "the nearest news cluster and its headline count, risk-factor and outlook text per name, dated"
      - "intra-quarter event text per name, dated, positioning score per name, with its lag"
    outputs:
      - "theme signature per name outside the component set"
      - "with quote and score"
    rule: |
      Scope: the rest of the book plus the universe's top positioning quintile. Every passage in scope is embedded once with the dated encoder and cached; retrieval by the theme anchor returns candidates; the LLM reranks the top candidates 0 to 3 with a verbatim quote, 2 or more carries the signature. In the backtest before the LLM's cutoff the retrieval score alone is the instrument. Placebo: the same run with last year's headline theme; the false-signature rate is printed beside the signature rate every time.
    checks:
      - "quote gate"
      - "placebo with a plausible-but-wrong theme"
      - "retrieval-only twin"
    on_failure: name marked unscanned
    open: []
    memo: "§3 step 4"

  - id: themescore
    name: Theme readings, two numbers
    lane: propagate
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: inherits its inputs' labels
    inputs:
      - "components above the bulk edge"
      - "per component the book's variance share, its placebo percentile, the component set with signs, and the case flag, mass per taxonomy entry and residual cluster, loading-weighted, by leg and by loss direction, with its sector-matched placebo, theme signature per name outside the component set, with quote and score"
    outputs:
      - "book variance share on the theme with its placebo percentile"
      - "share of book weight by leg carrying the theme in the loss direction, with its placebo"
      - "agreement line"
    rule: |
      Replaces the product formula. Two placebo-referenced numbers per theme: (1) the book's variance share on the component with its percentile against random books; (2) the share of the book's weight, by leg, that carries the theme in the loss direction, component set plus signature carriers, with the sector-matched placebo share. Converted on the page to bp: the book's loss if the component set returns minus two sigma, signature carriers included. Agreement line: whether the taxonomy's top entry by mass and the component's name are the same theme. Recomputed weekly on the event stream, monthly for the decomposition.
    checks:
      - "both placebos"
      - "a filing-season check, February against August"
    on_failure: n/a
    open: []
    memo: "§3 step 5, §6"

  # ============================================================ positioning
  - id: poscluster
    name: Positioning overlap with the theme
    lane: positioning
    kind: deterministic
    status: settled
    lookahead: data
    mitigation: positioning as-of release
    inputs:
      - "positioning score per name, with its lag, theme signature per name outside the component set, with quote and score, components above the bulk edge"
      - "per component the book's variance share, its placebo percentile, the component set with signs, and the case flag"
    outputs:
      - "overlap of the heavily positioned set with the theme set, by leg"
      - "the non-overlap"
      - "history"
    rule: Theme set (component set plus signature carriers) against the top positioning quintile of the book, by leg. Overlap and non-overlap both reported with their history, which measures the claim that hedge funds are mostly positioned on one theme rather than asserting it. Absorbs the former Route 3 reading.
    checks:
      - "overlap history"
    on_failure: overlap not computed
    open: []
    memo: "§7"

  - id: timebombs
    name: Time bombs, two objects
    lane: positioning
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: returns and positioning as-of
    inputs:
      - "overlap of the heavily positioned set with the theme set, by leg"
      - "the non-overlap"
      - "history, daily returns per name"
    outputs:
      - "pre-catalyst list"
      - "contagion list"
      - "both by leg"
    rule: |
      Two lines. Pre-catalyst: signature carriers that have rallied with the component (trailing 20-day return beyond one sigma of their own trailing year, same direction as the component) and sit in the top positioning quintile, the names with the most to give back. Contagion, read after an unwind starts: signature carriers still within one sigma while the component has moved beyond one, and crowded, the names that have not yet paid. Split by leg, since a crowded short that has not rallied in a squeeze is where the next squeeze goes.
    checks:
      - "event study registered per object (see validation)"
    on_failure: n/a
    open: []
    memo: "§7, §6"

  # ============================================================ tail model
  - id: route1
    name: Route 1 detector (retired)
    lane: routes
    kind: deterministic
    status: retired
    lookahead: none
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. Its input node no longer exists and the theme readings by leg carry the short-leg-on-one-condition case. The loser-leg beta, distance from highs and short interest survive as inputs to the tail model.
    checks: []
    on_failure: n/a
    open: []
    memo: "—"

  - id: route2
    name: Driving-series reading (was Route 2)
    lane: routes
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: n/a
    inputs:
      - "per series"
      - "the exposure in hedgeable units"
      - "its cross-sectional percentile against random books"
      - "and its time-series percentile against the book's own history"
    outputs:
      - "the winner leg's driving-series exposure"
      - "in hedgeable units"
      - "with where inside the leg it sits"
    rule: The one v1 detector a desk would use, kept as a reading and stripped of the route vocabulary. The winner leg's exposure to the driving series in hedgeable units, its two percentiles, and where in the leg it sits.
    checks:
      - "check 5 recovered 3 of 4"
    on_failure: n/a
    open: []
    memo: "§3"

  - id: route3
    name: Route 3 detector (retired)
    lane: routes
    kind: deterministic
    status: retired
    lookahead: none
    mitigation: n/a
    inputs: []
    outputs: []
    rule: Retired in draft 4. Fired on zero of 195 episodes; its inputs are absorbed into the positioning score and the overlap reading.
    checks: []
    on_failure: n/a
    open: []
    memo: "—"

  - id: classify
    name: Classification rule (retired; inventory kept)
    lane: routes
    kind: deterministic
    status: retired
    lookahead: none
    mitigation: n/a
    inputs: []
    outputs:
      - "the crash inventory"
      - "195 episodes"
    rule: The rule is retired as a page-facing node after its refutation (44.1% fits none). The crash inventory stays as data for the tail model and the analogue. The finding that 77 of the 86 unassigned episodes are a loser-leg loss in a rising market with no prior bear state goes into the memo as a finding.
    checks: []
    on_failure: n/a
    open: []
    memo: "§5, memo finding"

  - id: severity
    name: Conditional tail model
    lane: routes
    kind: deterministic
    status: settled
    lookahead: none
    mitigation: earnings calendar known in advance; all regressors as-of
    inputs:
      - "book returns, book variance share on the theme with its placebo percentile"
      - "share of book weight by leg carrying the theme in the loss direction, with its placebo"
      - "agreement line, overlap of the heavily positioned set with the theme set, by leg"
      - "the non-overlap"
      - "history, approved catalysts, added catalysts, baseline vol forecast, event-density baseline, the crash inventory, 195 episodes"
    outputs:
      - "10-day 5% VaR and ES"
      - "the catalyst-window conditional VaR"
      - "the ablation ladder"
    rule: |
      One tail model. Linear quantile regression of the book's ten-day forward return at the 5% quantile on trailing volatility, the Daniel-Moskowitz bear-state terms, the comomentum state from the case flag, and the new features: the book's variance share on the theme, the loss-direction signature share by leg, the positioning overlap, a catalyst-window indicator with days to the nearest approved catalyst, the GARCH forecast and the event-density baseline as controls. Fitted on every day up to the formation date. Output: the ten-day VaR and ES, and the catalyst-window conditional VaR, whose difference from the unconditional is the 'bump' stated in loss terms. Ablation ladder reported every run: (0) vol and bear state; (1) plus variance share and price-only signature; (2) plus text signature; (3) plus positioning. Whether the quantile moves with the state is reported as the state-conditional breach rate.
    checks:
      - "breach rate on held-out years"
      - "state-conditional breach rates"
      - "ablation ladder"
      - "ES no milder than VaR"
    on_failure: unconditional quantile alone
    open: []
    memo: "§3, §5, §6"

