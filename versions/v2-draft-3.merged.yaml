  on_failure: n/a
  open:
  - Rows 07, 14, 15, 18 are about the memo or the developer, not the world (bloat pass C-1).
  - Rows 02, 03, 05 have no reported result.
  - Row 23 was registered 2026-09-02, four days before the memo date, with a seventh control added at run and two
    dates' numbers known at registration.
  memo: §5.1, Appendix C
  row: 12, 18, 23
- id: labels
  name: Hand-labelled sample and rectification
  lane: research
  kind: human
  status: memo
  inputs:
  - stored records
  outputs:
  - precision and recall of the extractor; rectified stated-condition rate and modal share with intervals
  rule: 'About 90 to 100 records per draw, a stratified sample across the whole leg including uncovered names with
    stratum weights known, sized by inverting for a target half-width of 0.08 near 0.80, second-rated. Prediction-powered
    inference uses the labelled subset to estimate the model''s bias and remove it, with an interval valid for means.
    Pass: both precision and recall at or above 0.80 with intervals excluding the keyword floor, and the rectified
    interval narrower than the classical one. Labels produced by the assistant that wrote the extraction prompt
    are barred by code.

    '
  checks:
  - n/a
  on_failure: the labelled sample alone carries the estimate; the model buys no effective sample
  open:
  - Unwritten. The ninety labels are reserved to Tim.
  - At 90 labels the PPI interval is barely narrower than the classical one, so the pass criterion is nearly vacuous
    (ML review step 9).
  - Constant model bias cancels in the episode-minus-control difference; date-dependent bias does not, so labels
    must be stratified by episode/control and by era, and error reported by stratum.
  - How is a name with no document labelled?
  memo: §5.1, Appendix C row 08, E.1
  row: 08
