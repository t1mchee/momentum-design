- id: route3
  name: Route 3 detector, crowded exit
  lane: routes
  kind: deterministic
  status: memo
  inputs:
  - co-movement per leg
  - holder overlap
  - daily factor flow
  - implied correlation
  outputs:
  - Route 3 state
  - read at rebalance
  rule: 'Observable: names in a leg move together more than fundamentals warrant while their holders overlap. Read
    at rebalance. Little from public text: 246 hand-labelled news articles contained no genuine discussion of factor
    crowding and a model reading the same corpus found approximately none. Blind at the daily horizon until crowding
    has moved prices; prime-broker positioning is first on the production purchase list.

    '
  checks:
  - 'check 5: the crowding detector never left its quiet range on any of the seven dates'
  on_failure: blind by construction
  open:
  - Route 3 fires on zero of 195 historical episodes; four synthetic episodes planted at its definition's centre
    were all recovered, so the rule works and the definition does not describe the record.
  memo: §1.4, Table 5 Route 3 row, Table 6
  row: '05'
- id: classify
  name: Classification rule over past reversals (refuted)
  lane: routes
  kind: deterministic
  status: memo
  inputs:
  - crash inventory (195 episodes 1926 to 2026)
  - leg shares of each loss
  - market move
  - bear state
  outputs:
  - route label per episode
  - or fits-none
  rule: 'Each episode typed by a fixed rule from the leg share of the loss, the market''s move and the bear state;
    routes mutually exclusive by construction. Registered band for the fits-none share 5 to 30%; result 44.1% [37.0,
    51.4], refuted (row 19). 77 of the 86 unassigned share one pattern: short-leg loss, market rising, no prior
    bear market. Dropping the bear clause would assign 71 of 77; not done because a rule changed after seeing which
    clause failed is fitted to the data. Breach days within 21 days collapsed to one episode. Route 3 takes zero
    episodes. The daily output therefore reports by leg and names a route only where its detector fires.

    '
  checks:
  - order-invariance of the fits-none share; interval assumes independent episodes
  - a regime-blocked bootstrap owed
  on_failure: reports by leg
  open:
  - November 2020 is Route 1 in §1.4's narrative and fits-none under the rule; now reconciled in one sentence, but
    the framework's flagship case falls outside its taxonomy.
  - The next registration (§7) writes the short-leg mechanism as two variants, with and without a preceding bear
    market.
  memo: §1.4, §3.2, §5.2 claim 4 and note, Table B.1 last row
  row: 19, 20
- id: severity
  name: Severity
  lane: routes
  kind: deterministic
  status: memo
  inputs:
  - reconstructed book returns
  - volatility state
  - bear-state terms
  - route states
  outputs:
  - 10-day 5% VaR
  - 10-day ES
  - 21-day VaR
  - unconditional quantile beside each
  - episode count
  rule: 'Design: a conditional quantile per route (Route 1 on the volatility regime with the panic flag; Route 2
    on driving-series extension), unconditional quantile and episode count beside it, unconditional alone below
    a minimum count; no probability printed because the crashes number in single figures. Prototype, which produced
    every VaR and ES in §4 and §6: linear quantile regression of the reconstructed book''s ten-day forward return
    on trailing volatility and the Daniel-Moskowitz bear-state terms, fitted at the 5% quantile on every day up
    to the formation date, scored against unconditional, volatility-scaled and bear-state baselines. Events: ten-day
    return at or below -432bp (Routes 1 and 3); 800bp peak-to-trough within 90 days confirmed by 20 sessions (Route
    2). On 2020-10-31: VaR -9.47% against -4.24% unconditional; realised -9.56%.

    '
  checks:
  - 'check 3: 2 breaches of the 5% VaR in 42 non-overlapping forecasts on the held-out years (4.76%, [0.6%, 16%]);
    ES no milder than VaR (trp-81)'
  on_failure: unconditional quantile alone
  open:
  - Minimum episode count for the conditional quantile is not stated (fix 3.3-b).
  - Whether the VaR moves with the state is untested (check 3 caveat).
  - §6 says 'given the current volatility regime only', §3.3 says volatility plus bear-state terms (fix 6-b).
  memo: §1.6, §3.3, §4.2, §5.3 check 3, §6 severity line
  row: 07 (withdrawn sizing test)
